# Chaque push sur main reconstruit et publie le site : sur GitHub Pages, et
# chez OVH par FTP des que les trois secrets sont poses dans GitHub
# (Settings > Secrets and variables > Actions) : OVH_FTP_HOTE,
# OVH_FTP_UTILISATEUR, OVH_FTP_MOTDEPASSE. Sans eux, l'etape OVH est sautee.
# A faire une fois dans GitHub : Settings > Pages > Source = GitHub Actions.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      OVH_FTP_HOTE: ${{ secrets.OVH_FTP_HOTE }}
      DEPOT_CLE: ${{ secrets.DEPOT_CLE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Construire le site
        run: python outils/construire_site.py site

      # la cle du depot des saisies (secret DEPOT_CLE) : ecrite pour OVH seulement,
      # jamais publiee sur GitHub Pages (l'etape de nettoyage plus bas l'enleve)
      - name: La clé du dépôt des saisies
        if: env.OVH_FTP_HOTE != '' && env.DEPOT_CLE != ''
        run: |
          mkdir -p site/depot
          printf "<?php define('CLE', base64_decode('%s'));\n" "$(printf %s "$DEPOT_CLE" | base64 -w0)" > site/depot/cle.php

      # le site chez OVH : le contenu de site/ dans le www de l'hebergement,
      # seuls les fichiers qui ont change sont renvoyes
      # un envoi rate n'empeche pas GitHub Pages de publier
      - name: Envoyer chez OVH
        if: env.OVH_FTP_HOTE != ''
        continue-on-error: true
        timeout-minutes: 10
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_HOTE }}
          username: ${{ secrets.OVH_FTP_UTILISATEUR }}
          password: ${{ secrets.OVH_FTP_MOTDEPASSE }}
          protocol: ftp   # ce cluster OVH ne sait pas le TLS explicite
          local-dir: site/
          server-dir: www/

      - name: La clé ne part pas sur GitHub Pages
        if: always()
        run: rm -f site/depot/cle.php

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v4
