# Chaque push sur main reconstruit et publie le site : sur GitHub Pages, et
# chez OVH par FTP des que les trois secrets sont poses dans GitHub
# (Settings > Secrets and variables > Actions) : OVH_FTP_HOTE,
# OVH_FTP_UTILISATEUR, OVH_FTP_MOTDEPASSE. Sans eux, l'etape OVH est sautee.
# A faire une fois dans GitHub : Settings > Pages > Source = GitHub Actions.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      OVH_FTP_HOTE: ${{ secrets.OVH_FTP_HOTE }}
      API_DISTANTE: http://peojfus.cluster129.hosting.ovh.net/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # deux sites : celui d'OVH fait serveur (les scripts PHP d'api/,
      # et la page le sait), celui de GitHub Pages est la page seule
      # tant que foresight-movie.com pointe sur GitHub Pages, la page qu'on y
      # publie appelle le serveur chez OVH a son adresse technique : chacun,
      # sur son telephone, y depose ses saisies, et le DIT les y retrouve.
      # A retirer (--api) une fois le domaine rattache a l'hebergement OVH.
      - name: Construire le site
        run: |
          python outils/construire_site.py site-ovh --php
          python outils/construire_site.py site --api "$API_DISTANTE"
          rm -rf site/api

      # le site chez OVH : le contenu de site-ovh/ dans le www de l'hebergement,
      # seuls les fichiers qui ont change sont renvoyes ; les donnees que PHP
      # y ecrit (api/donnees) ne sont pas touchees
      # un envoi rate n'empeche pas GitHub Pages de publier
      - name: Envoyer chez OVH
        id: ovh
        if: env.OVH_FTP_HOTE != ''
        continue-on-error: true
        timeout-minutes: 10
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_HOTE }}
          username: ${{ secrets.OVH_FTP_UTILISATEUR }}
          password: ${{ secrets.OVH_FTP_MOTDEPASSE }}
          protocol: ftp   # ce cluster OVH ne sait pas le TLS explicite
          local-dir: site-ovh/
          server-dir: www/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v4

      # un envoi FTP rate n'empeche pas GitHub Pages de publier, mais il ne doit
      # pas passer inapercu : le site chez OVH resterait sur la version d'avant
      - name: L'envoi chez OVH a-t-il abouti ?
        if: always() && steps.ovh.outcome == 'failure'
        run: |
          echo "::error::L'envoi chez OVH a échoué : le site publié là-bas est resté sur la version d'avant. GitHub Pages, lui, est à jour."
          exit 1
