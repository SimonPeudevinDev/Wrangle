const CROQUIS_COULEURS = ['#1c1410', '#e7b04a', '#e8675e', '#5fb36d', '#4f8fd6'];

const CROQUIS_OBJETS = [

/* trois gestes : poser puis orienter ; tirer d'un bout a l'autre ; tirer coin a coin */
const OBJ_POSE = ['cam', 'chrono', 'lum', 'ponct', 'soleil', 'perso', 'table', 'chaise'], OBJ_SEG = ['mur', 'fenetre', 'vert', 'diffb', 'diffn', 'cote', 'fleche'], OBJ_RECT = ['bloc', 'rond'];
/* la fleche libre : un trajet dessine a main levee, en pointille, la pointe a l'arrivee */
const OBJ_TRACE = ['trajet'];
let dessin = null;   // l'editeur ouvert

/* Les plans des decors fournis avec la page (public/maps) : des fichiers, pas des
   images dans le projet, ils ne pesent rien dans les espaces ni les sauvegardes.
   Un plan importe pour un decor du meme nom passe devant. */
const PLANS_DECOR = [
  ['Atelier', 'atelier'], ['Atelier (vide)', 'atelier-vide'],
  ['Royal Academy', 'royal-academy'], ['Royal Academy (vide)', 'royal-academy-vide'],
  // la rue et la cour : leurs plans portent le nom du decor
  ['La rue', 'rue-des-coquerez'], ['La cour', 'rue-des-brigittines']
];
const planIntegre = lieu => { const x = PLANS_DECOR.find(d => memeVal(d[0], (lieu || '').trim())); return x ? 'public/maps/' + x[1] + '.webp' : ''; };
const fondImporte = lieu => (DB.prod.fonds || {})[(lieu || '').trim()] || '';
/* Un plan importe vit sur le serveur, en fichier : le projet n'en garde que le nom
   (« fond:… »). Sans serveur, il reste dans le projet, en image (data:…). */
const urlFond = v => String(v || '').indexOf('fond:') === 0 ? API('fond') + '?f=' + encodeURIComponent(v.slice(5)) : v || '';
const fondDecor = lieu => urlFond(fondImporte(lieu)) || planIntegre(lieu);
/* L'adresse reelle d'un decor (prod.adresse_<decor>), reglee dans Decors, pour le data wrangling */
const adresseDecor = lieu => String(DB.prod['adresse_' + String(lieu || '').trim()] || '').trim();
/* Envoie l'image au serveur et rend ce que le projet en gardera : son nom, ou
   l'image elle-meme si le serveur n'est pas la (elle partira a la prochaine occasion). */
function envoyerFond(url){
  if (!RESEAU.possible || String(url).indexOf('data:') !== 0) return Promise.resolve(url);
  return fetch(API('fond'), { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ data: url }) })
    .then(r => r.ok ? r.json() : null).then(j => j && j.f ? 'fond:' + j.f : url).catch(() => url);
}
/* Les plans importes avant (ou hors ligne) sont dans le projet, en image : un
   preparateur connecte les envoie au serveur ; le projet n'en garde plus que le nom. */
function rangerFonds(){
  if (!RESEAU.possible || !prepare()) return;
  const fonds = DB.prod.fonds || {}, l = Object.keys(fonds).filter(k => String(fonds[k]).indexOf('data:') === 0);
  l.forEach(k => envoyerFond(fonds[k]).then(ref => {
    if (ref.indexOf('fond:') === 0 && (DB.prod.fonds || {})[k] === fonds[k]) poserFond(k, ref);
  }));
}
/* Les decors du tournage se declarent une fois pour toutes (DB.prod.decors,
   propage a tous comme le reste de la production) : le champ Decor de chaque
   plan les propose, en Preparation comme dans la fiche. Ceux qu'un plan porte
   deja sont proposes aussi. */
function ajouterDecor(){
  return demanderTexte('Nom du décor', { ok:'Ajouter' }).then(nom => {
    nom = (nom || '').trim();
    if (!nom) return '';
    const l = DB.prod.decors || [];
    if (!l.some(x => memeVal(x, nom))) patch('prod', 'prod', { decors: l.concat([nom]) });
    return nom;
  });
}
/* Renommer un decor : dans la liste, sur chaque plan qui le porte, et le plan du decor du croquis suit. */
function renommerDecor(nom){
  demanderTexte('Nouveau nom du décor', { valeur: nom, ok:'Renommer' }).then(neuf => {
    neuf = (neuf || '').trim();
    if (!neuf || neuf === nom) return;
    const l = (DB.prod.decors || []).filter(x => !memeVal(x, nom) && !memeVal(x, neuf)).concat([neuf]);
    const fonds = Object.assign({}, DB.prod.fonds || {});
    if (fonds[nom] !== undefined){ fonds[neuf] = fonds[nom]; delete fonds[nom]; }
    const adr = adresseDecor(nom);
    patch('prod', 'prod', Object.assign({ decors: l, fonds }, adr ? { ['adresse_' + neuf]: adr, ['adresse_' + nom]: '' } : {}));
    DB.plans.forEach(x => {
      const d = {};
      if (memeVal(x.lieu, nom)) d.lieu = neuf;
      if (memeVal(x.fondLieu, nom)) d.fondLieu = neuf;
      if (Object.keys(d).length) patch('plan', x.id, d);
    });
    oublierPrep(); renderAll(); openDecors();
    toast('« ' + nom + ' » renommé en « ' + neuf + ' »');
  });
}
/* Retirer un decor : de la liste, et des plans qui le portent — leur sequence n'a plus de decor. */
function retirerDecor(nom){
  const plans = DB.plans.filter(x => memeVal(x.lieu, nom) || memeVal(x.fondLieu, nom));
  const faire = () => {
    const fonds = Object.assign({}, DB.prod.fonds || {}); delete fonds[nom];
    patch('prod', 'prod', Object.assign({ decors: (DB.prod.decors || []).filter(x => !memeVal(x, nom)), fonds },
                                        adresseDecor(nom) ? { ['adresse_' + nom]: '' } : {}));
    plans.forEach(x => patch('plan', x.id, Object.assign(memeVal(x.lieu, nom) ? { lieu: '' } : {}, memeVal(x.fondLieu, nom) ? { fondLieu: '' } : {})));
    oublierPrep(); renderAll(); openDecors();
    toast('« ' + nom + ' » retiré' + (plans.length ? ' : ' + plans.length + ' plan' + plur(plans.length) + ' sans décor' : ''));
  };
  if (!plans.length) return faire();
  confirmer('Retirer le décor « ' + nom + ' » ?', { detail: plans.length + ' plan' + plur(plans.length) + ' le porte' + plur(plans.length) + ' : ' + (plans.length > 1 ? 'ils n’auront' : 'il n’aura') + ' plus de décor.', ok:'Retirer', danger:true })
    .then(oui => { if (oui) faire(); });
}
function openDecors(){
  openId = 'decors'; openType = 'decors';
  videEntete();
  const declares = DB.prod.decors || [];
  const tous = fusion(declares, connus(DB.plans, 'lieu'));

  $('ssub').textContent = 'Les lieux où l’on tourne, proposés au champ Décor de chaque plan';
  $('sbody').innerHTML = `
    <div class="sec">
      <div class="specs">
        ${tous.map(d => { const n = compte(d); return `<div class="spec decor"><label>${esc(d)}</label>
          <span class="compte">${n ? n + ' plan' + plur(n) : 'aucun plan'}</span>
          <button type="button" class="btn sm" onclick="renommerDecor('${esc(d)}')">Modifier</button>
          <button type="button" class="btn sm" onclick="retirerDecor('${esc(d)}')">Retirer</button></div>
          ${F(DB.prod, 'Adresse', 'adresse_' + d.trim(), {ph:'Rue, numéro, ville : l’adresse réelle du tournage'})}`; }).join('') ||
          '<div class="note">Aucun décor pour l’instant.</div>'}
      </div>
      <div class="btns" style="margin-top:12px">
        <button type="button" class="btn p" onclick="ajouterDecor().then(openDecors)">+ Ajouter un décor</button>
      </div>
      <div class="note">Modifier renomme le décor sur tous les plans qui le portent ; Retirer les laisse sans décor. L’adresse va dans « Location » du data wrangling. Le plan du décor pour le croquis s’importe depuis la fiche d’un plan.</div>
    </div>`;
  montrerFiche(0);
}
/* Le decor dont le plan sert de fond au croquis : celui du plan, sauf si on en a choisi un autre. */
const lieuFond = p => (p.fondLieu || p.lieu || '').trim();
/* Les decors ou l'on tourne vraiment (le full CG n'a pas de plateau), les plus frequents d'abord. */
function decorsTournage(){
  return frequences(DB.plans.filter(p => p.jour !== 'CG').map(p => (p.lieu || '').trim())).map(x => x[0]);
}
function chargerImage(src){
  // un plan servi par l'API (peut-etre d'une autre adresse) doit rester lisible pour le PDF : on le demande en CORS
  return new Promise((ok, ko) => { if (!src) return ok(null); const i = new Image(); i.onload = () => ok(i); i.onerror = ko;
    if (/^https?:|api\//.test(src)) i.crossOrigin = 'anonymous'; i.src = src; });
}

/* A-t-on dessine quelque chose ? Et : y a-t-il quelque chose a montrer, le
   plan du decor seul comptant pour un apercu. */
/* Un plan peut avoir plusieurs croquis : le premier reste dans p.croquis (les anciens
   projets n'ont rien a changer), les suivants dans p.croquisPlus, dans l'ordre. Tous
   partagent le plan du decor. La fiche en montre un a la fois (CROQ_VU, par plan). */
const croquisListe = p => [p && p.croquis || null].concat(p && p.croquisPlus || []);
const croquisDe = (p, i) => croquisListe(p)[i || 0] || null;
const pleinCroquis = c => !!(c && ((c.traits && c.traits.length) || (c.objets && c.objets.length)));
const CROQ_VU = {};
const croquisVu = p => Math.max(0, Math.min(CROQ_VU[p.id] || 0, croquisListe(p).length - 1));
// sans numero : un croquis dessine, quel qu'il soit
const aTraits = (p, i) => i == null ? croquisListe(p).some(pleinCroquis) : pleinCroquis(croquisDe(p, i));
const aCroquis = p => aTraits(p) || !!fondDecor(lieuFond(p));

let choixFondOuvert = false;   // « Changer le plan du decor » : les vignettes des decors sont depliees
function htmlCroquis(p){
  const lieu = lieuFond(p), fond = fondDecor(lieu);
  // les decors du tournage, puis les plans fournis avec la page
  const decors = fusion(decorsTournage(), (lieu ? [lieu] : []).concat(PLANS_DECOR.map(d => d[0])));
  const n = croquisListe(p).length, vu = croquisVu(p);
  const montrer = aTraits(p, vu) || !!fond;
  // les onglets des croquis : un par croquis s'il y en a plusieurs, et « + Croquis » des qu'un est dessine
  const onglets = n > 1 || aTraits(p, vu) ? `<div class="croq-onglets">
      ${n > 1 ? croquisListe(p).map((c, i) => `<button type="button" class="${i === vu ? 'on' : ''}" onclick="voirCroquis('${p.id}', ${i})">Croquis ${i + 1}</button>`).join('') : ''}
      <button type="button" class="plus" onclick="nouveauCroquis('${p.id}')">+ Croquis</button>
      ${n > 1 ? `<button type="button" class="suppr" onclick="supprimerCroquis('${p.id}')">Supprimer le croquis ${vu + 1}</button>` : ''}
    </div>` : '';
  // les trois gestes du croquis : des pictos poses en haut de l'image, leur nom au survol
  const outil = (cls, action, nom, ico) =>
    `<button type="button" class="${cls}" onclick="${action}('${p.id}')" title="${nom}" aria-label="${nom}">${ico}</button>`;
  const deja = texteDessine(quiDessine(p.id));
  return `<div class="croq">
    <div class="croq-deja" data-plan="${p.id}"${deja ? '' : ' hidden'}>${esc(deja)}</div>
    ${onglets}
    <div class="croq-cadre${montrer ? '' : ' vide'}">
      ${montrer ? `<canvas id="croq-apercu" onclick="ouvrirCroquis('${p.id}')" title="Modifier le croquis"></canvas>`
                : `<button type="button" class="croq-vide" onclick="ouvrirCroquis('${p.id}')">${ICONES.crayon}<span>Dessiner le set</span></button>`}
      <div class="croq-outils">
        ${outil('', 'ouvrirCroquis', montrer ? 'Modifier le croquis' : 'Dessiner le set', ICONES.crayon)}
        ${outil(choixFondOuvert ? 'on' : '', 'basculerChoixFond', fond ? 'Changer le plan du décor' : 'Choisir le plan du décor', ICONES.decor)}
        ${fondImporte(lieu) ? outil('d', 'retirerFond', 'Retirer le plan du décor', ICONES.corbeille) : ''}
      </div>
    </div>
    ${choixFondOuvert ? `<div class="fonds">
      ${decors.map(l => { const img = fondDecor(l), ici = memeVal(l, lieu);
        return `<button type="button" class="fond${ici ? ' on' : ''}" data-l="${esc(l)}" onclick="prendreFond('${p.id}', this.dataset.l)">
          ${img ? `<img src="${img}" alt="">` : `<span class="fond-vide">${ICONES.image}<em>Importer</em></span>`}
          <b>${esc(l)}</b><i>${ici && img ? 'utilisé ici' : fondImporte(l) ? 'plan importé' : img ? 'plan du décor' : 'pas encore de plan'}</i>
        </button>`; }).join('')}
      ${fond ? `<button type="button" class="fond-autre" onclick="choisirFond('${p.id}')">Remplacer l’image de « ${esc(lieu)} »…</button>` : ''}
    </div>` : ''}
  </div>`;
}

/* L'etat de l'editeur pour un plan, sur le fond donne : le croquis garde est remis a l'echelle du fond. */
function etatCroquis(p, img, i){
  // sans plan du decor : le format du croquis existant, sinon une feuille dans le sens de l'ecran
  i = i == null ? croquisVu(p) : i;
  const anc = croquisDe(p, i) || {}, portrait = innerHeight > innerWidth;
  const plein = (anc.traits && anc.traits.length) || (anc.objets && anc.objets.length);
  const w = img ? img.naturalWidth : (plein && anc.w ? anc.w : (portrait ? 1200 : 1600));
  const h = img ? img.naturalHeight : (plein && anc.h ? anc.h : (portrait ? 1600 : 1200));
  const kx = anc.w ? w / anc.w : 1, ky = anc.h ? h / anc.h : 1;
  let seq = 0;
  const traits = (anc.traits || []).map(t => ({ c:t.c, w:t.w, pts:t.pts.map(q => [q[0] * kx, q[1] * ky]), n:++seq }));
  const objets = (anc.objets || []).map(o => {
    const c = Object.assign({}, o, { n:++seq });
    ['x', 'x1', 'x2', 'mx'].forEach(k => { if (o[k] != null) c[k] = o[k] * kx; });
    ['y', 'y1', 'y2', 'my'].forEach(k => { if (o[k] != null) c[k] = o[k] * ky; });
    if (o.pts) c.pts = o.pts.map(q => [q[0] * kx, q[1] * ky]);
    return c;
  });
  return { planId:p.id, index:i, fond:img, w, h, traits, objets, seq, outil:'crayon', couleur:CROQUIS_COULEURS[0], largeur:1, courant:null, sale:false, zoom:1, histo:[] };
}

function ouvrirCroquis(id, i){
  const p = plan(id); if (!p) return;
  i = i == null ? croquisVu(p) : i;
  chargerImage(fondDecor(lieuFond(p))).catch(() => null).then(img => {
    dessin = etatCroquis(p, img, i);
    dessin.rot = dessin.cale = UI.rotCroquis || 0;   // le sens de la feuille choisi sur cet appareil
    // qui le dessine deja : une fenetre le dit (majDejaCroquis), une fois par personne
    dessin.prevenus = new Set();
    envoyerPresence(); majDejaCroquis();
    // l'editeur a sa marque dans l'historique : le Retour du telephone le ferme (en enregistrant), pas la fiche
    try{ if (!(history.state && history.state.dessin)) history.pushState(Object.assign({}, history.state, { dessin: 1 }), ''); }catch(e){}
    const v = $('voile-dessin');
    v.querySelector('.dtitre b').textContent = 'Croquis' + (croquisListe(p).length > 1 || i ? ' ' + (i + 1) : '') + ' · shot ' + (p.plan || '?');
    v.querySelector('.dtitre span').textContent = (lieuFond(p) || 'Sans décor') + (img ? ' — sur le plan du décor' : ' — feuille blanche');
    v.hidden = false;
    majOutils(); tailleCroquis(); rendreCroquis();
  });
}

/* Les onglets de la fiche : voir un autre croquis, en commencer un nouveau (il n'existe
   qu'une fois enregistre), ou en supprimer un (les suivants remontent d'un rang). */
function voirCroquis(id, i){ const p = plan(id); if (!p) return; CROQ_VU[id] = i; redessinerFichePlan(p); }
function nouveauCroquis(id){ const p = plan(id); if (!p) return; ouvrirCroquis(id, croquisListe(p).length); }
function supprimerCroquis(id){
  const p = plan(id); if (!p) return;
  const i = croquisVu(p), l = croquisListe(p);
  if (l.length < 2) return;
  confirmer('Supprimer le croquis ' + (i + 1) + ' de ce plan ?', { ok:'Supprimer', danger:true }).then(oui => {
    if (!oui) return;
    const reste = l.filter((c, k) => k !== i);
    patch('plan', p.id, { croquis: reste[0] || null, croquisPlus: reste.slice(1).map(x => x || {}) });
    CROQ_VU[id] = Math.max(0, i - 1);
    redessinerFichePlan(p); renderList();
    toast('Croquis supprimé');
  });
}

/* L'apercu de la fiche se redessine a l'ouverture, depuis les traits gardes dans
   le projet. Il n'est plus enregistre en image : c'etait la meme information,
   quinze fois plus lourde, recopiee dans chaque plan avec le plan du decor cuit
   dedans — les soixante plans d'un meme decor en portaient soixante copies. Le
   decor change ? Il n'y a plus rien a refaire dans le projet, on redessine.
   La largeur du canvas ne part nulle part : elle peut etre genereuse. */
const APERCU = 900;
/* Autour de la feuille, une marge ou l'on dessine aussi : une lumiere derriere la fenetre,
   une camera dans le couloir. Elle vaut un quart de la feuille de chaque cote. */
const MARGE_CROQUIS = .25;
const margeCroquis = () => ({ x0: -MARGE_CROQUIS * dessin.w, y0: -MARGE_CROQUIS * dessin.h,
                              x1: (1 + MARGE_CROQUIS) * dessin.w, y1: (1 + MARGE_CROQUIS) * dessin.h });
/* Ce que couvre le dessin : la feuille, agrandie de ce qui en deborde (dans la marge). L'apercu et
   la feuille VFX s'elargissent d'autant ; sans rien dehors, ils restent la feuille seule. */
function bornesCroquis(){
  const m = margeCroquis(), pad = 70 * dessin.w / 1600, b = { x0: 0, y0: 0, x1: dessin.w, y1: dessin.h };
  const voir = (x, y) => { if (x == null || y == null) return;
    b.x0 = Math.min(b.x0, x - pad); b.y0 = Math.min(b.y0, y - pad); b.x1 = Math.max(b.x1, x + pad); b.y1 = Math.max(b.y1, y + pad); };
  dessin.traits.forEach(t => t.pts.forEach(q => voir(q[0], q[1])));
  dessin.objets.forEach(o => { voir(o.x, o.y); voir(o.x1, o.y1); voir(o.x2, o.y2); voir(o.mx, o.my); (o.pts || []).forEach(q => voir(q[0], q[1])); });
  return { x0: Math.max(m.x0, b.x0), y0: Math.max(m.y0, b.y0), x1: Math.min(m.x1, b.x1), y1: Math.min(m.y1, b.y1) };
}
const hauteurApercu = l => { const b = bornesCroquis(); return Math.round(l * (b.y1 - b.y0) / (b.x1 - b.x0)); };
function dessinerApercu(p){
  const cv = $('croq-apercu');
  if (!cv) return;
  chargerImage(fondDecor(lieuFond(p))).catch(() => null).then(img => {
    // la fiche a pu se redessiner, ou changer de plan, pendant le chargement
    if ($('croq-apercu') !== cv) return;
    const garde = dessin;
    dessin = etatCroquis(p, img);
    cv.width = APERCU; cv.height = hauteurApercu(APERCU);
    rendreCroquis(cv);
    dessin = garde;
  });
}
/* Le retour (la fleche, ou le Retour du telephone) enregistre le dessin avant de fermer :
   rien ne se perd en sortant. */
function fermerCroquis(enregistrer){
  if (!dessin) return false;
  if (enregistrer && dessin.sale && plan(dessin.planId)) enregistrerCroquis();
  fermerPick(); dessin = null; $('voile-dessin').hidden = true;
  envoyerPresence();
  // fermee a la main : sa marque quitte l'historique, sans que le Retour touche a la fiche
  if (!RETOUR.rejoue && history.state && history.state.dessin){
    RETOUR.ignorer = true;
    try{ history.back(); }catch(e){ RETOUR.ignorer = false; }
  }
  return true;
}

/* La vue du croquis. Le canevas a la taille de la zone (a la densite de l'ecran) et y
   dessine la feuille zoomee et tournee : rien n'est agrandi en CSS. Un canevas de
   plusieurs milliers de pixels, tourne, depassait ce que la carte graphique d'un
   telephone sait peindre, et des bandes noires le rognaient.
   dessin.vue : le point de la feuille au centre de la zone ; dessin.rot : l'angle (degres) ;
   dessin.zoom : par rapport a la vue entiere, calculee pour le quart de tour dessin.cale —
   tourner du bout des doigts ne la change pas, le zoom ne saute donc pas en diagonale. */
function vueCroquis(){
  const z = $('dzone').getBoundingClientRect(), debout = (dessin.cale || 0) % 180 !== 0;
  const lw = debout ? dessin.h : dessin.w, lh = debout ? dessin.w : dessin.h;
  const fit = Math.max(.01, Math.min((z.width - 24) / lw, (z.height - 24) / lh));
  return { z, k: fit * (dessin.zoom || 1), a: (dessin.rot || 0) * Math.PI / 180, v: dessin.vue || [dessin.w / 2, dessin.h / 2] };
}
/* le point de la feuille sous un point de l'ecran, et l'inverse */
function feuilleSous(x, y){
  const { z, k, a, v } = vueCroquis(), dx = x - z.left - z.width / 2, dy = y - z.top - z.height / 2;
  return [(dx * Math.cos(a) + dy * Math.sin(a)) / k + v[0], (dy * Math.cos(a) - dx * Math.sin(a)) / k + v[1]];
}
function ecranDe(pt){
  const { z, k, a, v } = vueCroquis(), ox = (pt[0] - v[0]) * k, oy = (pt[1] - v[1]) * k;
  return [z.left + z.width / 2 + ox * Math.cos(a) - oy * Math.sin(a), z.top + z.height / 2 + ox * Math.sin(a) + oy * Math.cos(a)];
}
/* ancre : un point de l'ecran (clientX/Y) sous lequel doit se trouver ancre.pt, un point de la feuille */
function tailleCroquis(ancre){
  if (!dessin) return;
  const c = $('croquis'), { z, k, a } = vueCroquis(), dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, Math.round(z.width * dpr)), H = Math.max(1, Math.round(z.height * dpr));
  if (c.width !== W || c.height !== H){ c.width = W; c.height = H; }
  if (ancre && ancre.pt){
    const dx = ancre.x - z.left - z.width / 2, dy = ancre.y - z.top - z.height / 2;
    dessin.vue = [ancre.pt[0] - (dx * Math.cos(a) + dy * Math.sin(a)) / k, ancre.pt[1] - (dy * Math.cos(a) - dx * Math.sin(a)) / k];
  }
  // la feuille ne part jamais tout entiere hors de la zone : le centre de la vue reste dessus
  const v = dessin.vue || [dessin.w / 2, dessin.h / 2];
  const mg = margeCroquis();
  dessin.vue = [Math.max(mg.x0, Math.min(mg.x1, v[0])), Math.max(mg.y0, Math.min(mg.y1, v[1]))];
  const rot = dessin.rot || 0, e = $('dzoom');
  if (e) e.textContent = Math.round((dessin.zoom || 1) * 100) + ' %' + (rot % 90 ? ' · ' + Math.round(rot) + '°' : '');
  rendreCroquis();
}
/* Revenir a la vue entiere remet aussi la feuille droite, dans le sens choisi sur l'appareil, et centree. */
function zoomCroquis(facteur, ancre){
  if (!dessin) return;
  const pt = ancre && feuilleSous(ancre.x, ancre.y);
  dessin.zoom = facteur == null ? 1 : Math.max(.5, Math.min(6, (dessin.zoom || 1) * facteur));
  if (facteur == null){ dessin.rot = dessin.cale = UI.rotCroquis || 0; dessin.vue = null; }
  tailleCroquis(pt ? { x: ancre.x, y: ancre.y, pt } : null);
}
/* faire glisser la vue d'un deplacement a l'ecran (la main, la molette, deux doigts) */
function glisserVue(dx, dy){
  const { k, a, v } = vueCroquis();
  dessin.vue = [v[0] - (dx * Math.cos(a) + dy * Math.sin(a)) / k, v[1] - (dy * Math.cos(a) - dx * Math.sin(a)) / k];
  tailleCroquis();
}
/* Ctrl + molette (ou le pincement d'un pave tactile) zoome autour du curseur ; la molette seule fait glisser la vue. */
function moletteCroquis(e){
  if (!dessin) return;
  if (e.ctrlKey || e.metaKey){ e.preventDefault(); zoomCroquis(e.deltaY < 0 ? 1.15 : 1 / 1.15, { x:e.clientX, y:e.clientY }); return; }
  const o = dessin.selection;
  if (dessin.outil === 'move' && o && (OBJ_POSE.includes(o.t) || o.t === 'txt' || (OBJ_RECT.includes(o.t) && !e.shiftKey))){
    e.preventDefault();
    souvenir('molette' + o.n);
    // Maj + molette : la taille ; la molette seule : l'orientation
    if (e.shiftKey) o.s = Math.round(Math.min(TAILLE_MAX, Math.max(TAILLE_MIN, (o.s || 1) * ((e.deltaY || e.deltaX) > 0 ? 1 / 1.1 : 1.1))) * 20) / 20;
    else if (o.t === 'ponct') o.r = Math.min(RAYON_MAX, Math.max(RAYON_MIN, Math.round(rayonPonct(o) * (e.deltaY > 0 ? 1 / 1.1 : 1.1) / 5) * 5));
    else o.a = (o.a || 0) + (e.deltaY > 0 ? 1 : -1) * Math.PI / 36;
    dessin.sale = true; rendreCroquis();
    return;
  }
  e.preventDefault();
  glisserVue(-(e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX), e.shiftKey && !e.deltaX ? 0 : -e.deltaY);
}
/* Deux doigts sur le canevas : on pince pour zoomer, on tourne pour tourner la feuille,
   le trait en cours est abandonne. La rotation ne part qu'au-dela de quelques degres
   (un pincement seul ne fait pas trembler la feuille) et se recolle a 0° quand on l'y ramene. */
const doigts = new Map();
let pince = null;
const SEUIL_TOUR = 12, AIMANT_TOUR = 10;
const angleDoigts = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
function doigtPose(e){
  doigts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (doigts.size === 2 && dessin){
    const [a, b] = [...doigts.values()];
    // on garde sous les deux doigts le point du croquis qu'ils tenaient : pincer zoome, tourner tourne, glisser deplace
    pince = { d0: Math.hypot(a.x - b.x, a.y - b.y), z0: dessin.zoom || 1, a0: angleDoigts(a, b), r0: dessin.rot || 0,
              tourne: false, pt: feuilleSous((a.x + b.x) / 2, (a.y + b.y) / 2) };
    dessin.courant = null; rendreCroquis();
  }
}
function doigtBouge(e){
  if (!doigts.has(e.pointerId)) return;
  doigts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pince && doigts.size === 2){
    const [a, b] = [...doigts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    dessin.zoom = Math.max(.5, Math.min(6, pince.z0 * d / Math.max(1, pince.d0)));
    const da = ((angleDoigts(a, b) - pince.a0) % 360 + 540) % 360 - 180;
    // passe le seuil, la feuille part d'ou elle etait : pas de saut
    if (!pince.tourne && Math.abs(da) > SEUIL_TOUR){ pince.tourne = true; pince.a0 += Math.sign(da) * SEUIL_TOUR; }
    if (pince.tourne){
      // l'aimant ne joue qu'au retour a l'origine : la feuille droite, a 0°
      const r = ((pince.r0 + ((angleDoigts(a, b) - pince.a0) % 360 + 540) % 360 - 180) % 360 + 360) % 360;
      dessin.rot = Math.min(r, 360 - r) < AIMANT_TOUR ? 0 : r;
    }
    tailleCroquis({ x:(a.x + b.x) / 2, y:(a.y + b.y) / 2, pt:pince.pt });
  }
}
function doigtLeve(e){
  doigts.delete(e.pointerId);
  if (doigts.size >= 2 || !pince) return;
  // une feuille reposee droite devient le sens de l'appareil ; un angle de travail reste le temps du croquis
  if (pince.tourne && dessin && dessin.rot % 90 === 0 && dessin.rot !== (UI.rotCroquis || 0)){ UI.rotCroquis = dessin.rot; ecrireUI(); }
  // la vue entiere suit le sens de la feuille une fois reposee droite (sans rien changer a l'ecran : le zoom compense)
  if (pince.tourne && dessin && dessin.rot % 90 === 0 && dessin.rot !== (dessin.cale || 0)){
    const k = vueCroquis().k; dessin.cale = dessin.rot; dessin.zoom *= k / vueCroquis().k; tailleCroquis();
  }
  pince = null;
}
/* la barre d'espace tenue : la vue se deplace a la souris, quel que soit l'outil */
let espaceTenu = false;
document.addEventListener('keydown', e => {
  if (e.key === ' ' && dessin && !DLG.resoudre && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ e.preventDefault(); espaceTenu = true; $('dzone').classList.add('main'); }
});
document.addEventListener('keyup', e => { if (e.key === ' '){ espaceTenu = false; const z = $('dzone'); if (z) z.classList.remove('main'); } });

/* Les objets sont dessines a une taille fixe par rapport a une feuille de
   1600 de large : la meme camera sur un petit ou un grand plan de decor. */
/* Les volets du projecteur : o.bd, le demi-angle du faisceau (en radians), entre 5° et 80°.
   Le bord du faisceau part de la lentille ; f.x, f.y : son bout, f.b : l'angle. */
const VOLET_DEF = .38, VOLET_MIN = 5 * Math.PI / 180, VOLET_MAX = 80 * Math.PI / 180;
function faisceau(o){
  const b = o.bd != null ? o.bd : VOLET_DEF;
  return { b, x: 28 + 155 * Math.cos(b), y: 14 + 155 * Math.sin(b) };
}
/* la portee d'une point light : le rayon de son cercle, a sa taille d'origine (30 a 600) */
const RAYON_DEF = 75, RAYON_MIN = 30, RAYON_MAX = 600;
const rayonPonct = o => o.r || RAYON_DEF;
const rgbaHex = (h, a) => { const m = /^#?([0-9a-f]{6})$/i.exec(h || '') || [0, 'e7b04a'];
  return 'rgba(' + [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16)).join(',') + ',' + a + ')'; };
function dessinerObjet(g, o, k, u){
  const X = v => v * k, Y = X;   // meme echelle sur les deux axes
  g.save();
  if (o.t === 'bloc'){
    // un rectangle tire coin a coin : praticable, caisse, meuble
    // tourne autour de son centre (o.a), comme une camera
    const w = Math.abs(o.x2 - o.x1), h = Math.abs(o.y2 - o.y1);
    g.translate(X((o.x1 + o.x2) / 2), Y((o.y1 + o.y2) / 2)); g.rotate(o.a || 0);
    // le contour de la couleur choisie, l'interieur de la meme couleur, translucide
    g.fillStyle = g.strokeStyle = o.c || '#3a3330'; g.lineWidth = 4 * u; g.lineJoin = 'miter';
    g.globalAlpha = .18; g.fillRect(-X(w) / 2, -Y(h) / 2, X(w), Y(h));
    g.globalAlpha = 1; g.strokeRect(-X(w) / 2, -Y(h) / 2, X(w), Y(h));
  } else if (o.t === 'rond'){
    // un rond (ou un ovale) inscrit dans le rectangle tire : table ronde, tapis, zone
    const cx = X((o.x1 + o.x2) / 2), cy = Y((o.y1 + o.y2) / 2), rx = Math.abs(X(o.x2 - o.x1)) / 2, ry = Math.abs(Y(o.y2 - o.y1)) / 2;
    g.fillStyle = g.strokeStyle = o.c || '#3a3330'; g.lineWidth = 4 * u;
    g.beginPath(); g.ellipse(cx, cy, Math.max(rx, 1), Math.max(ry, 1), o.a || 0, 0, Math.PI * 2);
    g.globalAlpha = .18; g.fill(); g.globalAlpha = 1; g.stroke();
  } else if (o.t === 'fleche'){
    // un deplacement : un trait en pointille long, une pointe a l'arrivee ; courbe,
    // il passe par son point du milieu (o.mx, o.my) et la pointe suit la courbe
    const ax = X(o.x1), ay = Y(o.y1), bx = X(o.x2), by = Y(o.y2), q = controleFleche(o);
    const ang = q ? Math.atan2(by - Y(q[1]), bx - X(q[0])) : Math.atan2(by - ay, bx - ax);
    g.strokeStyle = o.c || '#1c1410'; g.fillStyle = o.c || '#1c1410'; g.lineWidth = 5 * u; g.lineCap = 'round';
    g.setLineDash([16 * u, 12 * u]);
    g.beginPath(); g.moveTo(ax, ay);
    if (q) g.quadraticCurveTo(X(q[0]), Y(q[1]), bx - Math.cos(ang) * 14 * u, by - Math.sin(ang) * 14 * u);
    else g.lineTo(bx - Math.cos(ang) * 14 * u, by - Math.sin(ang) * 14 * u);
    g.stroke();
    g.setLineDash([]);
    g.beginPath(); g.moveTo(bx, by);
    g.lineTo(bx - Math.cos(ang - .45) * 26 * u, by - Math.sin(ang - .45) * 26 * u);
    g.lineTo(bx - Math.cos(ang + .45) * 26 * u, by - Math.sin(ang + .45) * 26 * u); g.closePath(); g.fill();
  } else if (o.t === 'trajet'){
    // la fleche libre : le trajet lisse en pointille, arrete avant la pointe, qui suit sa derniere direction
    const l = (o.pts || []).map(q => [X(q[0]), Y(q[1])]);
    if (l.length > 1){
      const fin = l[l.length - 1], coupe = retirerFin(l, 14 * u), base = pointAvant(l, 26 * u);
      const ang = Math.atan2(fin[1] - base[1], fin[0] - base[0]);
      g.strokeStyle = o.c || '#1c1410'; g.fillStyle = o.c || '#1c1410'; g.lineWidth = 5 * u; g.lineCap = 'round'; g.lineJoin = 'round';
      g.setLineDash([16 * u, 12 * u]);
      g.beginPath(); g.moveTo(coupe[0][0], coupe[0][1]);
      // des courbes d'un milieu de segment au suivant : le trace a la main s'adoucit
      for (let i = 1; i < coupe.length - 1; i++)
        g.quadraticCurveTo(coupe[i][0], coupe[i][1], (coupe[i][0] + coupe[i + 1][0]) / 2, (coupe[i][1] + coupe[i + 1][1]) / 2);
      g.lineTo(coupe[coupe.length - 1][0], coupe[coupe.length - 1][1]);
      g.stroke();
      g.setLineDash([]);
      g.beginPath(); g.moveTo(fin[0], fin[1]);
      g.lineTo(fin[0] - Math.cos(ang - .45) * 26 * u, fin[1] - Math.sin(ang - .45) * 26 * u);
      g.lineTo(fin[0] - Math.cos(ang + .45) * 26 * u, fin[1] - Math.sin(ang + .45) * 26 * u); g.closePath(); g.fill();

function saisir(pt){
  const r = 28 * dessin.w / 1600;
  for (let i = dessin.objets.length - 1; i >= 0; i--) if (touche(pt, dessin.objets[i])) return dessin.objets[i];
  for (let i = dessin.traits.length - 1; i >= 0; i--){
    const t = dessin.traits[i];
    if (t.pts.some(q => Math.hypot(q[0] - pt[0], q[1] - pt[1]) < r + t.w)) return t;
  }
  return null;
}
function translater(e, dx, dy){
  if (e.pts) e.pts = e.pts.map(q => [q[0] + dx, q[1] + dy]);
  else if (e.x1 != null){ e.x1 += dx; e.y1 += dy; e.x2 += dx; e.y2 += dy; if (e.mx != null){ e.mx += dx; e.my += dy; } }
  else { e.x += dx; e.y += dy; }
}
function gommer(pt){
  const r = 28 * dessin.w / 1600;
  const traits = dessin.traits.filter(t => !t.pts.some(q => Math.hypot(q[0] - pt[0], q[1] - pt[1]) < r + t.w));
  const objets = dessin.objets.filter(o => !touche(pt, o));
  if (traits.length === dessin.traits.length && objets.length === dessin.objets.length) return;
  const g = dessin.courant;
  if (!g || !g.souvenu){ souvenir(); if (g) g.souvenu = true; }
  dessin.traits = traits; dessin.objets = objets;
  dessin.sale = true; rendreCroquis();
}
/* L'historique : une copie des traits et des objets prise avant chaque geste, pour
   qu'Annuler rende aussi ce que la gomme a retire, ce qui a bouge ou tourne, et le
   grand effacement. Une cle regroupe les gestes qui s'enchainent (les crans de molette). */
function souvenir(cle){
  const h = dessin.histo, d = h[h.length - 1];
  if (cle && d && d.cle === cle && Date.now() - d.quand < 800){ d.quand = Date.now(); return; }
  h.push({ traits: structuredClone(dessin.traits), objets: structuredClone(dessin.objets), cle, quand: Date.now() });

}
/* le premier vrai mouvement d'un geste prend le cran, pas le simple clic qui saisit */
const retenir = c => { if (!c.souvenu){ souvenir(); c.souvenu = true; } };
function annulerTrait(){
  if (!dessin) return;

  dessin.selection = sel ? dessin.objets.concat(dessin.traits).find(o => o.n === sel.n) || null : null;
  dessin.sale = true; rendreCroquis();
}
function viderCroquis(){
  if (!dessin || !(dessin.traits.length || dessin.objets.length)) return;
  confirmer('Effacer tout le croquis ?', { ok:'Tout effacer', danger:true }).then(oui => {
    if (!oui || !dessin) return;
    souvenir();
    dessin.traits = []; dessin.objets = []; dessin.sale = true; rendreCroquis();
  });
}
/* La corbeille : retire ce qui est saisi (un objet, un texte, un trait) ; rien de saisi, elle propose de tout effacer. */
function supprimerCroquisSel(){
  if (!dessin) return;
  const o = dessin.selection;
  if (!saisissable(o)) return viderCroquis();
  souvenir();
  dessin.objets = dessin.objets.filter(x => x !== o); dessin.traits = dessin.traits.filter(x => x !== o);
  dessin.selection = null; dessin.sale = true; rendreCroquis();
}
function outilCroquis(k, v){
  if (!dessin) return;
  if (k === 'couleur'){
    dessin.couleur = v; if (dessin.outil === 'gomme') dessin.outil = 'crayon';
    // un objet saisi prend la couleur (un cran d'Annuler par objet, meme en promenant le selecteur)
    const o = dessin.outil === 'move' && dessin.selection;
    if (saisissable(o) && o.c !== v){ souvenir('couleur' + o.n); o.c = v; dessin.sale = true; rendreCroquis(); }
  }
  else if (k === 'largeur'){ dessin.largeur = v; dessin.outil = 'crayon'; }
  else if (k === 'objet') dessin.outil = dessin.outil === v ? 'crayon' : v;
  else if (k === 'move') dessin.outil = dessin.outil === 'move' ? 'crayon' : 'move';
  else if (k === 'main') dessin.outil = dessin.outil === 'main' ? 'crayon' : 'main';
  else if (k === 'crayon') dessin.outil = 'crayon';
  else dessin.outil = dessin.outil === 'gomme' ? 'crayon' : 'gomme';
  if (dessin.outil !== 'move') dessin.selection = null;

}

function enregistrerCroquis(silence){
  if (!dessin) return;
  const p = plan(dessin.planId); if (!p){ fermerCroquis(); return; }
  const sans = l => l.map(o => { const c = Object.assign({}, o); delete c.n; return c; });
  const c = { w: dessin.w, h: dessin.h, traits: sans(dessin.traits), objets: sans(dessin.objets) }, i = dessin.index || 0;
  if (!i) patch('plan', p.id, { croquis: c });
  else { const plus = (p.croquisPlus || []).slice(); plus[i - 1] = c; patch('plan', p.id, { croquisPlus: plus.map(x => x || {}) }); }
  CROQ_VU[p.id] = i;
  // on reste dans l'editeur : la fiche derriere se met a jour, la fleche ramene quand on veut
  dessin.sale = false;
  redessinerFichePlan(p); renderList();

/* Le selecteur de couleur, dans la charte : un carre saturation / luminosite, un rail de
   teinte, le code, et les dernieres couleurs choisies (gardees sur l'appareil). La couleur
   s'applique en direct au crayon et aux objets qu'on pose. */
const PICK = { h: 280, s: .6, v: .8 };
function hsvHex(h, s, v){
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return '#' + [f(5), f(3), f(1)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
}
function hexHsv(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return null;
  const [r, g, b] = [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16) / 255);
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  const h = !d ? 0 : max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: h * 60, s: max ? d / max : 0, v: max };
}
function ouvrirPick(btn){
  const pk = $('dpick');
  if (!pk.hidden){ fermerPick(); return; }
  const deja = dessin && !CROQUIS_COULEURS.includes(dessin.couleur) && hexHsv(dessin.couleur);
  if (deja) Object.assign(PICK, deja);
  pk.hidden = false;
  // au-dessus de la pastille, sans sortir de l'ecran
  const r = btn.getBoundingClientRect(), l = pk.offsetWidth, h = pk.offsetHeight;
  pk.style.left = Math.max(8, Math.min(innerWidth - l - 8, r.left + r.width / 2 - l / 2)) + 'px';
  pk.style.top = Math.max(8, r.top - h - 10) + 'px';
  majPick(!deja);
  setTimeout(() => document.addEventListener('pointerdown', horsPick, true), 0);
}
function horsPick(e){ if (!e.target.closest('#dpick, .dperso')) fermerPick(); }
function fermerPick(){
  const pk = $('dpick'); if (!pk || pk.hidden) return;
  pk.hidden = true;
  document.removeEventListener('pointerdown', horsPick, true);
  // la couleur rejoint les recentes
  if (dessin && !CROQUIS_COULEURS.includes(dessin.couleur)){
    UI.couleurs = [dessin.couleur].concat((UI.couleurs || []).filter(c => c !== dessin.couleur)).slice(0, 8);

/* appliquer : l'outil prend la couleur (sans rien poser), la pastille la montre */
function majPick(sansAppliquer){
  const hex = hsvHex(PICK.h, PICK.s, PICK.v);
  $('dpick-sv').style.background = `linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,hsl(${PICK.h},100%,50%))`;
  const pt = $('dpick-pt'); pt.style.left = PICK.s * 100 + '%'; pt.style.top = (1 - PICK.v) * 100 + '%'; pt.style.background = hex;
  $('dpick-h').value = Math.round(PICK.h);
  $('dpick-ap').style.background = hex;
  const hx = $('dpick-hex'); if (document.activeElement !== hx) hx.value = hex;
  $('dpick-rec').innerHTML = (UI.couleurs || []).map(c => `<button type="button" style="background:${c}" onclick="prendrePick('${c}')" aria-label="${c}"></button>`).join('');
  if (!sansAppliquer && dessin) outilCroquis('couleur', hex);
}
function teintePick(v){ PICK.h = +v; majPick(); }
function hexPick(v){ const c = hexHsv(v.startsWith('#') ? v : '#' + v); if (c){ Object.assign(PICK, c); majPick(); } }
function prendrePick(c){ Object.assign(PICK, hexHsv(c)); majPick(); }
(function(){
  const sv = document.getElementById('dpick-sv'); if (!sv) return;
  const lire = e => { const r = sv.getBoundingClientRect();
    PICK.s = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); PICK.v = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height)); majPick(); };
  sv.addEventListener('pointerdown', e => { sv.setPointerCapture(e.pointerId); lire(e); });
  sv.addEventListener('pointermove', e => { if (e.buttons) lire(e); });
})();

        `<button data-et="${v}" class="${classeSeg(v, p.etat, c)}" onclick="setEtatPlan('${v}')">${ETATS[v]}</button>`).join('')}</div>
      ${p.fusionDans && plan(p.fusionDans)
        ? `<div class="note">Fusionné dans le <a href="#" onclick="event.preventDefault();openPlan('${p.fusionDans}')">shot ${esc(plan(p.fusionDans).plan || '?')}</a> : ses prises y sont.</div>`
        : `<button type="button" class="btn fusion" onclick="choisirFusion('${p.id}')">Fusionner avec un autre shot…</button>`}
    </div>

    ${prepare() ? `<div class="btns centre" style="margin-top:6px">
        <button type="button" class="btn d" onclick="supprimerShotTournage('${p.id}')">Supprimer ce shot</button></div>
      <div class="note centre">Il disparaît du découpage pour toute l’équipe, avec ses prises.</div>`
      : `<div class="note centre">Pour retirer ce shot du découpage, ou en ajouter un : Préparation.</div>`}`;

  const f = $('sfoot');
  f.innerHTML = `<button type="button" class="btn" id="moteur-fiche">&#9679; Moteur</button>
    <button type="button" class="btn p" id="prise-plus-fiche" onclick="ajouterPrise('${p.id}')">+ Prise ${prisesDe(p.id).length + 1}</button>`;
  f.hidden = false;
  majMoteurFiche();

  montrerFiche(y);
  calerPrises('#fiche-prises');
  dessinerApercu(p);
  envoyerPresence();
  decorerFiche(); majAutres();
  majVise();   // l'anneau a cote de la description porte tout de suite le rond de qui vise ce plan
}

function majBoutonsPlan(){
  const p = plan(openId); if (!p) return;
  majSeg('#seg-etat', 'et', ETATS_SEG, p.etat);
  document.querySelectorAll('#sbody .el[data-el]').forEach(b => { b.className = classeEl(p, b.dataset.el); });
  const ep = $('elems-prevu'); if (ep) ep.innerHTML = htmlElemsPrevu(p);
  majChoix(); majResumes(); majNavPlan();
  const pt = $('ptags-fiche'); if (pt) pt.innerHTML = htmlPtags(p);
  decorerFiche();
}

/* On ne reconstruit pas la feuille pour un simple basculement : elle remonterait
   en haut a chaque clic et deviendrait impossible a remplir. */
/* Mes elements sur ce plan (sans prenom, sur un appareil seul : ceux du plan). */
const mesElements = p => UI.nom ? elementsDe(p, UI.nom.trim(), true) : Object.assign({}, p.elements || {});
/* La presaisie des elements : ceux que la Preparation a prevus (On set), tant que je n'ai
   rien coche moi-meme sur ce plan. Un clic part de la : on garde, on retire, on ajoute. */
const elementsPrevus = p => { const o = {}; (p.onSet || []).forEach(k => { o[k] = true; }); return o; };
function elementsEnPrevu(p){
  if (!p || !(p.onSet || []).length) return false;
  if (!UI.nom) return !Object.keys(p.elements || {}).some(k => p.elements[k]);
  const cle = 'elements@' + UI.nom.trim();
  return !(p[cle] && typeof p[cle] === 'object') && !Object.keys(mesElements(p)).length;
}
function classeEl(p, k){
  const prevu = elementsEnPrevu(p), mes = prevu ? elementsPrevus(p) : mesElements(p);
  return 'el' + (mes[k] ? (prevu ? ' on prevu' : ' on') : '');
}
const htmlElemsPrevu = p => elementsEnPrevu(p)
  ? `<em class="prevu-note">Prévu en préparation</em><button type="button" class="mini prevu-ok" onclick="validerElements()">Valider</button>` : '';
function validerElements(){
  const p = plan(openId); if (!p) return;
  poserMesElements(p, elementsPrevus(p));
  majBoutonsPlan();
  renderList();
}
function toggleElement(k){
  const p = plan(openId); if (!p) return;
  const mien = elementsEnPrevu(p) ? elementsPrevus(p) : mesElements(p);
  if (mien[k]) delete mien[k]; else mien[k] = true;
  poserMesElements(p, mien);
  majBoutonsPlan();
  renderList();
}
function poserMesElements(p, mien){
  if (!UI.nom){
    patch('plan', p.id, { elements: mien });
  } else {
    const nom = UI.nom.trim(), cle = 'elements@' + nom;
    const d = { [cle]: mien };
    // la premiere fois, les elements communs qui sont a moi passent sous mon prenom ;
    // ceux coches par d'autres restent aux autres
    if (!(p[cle] && typeof p[cle] === 'object')){
      const au = p.auteurs || {}, reste = {};
      Object.keys(p.elements || {}).forEach(e => { if (p.elements[e] && au['el:' + e] && au['el:' + e] !== nom) reste[e] = true; });
      d.elements = reste;
    }
    patch('plan', p.id, d);
  }
}

function setEtatPlan(e){
  const p = plan(openId); if (!p) return;
  // « Tourne » choisi a la main vaut tout de suite, meme sur le shot qui a la derniere prise
  patch('plan', p.id, { etat: e, tourneMain: e === 'done' });
  majBoutonsPlan();
  renderList();
}

function supprimerPlan(p){
  const pr = prisesDe(p.id);
  const idx = DB.plans.indexOf(p);
  const apres = idx > 0 ? DB.plans[idx - 1].id : '';
  DB.prises = DB.prises.filter(t => t.planId !== p.id);
  DB.plans = DB.plans.filter(x => x.id !== p.id);
  if (dernierPlan === p.id) dernierPlan = null;
  if (chrono && !prise(chrono.priseId)) chrono = null;
  operer({ op:'del', kind:'plan', id: p.id });
  corbeille = { type:'plan', plan: p, prises: pr, apres };
}
/* Demande confirmation, supprime, propose Annuler. Tient vrai si c'est fait. */
function supprimerPlanConfirme(p){
  if (bloque(p)){ prevenirVerrou(p); return Promise.resolve(false); }
  const pr = prisesDe(p.id);
  return confirmer('Supprimer le shot ' + (p.plan || 'sans n°') + (pr.length ? ' et ses ' + pr.length + ' prise(s)' : '') + ' ?',
                   { ok:'Supprimer', danger:true }).then(oui => {
    if (!oui || !plan(p.id)) return false;
    supprimerPlan(p);
    toastAction('Shot ' + (p.plan || 'sans n°') + ' supprimé', 'Annuler', restaurer);
    return true;
  });
}

/* Un plan tourne en plus du decoupage : insert, plan de coupe, raccord ajoute
   sur le plateau. Il se range dans la journee filtree, ou dans celle du dernier
   plan touche si on est en vue "Tout". */
/* Un numero de shot tape « Plan 12A » ou « shot 12A » : le mot s'en va, le titre le met deja. */
const numeroPropre = v => String(v || '').trim().replace(/^(plan|shot)\s*[:.\-]?\s*/i, '');
/* Renommer un plan : son numero change pour toute l'equipe, ses prises suivent. */
function renommerPlan(id){
  const p = plan(id); if (!p) return;
  demanderTexte('Numéro du shot', { valeur: p.plan || '', aide:'12, 12A, 06bis…', ok:'Renommer' }).then(v => {
    if (v == null || !plan(id)) return;
    v = numeroPropre(v);
    if (v === (p.plan || '')) return;
    patch('plan', id, { plan: v });
    propager(plan(id));
    renderList();
    if (openType === 'plan' && openId === id) rouvrirFiche();
    toast(v ? 'Shot renommé ' + v + ' pour toute l’équipe' : 'Shot sans numéro');
  });
}
function nouveauPlan(){
  demanderTexte('Numéro du nouveau shot', { aide:'12, 12A, 06bis… (modifiable ensuite dans sa fiche)', ok:'Ajouter' }).then(num => {
    if (num == null) return;   // on renonce : pas de plan
    num = numeroPropre(num);
    const ref = dernierPlan && plan(dernierPlan);
    const p = creerPlan(fJour !== '*' ? fJour : (ref ? ref.jour : ''), true);
    if (!p) return;
    // le plan est au decoupage : il arrive chez toute l'equipe, numero compris
    if (num) patch('plan', p.id, { plan: num });
    renderAll(); openPlan(p.id);
    toast(num ? 'Shot ' + num + ' ajouté pour toute l’équipe' : 'Shot ajouté — donnez-lui un numéro dans sa fiche');
  });
}

/* ------------------------------------------------------------ Preparation */
/* La page de saisie d'avant tournage : numeros, sequences, descriptions,
   decors, jours. Chaque champ ecrit directement dans le projet ; la page ne
   se redessine jamais sous les doigts. Le reste se regle dans la fiche. */
function champPrep(p, k, label, opt){
  opt = opt || {};
  const at = liaison(p, k, opt.area ? ';autoHauteur(this)' : '') + ` onkeydown="touchePrep(event, '${p.id}')"` +
             (opt.cap ? ` autocapitalize="${opt.cap}"` : '') + (opt.im ? ` inputmode="${opt.im}"` : '');
  const ph = opt.ph ? ` placeholder="${esc(opt.ph)}"` : '';
  const champ = opt.area
    ? `<textarea rows="1" ${at}${ph}>${esc(p[k])}</textarea>`
    : `<input ${at} value="${esc(p[k])}"${ph} autocomplete="off">`;
  return `<label class="pc ${opt.cls || ''}"><span>${label}</span>${champ}` +
    (opt.dl ? `<button type="button" class="deroul" data-liste="${opt.dl}"${opt.multi ? ' data-multi="1"' : ''} onclick="ouvrirMenu(this)" aria-label="Choisir dans la liste">${CHEVRON_BAS}</button>` : '') +
    `</label>`;
}
/* La distribution d'un plan, en Preparation : un champ qui dit qui est dans
   le plan, et un menu deroulant ou l'on coche les roles, la figuration, ou
   l'on ajoute un nom. Le champ ne se tape pas : tout passe par le menu. */
const texteDistribution = p => (p.acteurs || []).concat(p.figu ? ['Figuration'] : []).join(', ');
function champDistribution(p){
  return `<label class="pc w-dist"><span>Distribution</span>
    <input readonly value="${esc(texteDistribution(p))}" placeholder="Qui est dans le plan ?" data-dist="${p.id}" onclick="ouvrirDistribution(this.nextElementSibling)" onkeydown="touchePrep(event, '${p.id}')">
    <button type="button" class="deroul" onclick="ouvrirDistribution(this)" aria-label="Choisir la distribution">${CHEVRON_BAS}</button></label>`;
}
function ouvrirDistribution(btn){
  const deja = btn.classList.contains('on');
  fermerMenu();
  if (deja) return;
  const row = btn.closest('.pc'), id = row.querySelector('input').dataset.dist, p = plan(id);
  if (!p) return;
  const coche = x => (p.acteurs || []).some(y => memeVal(y, x));
  const m = document.createElement('div');
  m.className = 'menu multi';
  m.innerHTML = acteursConnus().map(x => `<button type="button" class="${coche(x) ? 'on' : ''}" data-v="${esc(x)}"
      onclick="cocherDistribution('${id}', 'acteurs', this)">${esc(x)}</button>`).join('') +
    `<button type="button" class="${p.figu ? 'on' : ''}" data-v="figu" onclick="cocherDistribution('${id}', 'figu', this)">Figuration</button>` +
    `<button type="button" class="autre" onclick="autreDistribution('${id}', this)">+ Autre nom…</button>`;
  row.appendChild(m);
  btn.classList.add('on');
  setTimeout(() => document.addEventListener('click', clicHorsMenu), 0);
}
function cocherDistribution(id, k, b){
  const p = plan(id); if (!p) return;
  if (k === 'figu') patch('plan', id, { figu: !p.figu });
  else patch('plan', id, { acteurs: avecOuSans(p.acteurs, b.dataset.v) });
  b.classList.toggle('on');
  const i = document.querySelector(`#l-prep input[data-dist="${id}"]`);
  if (i) i.value = texteDistribution(plan(id));
  majResumes(); renderList();
}
function autreDistribution(id, b){
  demanderTexte('Nom du rôle').then(nom => {
    nom = (nom || '').trim(); if (!nom) return;
    const p = plan(id); if (!p || (p.acteurs || []).some(x => memeVal(x, nom))) return;
    patch('plan', id, { acteurs: (p.acteurs || []).concat([nom]) });
    const i = document.querySelector(`#l-prep input[data-dist="${id}"]`);
    if (i) i.value = texteDistribution(plan(id));
    b.insertAdjacentHTML('beforebegin', `<button type="button" class="on" data-v="${esc(nom)}" onclick="cocherDistribution('${id}', 'acteurs', this)">${esc(nom)}</button>`);
    majResumes(); renderList();
  });
}
// masquee (section repliee, vue cachee), la zone ne mesure rien : on la laisse a sa ligne
function autoHauteur(ta){ ta.style.height = 'auto'; if (ta.scrollHeight) ta.style.height = ta.scrollHeight + 'px'; }

/* Une note de plateau commence souvent par l'heure (« 14h30 on a enregistre juste
   du son ») : le bouton la pose en tete d'une nouvelle ligne, il reste a ecrire. */
function horodater(btn){
  const ta = btn.previousElementSibling;
  const h = maintenant().replace(':', 'h') + ' ';
  ta.value = ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n' + h : h;
  live(ta); autoHauteur(ta);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

function rangPrep(p){

        ${champPrep(p, 'seq', 'Séq', {cls:'w-seq', ph:'01', dl:'dl-seq'})}

/* « On set » : ce qu'on fera au tournage pour ce plan (HDRI, color charts, photogrammétrie…),
   commun a l'equipe. Les cles sont celles des elements de la fiche ; le menu les coche. */
const texteOnSet = p => ELEMENTS.filter(e => (p.onSet || []).indexOf(e[0]) >= 0).map(e => e[1]).join(', ');
function champOnSet(p){
  return `<label class="pc w-onset"><span>On set</span>
    <input readonly value="${esc(texteOnSet(p))}" placeholder="Ce qu’on fait sur le plateau" data-onset="${p.id}" onclick="ouvrirOnSet(this.nextElementSibling)" onkeydown="touchePrep(event, '${p.id}')">
    <button type="button" class="deroul" onclick="ouvrirOnSet(this)" aria-label="Choisir ce qu’on fait sur le plateau">${CHEVRON_BAS}</button></label>`;
}
function ouvrirOnSet(btn){
  const deja = btn.classList.contains('on');
  fermerMenu();
  if (deja) return;
  const row = btn.closest('.pc'), id = row.querySelector('input').dataset.onset, p = plan(id);
  if (!p) return;
  const m = document.createElement('div');
  m.className = 'menu multi';
  m.innerHTML = ELEMENTS.map(e => `<button type="button" class="${(p.onSet || []).indexOf(e[0]) >= 0 ? 'on' : ''}" data-v="${e[0]}"
      onclick="cocherOnSet('${id}', this)">${esc(e[1])}</button>`).join('');
  row.appendChild(m);
  btn.classList.add('on');
  setTimeout(() => document.addEventListener('click', clicHorsMenu), 0);
}
function cocherOnSet(id, b){
  const p = plan(id); if (!p) return;
  const s = new Set(p.onSet || []), k = b.dataset.v;
  if (s.has(k)) s.delete(k); else s.add(k);
  // dans l'ordre de la liste, quel que soit l'ordre des clics
  patch('plan', id, { onSet: ELEMENTS.map(e => e[0]).filter(x => s.has(x)) });
  b.classList.toggle('on');
  const i = document.querySelector(`#l-prep input[data-onset="${id}"]`);
  if (i) i.value = texteOnSet(plan(id));
}

/* En Preparation, les plans suivent l'ordre de tournage : un bandeau marque chaque
   changement de sequence (le premier plan du jour compris). */
function bandeauSeq(ps, i){
  const p = ps[i], cle = x => (x.seq || '') + '|' + (x.seqTitre || '');
  if (i && cle(ps[i - 1]) === cle(p)) return '';
  return `<div class="seqbar"><b>Séquence ${esc(p.seq || '—')}</b>${p.seqTitre ? `<em>${esc(p.seqTitre)}</em>` : ''}</div>`;
}
function renderPrep(){
  const l = $('l-prep'); if (!l) return;
  if (!prepare()) return renderPrepLecture(l);
  const ids = fJourP + '|' + joursConnus().filter(jourFige).join(',') + '|' + DB.plans.map(p => p.id).join(',');
  // quelqu'un tape ici, ou coche dans un menu : on ne redessine pas, les autres champs se mettent a niveau
  if (l.dataset.ids === ids && (l.contains(document.activeElement) || l.querySelector('.menu'))){
    l.querySelectorAll('[data-o][data-k]').forEach(el => {
      if (el === document.activeElement) return;
      const o = plan(el.dataset.o); if (!o) return;
      const v = o[el.dataset.k] == null ? '' : String(o[el.dataset.k]);
      if (el.value !== v) el.value = v;
    });
    l.querySelectorAll('.prow').forEach(r => {
      const p = plan(r.dataset.id), s = r.querySelector('.ptags');
      if (p && s) s.innerHTML = htmlPtags(p);
    });
    majChoix('#l-prep');
    return;
  }
  const tous = joursPrep(), nj = tous.filter(j => j && j !== 'CG').length;
  if (fJourP !== '*' && tous.indexOf(fJourP) < 0) fJourP = '*';
  $('c-jourp').innerHTML = chipsJours(fJourP, 'setJourP', j => {
    const n = j === '*' ? DB.plans.length : plansDuJour(j).length;
    return { titre: (j === '*' ? 'Tout le tournage' : nomJour(j)) + ' · ' + n + ' plan' + plur(n) };
  }, tous);
  cadrerJour('c-jourp', fJourP);
  const unJour = fJourP !== '*', nP = unJour ? plansDuJour(fJourP).length : DB.plans.length;
  let html = `<div class="ptitre"><div><b>Découpage</b><span>${unJour ? esc(nomJour(fJourP)) + ' · ' : ''}${
      nP} plan${plur(nP)}${unJour ? '' : ' · ' + nj + ' jour' + plur(nj) + ' de tournage'}</span></div>
      <div class="pbtns">
        <button type="button" class="btn ${modeOrdre ? 'p' : ''}" onclick="basculerOrdre()">${modeOrdre ? 'Terminer' : 'Ordonner'}</button>
        <button type="button" class="btn" onclick="openDecors()" ${modeOrdre ? 'hidden' : ''}>Décors</button>
        <button type="button" class="btn" onclick="ajouterJourPrep()" ${modeOrdre ? 'hidden' : ''}>+ Jour</button>
        <button type="button" class="btn p" onclick="ajouterPlanPrep('${unJour ? esc(fJourP) : ''}')" ${modeOrdre ? 'hidden' : ''}>+ Ajouter un plan</button>
      </div></div>
    <p class="pnote">Séquences, numéros, descriptions, décors et jours : ce qui se prépare avant le plateau.
      Cadrage, focale, mouvement, description VFX et ce qu’on fait sur le plateau se notent ici ; le reste se règle dans la fiche de chaque plan.
      L’ordre des cartes est l’ordre de tournage : « Ordonner » permet de les glisser.</p>`;
  (unJour ? [fJourP] : tous).forEach(j => {
    const ps = trierPlans(plansDuJour(j), false);

              fige ? `<span class="jctrl"><button type="button" class="btn sm" onclick="verrouillerJour('${esc(j)}')">Verrouillé · rouvrir</button></span>`
                   : enteteJour(j, ps.length)}</div>` +
            (fige ? '<fieldset class="fige" disabled>' : '') +
            ps.map((p, i) => bandeauSeq(ps, i) + rangPrep(p)).join('') +
            (fige ? '</fieldset>'
                  : `<button type="button" class="addplan" onclick="ajouterPlanPrep('${esc(j)}')">+ Plan${j ? ' ' + esc(nomJour(j).toLowerCase()) : ''}</button>`);
  });
  l.innerHTML = html; l.dataset.ids = ids;
  l.querySelectorAll('textarea').forEach(autoHauteur);
  brancherOrdre();
}

/* Pour les autres que Simon : le decoupage en lecture, jour par jour. Rien ne
   s'y modifie ; toucher un shot ouvre sa fiche, comme au Tournage. */
function renderPrepLecture(l){
  const tous = joursPrep();

  }, tous);
  cadrerJour('c-jourp', fJourP);
  const unJour = fJourP !== '*', nP = unJour ? plansDuJour(fJourP).length : DB.plans.length;
  let html = `<div class="ptitre"><div><b>Découpage</b><span>${unJour ? esc(nomJour(fJourP)) + ' · ' : ''}${nP} plan${plur(nP)}</span></div></div>
    <p class="pnote">Le découpage préparé par ${esc(PREPARATEURS.join(', '))}, jour par jour, à consulter. Pour noter une prise : Tournage.</p>`;
  (unJour ? [fJourP] : tous).forEach(j => {
    const ps = trierPlans(plansDuJour(j), false);
    html += `<div class="jour"><b>${nomJour(j)}</b><span>${ps.length} plan${plur(ps.length)}</span></div>` + ps.map((p, i) => bandeauSeq(ps, i) + (() => {
      const ctx = [p.lieu && `<span><b>${esc(p.lieu)}</b></span>`, p.cadrage && `<span>${esc(p.cadrage)}</span>`,
                   p.focale && `<span>${esc(p.focale)}</span>`, p.mouv && `<span>${esc(p.mouv)}</span>`,
                   (p.acteurs || []).length && `<span>${esc(p.acteurs.join(', '))}</span>`,
                   texteOnSet(p) && `<span>On set : ${esc(texteOnSet(p))}</span>`]
                  .filter(Boolean).join('');
      return `<div class="lprep" onclick="openPlan('${p.id}')">
        <div class="lprep-tete"><span class="lprep-ordre">${deuxCh(i + 1)}</span><b>Shot ${esc(p.plan || 'sans n°')}</b>
          <span class="lprep-seq">Séq ${esc(p.seq || '—')}${p.seqTitre ? ' · ' + esc(p.seqTitre) : ''}</span><span class="ptags">${htmlPtags(p)}</span></div>
        ${p.desc ? `<div class="lprep-desc">${esc(p.desc)}</div>` : ''}
        ${p.vfxDesc ? `<div class="lprep-desc"><b>VFX</b> · ${esc(p.vfxDesc)}</div>` : ''}
        ${ctx ? `<div class="pctx">${ctx}</div>` : ''}
      </div>`;
    })()).join('');
  });
  l.innerHTML = html; l.dataset.ids = '';
}
/* Le mode Ordonner : les cartes se glissent (souris) ou montent et descendent
   (fleches, au doigt) ; un plan ne change pas de jour en bougeant. */
let modeOrdre = false, plansTire = null;
/* La page Preparation se redessine au prochain rendu, meme si l'on y tape. */
function oublierPrep(){ const l = $('l-prep'); if (l) l.dataset.ids = ''; }
function basculerOrdre(){
  modeOrdre = !modeOrdre;
  oublierPrep(); renderPrep();
}
function deplacerLocal(id, apres){
  const i = DB.plans.findIndex(p => p.id === id); if (i < 0) return false;
  const [p] = DB.plans.splice(i, 1);
  const j = apres === '' ? -1 : DB.plans.findIndex(x => x.id === apres);
  DB.plans.splice(j + 1, 0, p);
  return true;
}
function deplacerPlan(id, apres){
  const p = plan(id), dest = apres && plan(apres);
  if (p && jourFige(p.jour)) return prevenirVerrou(p);
  if (dest && dest.jour !== p.jour && jourFige(dest.jour)) return prevenirVerrou(null, dest.jour);
  if (id === apres || !deplacerLocal(id, apres)) return;
  operer({ op:'move', kind:'plan', id, apres });
  oublierPrep(); renderAll();
}
/* La position d'un plan dans sa journee, et l'inverse : taper un numero
   l'insere a cette place, les autres se decalent (jamais deux fois le meme). */
const positionPlan = p => plansDuJour(p.jour).indexOf(p) + 1;
function placerPlan(id, val){
  const p = plan(id); if (!p) return;
  const jour = plansDuJour(p.jour), autres = jour.filter(x => x !== p);
  const n = Math.max(1, Math.min(autres.length + 1, parseInt(val, 10) || 0));
  if (!parseInt(val, 10) || n === positionPlan(p)){ oublierPrep(); renderPrep(); return; }   // on remet le numero en place
  // en tete de journee : juste avant le premier plan du jour ; sinon apres le (n-1)e
  deplacerPlanVisible(id, n === 1 ? DB.plans[DB.plans.indexOf(autres[0]) - 1] : autres[n - 2]);
}
function monterPlan(id, sens){
  const p = plan(id); if (!p) return;
  const jour = plansDuJour(p.jour), v = jour[jour.indexOf(p) + sens]; if (!v) return;
  // monter = se placer avant le voisin du dessus ; descendre = juste apres celui du dessous
  deplacerPlanVisible(id, sens < 0 ? DB.plans[DB.plans.indexOf(v) - 1] : v);
}
/* Deplace le plan juste apres `avant` (en tete sans lui) et garde sa carte sous les yeux. */
function deplacerPlanVisible(id, avant){
  deplacerPlan(id, avant ? avant.id : '');
  const r = document.querySelector(`#l-prep .prow[data-id="${id}"]`); if (r) r.scrollIntoView({ block:'nearest' });
}
function brancherOrdre(){
  const l = $('l-prep'); if (!l || l.dataset.dnd) return;
  l.dataset.dnd = '1';
  const carte = e => e.target.closest && e.target.closest('.prow.ordo');
  l.addEventListener('dragstart', e => {
    const r = carte(e); if (!r) return;
    plansTire = r.dataset.id; r.classList.add('tire');
    try { e.dataTransfer.setData('text/plain', plansTire); e.dataTransfer.effectAllowed = 'move'; } catch (x) {}
  });
  l.addEventListener('dragover', e => {
    const r = carte(e); if (!r || !plansTire || r.dataset.id === plansTire) return;
    const a = plan(plansTire), b = plan(r.dataset.id);
    if (!a || !b || (a.jour || '') !== (b.jour || '')) return;
    e.preventDefault();
    const av = e.clientY < r.getBoundingClientRect().top + r.offsetHeight / 2;
    r.classList.toggle('av', av); r.classList.toggle('ap', !av);
  });
  l.addEventListener('dragleave', e => { const r = carte(e); if (r) r.classList.remove('av', 'ap'); });
  l.addEventListener('drop', e => {
    const r = carte(e); if (!r || !plansTire) return;
    e.preventDefault();
    const av = r.classList.contains('av'), cible = plan(r.dataset.id), id = plansTire;
    r.classList.remove('av', 'ap');
    if (!cible || id === cible.id) return;
    const avant = av ? DB.plans[DB.plans.indexOf(cible) - 1] : cible;
    deplacerPlan(id, avant && avant.id !== id ? avant.id : (av ? '' : cible.id));
  });
  l.addEventListener('dragend', () => {
    plansTire = null;
    l.querySelectorAll('.tire, .av, .ap').forEach(x => x.classList.remove('tire', 'av', 'ap'));
  });
}

function ajouterPlanPrep(j){

/* Combien de plans par jour, avant le detail : on pose d'abord la journee en
   nombre (« Jour 1 : 14 plans »), les cartes vides se remplissent ensuite.
   Monter le nombre ajoute des cartes vides a la fin du jour ; le baisser ne
   retire que des cartes encore vides (sans numero, sans description, sans
   prise), les autres restent et la page le dit. Un jour ajoute sans plan
   n'existe que sur cet ecran, le temps de lui donner un nombre. */
let joursVides = [];
const planVide = p => !(p.plan || '').trim() && !(p.desc || '').trim() && !prisesDe(p.id).length;
/* Les jours de la Preparation : ceux qui ont des plans, et ceux qu'on vient d'ouvrir. */
function joursPrep(){
  const jours = joursConnus();
  return jours.concat(joursVides.filter(j => jours.indexOf(j) < 0)).sort((a, b) => rangJour(a) - rangJour(b));
}
/* Dans l'en-tete d'un jour : son nombre de plans a regler, et de quoi le supprimer. */
function enteteJour(j, n){
  if (!j || j === 'CG' || modeOrdre) return '';
  return `<span class="jctrl"><span class="pjour"><span>Plans</span>
      <button type="button" class="pas" onclick="pasJour('${esc(j)}', -1)" aria-label="Un plan de moins">&minus;</button>
      <input type="text" inputmode="numeric" value="${n}" data-jour="${esc(j)}" aria-label="Nombre de plans"
        onfocus="this.select()" onchange="fixerNombreJour('${esc(j)}', this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">
      <button type="button" class="pas" onclick="pasJour('${esc(j)}', 1)" aria-label="Un plan de plus">+</button></span>
    <button type="button" class="btn sm d" onclick="supprimerJourPrep('${esc(j)}')">Supprimer le jour</button></span>`;
}
function pasJour(j, d){
  const i = document.querySelector(`#l-prep .jour input[data-jour="${j}"]`); if (!i) return;
  i.value = Math.max(0, (parseInt(i.value, 10) || 0) + d);
  fixerNombreJour(j, i);
}
function ajouterJourPrep(){
  // un jour deja ouvert et encore vide attend son nombre : on y retourne, on n'en empile pas un autre
  let j = joursVides.filter(x => !plansDuJour(x).length).sort((a, b) => rangJour(a) - rangJour(b))[0];
  if (!j){
    const nums = joursPrep().map(x => parseInt(numJour(x), 10) || 0);
    j = 'J' + (Math.max(0, ...nums) + 1);
    joursVides.push(j);
  }
  setJourP(j);
  const i = document.querySelector(`#l-prep .jour input[data-jour="${j}"]`);
  if (i){ i.focus(); i.select(); }
}
/* Supprimer un jour : ses plans avec, apres confirmation s'il en a. */
function supprimerJourPrep(j){
  if (jourFige(j)) return prevenirVerrou(null, j);
  const ps = plansDuJour(j), pr = ps.reduce((n, p) => n + prisesDe(p.id).length, 0);
  const faire = () => {
    ps.forEach(supprimerPlan); corbeille = null;
    joursVides = joursVides.filter(x => x !== j);
    if (fJourP === j) fJourP = '*';
    oublierPrep(); renderAll(); toast(nomJour(j) + ' supprimé');
  };
  if (!ps.length) return faire();
  confirmer('Supprimer le ' + nomJour(j).toLowerCase() + ' et ses ' + ps.length + ' plan' + plur(ps.length) +
            (pr ? ' (' + pr + ' prise' + plur(pr) + ')' : '') + ' ?', { ok:'Supprimer', danger:true }).then(oui => { if (oui) faire(); });
}
function fixerNombreJour(j, input){
  if (jourFige(j)){ input.value = plansDuJour(j).length; return prevenirVerrou(null, j); }
  const n = Math.max(0, Math.min(99, parseInt(input.value, 10) || 0));
  const ps = plansDuJour(j);
  if (n > ps.length){
    for (let k = ps.length; k < n; k++) creerPlan(j, false);
    joursVides = joursVides.filter(x => x !== j);
    oublierPrep(); renderAll();
    toast((n - ps.length) + ' plan' + plur(n - ps.length) + ' ajouté' + plur(n - ps.length) + ' au ' + nomJour(j).toLowerCase());
    return;
  }
  if (n < ps.length){
    const trop = ps.slice(n).reverse(), gardes = trop.filter(p => !planVide(p));
    trop.filter(planVide).forEach(supprimerPlan);
    corbeille = null;
    oublierPrep(); renderAll();
    const retires = trop.length - gardes.length;
    toast((retires ? retires + ' plan' + plur(retires) + ' vide' + plur(retires) + ' retiré' + plur(retires) : 'Rien à retirer') +
          (gardes.length ? ' · ' + gardes.length + ' plan' + plur(gardes.length) + ' déjà rempli' + plur(gardes.length) + ' gardé' + plur(gardes.length) : ''));
    return;
  }
  input.value = ps.length;
}
/* Depuis Tournage, le preparateur (Simon) peut supprimer un shot : la fiche se ferme ensuite. */
function supprimerShotTournage(id){

/* Entree passe au champ suivant de la carte ; sur le dernier, elle rend la main.
   Maj+Entree garde son sens dans la description. */
function touchePrep(e, id){

/* Un plan de plus, range apres le dernier plan du meme jour. Sur le plateau
   (horsDT), il porte l'etiquette HORS DT pour se distinguer du decoupage. */
function creerPlan(j, horsDT){
  if (jourFige(j)){ prevenirVerrou(null, j); return null; }
  const ref = dernierPlan && plan(dernierPlan);
  const voisins = plansDuJour(j);
  const modele = voisins.length ? voisins[voisins.length - 1] : ref;
  const p = Object.assign({ id: uid() }, PLAN_NEUF(), {
    seq: modele ? modele.seq : '', seqTitre: modele ? modele.seqTitre : '',
    plan: '', desc: '', lieu: modele ? modele.lieu : '', cadrage: '', mouv: '',
    focale: '', duree: '', tags: horsDT ? ['LIVE', 'TBC', 'HORS DT'] : ['LIVE', 'TBC'],
    assets: '', previz: true, ref: '', jour: j, horsDT: !!horsDT
  });
  const dernier = voisins.length ? DB.plans.indexOf(voisins[voisins.length - 1]) : DB.plans.length - 1;
  DB.plans.splice(dernier + 1, 0, p);
  operer({ op:'add', kind:'plan', data: p, apres: dernier >= 0 ? DB.plans[dernier].id : '' });
  dernierPlan = p.id;
  return p;
}

/* ------------------------------------------------ Fusionner deux shots */
/* Deux shots tournes en un seul (le 06 dans le 05). Le shot absorbe passe en
   « Abandonne », marque fusionDans : A ; ses descriptions, notes et elements
   captes, ceux de chacun, rejoignent A (le plan est partage : un appareil le
   fait pour tous). Les prises, elles, sont a chacun : chaque appareil deplace
   les siennes des qu'il voit la fusion (appliquerFusions), a la suite de A,
   avec un decalage fixe choisi a la fusion (fusionDecalage) : la prise 1 du 06
   devient partout la meme prise du 05, et le rapprochement reste juste. */
function choisirFusion(aId){
  const a = plan(aId); if (!a) return;
  openId = null; openType = 'picker';
  videEntete();
  $('stitle').textContent = 'Fusionner dans ' + (a.seq ? 'Séq ' + a.seq + ' · ' : '') + 'Shot ' + (a.plan || 'sans n°');
  $('ssub').textContent = 'Le shot tourné avec lui : ses prises le rejoignent';
  // ni un shot verrouille (valide), ni un shot abandonne ou deja fusionne : ils ne bougent plus
  const libre = p => p.id !== a.id && !p.fusionDans && !bloque(p) && p.etat !== 'drop';
  const duJour = DB.plans.filter(p => libre(p) && (p.jour || '') === (a.jour || ''));
  const autres = DB.plans.filter(p => libre(p) && (p.jour || '') !== (a.jour || ''));
  const ligneF = p => {
    const n = prisesDe(p.id).length;
    return `<div class="plan pick"><div class="phead" onclick="confirmerFusion('${a.id}', '${p.id}')">
      <div class="pmain">
        <div class="pnum" style="font-size:17px"><span class="pno">${p.seq ? `<small class="pno-seq">Séq ${esc(p.seq)}</small>` : ''}<small>Shot</small>${p.plan ? esc(p.plan) : 'sans n°'}</span>
          <span style="font-size:12px;color:var(--dim2);font-weight:600;margin-left:8px">${esc(nomJour(p.jour || ''))}${n ? ' · ' + n + ' pr.' : ''}</span></div>
        <div class="pdesc" style="font-size:13.5px;color:var(--dim);margin-top:4px;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.desc || '')}</div>
      </div></div></div>`;
  };
  $('sbody').innerHTML = `<div class="list" id="l-pick">${duJour.map(ligneF).join('') || '<div class="empty">Aucun autre shot ce jour-là.</div>'}
    ${autres.length ? `<div class="seq" style="padding-top:22px">Autres jours</div>${autres.map(ligneF).join('')}` : ''}</div>`;
  montrerFiche(0);
}
/* le plus grand numero de prise du shot A, chez moi et chez les autres */
function maxPrisesPartout(a){
  let m = prisesDe(a.id).reduce((x, t) => Math.max(x, t.n || 0), 0);
  try{
    AUTRES.liste.forEach(o => {
      const q = o.db.plans.find(x => x.id === a.id) || o.db.plans.find(x => clePlan(x) === clePlan(a));
      if (q) o.db.prises.forEach(t => { if (t.planId === q.id) m = Math.max(m, t.n || 0); });
    });
  }catch(e){}
  return m;
}
function confirmerFusion(aId, bId){
  const a = plan(aId), b = plan(bId); if (!a || !b) return;
  const na = a.plan || 'sans n°', nb = b.plan || 'sans n°', d = maxPrisesPartout(a), n = prisesDe(b.id).length;
  confirmer('Fusionner le shot ' + nb + ' dans le shot ' + na + ' ?', {
    detail: 'Les prises du ' + nb + ' passent sur le ' + na + ', à la suite (la prise 1 du ' + nb + ' devient la prise ' + (d + 1) +
            '), chez toute l’équipe' + (n ? ' — ici, ' + n + ' prise' + plur(n) : '') + '. Descriptions, notes et éléments captés rejoignent le ' + na +
            ' ; le ' + nb + ' passe en « Abandonné ». Ce n’est pas facile à défaire.',
    ok: 'Fusionner'
  }).then(oui => {
    if (!oui || !plan(aId) || !plan(bId)) return;
    fusionner(aId, bId, d);
    closeSheet(); renderAll(); openPlan(aId);
    toast('Shot ' + nb + ' fusionné dans le shot ' + na);
  });
}
function fusionner(aId, bId, decalage){
  const a = plan(aId), b = plan(bId); if (!a || !b) return;
  const joindre = (x, y) => [String(x || '').trim(), String(y || '').trim()].filter(Boolean).join(' · ');
  const da = {}, db = { fusionDans: a.id, fusionDecalage: decalage, etat: 'drop', auteurs: {} };
  // les elements captes : ceux d'avant qui ont un auteur passent sous son prenom ; les autres restent communs
  const au = Object.assign({}, a.auteurs || {}), aub = b.auteurs || {};
  const perso = {};
  const ajouter = (nom, l) => { perso[nom] = Object.assign(perso[nom] || {}, l); };
  quiAElements(a).concat(quiAElements(b)).forEach(nom => {
    ajouter(nom, elementsDe(a, nom, false)); ajouter(nom, elementsDe(b, nom, false));
  });
  const communs = {};
  [[a, a.auteurs || {}], [b, aub]].forEach(([p, ax]) =>
    Object.keys(p.elements || {}).forEach(k => { if (p.elements[k] && !ax['el:' + k]) communs[k] = true; }));
  Object.keys(perso).forEach(nom => { da['elements@' + nom] = perso[nom]; db['elements@' + nom] = {}; });
  Object.keys(au).forEach(k => { if (k.indexOf('el:') === 0) delete au[k]; });
  da.elements = communs; da.auteurs = au; db.elements = {};
  // les textes de chacun, et le commun : ceux du shot absorbe s'ajoutent a ceux de A
  TEXTES_A_CHACUN.forEach(k => textesDe(b, k).forEach(([nom, v]) => {
    const c = nom ? k + '@' + nom : k;
    da[c] = joindre(da[c] !== undefined ? da[c] : a[c], v); db[c] = '';
  }));
  da.notesClient = joindre(da.notesClient !== undefined ? da.notesClient : a.notesClient, 'Tourné avec le shot ' + (b.plan || '?') + ' (fusion)');
  db.notesClient = 'Fusionné dans le shot ' + (a.plan || '?');
  da.fusionAvec = (a.fusionAvec || []).concat([b.id]);
  if (b.etat === 'done' || prisesDe(b.id).length) da.etat = 'done';
  patch('plan', a.id, da);
  patch('plan', b.id, db);
  appliquerFusions();
}
/* Mes prises d'un shot fusionne passent sur le shot qui l'a absorbe. */
function appliquerFusions(){
  DB.plans.forEach(b => {
    if (!b.fusionDans) return;
    const a = plan(b.fusionDans); if (!a) return;
    prisesDe(b.id).forEach(t => {
      const note = 'prise ' + t.n + ' du shot ' + (b.plan || '?');
      patch('prise', t.id, { planId: a.id, plan: a.plan, seq: a.seq, jour: a.jour || '', n: (b.fusionDecalage || 0) + (t.n || 0),
                             notes: [t.notes, note].filter(Boolean).join(' · ') });
    });
  });
}

/* ---------------------------------------------------- Feuille production */

function htmlListeEquipe(){
  if (RESEAU.etat === 'coupe')
    return `<div class="alert o"><i>&#9888;</i><div>Serveur injoignable. Les saisies sont gardées sur cet appareil et repartiront dès le retour du réseau.</div></div>`;
  const l = personnesConnectees().sort((a, b) =>
    (a.client === CLIENT ? 0 : 1) - (b.client === CLIENT ? 0 : 1) || (a.nom || '').localeCompare(b.nom || ''));
  if (!l.length) return '<div style="color:var(--dim2);font-size:13.5px">Connexion en cours…</div>';
  return l.map(x => `<div class="ligne"><span><b style="color:var(--txt)">${esc(x.nom || 'Sans nom')}</b>` +
    (x.client === CLIENT ? ' <small>(cet appareil)</small>' : '') + ouEst(x) + `</span></div>`).join('');
}
function ouEst(x){
  const parts = (x.actif || '').split(';').filter(Boolean);
  const f = parts.find(a => a.indexOf('vise:') !== 0), v = parts.find(a => a.indexOf('vise:') === 0);
  if (f){
    const i = f.indexOf(':');
    const type = f.slice(0, i), o = cible(f.slice(i + 1));
    if (o) return ` <small>— sur ${esc(type === 'prise' ? 'prise ' + o.n + ' · shot ' + (o.plan || '?') : 'shot ' + (o.plan || 'sans n°'))}</small>`;
  }
  const pv = v && plan(v.slice(5));
  return pv ? ` <small>— Moteur sur le shot ${esc(pv.plan || 'sans n°')}</small>` : '';
}
