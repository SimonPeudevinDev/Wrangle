/* -------------------------------------- Fiche de transmission a la post */

/* Le seul document de l'application ecrit pour quelqu'un d'autre : le monteur
   et le studio VFX. Il repond a leurs deux questions, dans cet ordre — quelle
   prise fait foi, et qu'a-t-on capte sur ce plan. Les plans muets ne sont pas
   imprimes : une liasse de 126 plans vides ne se lit pas. */

const optiqueDe = t => [t.focale, t.objectif, t.diaph, t.filtre].filter(Boolean).join(' · ');

function relevesDe(t){
  const ptr = [['pan', fleche(t.panStart, t.panStop)], ['tilt', fleche(t.tiltStart, t.tiltStop)], ['roll', fleche(t.rollStart, t.rollStop)]]
    .filter(x => x[1]).map(x => x[0] + ' ' + x[1]).join(' / ');
  return [['Point de map', fleche(t.focusStart, t.focusStop)], ['Hauteur', fleche(t.hauteurStart, t.hauteurStop)],
          ['Mesuré depuis', t.mesureDepuis], ['Orientation', ptr], ['Mouvement', t.mouvement], ['Support', t.support]].filter(x => x[1]);
}

const imageDe = t => [t.cam, t.camModel, t.codec, t.reso, t.fps && t.fps + ' i/s',
                      t.shutter, t.ei && 'EI ' + t.ei, t.wb, t.nd && 'ND ' + t.nd, t.lut]
                     .filter(Boolean).join(' · ');

function htmlPost(j){
  const tous = j === '*';
  const P = tous ? DB.plans : plansDuJour(j);
  const T = tous ? DB.prises : prisesDuJour(j);
  const p = DB.prod;
  const gardees = T.filter(t => t.retenue);
  const parlants = P.filter(x => prisesDe(x.id).length || aElements(x));
  // les cartes ou sont les rushes de la periode : une par nom de carte note sur les prises
  const cartes = [...new Set(T.map(t => (t.carte || '').trim()).filter(Boolean))];
  const d = new Date();

  /* 1. Pour le monteur : la liste des clips qui font foi, rien d'autre. */
  /* Dans l'ordre du tournage : c'est celui dans lequel le monteur derushe. */
  const ordre = new Map(DB.plans.map((x, i) => [x.id, i]));
  const suite = gardees.slice().sort((a, b) =>
    rangJour(a.jour || '') - rangJour(b.jour || '') ||
    (ordre.get(a.planId) || 0) - (ordre.get(b.planId) || 0) || (a.n || 0) - (b.n || 0));

  const montage = suite.length ? `<table>
      <thead><tr>${tous ? '<th>Jour</th>' : ''}<th>Clip</th><th>Séq</th><th>Plan</th><th>Pr.</th>
        <th>Durée</th><th>Carte</th><th>Note</th></tr></thead>
      <tbody>${suite.map(t => `<tr>
        ${tous ? `<td>${esc(miniJour(t.jour || ''))}</td>` : ''}
        <td class="mono">${esc(t.clip || '—')}</td><td>${esc(t.seq || '')}</td>
        <td>${esc(t.plan || '')}</td><td>${esc(t.n)}</td><td>${esc(t.duree || '')}</td>
        <td>${esc(t.carte || '')}</td><td>${esc(t.notes || '')}</td></tr>`).join('')}</tbody>
    </table>` : `<div class="pvide">Aucune prise marquée à monter.</div>`;

  /* 2. Pour les VFX : le plan, ce qui a ete capte, et les releves du matchmove. */
  const vfx = parlants.length ? parlants.map(x => {
    const pr = prisesDe(x.id);
    const keep = pr.filter(t => t.retenue);
    const ref = keep[0] || pr[pr.length - 1];
    const autres = pr.filter(t => keep.indexOf(t) < 0);
    const el = elementsCoches(x).map(e => `<span${e[3] === 'v' ? ' class="v"' : ''}>${esc(e[2])}</span>`).join('') +
      (x.elementsAutre ? `<span>${esc(x.elementsAutre.toUpperCase())}</span>` : '');
    const rel = ref ? relevesDe(ref) : [];
    const th = imagePlan(x);
    return `<article class="pplan">
      <div class="ptete">
        ${th ? `<img class="pvig" src="${th}" alt="">` : ''}
        <div>
          <div class="pno">Plan ${esc(x.plan || '—')}${
            (x.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
          <div class="pdes">${esc(x.desc || '')}</div>
          <div class="pmet">${[nomJour(x.jour || ''), 'Séq ' + (x.seq || ''), x.lieu, x.cadrage, x.mouv]
            .filter(Boolean).map(esc).join(' · ')}</div>
          ${x.assets ? `<div class="pmet">Découpage VFX : ${esc(x.assets)}</div>` : ''}
          ${x.vfxDesc ? `<div class="pmet">${esc(x.vfxDesc)}</div>` : ''}
        </div>
      </div>
      ${keep.length ? keep.map(t => `<div class="pgarde">
        <b>${esc(t.clip || 'clip non renseigné')}</b>
        <i>${[t.carte && 'carte ' + t.carte, optiqueDe(t), t.duree, t.tcIn].filter(Boolean).map(esc).join(' · ')}</i>
        ${t.notes ? `<div class="pnote">${esc(t.notes)}</div>` : ''}
        ${imageDe(t) ? `<div class="pnote"><em style="color:#666">${esc(imageDe(t))}</em></div>` : ''}
      </div>`).join('') : `<div class="pgarde"><i>Aucune prise retenue pour le montage sur ce plan.</i></div>`}
      ${el || rel.length ? `<div class="pcols">
        ${el ? `<div><h4>Éléments captés</h4><div class="pel">${el}</div></div>` : ''}
        ${rel.length ? `<div><h4>Relevés matchmove</h4><div class="prel">${
          rel.map(r => `<em>${r[0]}</em> ${esc(r[1])}`).join('<br>')}</div></div>` : ''}
      </div>` : ''}
      ${autres.length ? `<div class="pautres">Autres prises : ${autres.map(t => {
        const q = [t.statut, t.clip].filter(Boolean).join(' · ');
        return esc(t.n + (q ? ' (' + q + ')' : ''));
      }).join(', ')}</div>` : ''}
    </article>`;
  }).join('') : `<div class="pvide">Aucun plan tourné ni élément capté sur cette période.</div>`;

  return `
    <h1>${esc(p.titre || 'Projet sans titre')} — transmission post-production</h1>
    <div class="psous">${[tous ? 'Tout le tournage' : nomJour(j), p.date, p.lieu, p.unit,
        p.dit && 'DIT ' + p.dit, p.wrangler && 'Wrangler ' + p.wrangler].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="pchiffres">
      <span><b>${P.filter(x => x.etat === 'done').length}</b>plans tournés sur ${P.length}</span>
      <span><b>${gardees.length}</b>prises à monter</span>
      <span><b>${T.length}</b>prises au total</span>
      <span><b>${P.filter(aElements).length}</b>plans avec éléments</span>
      <span><b>${cartes.length}</b>cartes</span>
    </div>

    <h2>Pour le montage — prises retenues</h2>
    ${montage}

    <h2>Pour les VFX — plan par plan</h2>
    ${vfx}

    <div class="ppied">${esc(p.titre || '')} · édité le ${deuxCh(d.getDate())}/${deuxCh(d.getMonth() + 1)}/${d.getFullYear()}
      à ${hhmm(d)}${UI.nom ? ' par ' + esc(UI.nom) : ''} ·
      Wrangle</div>`;
}

/* ------------------------------------------------------- Journal du DIT */

/* Le second document : pour le DIT lui-meme. Il s'ouvre sur ce que le montage
   attend en temps reel (les prises retenues, avec leurs clips), puis liste
   tous les plans, chacun avec ses prises, celle qui est retenue, et qui a
   saisi quoi a quelle heure. Les plans sans prise y figurent aussi, en une
   ligne : le journal dit ce qui reste a tourner. Il se telecharge en PDF,
   ecrit par la page elle-meme (voir plus bas). */
/* Un journal par journee : « Tout » en donne un par jour, a la suite, chacun
   sur sa page. Une journee dit ses chiffres, les prises retenues, les plans
   tournes avec leurs prises, puis ce qui reste a tourner, en liste. */
function modeleDIT(j){
  const jours = j === '*' ? joursConnus().filter(x => plansDuJour(x).length) : [j];
  const p = DB.prod, d = new Date();
  const pied = [p.titre || '', 'journal DIT édité le ' + deuxCh(d.getDate()) + '/' + deuxCh(d.getMonth() + 1) + '/' + d.getFullYear() +
                ' à ' + hhmm(d) + (UI.nom ? ' par ' + UI.nom : ''), 'Wrangle'].filter(Boolean).join(' · ');
  const qui = t => [t.par, t.heure].filter(Boolean).join(' · ');
  const prise = t => ({ n: String(t.n || ''), clip: t.clip || '', carte: t.carte || '', statut: t.statut || '',
                        retenue: !!t.retenue, tcIn: t.tcIn || '', tcOut: t.tcOut || '', duree: t.duree || '',
                        note: t.notes || '', qui: qui(t), par: t.par || '', heure: t.heure || '', seq: t.seq || '', plan: t.plan || '' });
  const ordre = new Map(DB.plans.map((x, i) => [x.id, i]));

  return jours.map(jour => {
    const P = plansDuJour(jour), T = prisesDuJour(jour);
    const gardees = T.filter(t => t.retenue);
    const cartes = [...new Set(T.map(t => (t.carte || '').trim()).filter(Boolean))];
    /* 1. Pour le montage, dans l'ordre du tournage. */
    const montage = gardees.slice().sort((a, b) =>
      (ordre.get(a.planId) || 0) - (ordre.get(b.planId) || 0) || (a.n || 0) - (b.n || 0)).map(prise);
    /* 2. Les plans tournes (ou marques tels), sous leur sequence ; le reste en liste. */
    const tournes = [], reste = [], abandonnes = [];
    let seqCourante = null;
    P.forEach(x => {
      const pr = prisesDe(x.id);
      const meta = [x.cadrage, x.mouv, x.support, x.focale].filter(Boolean).join(' · ');
      const ref = 'Séquence ' + (x.seq || '—') + ' · Plan ' + (x.plan || '—');
      if (pr.length || x.etat === 'done'){
        const ok = pr.filter(t => t.statut === 'OK').length, ng = pr.filter(t => t.statut === 'NG').length,
              ret = pr.filter(t => t.retenue).length;
        const b = { seq: '', seqTitre: '', plan: x.plan || '—', prises: pr.map(prise),
                    meta: [ETATS[x.etat], meta].filter(Boolean).join(' · '),
                    bilan: pr.length ? [pr.length + ' prise' + plur(pr.length), ok && ok + ' OK', ng && ng + ' NG',
                                        ret && ret + ' retenue' + plur(ret)].filter(Boolean).join(' · ') : 'aucune prise' };
        if ((x.seq || '') !== seqCourante){
          seqCourante = x.seq || '';
          b.seq = 'Séquence ' + (seqCourante || '—'); b.seqTitre = x.seqTitre || '';
        }
        tournes.push(b);
      } else if (x.etat === 'drop') abandonnes.push({ ref, meta });
      else reste.push({ ref, meta });
    });
    /* 3. Ce qu'il y a a sauvegarder : un fichier par prise, carte par carte,
       du premier au dernier clip ; et ce qui manque pour les retrouver. */
    const parCarte = new Map();
    T.forEach(t => { const c = (t.carte || '').trim(); if (c) parCarte.set(c, (parCarte.get(c) || []).concat([t])); });
    const sauvegarde = {
      total: T.length,
      cartes: [...parCarte].sort((a, b) => a[0].localeCompare(b[0], 'fr', { numeric: true })).map(([carte, l]) => {
        const clips = l.map(t => (t.clip || '').trim()).filter(Boolean).sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
        return { carte, n: l.length, premier: clips[0] || '', dernier: clips[clips.length - 1] || '' };
      }),
      sansCarte: T.filter(t => !(t.carte || '').trim()).length,
      sansClip: T.filter(t => !(t.clip || '').trim()).length
    };
    const dec = jour === 'CG' ? 'Full CG' : decorJour(jour);
    return {
      jour, titre: p.titre || 'Projet sans titre', sauvegarde,
      sous: ['Journal DIT', nomJour(jour), dec, p.date, p.unit, p.dit && 'DIT ' + p.dit, p.wrangler && 'Wrangler ' + p.wrangler]
              .filter(Boolean).join(' · '),
      chiffres: [[P.filter(x => x.etat === 'done').length, 'plans tournés sur ' + P.length], [reste.length, 'à tourner'],
                 [T.length, 'fichier' + plur(T.length) + ' à sauvegarder'], [gardees.length, 'prises à monter'],
                 [T.filter(t => t.statut === 'OK').length, 'OK'], [T.filter(t => t.statut === 'NG').length, 'NG'],
                 [cartes.length, 'carte' + plur(cartes.length) + (cartes.length && cartes.length <= 6 ? ' · ' + cartes.join(', ') : '')]],
      montage, tournes, reste, abandonnes, pied
    };
  });
}

/* ------------------------------------------------ Un PDF ecrit a la main */
/* Le journal se telecharge sans passer par la fenetre d'impression : la page
   ecrit le PDF elle-meme. Helvetica et Courier, que tout lecteur possede,
   en WinAnsi pour les accents ; pas de compression, le fichier se relit tel
   quel. A4, marges de 40 points, l'origine en bas a gauche comme dans tout PDF. */
const PDF_L = 595.28, PDF_H = 841.89, PDF_M = 40;
/* les largeurs d'Helvetica, en milliemes de cadratin : pour couper les lignes au bon endroit */
const PDF_HELV = { ' ':278, '!':278, '"':355, '#':556, '$':556, '%':889, '&':667, "'":191, '(':333, ')':333, '*':389,
  '+':584, ',':278, '-':333, '.':278, '/':278, ':':278, ';':278, '<':584, '=':584, '>':584, '?':556, '@':1015, '[':278,
  '\\':278, ']':278, '_':556, '`':333, '{':334, '|':260, '}':334, 'a':556, 'b':556, 'c':500, 'd':556, 'e':556, 'f':278,
  'g':556, 'h':556, 'i':222, 'j':222, 'k':500, 'l':222, 'm':833, 'n':556, 'o':556, 'p':556, 'q':556, 'r':333, 's':500,
  't':278, 'u':556, 'v':500, 'w':722, 'x':500, 'y':500, 'z':500, 'A':667, 'B':667, 'C':722, 'D':722, 'E':667, 'F':611,
  'G':778, 'H':722, 'I':278, 'J':500, 'K':667, 'L':556, 'M':833, 'N':722, 'O':778, 'P':667, 'Q':778, 'R':722, 'S':667,
  'T':611, 'U':722, 'V':667, 'W':944, 'X':667, 'Y':667, 'Z':611, '•':350, '–':556, '—':1000, '…':1000, '«':556, '»':556,
  '°':400, '€':556, '·':278, 'œ':944, 'Œ':1000 };
/* ce que WinAnsi place au-dela du latin-1 */
const PDF_WINANSI = { '€':128, '‚':130, 'ƒ':131, '„':132, '…':133, '†':134, '‡':135, 'ˆ':136, '‰':137, 'Š':138, '‹':139,
  'Œ':140, 'Ž':142, '‘':145, '’':146, '“':147, '”':148, '•':149, '–':150, '—':151, '˜':152, '™':153, 'š':154, '›':155,
  'œ':156, 'ž':158, 'Ÿ':159 };

/* La charte du site, en clair comme sur papier : encre brune, caramel pour
   ce qui compte, tan pour ce qui accompagne, creme pour les fonds. */
const PDF_TEINTES = {
  encre:   [42, 26, 5],      // --acc-txt
  brun:    [58, 42, 32],     // le texte courant
  tan:     [142, 122, 105],  // --dim2 : les libelles, les metas
  caramel: [154, 106, 20],   // --acc en clair : titres de section, filets forts
  or:      [231, 176, 74],   // --acc : le logo
  creme:   [241, 232, 220],  // --surface2 en clair : les fonds
  creme2:  [232, 220, 205],  // --surface3 en clair : la prise retenue
  creme3:  [247, 243, 237],  // une rangee sur deux des tableaux
  filet:   [216, 204, 190],  // les traits fins
  filet2:  [176, 160, 142],  // les traits des en-tetes
  ok:      [72, 138, 90],    // une prise bonne
  ng:      [188, 84, 76]     // une prise a jeter
};
/* la largeur d'un texte interlettre */
const largeurEsp = (s, taille, police, esp) => largeurPdf(s, taille, police) + (esp || 0) * Math.max(0, String(s || '').length - 1);
function teintePdf(couleur, gris){
  const c = PDF_TEINTES[couleur];
  if (c) return c.map(v => (v / 255).toFixed(3)).join(' ');
  const g = (gris == null ? 0 : gris).toFixed(2);
  return `${g} ${g} ${g}`;
}

function largeurPdf(s, taille, police){
  if (police === 'C' || police === 'CB') return String(s || '').length * 600 * taille / 1000;
  let l = 0;
  for (const ch of String(s || '')){
    const base = ch.normalize('NFD').replace(/[̀-ͯ]/g, '');
    l += PDF_HELV[ch] || PDF_HELV[base] || 556;
  }
  return l * taille / 1000 * (police === 'HB' ? 1.05 : 1);
}
/* Une chaine PDF : en WinAnsi, parentheses et barres echappees. */
function chainePdf(s){
  let out = '';
  for (const ch of String(s || '')){
    let c = ch.charCodeAt(0);
    if (c > 255) c = PDF_WINANSI[ch] || 63;
    if (c < 32) c = 32;
    if (c === 40 || c === 41 || c === 92) out += '\\';
    out += String.fromCharCode(c);
  }
  return out;
}
/* Coupe un texte en lignes qui tiennent dans `larg` points ; un mot trop long est brise. */
function lignesPdf(s, larg, taille, police){
  const out = []; let l = '';
  for (let m of String(s || '').replace(/\s+/g, ' ').trim().split(' ')){
    while (largeurPdf(m, taille, police) > larg && m.length > 1){
      let k = m.length; while (k > 1 && largeurPdf(m.slice(0, k), taille, police) > larg) k--;
      if (l){ out.push(l); l = ''; }
      out.push(m.slice(0, k)); m = m.slice(k);
    }
    const essai = l ? l + ' ' + m : m;
    if (!l || largeurPdf(essai, taille, police) <= larg) l = essai; else { out.push(l); l = m; }
  }
  if (l) out.push(l);
  return out.length ? out : [''];
}

/* `paysage` : la page couchee, pour les tableaux larges */
function nouveauPdf(paysage){
  const pages = [], largeur = paysage ? PDF_H : PDF_L, hauteur = paysage ? PDF_L : PDF_H;
  const doc = {
    y: 0, page: null, largeur, hauteur,
    nouvellePage(){ doc.page = { ops: [] }; pages.push(doc.page); doc.y = hauteur - PDF_M; },
    /* du texte a partir de (x, y), y etant la ligne de base ; `couleur` est un
       nom de la charte (PDF_TEINTES), a defaut un gris de 0 (noir) a 1 */
    texte(x, y, s, o){
      o = o || {};
      // `esp` : l'interlettrage, pour les petites capitales ; il reste pose tant qu'on ne le remet pas a zero
      doc.page.ops.push(`BT /${o.police || 'H'} ${o.taille || 9} Tf ${(o.esp || 0).toFixed(2)} Tc ` +
                        `${teintePdf(o.couleur || (o.gris == null ? 'brun' : ''), o.gris)} rg ` +
                        `${x.toFixed(2)} ${y.toFixed(2)} Td (${chainePdf(s)}) Tj ET`);
    },
    /* un point plein : quatre arcs de Bezier */
    disque(cx, cy, r, couleur){
      const k = .5523 * r, f = v => v.toFixed(2);
      doc.page.ops.push(`${teintePdf(couleur)} rg ${f(cx + r)} ${f(cy)} m ` +
        `${f(cx + r)} ${f(cy + k)} ${f(cx + k)} ${f(cy + r)} ${f(cx)} ${f(cy + r)} c ` +
        `${f(cx - k)} ${f(cy + r)} ${f(cx - r)} ${f(cy + k)} ${f(cx - r)} ${f(cy)} c ` +
        `${f(cx - r)} ${f(cy - k)} ${f(cx - k)} ${f(cy - r)} ${f(cx)} ${f(cy - r)} c ` +
        `${f(cx + k)} ${f(cy - r)} ${f(cx + r)} ${f(cy - k)} ${f(cx + r)} ${f(cy)} c f`);
    },
    ligne(x1, y1, x2, y2, ep, couleur){
      doc.page.ops.push(`${teintePdf(couleur)} RG ${ep || .5} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
    },
    rect(x, y, w, h, couleur){ doc.page.ops.push(`${teintePdf(couleur)} rg ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); },
    /* un trace ferme, en points de la page, rempli d'une teinte */
    forme(points, couleur){
      if (points.length < 3) return;
      doc.page.ops.push(`${teintePdf(couleur)} rg ` + points.map((p, i) => `${p[0].toFixed(2)} ${p[1].toFixed(2)} ${i ? 'l' : 'm'}`).join(' ') + ' h f');
    },
    /* un trace SVG (M, L, Z seulement) pose dans la page : (x0, y0) est l'origine
       du dessin, k son echelle ; le SVG compte y vers le bas, la page vers le haut */
    trace(d, couleur, evenodd, x0, y0, k){
      const t = d.match(/[MLZ]|-?[\d.]+/g) || [], ops = [teintePdf(couleur) + ' rg'];
      for (let i = 0; i < t.length;){
        const c = t[i++];
        if (c === 'Z') ops.push('h');
        else if (c === 'M' || c === 'L'){
          const x = +t[i++], y = +t[i++];
          ops.push(`${(x0 + x * k).toFixed(2)} ${(y0 - y * k).toFixed(2)} ${c === 'M' ? 'm' : 'l'}`);
        }
      }
      ops.push(evenodd ? 'f*' : 'f');
      doc.page.ops.push(ops.join(' '));
    },
    /* assez de place pour `h` points, sinon page suivante */
    place(h){ if (doc.y - h < PDF_M) doc.nouvellePage(); },
    /* le fichier : les objets, la table des adresses, le pied de chaque page */
    fichier(pied){
      pages.forEach((pg, i) => {
        const s = (i + 1) + ' / ' + pages.length;
        pg.ops.push(`${teintePdf('filet2')} RG 0.5 w ${PDF_M} ${PDF_M - 10} m ${(largeur - PDF_M).toFixed(2)} ${PDF_M - 10} l S`);
        pg.ops.push(`BT /H 7 Tf 0 Tc ${teintePdf('tan')} rg ${PDF_M} ${PDF_M - 20} Td (${chainePdf(pied)}) Tj ET`);
        pg.ops.push(`BT /H 7 Tf 0 Tc ${teintePdf('tan')} rg ${(largeur - PDF_M - largeurPdf(s, 7, 'H')).toFixed(2)} ${PDF_M - 20} Td (${chainePdf(s)}) Tj ET`);
      });
      const objets = [];
      const ajouter = s => { objets.push(s); return objets.length; };
      const fontes = ['Helvetica', 'Helvetica-Bold', 'Courier', 'Courier-Bold'].map(f =>
        ajouter(`<< /Type /Font /Subtype /Type1 /BaseFont /${f} /Encoding /WinAnsiEncoding >>`));
      const res = `<< /Font << /H ${fontes[0]} 0 R /HB ${fontes[1]} 0 R /C ${fontes[2]} 0 R /CB ${fontes[3]} 0 R >> >>`;
      const noPages = ajouter('');
      const kids = pages.map(pg => {
        const flux = pg.ops.join('\n');
        const c = ajouter(`<< /Length ${flux.length} >>\nstream\n${flux}\nendstream`);
        return ajouter(`<< /Type /Page /Parent ${noPages} 0 R /MediaBox [0 0 ${largeur} ${hauteur}] /Resources ${res} /Contents ${c} 0 R >>`);
      });
      objets[noPages - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
      const racine = ajouter(`<< /Type /Catalog /Pages ${noPages} 0 R >>`);
      let s = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
      const adresses = objets.map((o, i) => { const a = s.length; s += `${i + 1} 0 obj\n${o}\nendobj\n`; return a; });
      const xref = s.length;
      s += `xref\n0 ${objets.length + 1}\n0000000000 65535 f \n` +
           adresses.map(a => String(a).padStart(10, '0') + ' 00000 n \n').join('') +
           `trailer\n<< /Size ${objets.length + 1} /Root ${racine} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
      return Uint8Array.from(s, ch => ch.charCodeAt(0) & 255);
    }
  };
  doc.nouvellePage();
  return doc;
}

/* Un tableau : des colonnes [titre, largeur, police], des lignes { v: cellules, fond, gras }.
   Une ligne tient d'un seul tenant ; l'en-tete se repete apres un saut de page. */
/* Une cellule est un texte, ou { t, couleur, police, puce } : `puce` pose un
   point de couleur devant le texte. Une cellule { parts: [...] } enchaine
   plusieurs textes sur une ligne, chacun avec sa police et sa couleur. */
/* `suite` : ce qu'on rappelle en tete du tableau quand il continue sur la page d'apres. */
function tableauPdf(doc, cols, lignes, taille, suite){
  const inter = taille * 1.4, x0 = PDF_M, larg = cols.reduce((a, c) => a + c[1], 0);
  const entete = encore => {
    doc.place(inter + 12);
    if (encore && suite){ doc.texte(x0, doc.y - 9, suite, { taille: 8, police: 'HB', couleur: 'tan' }); doc.y -= 13; }
    let x = x0;
    cols.forEach(c => { doc.texte(x + 3, doc.y - 8, c[0].toUpperCase(), { taille: 6.3, police: 'HB', couleur: 'tan', esp: .5 }); x += c[1]; });
    doc.y -= 11;
    doc.ligne(x0, doc.y, x0 + larg, doc.y, .7, 'filet2');
    doc.y -= 1;
  };
  entete(false);
  lignes.forEach((li, n) => {
    const cel = li.v.map(c => (c && typeof c === 'object') ? c : { t: c });
    const lg = cols.map((c, i) => cel[i].parts ? [''] : lignesPdf(cel[i].t, c[1] - 8 - (cel[i].puce ? 9 : 0), taille, cel[i].police || c[2] || 'H'));
    const h = Math.max(...lg.map(l => l.length)) * inter + 5;
    if (doc.y - h < PDF_M){ doc.nouvellePage(); entete(true); }
    // une rangee sur deux est teintee ; la prise retenue l'est davantage
    if (li.fond) doc.rect(x0, doc.y - h, larg, h, 'creme2');
    else if (n % 2) doc.rect(x0, doc.y - h, larg, h, 'creme3');
    let x = x0 + 3;
    lg.forEach((l, i) => {
      const c = cel[i], base = c.police || cols[i][2] || 'H';
      const police = base === 'C' ? (li.gras ? 'CB' : 'C') : (li.gras || base === 'HB' ? 'HB' : 'H');
      let dx = 0;
      if (c.puce && c.t){ doc.disque(x + 2.6, doc.y - taille + 1, 2.1, c.puce); dx = 9; }
      if (c.parts) c.parts.forEach(p => {
        if (!p.t) return;
        const pol = p.police || police;
        doc.texte(x + dx, doc.y - taille - 2, p.t, { taille, police: pol, couleur: p.couleur });
        dx += largeurPdf(p.t, taille, pol);
      });
      else l.forEach((s, k) => doc.texte(x + dx, doc.y - taille - 2 - k * inter, s, { taille, police, couleur: c.couleur }));
      x += cols[i][1];
    });
    doc.y -= h;
  });
  doc.ligne(x0, doc.y, x0 + larg, doc.y, .5, 'filet2');
  doc.y -= 2;
}

/* Le logo, lu une fois dans son SVG : le mot et la touche caramel. Sans lui
   (page ouverte hors serveur), le journal se fait quand meme. */
let LOGO_PDF = null;
function chargerLogo(){
  if (LOGO_PDF) return Promise.resolve(LOGO_PDF);
  return fetch('public/wrangle-logo.svg').then(r => r.ok ? r.text() : '').then(svg => {
    const d = [...svg.matchAll(/<path\b[^>]*?\sd="([^"]*)"/g)].map(x => x[1]);
    // dans le fichier : la decoupe, puis le mot, puis la touche caramel
    LOGO_PDF = d.length >= 3 ? { mot: d[1], touche: d[2] } : null;
    return LOGO_PDF;
  }).catch(() => null);
}
// la boite du dessin dans son SVG (viewBox 1569 x 484) : le mot tient la
const LOGO_BOITE = { x: 109.4, y: 132.4, l: 1346.3, h: 232.6 };

/* L'en-tete d'un document : le logo a gauche, le titre et le sous-titre a
   droite sur un trait caramel, puis les chiffres en tuiles comme sur le site,
   le nombre en grand et son libelle en petites capitales dessous. */
function entetePdf(doc, titre, sous, chiffres){
  const L = doc.largeur - 2 * PDF_M, hl = 26, kl = hl / LOGO_BOITE.h;
  if (LOGO_PDF){
    const ox = PDF_M - LOGO_BOITE.x * kl, oy = doc.y + LOGO_BOITE.y * kl;
    doc.trace(LOGO_PDF.mot, 'encre', true, ox, oy, kl);
    doc.trace(LOGO_PDF.touche, 'or', false, ox, oy, kl);
  }
  const xd = PDF_M + L;
  doc.texte(xd - largeurPdf(titre, 20, 'HB'), doc.y - 16, titre, { taille: 20, police: 'HB', couleur: 'encre' });
  doc.texte(xd - largeurPdf(sous, 8.5, 'H'), doc.y - 29, sous, { taille: 8.5, couleur: 'tan' });
  doc.y -= 40;
  doc.ligne(PDF_M, doc.y, PDF_M + L, doc.y, 1, 'caramel');   // le seul trait caramel de la page
  const lt = L / chiffres.length;
  doc.y -= 6;
  chiffres.forEach(([n, l], k) => {
    const xt = PDF_M + k * lt;
    if (k) doc.ligne(xt - 7, doc.y - 4, xt - 7, doc.y - 32, .4, 'filet');
    doc.texte(xt, doc.y - 18, String(n), { taille: 17, police: 'HB', couleur: 'encre' });
    lignesPdf(l.toUpperCase(), lt - 14, 5.8, 'HB').slice(0, 2).forEach((s, q) =>
      doc.texte(xt, doc.y - 27.5 - q * 7.5, s, { taille: 5.8, police: 'HB', couleur: 'tan', esp: .45 }));
  });
  doc.y -= 44; doc.ligne(PDF_M, doc.y, PDF_M + L, doc.y, .6, 'filet2');
}
/* un titre de section : petites capitales espacees, encre, sur un filet */
function sectionPdf(doc, s){
  const L = doc.largeur - 2 * PDF_M;
  doc.place(48); doc.y -= 18;
  doc.texte(PDF_M, doc.y - 8, s.toUpperCase(), { taille: 7.4, police: 'HB', couleur: 'encre', esp: .9 });
  doc.y -= 12; doc.ligne(PDF_M, doc.y, PDF_M + L, doc.y, .7, 'filet2'); doc.y -= 8;
}

/* Une journee de dix plans a dix prises fait cent lignes : chacune doit se
   lire d'un coup d'oeil. Les tableaux ne montrent que les colonnes remplies
   ce jour-la, un tableau qui continue sur la page d'apres rappelle son plan,
   et chaque plan annonce son bilan. */
function pdfDIT(j){
  const jours = modeleDIT(j), doc = nouveauPdf(), L = doc.largeur - 2 * PDF_M;
  const section = s => sectionPdf(doc, s);
  const vide = s => { doc.texte(PDF_M, doc.y - 8, s, { taille: 8.5, couleur: 'tan' }); doc.y -= 13; };
  // le statut d'une prise, dans sa couleur : OK en vert, NG en rouge, le reste en tan
  const statut = s => ({ t: s, couleur: s === 'OK' ? 'ok' : s === 'NG' ? 'ng' : 'tan', police: s === 'OK' || s === 'NG' ? 'HB' : 'H' });
  // qui a saisi : le prenom en gras, l'heure en tan
  const saisi = t => ({ parts: [{ t: t.par, police: 'HB', couleur: 'encre' }, { t: t.par && t.heure ? ' · ' : '', couleur: 'tan' },
                                { t: t.heure, couleur: 'tan' }] });
  /* les colonnes d'une journee : celles qui ont quelque chose a dire. Chaque
     colonne sait lire sa cellule dans une prise ; la note prend la place qui reste. */
  const COLONNES = {
    n:      ['Pr.', 22, 'H', t => t.n],
    clip:   ['Clip', 68, 'C', t => t.clip || '—'],
    ou:     ['Plan · prise', 84, 'H', t => [t.seq, t.plan].filter(Boolean).join(' · ') + ' · pr. ' + t.n],
    statut: ['Statut', 42, 'H', t => statut(t.statut)],
    ret:    ['Montage', 54, 'H', t => t.retenue ? { t: 'retenue', puce: 'caramel', police: 'HB', couleur: 'encre' } : ''],
    // les deux timecodes dans une colonne, l'un sous l'autre quand il y en a deux
    tc:     ['TC in / out', 72, 'C', t => t.tcIn && t.tcOut ? t.tcIn + ' – ' + t.tcOut : t.tcIn || t.tcOut],
    duree:  ['Durée', 34, 'H', t => t.duree],
    carte:  ['Carte', 40, 'H', t => t.carte],
    note:   ['Note', 0, 'H', t => t.note],
    qui:    ['Saisi par', 78, 'H', saisi]
  };
  const colonnes = (fixes, prises) => {
    const avec = k => prises.some(t => t[k]);
    const ids = fixes.slice(0, -1)
      .concat(avec('tcIn') || avec('tcOut') ? ['tc'] : [], avec('duree') ? ['duree'] : [], avec('carte') ? ['carte'] : [],
              avec('note') ? ['note'] : [], fixes.slice(-1));
    const cols = ids.map(id => COLONNES[id].slice());
    const reste = L - cols.reduce((a, c) => a + c[1], 0);
    const note = cols.find(c => c[0] === 'Note');
    if (note) note[1] = Math.max(80, reste); else cols[cols.length - 1][1] += Math.max(0, reste);
    return cols;
  };
  const rangee = (cols, t, extra) => Object.assign({ v: cols.map(c => c[3](t)) }, extra || {});

  jours.forEach((m, i) => {
    if (i) doc.nouvellePage();
    const toutes = m.tournes.flatMap(b => b.prises);
    const colsM = colonnes(['clip', 'ou', 'statut', 'qui'], m.montage);
    const colsP = colonnes(['n', 'clip', 'statut', 'ret', 'qui'], toutes);
    entetePdf(doc, m.titre, m.sous, m.chiffres);

    // 0. ce qu'il y a a sauvegarder : le premier travail du DIT
    const s = m.sauvegarde;
    section('À sauvegarder : ' + s.total + ' fichier' + plur(s.total) + (s.cartes.length ? ' sur ' + s.cartes.length + ' carte' + plur(s.cartes.length) : ''));
    if (s.cartes.length)
      tableauPdf(doc, [['Carte', 70], ['Fichiers', 50], ['Du clip', 110, 'C'], ['Au clip', 110, 'C'], ['', L - 340]],
                 s.cartes.map(c => ({ v: [{ t: c.carte, police: 'HB', couleur: 'encre' }, { t: String(c.n), police: 'HB', couleur: 'encre' },
                                          c.premier, c.dernier, ''] })), 8);
    else vide(s.total ? 'Aucune carte renseignée sur les prises.' : 'Aucune prise enregistrée.');
    const manques = [s.sansCarte && s.cartes.length ? s.sansCarte + ' prise' + plur(s.sansCarte) + ' sans carte' : '',
                     s.sansClip ? s.sansClip + ' prise' + plur(s.sansClip) + ' sans nom de clip' : ''].filter(Boolean);
    if (manques.length){ doc.place(14); doc.texte(PDF_M, doc.y - 9, 'À compléter : ' + manques.join(' · ') + '.', { taille: 7.5, couleur: 'ng' }); doc.y -= 13; }

    // 1. ce que le montage attend
    section('Pour le montage — prises retenues');
    if (m.montage.length) tableauPdf(doc, colsM, m.montage.map(t => rangee(colsM, t)), 8, 'Prises retenues, suite');
    else vide('Aucune prise marquée à monter pour l’instant.');

    // 2. les plans tournes, chacun avec ses prises
    section('Plans tournés — prises et saisies');
    if (!m.tournes.length) vide('Aucun plan tourné pour l’instant.');
    m.tournes.forEach(b => {
      // un plan ne se coupe pas en deux pages, sauf s'il ne tient sur aucune
      const h = 26 + (b.seq ? 18 : 0) + (b.prises.length ? 16 + b.prises.length * 16 : 12);
      if (doc.y - Math.min(h, 400) < PDF_M) doc.nouvellePage();
      if (b.seq){
        doc.y -= 8;
        doc.texte(PDF_M, doc.y - 7, b.seq.toUpperCase(), { taille: 6.5, police: 'HB', couleur: 'tan', esp: .7 });
        if (b.seqTitre) doc.texte(PDF_M + largeurEsp(b.seq.toUpperCase(), 6.5, 'HB', .7) + 8, doc.y - 7, b.seqTitre, { taille: 7.2, couleur: 'tan' });
        doc.y -= 12;
      }
      // le plan : son numero, ses reglages, et son bilan a droite
      doc.texte(PDF_M, doc.y - 13, 'Plan ' + b.plan, { taille: 12, police: 'HB', couleur: 'encre' });
      const xm = PDF_M + largeurPdf('Plan ' + b.plan, 12, 'HB') + 10, lb = largeurPdf(b.bilan, 8, 'HB');
      doc.texte(PDF_M + L - lb, doc.y - 12.5, b.bilan, { taille: 8, police: 'HB', couleur: 'encre' });
      doc.texte(xm, doc.y - 12.5, lignesPdf(b.meta, L - (xm - PDF_M) - lb - 12, 8, 'H')[0], { taille: 8, couleur: 'tan' });
      doc.y -= 20;
      if (b.prises.length)
        tableauPdf(doc, colsP, b.prises.map(t => rangee(colsP, t, { fond: t.retenue, gras: t.retenue })), 8, 'Plan ' + b.plan + ', suite');
      else { doc.texte(PDF_M, doc.y - 8, 'Marqué tourné, aucune prise enregistrée.', { taille: 8, couleur: 'tan' }); doc.y -= 12; }
      doc.y -= 8;
    });

    // 3. ce qui reste, sur deux colonnes : le plan, puis ses reglages dessous
    section('Reste à tourner : ' + m.reste.length + ' plan' + plur(m.reste.length));
    if (!m.reste.length) vide('Rien : la journée est tournée.');
    const nc = 2, parCol = Math.ceil(m.reste.length / nc), lc = L / nc, hr = 24;
    for (let k = 0; k < parCol; k++){
      doc.place(hr);
      [0, 1].map(c => m.reste[k + c * parCol]).forEach((r, c) => {
        if (!r) return;
        const xc = PDF_M + c * lc;
        doc.texte(xc, doc.y - 8.5, r.ref, { taille: 8.5, police: 'HB', couleur: 'encre' });
        if (r.meta) doc.texte(xc, doc.y - 18, lignesPdf(r.meta, lc - 14, 7.5, 'H')[0], { taille: 7.5, couleur: 'tan' });
      });
      doc.y -= hr;
    }
    if (m.abandonnes.length){
      doc.place(24); doc.y -= 4;
      doc.texte(PDF_M, doc.y - 8, 'Abandonnés : ' + m.abandonnes.map(a => a.ref).join(' · '), { taille: 7.5, couleur: 'tan' });
      doc.y -= 12;
    }
  });
  return doc.fichier(jours.length ? jours[0].pied : '');
}
function telechargerDIT(){
  const j = fJourR;
  chargerLogo().then(() => download(fname('journal-DIT' + (j === '*' ? '' : '-' + j), 'pdf'), pdfDIT(j), 'application/pdf'));
}

/* ------------------------------------------------- Le depot des saisies */
/* Sur le site, chacun depose ses saisies d'un bouton : elles partent chez
   l'hebergeur (depot/deposer.php) sous son compte, un fichier par personne.
   Le DIT les recupere toutes dans « Rapprocher les saisies ». Le serveur de
   plateau n'en a pas besoin : il partage deja tout en direct. */
const PAS_DE_DEPOT = 'Pas de dépôt à cette adresse : il faut ouvrir le site chez l’hébergeur.';
/* la reponse du depot : { rep, statut } ; une connexion refusee est oubliee, on la redemandera */
function appelDepot(quoi, corps){
  return appelCompte(quoi, Object.assign({ jeton: UI.jeton }, corps)).then(x => {
    if (x.statut === 401){ UI.jeton = ''; ecrireUI(); demanderNom(); }
    return x;
  });
}
function deposerSaisies(){
  if (!connecte()) return demanderNom();
  appelDepot('deposer', { projet: DB }).then(({ rep, statut }) => {
    if (rep.ok){
      UI.depose = rep.quand; ecrireUI();
      toast('Saisies déposées à ' + hhmm(new Date(rep.quand)));
      if (openType === 'prod') openProd();
    } else if (statut !== 401) prevenir('Le dépôt n’a pas pris.', { detail: rep.erreur || ('réponse ' + statut) });
  }).catch(() => prevenir('Le dépôt n’a pas pris.', { detail: PAS_DE_DEPOT }));
}
function recupererDepots(){
  if (!connecte()) return demanderNom();
  appelDepot('lister', {}).then(({ rep, statut }) => {
    if (!rep.depots){ if (statut !== 401) prevenir('Impossible de lire les dépôts.', { detail: rep.erreur || ('réponse ' + statut) }); return; }
    let n = 0;
    rep.depots.forEach(d => {
      if (d.nom === UI.nom) return;   // ses propres saisies sont deja la, dans ce navigateur
      try{
        const db = normaliser(d.projet);
        RAP.sources = RAP.sources.filter(s => s.nom !== d.nom);
        RAP.sources.push({ nom: d.nom, db, quand: d.quand });
        n++;
      }catch(e){}
    });
    renderReport();
    toast(n ? n + ' dépôt' + plur(n) + ' récupéré' + plur(n) : 'Aucun dépôt des autres pour l’instant');
  }).catch(() => prevenir('Impossible de lire les dépôts.', { detail: PAS_DE_DEPOT }));
}
const quandDepot = iso => { const d = new Date(iso); return isNaN(d) ? '' : deuxCh(d.getDate()) + '/' + deuxCh(d.getMonth() + 1) + ' ' + hhmm(d); };

/* ------------------------------------------------ Rapprocher les saisies */
/* Chacun saisit de son cote, dans son navigateur ; le DIT depose ici les
   sauvegardes des autres. On met les prises cote a cote, plan par plan :
   ce qui ne concorde pas (un ecart), ce qu'un seul a rempli (un complement),
   ce qu'un seul a saisi (une prise chez un seul). La fusion garde tout : la
   premiere source, ce navigateur, fait foi sur les ecarts ; les autres
   comblent les vides et apportent leurs prises en plus. */
const RAP = { sources: [] };
const RAP_PRISE = [['statut', 'Statut'], ['retenue', 'À monter'], ['clip', 'Clip'], ['carte', 'Carte'], ['cam', 'Caméra'],
  ['tcIn', 'TC in'], ['tcOut', 'TC out'], ['duree', 'Durée'], ['heure', 'Heure'], ['notes', 'Note'], ['focale', 'Focale'],
  ['focaleStop', 'Focale arrivée'], ['diaph', 'Diaph'], ['mouvement', 'Mouvement'], ['support', 'Support'], ['meteo', 'Météo'],
  ['codec', 'Codec'], ['reso', 'Résolution'], ['fps', 'Cadence'], ['shutter', 'Obturateur'], ['ei', 'EI'], ['wb', 'Balance'],
  ['nd', 'ND'], ['lut', 'LUT'], ['objectif', 'Objectif'], ['filtre', 'Filtres'], ['sonRoll', 'Bande son'], ['sync', 'Synchro'],
  ['sonFile', 'Fichier son']];
const RAP_PLAN = [['etat', 'État'], ['elements', 'Éléments captés'], ['elementsAutre', 'Autre élément'], ['notesClient', 'Note'],
  ['notesInternes', 'Note interne'], ['vfxDesc', 'Description VFX']];
const valRap = v => v === true ? 'oui' : v === false || v == null ? '' : Array.isArray(v) ? v.join(', ') : String(v).trim();
const clePlan = p => (p.seq || '') + '|' + (p.plan || '');
const champPlan = (p, k) => k === 'etat' ? (ETATS[p.etat] || valRap(p.etat))
  : k === 'elements' ? Object.keys(p.elements || {}).filter(x => p.elements[x]).sort().join(', ') : valRap(p[k]);
/* les saisies a rapprocher : celles de ce navigateur d'abord, puis les fichiers deposes */
const sourcesRap = () => [{ nom: UI.nom || 'Ce navigateur', db: DB, ici: true }].concat(RAP.sources);

function rapprocher(sources){
  const plans = new Map();   // cle -> { seq, plan, versions: Map(nom -> plan), prises: Map(n -> Map(nom -> prise)) }
  sources.forEach(s => {
    s.db.plans.forEach(p => {
      const c = clePlan(p);
      if (!plans.has(c)) plans.set(c, { seq: p.seq || '', plan: p.plan || '', versions: new Map(), prises: new Map() });
      plans.get(c).versions.set(s.nom, p);
    });
    s.db.prises.forEach(t => {
      const p = s.db.plans.find(x => x.id === t.planId); if (!p) return;
      const e = plans.get(clePlan(p)), n = String(t.n || '');
      if (!e.prises.has(n)) e.prises.set(n, new Map());
      e.prises.get(n).set(s.nom, t);
    });
  });
  /* un champ a la fois : des valeurs differentes, c'est un ecart ; une valeur
     chez certains seulement, c'est un complement */
  const comparer = (versions, champs, lire) => {
    const ecarts = [], complements = [];
    champs.forEach(([k, label]) => {
      const vals = [];
      versions.forEach((o, nom) => { const v = lire(o, k); if (v) vals.push([nom, v]); });
      if (!vals.length) return;
      if (new Set(vals.map(x => x[1].toLowerCase())).size > 1) ecarts.push({ champ: label, valeurs: vals });
      else if (vals.length < versions.size) complements.push({ champ: label, valeur: vals[0][1], par: vals.map(x => x[0]) });
    });
    return { ecarts, complements };
  };
  const ordre = new Map(sources[0].db.plans.map((p, i) => [clePlan(p), i]));
  const total = { ecarts: 0, complements: 0, seuls: 0 }, out = [];
  [...plans.entries()].sort((a, b) => (ordre.has(a[0]) ? ordre.get(a[0]) : 9999) - (ordre.has(b[0]) ? ordre.get(b[0]) : 9999))
    .forEach(([c, e]) => {
      const bloc = { seq: e.seq, plan: e.plan, plan_: comparer(e.versions, RAP_PLAN, champPlan), prises: [],
                     planSeul: e.versions.size < sources.length ? [...e.versions.keys()] : null };
      [...e.prises.entries()].sort((a, b) => (+a[0] || 0) - (+b[0] || 0)).forEach(([n, versions]) => {
        const r = comparer(versions, RAP_PRISE, (t, k) => valRap(t[k]));
        const seuls = versions.size < sources.length ? [...versions.keys()] : null;
        total.ecarts += r.ecarts.length; total.complements += r.complements.length; if (seuls) total.seuls++;
        if (r.ecarts.length || r.complements.length || seuls) bloc.prises.push(Object.assign({ n, seuls }, r));
      });
      total.ecarts += bloc.plan_.ecarts.length; total.complements += bloc.plan_.complements.length;
      if (bloc.prises.length || bloc.plan_.ecarts.length || bloc.plan_.complements.length) out.push(bloc);
    });
  return { plans: out, total, noms: sources.map(s => s.nom) };
}

/* La fusion : la premiere source pour base, les autres comblent ses vides,
   ajoutent leurs plans et leurs prises absents ; les elements captes s'additionnent. */
function fusionRap(sources){
  const base = structuredClone(sources[0].db);
  const parCle = new Map(base.plans.map(p => [clePlan(p), p]));
  const combler = (b, o, sauf) => Object.keys(o).forEach(k => {
    if (sauf.indexOf(k) >= 0 || (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k]))) return;
    if (!valRap(b[k]) && valRap(o[k])) b[k] = o[k];
  });
  sources.slice(1).forEach(s => {
    s.db.plans.forEach(p => {
      let b = parCle.get(clePlan(p));
      if (!b){ b = structuredClone(p); base.plans.push(b); parCle.set(clePlan(p), b); }
      else {
        combler(b, p, ['id']);
        b.elements = b.elements || {};
        Object.keys(p.elements || {}).forEach(k => { if (p.elements[k]) b.elements[k] = true; });
      }
      const prisesB = base.prises.filter(t => t.planId === b.id);
      s.db.prises.filter(t => t.planId === p.id).forEach(t => {
        const tb = prisesB.find(x => String(x.n) === String(t.n));
        if (!tb){ const c = structuredClone(t); c.planId = b.id; base.prises.push(c); prisesB.push(c); }
        else combler(tb, t, ['id', 'planId']);
      });
    });
  });
  return base;
}

/* les fichiers deposes : chacun nomme d'apres qui a saisi ses prises */
function lireSources(input){
  const fichiers = [...input.files]; input.value = '';
  let restant = fichiers.length;
  if (!restant) return;
  fichiers.forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result); if (!d.plans) throw 0;
        const db = normaliser(d);
        RAP.sources.push({ nom: nomDeSource(db, f.name), db, fichier: f.name });
      }catch(e){ toast('Fichier illisible : ' + f.name); }
      if (!--restant) renderReport();
    };
    r.readAsText(f);
  });
}
function nomDeSource(db, fichier){
  const f = frequences(db.prises.map(t => t.par).filter(Boolean));
  const nom = f.length ? f[0][0] : fichier.replace(/\.json$/i, '');
  const memes = sourcesRap().filter(s => s.nom === nom || s.nom.indexOf(nom + ' (') === 0).length;
  return memes ? nom + ' (' + (memes + 1) + ')' : nom;
}
function retirerSource(i){ RAP.sources.splice(i, 1); renderReport(); }

const ligneRap = (qui, c) =>
  c.ecarts.map(e => `<div class="alert o"><i>&#9888;</i><div>${qui ? esc(qui) + ' · ' : ''}${esc(e.champ)} : ${
    e.valeurs.map(([nom, v]) => `<b>${esc(nom)}</b> ${esc(v)}`).join(' · ')}</div></div>`).join('') +
  c.complements.map(e => `<div class="alert"><i></i><div>${qui ? esc(qui) + ' · ' : ''}${esc(e.champ)} « ${esc(e.valeur)} » seulement chez ${esc(e.par.join(', '))}</div></div>`).join('') +
  (c.seuls ? `<div class="alert"><i></i><div>${esc(qui)} seulement chez ${esc(c.seuls.join(', '))}</div></div>` : '');
function resumeRap(t){
  return [t.ecarts + ' écart' + plur(t.ecarts), t.complements + ' complément' + plur(t.complements),
          t.seuls + ' prise' + plur(t.seuls) + ' chez un seul'].join(' · ');
}
function htmlRapprochement(){

  const puces = s.map((x, i) => `<span class="rsource${x.ici ? ' ici' : ''}">${esc(x.nom)}${
    x.ici ? ' <em>ce navigateur</em>' : x.quand ? ` <em>${esc(quandDepot(x.quand))}</em>` : ''}${
    x.ici ? '' : ` <button type="button" onclick="retirerSource(${i - 1})" aria-label="Retirer ${esc(x.nom)}">&times;</button>`}</span>`).join('');
  let corps = '';
  if (s.length > 1){

          b.planSeul ? ` <em>seulement chez ${esc(b.planSeul.join(', '))}</em>` : ''}

    <button type="button" class="btn sm" onclick="$('rap-in').click()">+ Déposer des sauvegardes</button></div>${corps}`;
}
function garderFusion(){
  const s = sourcesRap();
  if (s.length < 2) return prevenir('Déposez d’abord une sauvegarde à rapprocher.');
  confirmer('Garder la version fusionnée comme projet' + (RESEAU.possible ? ', pour tous les appareils' : '') + ' ?',
            { detail:'Vos saisies font foi sur les écarts ; les autres comblent les vides et apportent leurs prises en plus.', ok:'Fusionner' })
  .then(oui => {
    if (!oui) return;
    DB = normaliser(fusionRap(s));
    dernierPlan = null; chrono = null; RAP.sources = [];
    operer({ op:'remplacer', db: DB });
    flush(); renderAll(); toast('Projet fusionné');
  });
}
/* le journal des ecarts en PDF, pour le relire ou le faire circuler */
function pdfRapprochement(){
  const s = sourcesRap(), r = rapprocher(s), doc = nouveauPdf(), L = doc.largeur - 2 * PDF_M, p = DB.prod, d = new Date();
  entetePdf(doc, p.titre || 'Projet sans titre', 'Rapprochement des saisies · ' + s.map(x => x.nom).join(', '),
            [[r.total.ecarts, 'écart' + plur(r.total.ecarts)], [r.total.complements, 'complément' + plur(r.total.complements)],
             [r.total.seuls, 'prise' + plur(r.total.seuls) + ' chez un seul'], [s.length, 'saisies rapprochées']]);
  const ligne = (texte, couleur, gras) => {
    lignesPdf(texte, L - 12, 8.5, gras ? 'HB' : 'H').forEach(l => {
      doc.place(13); doc.texte(PDF_M + 12, doc.y - 9, l, { taille: 8.5, police: gras ? 'HB' : 'H', couleur }); doc.y -= 12.5;
    });
  };
  const bloc = (qui, c) => {
    c.ecarts.forEach(e => ligne((qui ? qui + ' · ' : '') + e.champ + ' : ' + e.valeurs.map(([n, v]) => n + ' ' + v).join(' · '), 'encre', true));
    c.complements.forEach(e => ligne((qui ? qui + ' · ' : '') + e.champ + ' « ' + e.valeur + ' » seulement chez ' + e.par.join(', '), 'tan'));
    if (c.seuls) ligne(qui + ' seulement chez ' + c.seuls.join(', '), 'tan');
  };
  if (!r.plans.length){ sectionPdf(doc, 'Rien ne se contredit'); ligne('Les saisies concordent.', 'tan'); }
  r.plans.forEach(b => {
    sectionPdf(doc, 'Séquence ' + (b.seq || '—') + ' · Plan ' + (b.plan || '—') + (b.planSeul ? ' · seulement chez ' + b.planSeul.join(', ') : ''));
    bloc('', b.plan_);
    b.prises.forEach(t => bloc('Prise ' + t.n, t));
    doc.y -= 4;
  });
  return doc.fichier([p.titre || '', 'rapprochement édité le ' + deuxCh(d.getDate()) + '/' + deuxCh(d.getMonth() + 1) + '/' + d.getFullYear() +
                      ' à ' + hhmm(d) + (UI.nom ? ' par ' + UI.nom : ''), 'Wrangle'].filter(Boolean).join(' · '));
}
function telechargerRapprochement(){
  chargerLogo().then(() => download(fname('rapprochement', 'pdf'), pdfRapprochement(), 'application/pdf'));
}

/* ------------------------------------------------- Journal DIT par mail */
/* Le serveur expedie ce que la page fabrique : le PDF de la journee en cours,
   aux destinataires regles dans la fiche Journee. A la main, ou tout seul :
   toutes les heures (ou les deux heures) a l'heure pile dans la plage reglee,
   ou une fois par jour a l'heure dite, les journees cochees. Rien ne part si
   rien n'a change depuis le dernier envoi ; et un creneau ne part qu'une fois,
   meme si plusieurs appareils sont ouverts : le serveur ne garde que le premier. */
const destinatairesMail = () => String(DB.prod.mailA || '').split(/[,;\s]+/).map(x => x.trim()).filter(x => x.indexOf('@') > 0);
/* la journee du journal : celle de la derniere prise, sinon celle du plan vise, sinon celle affichee */
function jourDuJournal(){
  const t = DB.prises[DB.prises.length - 1];
  if (t && t.jour) return t.jour;
  const p = planVise();
  if (p && p.jour) return p.jour;
  return fJour !== '*' ? fJour : '*';
}
/* une heure ecrite comme on veut (« 20h », « 20:00 », « 8:5 ») -> « 20:00 », ou '' */
function heureLue(s){
  const m = String(s || '').trim().match(/^(\d{1,2})\s*[:hH]?\s*(\d{0,2})$/);
  return m ? deuxCh(Math.min(23, +m[1])) + ':' + deuxCh(Math.min(59, +(m[2] || 0))) : '';
}
/* ce qui a change : une empreinte des prises et des etats, pour ne pas renvoyer le meme journal */
function empreinteMail(){
  const s = JSON.stringify(DB.prises) + '|' + DB.plans.map(p => p.etat + (p.croquis ? 'c' : '')).join('');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return s.length + ':' + h;
}
/* le creneau d'envoi automatique du moment (« 2026-09-23 J1 14h »), ou '' s'il n'y en a pas :
   entre les deux dates reglees, a l'heure pile dans la plage, ou a l'heure dite */
function creneauMail(d){
  d = d || new Date();
  const c = DB.prod.mailCadence || '';
  if (!c) return '';
  const jour = jourDuJournal();
  const date = d.getFullYear() + '-' + deuxCh(d.getMonth() + 1) + '-' + deuxCh(d.getDate());
  if ((DB.prod.mailDu && date < DB.prod.mailDu) || (DB.prod.mailAu && date > DB.prod.mailAu)) return '';
  if (c === 'jour'){ const h = heureLue(DB.prod.mailHeure); return h && hhmm(d) === h ? date + ' ' + jour : ''; }
  if (d.getMinutes() !== 0) return '';
  const h = d.getHours();
  const de = +(heureLue(DB.prod.mailDebut) || '00:00').slice(0, 2), a = +(heureLue(DB.prod.mailFin) || '23:59').slice(0, 2);
  if (h < de || h > a) return '';
  if (c === '2h' && (h - de) % 2) return '';
  return date + ' ' + jour + ' ' + deuxCh(h) + 'h';
}
const base64De = u8 => {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
};
function envoyerJournalMail(auto, creneau){
  if (!RESEAU.possible) return Promise.resolve(null);
  const a = destinatairesMail();
  if (!a.length){
    if (!auto) prevenir('Aucun destinataire.', { detail:'Indiquez les adresses dans la fiche Journée, séparées par des virgules.' });
    return Promise.resolve(null);
  }
  const jour = jourDuJournal(), d = new Date(), titre = DB.prod.titre || 'Wrangle', empreinte = empreinteMail();
  const dateFr = deuxCh(d.getDate()) + '/' + deuxCh(d.getMonth() + 1) + '/' + d.getFullYear();
  const quoi = jour === '*' ? 'du tournage' : 'de ' + nomJour(jour).toLowerCase();
  return chargerLogo().then(() => poster('/api/mail', JSON.stringify({
      jour, auto: !!auto, creneau: creneau || '', destinataires: a, nomClient: UI.nom,
      nom: fname('journal-DIT' + (jour === '*' ? '' : '-' + jour), 'pdf'),
      sujet: titre + ' — journal DIT ' + quoi + ' · ' + dateFr + ' ' + hhmm(d),
      texte: 'Journal DIT ' + quoi + ', édité le ' + dateFr + ' à ' + hhmm(d) + (UI.nom ? ' par ' + UI.nom : '') + '.\n' +
             'En pièce jointe : ce qu’il y a à sauvegarder, les prises retenues pour le montage, ' +
             'les plans tournés et ce qui reste à tourner.\n\nEnvoyé par Wrangle.',
      pdf: base64De(pdfDIT(jour)) })))
    .then(r => r.json())
    .then(rep => {
      if (rep.ok){
        toast('Journal envoyé à ' + a.join(', '));
        patch('prod', 'prod', { mailEmpreinte: empreinte,
                                mailDernier: rep.quand + (auto ? ' (automatique)' : '') + ' · ' + (jour === '*' ? 'tout le tournage' : nomJour(jour)) });
        if (openType === 'prod') openProd();
      } else if (!rep.deja && !auto) prevenir('Le journal n’est pas parti.', { detail: rep.erreur || '' });
      return rep;
    })
    .catch(() => { if (!auto) prevenir('Le journal n’est pas parti.', { detail:'Serveur injoignable.' }); return null; });
}
/* La plage horaire se regle au curseur : deux poignees sur le meme rail, de
   0 h a 23 h, ou une seule pour l'heure d'un envoi quotidien (par demi-heure). */
function htmlPlageMail(p){
  const quotidien = p.mailCadence === 'jour';
  const de = +(heureLue(p.mailDebut) || '08:00').slice(0, 2), a = +(heureLue(p.mailFin) || '20:00').slice(0, 2);
  const h = heureLue(p.mailHeure) || '20:00', demi = +h.slice(0, 2) * 2 + (+h.slice(3) >= 30 ? 1 : 0);
  return `<div class="spec col"><label>${quotidien ? 'À' : 'Plage horaire'}</label>
    <div class="plage${quotidien ? ' seule' : ''}" id="plage-mail">
      <div class="rail"><i id="plage-fill"></i></div>
      ${quotidien
        ? `<input type="range" min="0" max="47" step="1" value="${demi}" data-k="mailHeure" oninput="glisserPlage(this)" aria-label="Heure d’envoi">`
        : `<input type="range" min="0" max="23" step="1" value="${de}" data-k="mailDebut" oninput="glisserPlage(this)" aria-label="Début">
           <input type="range" min="0" max="23" step="1" value="${a}" data-k="mailFin" oninput="glisserPlage(this)" aria-label="Fin">`}
      <b id="plage-txt"></b>
    </div></div>`;
}
function glisserPlage(input){
  const z = $('plage-mail'), r = z.querySelectorAll('input[type=range]'), txt = $('plage-txt'), fill = $('plage-fill');
  if (r.length === 1){
    const v = +r[0].value, h = deuxCh(Math.floor(v / 2)) + ':' + (v % 2 ? '30' : '00');
    if (input) patch('prod', 'prod', { mailHeure: h });
    txt.textContent = h; fill.style.left = '0'; fill.style.width = (v / 47 * 100) + '%';
    return;
  }
  let de = +r[0].value, a = +r[1].value;
  // une poignee qui croise l'autre la pousse : le debut reste avant la fin
  if (de > a){ if (input === r[0]) a = de; else de = a; r[0].value = de; r[1].value = a; }
  if (input) patch('prod', 'prod', { mailDebut: deuxCh(de) + ':00', mailFin: deuxCh(a) + ':00' });
  txt.textContent = deuxCh(de) + ':00 → ' + deuxCh(a) + ':00';
  fill.style.left = (de / 23 * 100) + '%'; fill.style.width = ((a - de) / 23 * 100) + '%';
}
/* ---------------------------------------------------------- Calendrier */
/* Un calendrier dans la charte, a la place de celui du navigateur : un mois
   a la fois, lundi en tete, la date choisie en caramel, la periode jusqu'a
   l'autre borne teintee. Il s'ouvre sous son champ, comme un menu. */
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const ICO_CAL = ICO('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', 16, 2);
const isoDate = d => d.getFullYear() + '-' + deuxCh(d.getMonth() + 1) + '-' + deuxCh(d.getDate());
const dateFr = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
/* un champ de date : la date en clair, le calendrier au doigt. `autre` est la cle de l'autre borne. */
function champDate(o, label, k, autre){
  return `<div class="spec"><label>${label}</label>
    <input readonly value="${esc(dateFr(o[k]))}" placeholder="jj/mm/aaaa" data-o="${o.id || 'prod'}" data-k="${k}" data-autre="${autre || ''}"
      onclick="ouvrirCalendrier(this)">
    <button type="button" class="deroul" onclick="ouvrirCalendrier(this.previousElementSibling)" aria-label="Choisir une date">${ICO_CAL}</button></div>`;
}
let calendrier = null;   // { input, mois } : le champ servi et le premier jour du mois affiche
function ouvrirCalendrier(input){
  if (calendrier && calendrier.input === input){ fermerCalendrier(); return; }
  fermerMenu(); fermerCalendrier();
  const o = cible(input.dataset.o), v = (o && o[input.dataset.k]) || '';
  const base = v ? new Date(+v.slice(0, 4), +v.slice(5, 7) - 1, 1) : new Date();
  calendrier = { input, mois: new Date(base.getFullYear(), base.getMonth(), 1) };
  const m = document.createElement('div');
  m.className = 'menu calendrier';
  input.closest('.spec').appendChild(m);
  dessinerCalendrier();
  const sb = m.closest('#sbody'), r = input.closest('.spec').getBoundingClientRect();
  const cadre = sb ? sb.getBoundingClientRect() : { top:0, bottom:innerHeight };
  if (r.bottom + m.offsetHeight > cadre.bottom && r.top - m.offsetHeight > cadre.top) m.classList.add('haut');
  setTimeout(() => document.addEventListener('click', clicHorsCalendrier), 0);
}
function dessinerCalendrier(){
  const c = calendrier; if (!c) return;
  const m = c.input.closest('.spec').querySelector('.calendrier'), o = cible(c.input.dataset.o);
  const choisi = o[c.input.dataset.k] || '', borne = c.input.dataset.autre ? o[c.input.dataset.autre] || '' : '';
  const [d1, d2] = [choisi, borne].filter(Boolean).sort();
  const y = c.mois.getFullYear(), mo = c.mois.getMonth(), auj = isoDate(new Date());
  const decal = (new Date(y, mo, 1).getDay() + 6) % 7;      // lundi en tete
  let jours = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(y, mo, 1 - decal + i), iso = isoDate(d);
    const cls = ['j', d.getMonth() !== mo && 'hors', iso === auj && 'auj', iso === choisi && 'on', iso === borne && 'borne',
                 d1 && d2 && iso > d1 && iso < d2 && 'entre'].filter(Boolean).join(' ');
    jours += `<button type="button" class="${cls}" data-d="${iso}" onclick="choisirDate('${iso}')">${d.getDate()}</button>`;
  }
  m.innerHTML = `<div class="ctete">
      <button type="button" class="ico" onclick="bougerMois(-1)" aria-label="Mois précédent">${CHEVRON(-1)}</button>
      <b>${MOIS[mo].charAt(0).toUpperCase() + MOIS[mo].slice(1)} ${y}</b>
      <button type="button" class="ico" onclick="bougerMois(1)" aria-label="Mois suivant">${CHEVRON(1)}</button></div>
    <div class="cjours">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span>${x}</span>`).join('')}${jours}</div>
    <div class="cpied"><button type="button" onclick="choisirDate('${auj}')">Aujourd’hui</button>
      <button type="button" onclick="choisirDate('')">Effacer</button></div>`;
}
function bougerMois(n){
  if (!calendrier) return;
  calendrier.mois = new Date(calendrier.mois.getFullYear(), calendrier.mois.getMonth() + n, 1);
  dessinerCalendrier();
}
function choisirDate(iso){
  const c = calendrier; if (!c) return;
  patch(kindDe(c.input.dataset.o), c.input.dataset.o, { [c.input.dataset.k]: iso });
  c.input.value = dateFr(iso);
  fermerCalendrier();
}
function fermerCalendrier(){
  if (!calendrier) return false;
  const sp = calendrier.input.closest('.spec'), m = sp && sp.querySelector('.calendrier');
  if (m) m.remove();
  calendrier = null;
  document.removeEventListener('click', clicHorsCalendrier);
  return true;
}
function clicHorsCalendrier(e){
  if (!e.target.isConnected) return;
  if (!e.target.closest('.calendrier') && !e.target.closest('.spec input[readonly]') && !e.target.closest('.deroul')) fermerCalendrier();
}

/* toutes les trente secondes : si un creneau est la, chaque appareil tente une fois ;
   le serveur ne laisse passer que le premier. Rien de neuf depuis le dernier envoi : rien ne part. */
function verifierEnvoiAuto(d){
  if (!RESEAU.possible || !DB.prod) return;
  const cr = creneauMail(d);
  if (!cr || verifierEnvoiAuto.fait === cr) return;
  verifierEnvoiAuto.fait = cr;
  if (empreinteMail() === DB.prod.mailEmpreinte) return;
  return envoyerJournalMail(true, cr);
}
setInterval(() => verifierEnvoiAuto(), 30000);

}

function download(name, content, mime){
  const b = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Fichier exporté');
}

function fname(sfx, ext){
  const p = DB.prod;
  // "4 / 7" doit donner J4 et non J47 : on ne garde que le premier nombre

         .filter(Boolean).join('_').replace(/[^\w.-]+/g, '-') + '.' + ext;
}

        t.clip, t.cam, t.camModel, t.carte, t.tcIn, t.tcOut, t.duree, t.heure, t.meteo,
        t.focale, t.focaleStop, t.diaph, t.focusStart, t.focusStop, t.hauteurStart, t.hauteurStop, t.mesureDepuis,
        t.panStart, t.panStop, t.tiltStart, t.tiltStop, t.rollStart, t.rollStop, t.mouvement, t.support,
        t.codec, t.reso, t.fps, t.shutter, t.ei, t.wb, t.nd, t.lut, t.objectif, t.filtre,
        t.sonRoll, t.sync, t.sonFile, t.notes,
        listeElements(p), p ? p.vfxDesc : '', p ? p.desc : '', p ? p.intExt : '', p ? p.momentJour : '',
        t.par];
    });
  } else {
    head = ['Jour','Séquence','Titre séquence','Plan','État','Description','Passages','Décor','Int/Ext','Moment','Météo','Acteurs','Figuration',
            'Cadrage','Mouvement','Support','Focale prévue','Durée','Tags','Assets du DT','Previz',
            'Éléments captés','Description VFX','Nb prises','Prises à monter','Note'];
    rows = DB.plans.map(p => {
      const pr = prisesDe(p.id);
      return [p.jour ? nomJour(p.jour) : '', p.seq, p.seqTitre, p.plan, ETATS[p.etat], p.desc, p.passages || '', p.lieu,
        p.intExt, p.momentJour, p.meteo, (p.acteurs || []).join(', '), p.figu ? 'oui' : '', p.cadrage, p.mouv, p.support, p.focale, p.duree, (p.tags || []).join(' '), p.assets,
        p.previz === false ? 'non' : 'oui', listeElements(p), p.vfxDesc, pr.length,
        pr.filter(t => t.retenue).map(t => t.clip || 'prise ' + t.n).join(' | '),
        p.notesClient];
    });
  }
  if (!rows.length) return toast(kind === 'montage' ? 'Aucune prise marquée à monter' : 'Rien à exporter');
  download(fname(kind, 'csv'),
    String.fromCharCode(0xFEFF) + [head].concat(rows).map(r => r.map(cell).join(';')).join('\r\n'),
    'text/csv;charset=utf-8');
}

/* ALE : liste de clips lisible par Avid et Resolve.
   Trois sections separees par une ligne vide, colonnes separees par des tabulations. */
function exportALE(){
  const src = DB.prises.filter(t => t.clip);
  if (!src.length) return toast('Aucune prise avec un nom de clip');
  // la cadence la plus courante des clips, 25 a defaut
  const fps = (frequences(src.map(t => t.fps))[0] || ['25'])[0];
  const cols = ['Name','Tape','Source File','Start','End','Scene','Take','Camera','Camroll','Soundroll',
                'Lens','Focal Length','Iris','ISO','Shutter','White Balance','LUT','VFX Elements','Comments'];
  const lignes = src.map(t => {
    const p = plan(t.planId);
    return [t.clip, t.carte, t.clip, t.tcIn, t.tcOut, (t.seq || '') + '/' + (t.plan || ''), t.n, t.cam, t.carte, t.sonRoll,
      t.objectif, t.focale, t.diaph, t.ei, t.shutter, t.wb, t.lut, listeElements(p),
      [t.retenue ? 'A MONTER' : '', t.statut, t.notes].filter(Boolean).join(' - ')
    ].map(plat).join('\t');
  });
  const ale = ['Heading', 'FIELD_DELIM\tTABS', 'VIDEO_FORMAT\tCUSTOM', 'AUDIO_FORMAT\t48kHz',
               'FPS\t' + plat(fps), '', 'Column', cols.join('\t'), '', 'Data'].concat(lignes).join('\r\n') + '\r\n';
  download(fname('montage', 'ale'), ale, 'text/plain;charset=utf-8');
}

function exportJSON(){ download(fname('rapport', 'json'), JSON.stringify(DB, null, 2), 'application/json'); }

function importJSON(input){
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    input.value = '';
    let d;
    try{ d = JSON.parse(r.result); if (!d.plans) throw 0; }
    catch(e){ prevenir('Fichier illisible ou format incorrect.'); return; }
    confirmer('Remplacer le projet actuel par le fichier importé' + (RESEAU.possible ? ', pour tous les appareils' : '') + ' ?',
              { ok:'Remplacer', danger:true }).then(oui => {
      if (!oui) return;
      DB = normaliser(d);
      dernierPlan = null; chrono = null;
      if (fJour !== '*' && joursConnus().indexOf(fJour) < 0){ fJour = '*'; UI.jour = '*'; ecrireUI(); }
      operer({ op:'remplacer', db: DB });
      flush(); closeSheet(); toast('Projet importé');
    });
  };
  r.readAsText(f);
}

/* Remet a jour le decoupage sans toucher au travail du plateau. */
function resync(){
  if (!SEED) return toast('Découpage introuvable');
  confirmer('Recharger le découpage technique' + (RESEAU.possible ? ' pour tous les appareils' : '') + ' ?',
            { detail:'Les prises, éléments, notes, états et jours sont conservés.', ok:'Recharger' }).then(oui => {
    if (!oui) return;
    let maj = 0, add = 0;
    for (const s of SEED.plans){
      // un plan ajoute sur le plateau n'a pas de ref : il ne doit jamais etre ecrase
      const ex = DB.plans.find(p => p.ref && p.ref === s.ref);
      if (ex){
        const garde = { id: ex.id, jour: ex.jour || s.jour, etat: ex.etat, elements: ex.elements,
                        elementsAutre: ex.elementsAutre, vfxDesc: ex.vfxDesc, intExt: ex.intExt, image: ex.image, croquis: ex.croquis,
                        momentJour: ex.momentJour, meteo: ex.meteo, acteurs: ex.acteurs, figu: ex.figu, notesClient: ex.notesClient, notesInternes: ex.notesInternes };
        Object.assign(ex, s, garde); propagerLocal(ex); maj++;
      } else { DB.plans.push(Object.assign({ id: uid() }, PLAN_NEUF(), s)); add++; }
    }
    operer({ op:'remplacer', db: DB });
    flush(); renderAll(); toast(maj + ' plans mis à jour, ' + add + ' ajoutés');
  });
}

function wipe(){
  confirmer('Effacer tout le projet, prises comprises' + (RESEAU.possible ? ', pour tous les appareils' : '') + ' ?',
            { detail:'Exportez une sauvegarde JSON avant si besoin.', ok:'Tout effacer', danger:true }).then(oui => {
    if (!oui) return;
    DB = normaliser(null);
    if (SEED) seed(DB);
    fJour = '*'; UI.jour = '*'; ecrireUI(); fEtat = ''; fCrit = {}; fQui = ''; dernierPlan = null; chrono = null;
    operer({ op:'remplacer', db: DB });
    flush(); closeSheet(); toast('Projet réinitialisé');
  });
}

/* ------------------------------------------------- Reprendre sa place */

/* Recharger la page ne doit pas ramener en haut, fiche fermee : sur le plateau
   on recharge pour prendre une mise a jour, et on veut retrouver le plan qu'on
   avait sous les yeux. L'onglet, le jour du rapport, la fiche ouverte, la ligne
   ouverte dedans et les deux defilements sont notes a chaque mouvement et au
   moment de quitter, dans la session de l'onglet : un nouvel onglet part
   propre. Le jour du tournage, lui, est deja garde dans les preferences. */
const CLE_PLACE = 'fstdw.place';
let tPlace = null;
function noterPlace(){
  const sb = $('sbody');
  const place = { view, jr: fJourR, openType, openId, champ: champOuvert,
                  y: window.scrollY, ys: sb ? sb.scrollTop : 0 };
  try{ sessionStorage.setItem(CLE_PLACE, JSON.stringify(place)); }catch(e){}
}
function noterPlaceBientot(){ clearTimeout(tPlace); tPlace = setTimeout(noterPlace, 150); }
window.addEventListener('scroll', noterPlaceBientot, { passive:true });
$('sbody').addEventListener('scroll', noterPlaceBientot, { passive:true });
window.addEventListener('pagehide', noterPlace);
document.addEventListener('visibilitychange', () => { if (document.hidden) noterPlace(); });

/* Une image qui se charge encore rend la page, ou la fiche, plus courte que la
   position visee : posee trop tot, elle serait rognee. On la repose a chaque
   image d'ecran tant qu'elle n'est pas atteinte, pendant deux secondes au plus.
   On s'arrete des qu'elle l'est : on ne se bat pas avec le doigt de l'usager. */
function remettreDefilement(el, y){
  if (!y) return;
  const boite = el === window ? document.scrollingElement : el;
  const poser = () => { if (el === window) window.scrollTo(0, y); else el.scrollTop = y; };
  let n = 120;
  const encore = () => {
    poser();
    if (Math.abs(boite.scrollTop - y) <= 1 || --n <= 0) return;
    requestAnimationFrame(encore);
  };
  encore();
}

function reprendrePlace(){
  let place = null;
  try{ place = JSON.parse(sessionStorage.getItem(CLE_PLACE) || 'null'); }catch(e){}
  if (!place) return;
  if (place.jr && place.jr !== '*' && joursConnus().indexOf(place.jr) >= 0) fJourR = place.jr;
  if (place.view && place.view !== view){
    const b = document.querySelector(`nav button[data-v="${place.view}"]`);
    if (b) b.click();
  }
  // la fiche, si ce qu'elle montrait existe encore ; y != null garde la ligne ouverte telle quelle
  if (place.openType === 'plan' && plan(place.openId)){
    champOuvert = place.champ || ''; openPlan(place.openId, place.ys || 0);
    remettreDefilement($('sbody'), place.ys);
  } else if (place.openType === 'prise' && prise(place.openId)){
    champOuvert = place.champ || ''; openPrise(place.openId, place.ys || 0);
    remettreDefilement($('sbody'), place.ys);
  }
  remettreDefilement(window, place.y);
}

/* Le logo ramene en haut de la page Tournage, d'ou que l'on vienne. */
function accueil(){
  if (openType) closeSheet();
  if (view !== 'shoot') document.querySelector('nav button[data-v="shoot"]').click();
  window.scrollTo({ top:0, behavior:'smooth' });
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  // le menu reste atteignable une fiche ouverte : on la referme d abord
  if (openType) closeSheet();
  view = b.dataset.v;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.hidden = (v.id !== 'v-' + view));
  renderList();
  majFab();
  window.scrollTo(0, 0);
});

document.addEventListener('keydown', e => {
  if (DLG.resoudre) return;   // une boite de dialogue a la main
  // les fleches : d'un jour a l'autre sur la liste, d'une fiche a l'autre quand une est ouverte
  const sens = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
  if (sens && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '')){
    if (!openType && view !== 'prep' && $('voile-nom').hidden) jourVoisin(sens, view === 'report' ? 'report' : 'shoot');
    else if (openType === 'prise' || openType === 'plan') (openType === 'plan' ? voisinPlan : voisinePrise)(sens);
    return;
  }
  if (e.key !== 'Escape') return;
  if (dessin){ fermerCroquis(true); return; }
  if (fermerCalendrier()) return;
  if (fermerMenu()) return;
  if (fermerFiltres()) return;
  const vp = $('voile-photo');
  if (!vp.hidden){ vp.hidden = true; return; }
  if (openType) closeSheet();
});

/* En arriere-plan, le telephone peut couper les requetes en cours :
   sendBeacon part quand meme. Les doublons eventuels sont sans effet. */
function envoyerBalise(){
  viderTampon();
  if (!RESEAU.possible || !RESEAU.attente.length || !navigator.sendBeacon) return;
  try{
    navigator.sendBeacon('/api/ops', new Blob([corpsOps(RESEAU.attente)], { type:'application/json' }));
  }catch(e){}
}
window.addEventListener('pagehide', () => { flush(); envoyerBalise(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ flush(); envoyerBalise(); }
  else if (RESEAU.possible && RESEAU.src && RESEAU.src.readyState === 2) connecter();
});

/* La rangee des jours : deux fleches autour des onglets, et sur la page Tournage
   le bouton des filtres. Les deux pages ont la meme rangee, elle n'est donc ecrite
   qu'une fois. `cadrerJour` eteint les fleches aux bouts en lisant les voisins de
   la rangee dans la page : leur ordre ici compte. */
const BTN_FILTRES = `<button type="button" class="filtres" id="btn-filtres" onclick="ouvrirFiltres()" aria-label="Filtres"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Filtres</span><b hidden></b></button>`;
function htmlJours(page, id, avecFiltres){
  const f = (sens, nom) => `<button class="fleche" onclick="jourVoisin(${sens}, '${page}')" aria-label="${nom}">${CHEVRON(sens)}</button>`;
  return `<div class="jours">${f(-1, 'Jour précédent')}<div class="chips" id="${id}"></div>${f(1, 'Jour suivant')}` +
         (avecFiltres ? BTN_FILTRES : '') + `</div>`;
}
function barresJours(){
  $('fbar-shoot').insertAdjacentHTML('afterbegin', htmlJours('shoot', 'c-jour', true));
  $('fbar-report').innerHTML = htmlJours('report', 'c-jourr', false);
}

/* La rangee des jours colle sous la barre haute : sa hauteur depend de
   l'encoche du telephone et de la taille du titre, on la mesure. */
function majHauteurBarre(){
  const t = document.querySelector('.top');
  if (t) document.documentElement.style.setProperty('--toph',
    (getComputedStyle(t).position === 'fixed' ? 0 : Math.round(t.getBoundingClientRect().height)) + 'px');
}
window.addEventListener('resize', majHauteurBarre);
window.addEventListener('orientationchange', () => setTimeout(majHauteurBarre, 200));

barresJours();
appliquerTheme();
majHauteurBarre();
renderAll();
reprendrePlace();
majPresence();
if (RESEAU.possible) connecter();
if (!UI.nom) demanderNom();
