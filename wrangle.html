  croix:    ICO('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>', 18, 1.9),
  // le plan du decor : une carte pliee en trois
  decor:    ICO('<path d="M9 4.5L3.5 6.6v12.9L9 17.4l6 2.1 5.5-2.1V4.5L15 6.6z"/><path d="M9 4.5v12.9M15 6.6v12.9"/>', 18, 1.9),
  corbeille:ICO('<path d="M4.5 7h15M9.5 7V4.8h5V7M6.8 7l.9 12.2h8.6L17.2 7M10 11v5M14 11v5"/>', 18, 1.9)
};
const CRITERES = [
  ['keep',   'À monter',         (p, pr) => pr.some(t => t.retenue), ICONES.etoile],
  ['elem',   'Éléments captés',  p => aElements(p), ICONES.elements],
  ['manque', 'À compléter',      (p, pr) => (p.etat === 'done' && !pr.length) || pr.some(priseIncomplete), ICONES.alerte]
];

/* La pastille active reste visible : on ouvre souvent la page sur le jour 5
   alors que la rangee commence au jour 1. On ne recadre qu'au changement,
   pour ne pas ramener la rangee sous les doigts de celui qui la parcourt. */
let cadreFait = null;
function cadrerJour(id, actif){
  const row = $(id);
  if (!row) return;
  const ids = ordreJours(), i = ids.indexOf(actif);
  if (row.previousElementSibling) row.previousElementSibling.disabled = i <= 0;
  if (row.nextElementSibling) row.nextElementSibling.disabled = i >= ids.length - 1;
  if (!row.clientWidth) return;               // vue masquee : on recadrera a l'ouverture
  const cle = id + '|' + actif;
  if (cadreFait === cle) return;
  const el = row.querySelector('.chip.on'); if (!el) return;
  cadreFait = cle;
  row.scrollLeft = Math.max(0, el.offsetLeft - (row.clientWidth - el.offsetWidth) / 2);
  bordsChips(row);
}

/* Le degrade de bord dit « la rangee continue par la ». Pose des deux cotes
   en dur, il rongeait le premier onglet alors qu on etait deja au debut : on
   lisait « ut » au lieu de « Tout ». Il ne se met donc que du cote ou il reste
   des jours a atteindre. */
function bordsChips(row){
  if (!row) return;
  const reste = row.scrollWidth - row.clientWidth;
  row.classList.toggle('bord-g', row.scrollLeft > 2);
  row.classList.toggle('bord-d', row.scrollLeft < reste - 2);
}
document.addEventListener('scroll', e => {
  if (e.target instanceof Element && e.target.classList.contains('chips')) bordsChips(e.target);
}, true);
window.addEventListener('resize', () => document.querySelectorAll('.chips').forEach(bordsChips));

/* Une pastille par jour : son libelle, son compte, un point d'or si c'est le
   jour du tournage et un trait d'avancement en pied. `info` decrit ce que
   compte la page qui appelle (plans ici, prises dans le rapport). */
function chipsJours(actif, fn, info){
  const auj = jourDuTournage();
  const un = (j, label) => {
    const d = info(j) || {};
    const fini = d.total > 0 && d.fait === d.total;
    return `<button class="chip${actif === j ? ' on' : ''}${fini ? ' fini' : ''}${d.vide ? ' vide' : ''}"
      onclick="${fn}('${esc(j)}')"${d.titre ? ` title="${esc(d.titre)}"` : ''}>${
      j !== '*' && j === auj ? '<u></u>' : ''}${label}</button>`;
  };
  // le nom du jour seul : les comptes et l'avancement sont dans la ligne de
  // filtres et dans l'en-tete de chaque journee
  return un('*', 'Tout') + joursConnus().map(j => un(j, nomJour(j))).join('');
}

function renderShoot(){
  /* La page Tournage n'a plus de champ de recherche : la liste se parcourt par
     jour et par filtre. Le tri par mot reste ecrit ici, inerte, pour le jour ou
     on le rebranchera sur une loupe dans la barre. */
  const ch = $('q');
  const q = ch ? ch.value.toLowerCase().trim() : '';

  /* La recherche porte sur le plan, sa sequence et toutes ses prises. */
  const corr = p => {
    if (!q) return true;
    return [p.plan, p.desc, p.lieu, p.cadrage, p.mouv, p.assets, p.vfxDesc, p.seqTitre, p.seq, p.jour]
      .concat(p.tags || [], prisesDe(p.id).map(t => [t.clip, t.carte, t.cam, t.notes, t.tcIn, t.par].join(' ')))
      .join(' ').toLowerCase().indexOf(q) >= 0;
  };
  const trouves = q ? DB.plans.filter(corr) : DB.plans;

  /* Les jours affichent leur avancement, et le nombre de resultats des qu'une
     recherche est en cours : on voit ou chercher sans changer de jour. */
  $('c-jour').innerHTML = chipsJours(fJour, 'setJour', j => {
    const a = avancement(j);
    if (q){
      const n = j === '*' ? trouves.length : trouves.filter(p => (p.jour || '') === j).length;
      return { txt: n, vide: !n, titre: n + ' plan' + plur(n) + ' trouvé' + plur(n) };
    }
    const d = j === '*' ? '' : (j === 'CG' ? 'Full CG' : decorJour(j));
    return { txt: a.fait + '/' + a.total, fait: a.fait, total: a.total,
             titre: [j === '*' ? 'Tout le tournage' : nomJour(j), d].filter(Boolean).join(' · ') };
  });
  cadrerJour('c-jour', fJour);

  /* Les comptes des filtres se lisent dans le jour affiche et la recherche en
     cours, sans tenir compte des autres filtres : « À monter 3 » veut dire
     trois plans a monter ce jour-la, quoi qu'on ait coche par ailleurs. */
  const base = trouves.filter(p => fJour === '*' || (p.jour || '') === fJour);
  const nb = f => base.filter(p => f(p, prisesDe(p.id))).length;

  /* Qui a saisi : on ne propose que les prenoms qu'on trouve vraiment dans
     les prises du jour affiche. Trois personnes sur le plateau, trois
     boutons. Celui qui est coche reste propose meme s'il n'a rien saisi
     ici, sinon on ne pourrait plus le decocher. */
  const gens = [];
  base.forEach(p => prisesDe(p.id).forEach(t => {
    const n = quiDe(t);
    if (n && gens.indexOf(n) < 0) gens.push(n);
  }));
  gens.sort((a, b) => a.localeCompare(b, 'fr'));
  if (fQui && gens.indexOf(fQui) < 0) gens.push(fQui);

  const etats = [['todo', 'À tourner', p => p.etat === 'todo'],
                 ['done', 'Tournés',   p => p.etat === 'done']];
  if (DB.plans.some(p => p.etat === 'drop')) etats.push(['drop', 'Abandonnés', p => p.etat === 'drop']);

  let rows = base.filter(p => {
    if (fEtat && p.etat !== fEtat) return false;
    const pr = prisesDe(p.id);
    if (fQui && !pr.some(t => quiDe(t) === fQui)) return false;
    return CRITERES.every(c => !fCrit[c[0]] || c[2](p, pr));
  });

  const enCours = fEtat || fQui || CRITERES.some(c => fCrit[c[0]]) || q;
  const seg = (k, label, n, on) => {
    const off = !n && !on;
    return `<button type="button" class="${on ? 'on' : ''}${off ? ' off' : ''}"${off ? ' disabled' : ''} onclick="setEtatF('${k}')">${label}<b>${n}</b></button>`;
  };
  $('c-filtre').innerHTML =
    `<div class="ptete"><div><b>Filtres</b><span>${fJour === '*' ? 'Tout le tournage' : nomJour(fJour)}</span></div>` +
      `${enCours ? '<button type="button" class="raz" onclick="razFiltres()">Effacer</button>' : ''}</div>` +
    `<h4>État</h4><div class="segm">` +
      seg('', 'Tous', base.length, !fEtat) +
      etats.map(e => seg(e[0], e[1], nb(e[2]), fEtat === e[0])).join('') +
    `</div>` +
    // une seule personne a saisi : le filtre ne trierait rien, on l'omet
    (gens.length > 1 ? `<h4>Saisie par</h4><div class="gens">` +
      gens.map(n => {
        const on = fQui === n;
        // le prenom traverse une chaine JS puis un attribut HTML
        const arg = esc(n.replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        return `<button type="button" class="${on ? 'on' : ''}" onclick="setQui('${arg}')">` +
               `${esc(n)}<b>${nb((p, pr) => pr.some(t => quiDe(t) === n))}</b></button>`;
      }).join('') + `</div>` : '') +
    `<h4>Marqueurs</h4><div class="marq">` +
      CRITERES.map(c => { const n = nb(c[2]), on = !!fCrit[c[0]], off = !n && !on;
        return `<button type="button" class="${on ? 'on' : ''}${off ? ' off' : ''}"${off ? ' disabled' : ''} onclick="basculerCritere('${c[0]}')">` +
               `<i>${c[3]}</i><span>${c[1]}</span><b>${n}</b><u></u></button>`; }).join('') +
    `</div>` +
    `<button type="button" class="btn p voir" onclick="fermerFiltres()">Voir ${rows.length === 1 ? 'le plan' : 'les ' + rows.length + ' plans'}</button>`;
  // le bouton de la rangee porte le nombre de filtres poses
  const actifs = (fEtat ? 1 : 0) + (fQui ? 1 : 0) + CRITERES.filter(c => fCrit[c[0]]).length;
  const bf = $('btn-filtres');
  if (bf){ bf.classList.toggle('on', actifs > 0); const b = bf.querySelector('b'); b.textContent = actifs || ''; b.hidden = !actifs; }

  rows = trierPlans(rows, fJour === '*');

  /* L'entete de journee est toujours la, meme sur un seul jour : elle rappelle
     le decor et l'avancement, que la pastille seule ne dit pas. */
  let html = '', lastJour = null, lastSeq = null;
  for (const p of rows){
    const j = p.jour || '';
    if (j !== lastJour){
      lastJour = j; lastSeq = null;
      const a = avancement(j);
      html += `<div class="jour"><b>${nomJour(j)}</b>
        <span>${esc(j === 'CG' ? 'Full CG' : decorJour(j))}</span>
        <i>${a.fait}/${a.total}</i></div>`;
    }
    const sk = p.seq + '|' + (p.seqTitre || '');
    if (sk !== lastSeq){
      lastSeq = sk;
      html += `<div class="seq">Séquence ${esc(p.seq)} <em>${esc(p.seqTitre || '')}</em></div>`;
    }
    html += blocPlan(p, !!fCrit.keep, fQui);
  }

  /* Chercher un clip du jour 5 depuis le jour 1 ne doit pas finir sur une
     page vide : on dit combien il y en a ailleurs et on y va d'un geste. */
  const ailleurs = q && fJour !== '*' ? trouves.filter(p => (p.jour || '') !== fJour).length : 0;
  const passerelle = ailleurs
    ? `<div class="ailleurs"><span>${ailleurs} ${ailleurs > 1 ? 'autres plans trouvés' : 'autre plan trouvé'}
         dans les autres jours</span>
       <button class="btn sm" onclick="setJour('*')">Voir tout le tournage</button></div>`
    : '';

  const vide = `<div class="empty">${
    !DB.plans.length ? 'Aucun plan chargé.'
    : ailleurs ? 'Rien ne correspond dans ' + esc(nomJour(fJour)) + '.'
    : enCours ? 'Aucun plan ne correspond.<br><button class="btn sm" style="margin-top:14px" onclick="razFiltres()">Tout afficher</button>'
    : 'Aucun plan ce jour-là.'}</div>`;

  memoDefilPrises('#l-shoot');
  $('l-shoot').innerHTML =
    (rows.length ? html : vide) + passerelle +
    `<button class="addplan" onclick="nouveauPlan()">+ Plan hors découpage</button>`;
  calerPrises('#l-shoot');

  majMarqueurs();
  majFab();
}

/* Au-dela de cinq prises, la liste d'un plan defile dans sa propre fenetre,
   haute de cinq lignes tout rond (la feuille de style s'en charge : toutes
   les prises font la meme hauteur). Un redessin remplace la liste : on remet
   chacune ou elle etait. 'fin' : on regardait les dernieres prises, on y
   reste quand il en arrive une d'un autre appareil. Meme chose dans la fiche
   du plan (racine '#fiche-prises'), qui garde sa propre position. */
const defilPrises = {};
const cleDefil = b => b.parentNode.dataset.id || 'fiche:' + openId;
function memoDefilPrises(racine){
  document.querySelectorAll(racine + ' .prises.defile').forEach(b => {
    if (!b.clientHeight) return;   // vue masquee : rien a retenir
    const fin = b.scrollTop > 0 && b.scrollTop + b.clientHeight >= b.scrollHeight - 2;
    defilPrises[cleDefil(b)] = fin ? 'fin' : b.scrollTop;
  });
}
function calerPrises(racine){
  document.querySelectorAll(racine + ' .prises.defile').forEach(b => {
    const y = defilPrises[cleDefil(b)];
    b.scrollTop = y === 'fin' ? b.scrollHeight : y || 0;
  });
}

function blocPlan(p, seulementRetenues, qui){
  const th = imagePlan(p);
  let pr = prisesDe(p.id);
  const total = pr.length;
  if (seulementRetenues) pr = pr.filter(t => t.retenue);
  if (qui) pr = pr.filter(t => quiDe(t) === qui);
  const el = lisElements(p);

  /* Le contexte du plan, en clair : decor, cadrage, mouvement, focale, duree. */
  const ctx = [
    p.lieu && `<span><b>${esc(p.lieu)}</b></span>`,
    p.cadrage && `<span>${esc(p.cadrage)}</span>`,
    p.mouv && `<span>${esc(p.mouv)}</span>`,
    p.support && `<span>${esc(p.support)}</span>`,
    (p.acteurs || []).length && `<span>${esc(p.acteurs.join(', '))}</span>`,
    p.figu && `<span>Figuration</span>`,
    p.focale && `<span>${esc(p.focale)}</span>`,
    p.duree && `<span>${esc(p.duree)}</span>`,
    p.intExt && `<span>${esc(p.intExt)}</span>`,
    p.momentJour && `<span>${esc(p.momentJour)}</span>`
  ].filter(Boolean).join('');

  return `<div class="plan ${p.etat === 'done' ? 'done' : p.etat === 'drop' ? 'drop' : ''}" data-id="${p.id}">
    <div class="phead" onclick="openPlan('${p.id}')">
      ${vigPlan(p)}
      <div class="pmain">
        <div class="pnum">${p.plan ? esc(p.plan) : 'sans n°'}${
          `<span class="ptags">${htmlPtags(p)}</span>`}
          <button type="button" class="viser${(planVise() || {}).id === p.id ? ' on' : ''}" data-vise="${p.id}"
            onclick="event.stopPropagation();viser('${p.id}')"
            title="Tourner ce plan : le Moteur et + Prise enregistrent dessus" aria-label="Tourner ce plan">${ICO_VISER}<span>Moteur</span></button></div>
        ${p.desc ? `<div class="pdesc">${esc(p.desc)}</div>` : ''}
        ${ctx ? `<div class="pctx">${ctx}</div>` : ''}
        ${el ? `<div class="pelem">${el}</div>` : ''}
      </div>
    </div>
    ${htmlPrises(pr)}
    <button class="addtake" onclick="ajouterPrise('${p.id}')">+ Prise ${total + 1}</button>
  </div>`;
}

function ligne(t, sansActions){
  const map = fleche(t.focusStart, t.focusStop), haut = fleche(t.hauteurStart, t.hauteurStop);
  const ptr = [fleche(t.panStart, t.panStop), fleche(t.tiltStart, t.tiltStop), fleche(t.rollStart, t.rollStop)].filter(Boolean).join(' / ');
  const enCours = chrono && chrono.priseId === t.id;
  const meta = [
    t.cam && `<span>${esc(t.cam)}</span>`,
    t.carte && `<span>${esc(t.carte)}</span>`,
    t.focale && `<span>${esc(fleche(t.focale, t.focaleStop))}</span>`,
    t.diaph && `<span>${esc(t.diaph)}</span>`,
    t.fps && `<span>${esc(t.fps)}&#8239;i/s</span>`,
    t.tcIn && `<span>${esc(t.tcIn)}</span>`,
    t.heure && `<span>${esc(t.heure)}</span>`,
    enCours ? `<span style="color:var(--ng);font-weight:700">&#9679; ça tourne</span>` : t.duree && `<span>${esc(t.duree)}</span>`,
    t.par && `<span>${esc(t.par)}</span>`
  ].filter(Boolean).join('');
  const rel = [
    map && `<span><b>Map</b> ${esc(map)}</span>`,
    haut && `<span><b>Haut.</b> ${esc(haut)}</span>`,
    ptr && `<span><b>P/T/R</b> ${esc(ptr)}</span>`
  ].filter(Boolean).join('');

  return `<div class="prise ${t.statut === 'OK' ? 'ok' : t.statut === 'NG' ? 'ng' : ''}"
    data-id="${t.id}" onclick="openPrise('${t.id}')">
    <div class="tn">${t.n}</div>
    <div class="tbody">
      <div class="trow">
        <span class="clip${t.clip ? '' : ' vide'}">${esc(t.clip || 'clip à renseigner')}</span>
        ${t.notes ? `<span class="tnote" title="${esc(t.notes)}">${esc(t.notes)}</span>` : ''}
        ${t.statut && t.statut !== 'OK' && t.statut !== 'NG'
          ? `<span class="tstat">${esc(t.statut)}</span>` : ''}
      </div>
      ${meta || rel ? `<div class="tmeta">${meta}${rel}</div>` : ''}
    </div>
    ${sansActions ? '' : `<div class="tact" onclick="event.stopPropagation()">
      <button class="kp ${t.retenue ? 'on' : ''}" onclick="basculerEtoile('${t.id}')"
        title="Prise à monter" aria-label="Prise à monter">${ICONES.etoile}</button>
      <button class="ok ${t.statut === 'OK' ? 'on' : ''}" onclick="marquer('${t.id}','OK')" title="Bonne" aria-label="Bonne">${ICONES.coche}</button>
      <button class="ng ${t.statut === 'NG' ? 'on' : ''}" onclick="marquer('${t.id}','NG')" title="Mauvaise" aria-label="Mauvaise">${ICONES.croix}</button>
    </div>`}
  </div>`;
}

/* Marquer, depuis la liste comme depuis la fiche, sans bouger la page. */
function marquer(id, s){
  const t = prise(id); if (!t) return;
  const d = { statut: t.statut === s ? '' : s };
  // premiere bonne prise du plan : on la retient d'office, quitte a changer ensuite
  if (d.statut === 'OK' && !t.retenue && !prisesDe(t.planId).some(x => x.retenue)) d.retenue = true;
  patch('prise', id, d);
  rafraichirDoux();
}

function basculerEtoile(id){
  const t = prise(id); if (!t) return;
  patch('prise', id, { retenue: !t.retenue });
  rafraichirDoux();
  toast(t.retenue ? 'Prise ' + t.n + ' retenue pour le montage' : 'Prise ' + t.n + ' retirée du montage');
}

/* Redessine sans rien faire bouger : ni la page, ni la fiche ouverte,
   ni le champ en cours de frappe. C'est aussi ce qui se passe quand une
   modification arrive d'un autre appareil. */
function rafraichirDoux(){
  const y = window.scrollY;
  const sb = $('sbody');
  const ys = openType ? sb.scrollTop : 0;
  if (openType && openType !== 'picker' && openType !== 'prod' && !cible(openId)){
    closeSheet();
    toast('Cette fiche a été supprimée sur un autre appareil');
  } else {
    renderList(); majFicheEnPlace();
  }
  window.scrollTo(0, y);
  if (openType) sb.scrollTop = ys;
}

/* Quand un autre appareil tape, ses modifications arrivent par paquets toutes
   les 250 ms : on ne redessine pas plus d'une fois toutes les 400 ms. */
let tDoux = null;
function rafraichirDouxBientot(){
  if (tDoux) return;
  tDoux = setTimeout(() => { tDoux = null; rafraichirDoux(); }, 400);
}

/* Met la fiche ouverte au niveau du projet sans la reconstruire :
   chaque champ non focalise reprend la valeur courante, les boutons suivent. */
function majFicheEnPlace(){
  if (!openType || openType === 'picker') return;
  document.querySelectorAll('#sbody [data-o][data-k]').forEach(el => {
    if (el === document.activeElement) return;
    const c = cible(el.dataset.o); if (!c) return;
    const v = c[el.dataset.k];
    if (el.type === 'checkbox'){ el.checked = !!v; return; }
    const s = v == null ? '' : String(v);
    if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === s)) el.add(new Option(s, s));
    if (el.value !== s){ el.value = s; if (el.classList.contains('auto')) autoHauteur(el); }
  });
  if (openType === 'prise'){
    const t = prise(openId);
    $('stitle').textContent = 'Plan ' + (t.plan || '?') + ' · prise ' + t.n;
    majBoutonsPrise(); majChronoFiche();
  }
  if (openType === 'plan'){ majBoutonsPlan(); majPrisesFiche(); }
  // les lignes de choix suivent aussi, sauf si l'on est en train d'y taper une valeur
  const a = document.activeElement;
  if (!(a && a.tagName === 'INPUT' && a.closest('.tuile-saisie'))) majChamps();
}

/* Le bouton flottant : Moteur pour ouvrir une prise et lancer le chrono,
   Coupez pour l'arreter et noter la duree. Le petit bouton ajoute une prise
   sans chrono, pour ceux qui notent apres coup. */
function majFab(){
  const f = $('fab'), f2 = $('fab2'), f3 = $('fab3');
  [f, f2, f3].forEach(b => { b.hidden = view !== 'shoot'; });
  if (view !== 'shoot') return;
  const p = planVise();
  // le bouton est redessine deux fois par seconde pendant une prise : on ne
  // touche au DOM que si son texte change, sinon l'onde du bouton tressaute
  let cls, html;
  if (chrono){
    const t = prise(chrono.priseId);
    cls = 'fab rec';
    html = `&#9632; Coupez <em>${fmtChrono(Date.now() - chrono.debut)}${t ? ' · prise ' + t.n : ''}</em>`;
  } else {
    cls = 'fab';
    html = p ? `&#9679; Moteur <em>plan ${esc(p.plan || '?')} · prise ${prisesDe(p.id).length + 1}</em>` : `&#9679; Moteur`;
  }
  if (f.className !== cls) f.className = cls;
  if (f.dataset.html !== html){ f.dataset.html = html; f.innerHTML = html; }
  f2.textContent = p ? '+ Prise ' + (prisesDe(p.id).length + 1) : '+ Prise';
  majMoteurFiche();
  majVise();
}

/* --------------------------------------------------------------- Chrono */

const fmtDuree = s => s < 60 ? s + 's' : Math.floor(s / 60) + 'm' + deuxCh(s % 60) + 's';
const fmtChrono = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return deuxCh(Math.floor(s / 60)) + ':' + deuxCh(s % 60); };

/* Le plan vise : celui que le Moteur et + Prise vont tourner. L'anneau d'une
   carte le choisit, et ce choix passe avant tout : ouvrir ou ajouter une
   prise ailleurs ne le deplace pas. Sans choix, on suit le dernier plan
   touche. L'appareil se souvient du choix d'un chargement a l'autre. */
const ICO_VISER = ICO('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>', 14, 2);
function planVise(){
  return (UI.vise && plan(UI.vise)) || (dernierPlan && plan(dernierPlan)) || null;
}
/* toucher l'anneau du plan deja vise rend la main au suivi automatique */
function viser(id){
  if (!plan(id)) return;
  UI.vise = UI.vise === id ? null : id; ecrireUI();
  majFab();
}
function majVise(){
  const v = planVise(), id = v ? v.id : null;
  document.querySelectorAll('.viser').forEach(b => b.classList.toggle('on', b.dataset.vise === id));
}

function fabAction(){ if (chrono) couper(); else moteur(); }
function moteur(){
  const p = planVise();
  if (!p){ choisirPlan(true); return; }
  moteurSur(p.id);
}
function moteurSur(planId){
  const t = ajouterPrise(planId, false, { heure: maintenant() });
  if (!t) return;
  chrono = { priseId: t.id, debut: Date.now() };
  majFab(); majChronoFiche(); rafraichirDoux();
}
function couper(){
  if (!chrono) return;
  const t = prise(chrono.priseId);
  const s = Math.max(1, Math.round((Date.now() - chrono.debut) / 1000));
  chrono = null;
  if (t){ patch('prise', t.id, { duree: fmtDuree(s) }); toast('Coupez — prise ' + t.n + ', ' + fmtDuree(s)); }
  rafraichirDoux();
}
setInterval(() => { if (chrono){ majFab(); majChronoFiche(); } }, 500);

/* La ligne Coupez dans la fiche de la prise qui tourne : la feuille recouvre
   le bouton flottant sur un telephone. */
function majChronoFiche(){
  const r = $('rec-row'); if (!r) return;
  const t = prise(openId);
  if (chrono && t && chrono.priseId === t.id)
    r.innerHTML = `<button class="btn rec" onclick="couper()">&#9632; Coupez <em>${fmtChrono(Date.now() - chrono.debut)}</em></button>`;
  else if (chrono)
    r.innerHTML = '';
  else if (t && !t.duree)
    r.innerHTML = `<button class="btn w" onclick="chronoSur('${t.id}')">&#9679; Lancer le chrono</button>`;
  else r.innerHTML = '';
}
function chronoSur(id){
  const t = prise(id); if (!t || chrono) return;
  chrono = { priseId: id, debut: Date.now() };
  if (!t.heure) patch('prise', id, { heure: maintenant() });
  majFab(); majChronoFiche(); rafraichirDoux();
}

function renderList(){
  view === 'shoot' ? renderShoot() : view === 'prep' ? renderPrep() : renderReport();
}

function renderAll(){
  renderShoot(); renderReport(); renderPrep();
}

/* --------------------------------------------------------- Feuille prise */

function nouvellePrise(){
  const p = planVise();
  if (p) ajouterPrise(p.id); else choisirPlan(false);
}

/* Ajoute une prise. Par defaut elle apparait dans la liste sans ouvrir de
   fiche : sur le plateau on enchaine les prises, on les detaille apres.
   Le numero est provisoire : si un autre appareil ajoute une prise au meme
   plan au meme moment, le serveur tranche et le numero est corrige. */
function ajouterPrise(planId, ouvrir, extra){
  const p = plan(planId); if (!p) return null;
  const sœurs = prisesDe(planId);
  const modele = sœurs[sœurs.length - 1] || DB.prises[DB.prises.length - 1];
  const n = sœurs.reduce((m, x) => Math.max(m, x.n || 0), 0) + 1;
  // l'heure de la prise, c'est celle de sa creation ; le chrono ou un appel explicite peuvent la fixer autrement
  const t = Object.assign({ id: uid(), planId, seq: p.seq, plan: p.plan, jour: p.jour || '' },
                          NEUVE(), { n, par: UI.nom || '', heure: maintenant() }, extra || {});
  if (modele) HERITE.forEach(k => { if (modele[k]) t[k] = modele[k]; });
  else { if (p.focale) t.focale = p.focale; if (p.mouv) t.mouvement = p.mouv; if (p.meteo) t.meteo = p.meteo; }
  // le nom de clip suit la numerotation de la camera : AA005 puis AA006, sans rien taper
  if (!t.clip){ const s = clipSuivant(t); if (s) t.clip = s; }
  DB.prises.push(t);
  operer({ op:'add', kind:'prise', data: t });
  if (p.etat === 'todo') patch('plan', p.id, { etat:'done' });
  dernierPlan = planId;

  if (ouvrir){ renderAll(); openPrise(t.id); return t; }

  if (openType === 'picker') closeSheet();
  const y = window.scrollY;
  const ys = openType === 'plan' ? $('sbody').scrollTop : 0;
  renderAll();
  if (openType === 'plan'){ majPrisesFiche(); $('sbody').scrollTop = ys; }
  window.scrollTo(0, y);

  // on amene la nouvelle prise sous les yeux et on la signale
  // dans la liste comme dans la fiche, la fenetre des prises descend sur la nouvelle
  document.querySelectorAll('.prise[data-id="' + t.id + '"]').forEach(e => {
    const b = e.closest('.prises.defile'); if (b) b.scrollTop = b.scrollHeight;
  });
  const el = document.querySelector((openType === 'plan' ? '#sbody ' : '#l-shoot ') + '.prise[data-id="' + t.id + '"]');
  if (el){
    el.classList.add('neuve');
    const r = el.getBoundingClientRect();
    if (r.top < 90 || r.bottom > window.innerHeight - 150)
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  toast('Prise ' + t.n + ' — plan ' + (p.plan || 'sans n°'));
  return t;
}

/* Le nom du clip qui suit le dernier clip saisi : A001C003 devient A001C004.
   Une suggestion a verifier sur la camera, jamais remplie d'office. */
function clipSuivant(t){
  const autres = DB.prises.filter(x => x.id !== t.id && x.clip);
  const memeCam = t.cam ? autres.filter(x => x.cam === t.cam) : [];
  const ref = memeCam[memeCam.length - 1] || autres[autres.length - 1];
  if (!ref) return '';
  const c = ref.clip.trim();
  const m = c.match(/^(.*?C)(\d+)(.*)$/i);
  if (m) return m[1] + String(+m[2] + 1).padStart(m[2].length, '0') + m[3];
  const d = c.match(/^(.*?)(\d+)(\D*)$/);
  if (d) return d[1] + String(+d[2] + 1).padStart(d[2].length, '0') + d[3];
  return '';
}
function appliquerClip(id){
  const t = prise(id); const s = t && clipSuivant(t);
  if (!s) return;
  patch('prise', id, { clip: s });
  const i = document.querySelector('#sbody input[data-k="clip"]'); if (i) i.value = s;
  const m = document.querySelector('#sbody .clip-ligne .mini'); if (m) m.remove();   // le nom est pose, le bouton n'a plus d'objet
  renderList();
}

const aNote = (t, n) => (t.notes || '').split(/\s*·\s*/).some(s => s.trim().toLowerCase() === n.toLowerCase());
function noteRapide(n){

  let segs = (t.notes || '').split(/\s*·\s*/).map(s => s.trim()).filter(Boolean);
  if (segs.some(s => s.toLowerCase() === n.toLowerCase())) segs = segs.filter(s => s.toLowerCase() !== n.toLowerCase());
  else segs.push(n);
  patch('prise', t.id, { notes: segs.join(' · ') });
  const ta = document.querySelector('#sbody textarea[data-k="notes"]'); if (ta){ ta.value = t.notes; autoHauteur(ta); }

}

function supprimerPrise(t){
  const pid = t.planId;
  DB.prises = DB.prises.filter(x => x.id !== t.id);
  // les suivantes se renumerotent (le serveur fait de meme et confirme)
  prisesDe(pid).forEach((x, i) => { x.n = i + 1; });
  if (chrono && chrono.priseId === t.id) chrono = null;
  operer({ op:'del', kind:'prise', id: t.id, planId: pid });
  corbeille = { type:'prise', prise: t };
  toastAction('Prise ' + t.n + ' supprimée', 'Annuler', restaurer);
}

/* Ce qui vient d'etre supprime revient a sa place. */
function restaurer(){
  const c = corbeille; corbeille = null;
  if (!c) return;
  if (c.type === 'prise'){
    const t = c.prise;
    if (!plan(t.planId)) return toast('Le plan n’existe plus');
    // les numeros ont bouge : les suivantes se decalent, la prise reprend le sien
    prisesDe(t.planId).filter(x => x.n >= t.n).forEach(x => patch('prise', x.id, { n: x.n + 1 }));
    DB.prises.push(t);
    operer({ op:'add', kind:'prise', data: t });
  } else if (c.type === 'plan'){
    const i = DB.plans.findIndex(x => x.id === c.apres);
    DB.plans.splice(i + 1, 0, c.plan);
    operer({ op:'add', kind:'plan', data: c.plan, apres: c.apres });
    c.prises.forEach(t => { DB.prises.push(t); operer({ op:'add', kind:'prise', data: t }); });
    }
  flush(); renderAll(); toast('Rétabli');
}

/* L'image d'un plan et le plan du decor sous le croquis : choisies sur
   l'appareil, reduites avant d'etre gardees. */

/* Ouvre le selecteur d'image de l'appareil, en retenant pour quelle fiche (et quel decor). */
function demanderImage(quel, id, lieu){
  const i = $(quel);
  i.dataset.id = id; i.dataset.lieu = lieu || ''; i.value = ''; i.click();
}
/* Reduite avant d'etre gardee : une vignette lisible pese 20 a 40 Ko,
   pas les 4 Mo d'une photo de telephone. */
/* Ce navigateur sait-il ecrire du WebP ? Mesure une fois, au chargement. */
const SAIT_WEBP = (() => {
  try{
    const c = document.createElement('canvas'); c.width = c.height = 1;
    return c.toDataURL('image/webp', .5).indexOf('image/webp') === 5;
  }catch(e){ return false; }
})();

function reduirePhoto(f, max, q){
  /* On encode dans les deux formats et on garde le plus leger. Le WebP gagne
     largement sur du trait et des aplats, mais le JPEG reprend l'avantage sur
     une photo tres granuleuse : a qualite nommee egale, les deux codecs ne
     visent pas la meme fidelite. Plutot que de parier, on compare. Une image
     importee est rare, le second encodage ne se sent pas. */
  const dessine = (img, w, h) => {
    const r = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * r)); c.height = Math.max(1, Math.round(h * r));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const jpeg = c.toDataURL('image/jpeg', q);
    if (!SAIT_WEBP) return jpeg;
    const webp = c.toDataURL('image/webp', q);
    return webp.length < jpeg.length ? webp : jpeg;
  };
  const viaImage = () => new Promise((ok, ko) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => { try{ ok(dessine(im, im.naturalWidth, im.naturalHeight)); }catch(e){ ko(e); } URL.revokeObjectURL(u); };
    im.onerror = ko; im.src = u;
  });
  if (window.createImageBitmap)
    return createImageBitmap(f, { imageOrientation:'from-image' })
      .then(b => dessine(b, b.width, b.height)).catch(viaImage);
  return viaImage();
}

/* Le Moteur du pied de fiche : lance une prise sur ce plan, puis devient
   Coupez tant que son chrono tourne. */
function majMoteurFiche(){
  const b = $('moteur-fiche'); if (!b) return;
  const p = plan(openId); if (!p) return;
  const t = chrono && prise(chrono.priseId);
  if (t && t.planId === p.id){
    b.className = 'btn rec'; b.disabled = false;
    b.innerHTML = `&#9632; Coupez <em>${fmtChrono(Date.now() - chrono.debut)}</em>`;
    b.onclick = couper;
  } else {
    b.className = 'btn'; b.disabled = !!chrono; b.innerHTML = '&#9679; Moteur';
    b.onclick = chrono ? null : () => moteurSur(p.id);
  }
}
function voirImage(src){
  const v = $('voile-photo');
  v.querySelector('img').src = src; v.hidden = false;
}

/* L'image d'un plan : celle qu'on lui a donnee, sinon la vignette du decoupage. */
const imagePlan = p => (p && (p.image || vignette(p.ref))) || '';
/* la vignette d'une carte : la photo ajoutee sur le plateau, sinon celle du decoupage */
const vigPlan = (p, style) => {
  const img = imagePlan(p);
  const css = (style || '') + (img ? `background-image:url(${img})` : '');
  return `<div class="vig"${css ? ` style="${css}"` : ''}></div>`;
};
function choisirImagePlan(id){ demanderImage('image-plan-in', id); }
function imagePlanChoisie(input){
  const f = input.files && input.files[0], id = input.dataset.id;
  input.value = '';
  if (!f || !id) return;

    toast('Image ajoutée');
  }).catch(() => toast('Image illisible'));
}
function retirerImagePlan(id){

}

/* Les etiquettes du plan : deux familles exclusives, ce qu'il est (LIVE, VFX,
   CG) et ce qu'il devient (TBC, VAL, KILLED). Un clic sur la puce, sur la
   carte comme dans la fiche, ouvre un petit menu de sa famille. */
const TAGS_GROUPES = [['LIVE', 'VFX', 'CG'], ['VAL', 'TBC', 'KILLED']];
const TAG_COULEURS = { LIVE:'vert', VFX:'bleu', CG:'rouge', TBC:'orange', VAL:'vert', KILLED:'rouge' };
const classeTag = t => TAG_COULEURS[String(t).toUpperCase()] ? ' t-' + TAG_COULEURS[String(t).toUpperCase()] : '';
const rangTag = t => { const i = TAGS_GROUPES.findIndex(x => x.includes(t)); return i < 0 ? 9 : i; };
function htmlPtags(p){
  const tags = (p.tags || []).slice().sort((a, b) => rangTag(a) - rangTag(b));
  const out = [];
  TAGS_GROUPES.forEach((g, i) => {
    const t = tags.find(x => g.includes(x));
    out.push(t ? `<button type="button" class="ptag${classeTag(t)}" data-tag="${esc(t)}" data-g="${i}"
        onclick="event.stopPropagation();menuTag(this, '${p.id}')">${esc(t)}</button>`
               : `<button type="button" class="ptag vide" data-tag="" data-g="${i}"
        onclick="event.stopPropagation();menuTag(this, '${p.id}')">${g[0]}</button>`);
  });
  tags.filter(t => rangTag(t) === 9).forEach(t => out.push(`<span class="ptag">${esc(t)}</span>`));
  return out.join('');
}
/* Le petit menu sous la puce : les etiquettes de sa famille, celle en place cochee. */
function menuTag(btn, id){
  const deja = btn.classList.contains('on');
  fermerMenu();
  if (deja) return;
  const g = TAGS_GROUPES[+btn.dataset.g] || TAGS_GROUPES[0], actuel = btn.dataset.tag;
  const m = document.createElement('div');
  m.className = 'menu puce';
  m.innerHTML = g.map(t => `<button type="button" class="${t === actuel ? 'on' : ''}${classeTag(t)}"
      onclick="event.stopPropagation();poserTag('${id}', '${t}')">${t}</button>`).join('');
  // pose sur la page, au-dessus de tout, a l'aplomb de la puce ; le defilement le referme
  const r = btn.getBoundingClientRect();
  m.style.left = r.left + 'px'; m.style.top = (r.bottom + 5) + 'px';
  document.body.appendChild(m);
  btn.classList.add('on');
  setTimeout(() => document.addEventListener('click', clicHorsMenu), 0);
  window.addEventListener('scroll', fermerMenu, { once:true, capture:true });
}
function poserTag(id, tag){
  fermerMenu();
  const p = plan(id); if (!p) return;
  const g = TAGS_GROUPES.find(x => x.includes(tag)); if (!g) return;
  const tags = (p.tags || []).filter(t => !g.includes(t)).concat([tag]).sort((a, b) => rangTag(a) - rangTag(b));
  patch('plan', p.id, { tags });
  if (openType === 'plan' && openId === p.id) majBoutonsPlan();
  renderList();
}

/* ------------------------------------------------------------ Croquis du set */
/* Un croquis par plan : positions de camera, axes, caches, trajets. Le fond est
   le plan du decor (une image par decor, partagee par tous ses plans), sinon une
   feuille blanche. On y trace au crayon, et on y pose des objets : cameras,
   lumieres, fonds verts, murs, textes. Tout est garde en points, donc
   reprenable ; une image rendue sert d'apercu dans la fiche. */
const CROQUIS_COULEURS = ['#1c1410', '#e7b04a', '#e8675e', '#5fb36d', '#4f8fd6'];
const CROQUIS_LARGEURS = [3, 6, 12];
const PICTO = d => ICO(d, 20, 1.8);
const CROQUIS_OBJETS = [
  ['cam',     'Caméra',     PICTO('<rect x="3" y="8" width="11" height="9" rx="1.5"/><path d="M14 11l6-3v9l-6-3z"/>')],
  ['lum',     'Lumière',    PICTO('<path d="M4 8h8a3.5 3.5 0 0 1 3.5 3.5v1A3.5 3.5 0 0 1 12 16H4z"/><path d="M17.5 12h3M16.5 8.5l2.5-2M16.5 15.5l2.5 2M7 16v3"/>')],
  ['perso',   'Personnage', PICTO('<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>')],
  ['bloc',    'Bloc',       PICTO('<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 9h16M9 4v16"/>')],
  ['rond',    'Rond',       PICTO('<circle cx="12" cy="12" r="8"/>')],
  ['fleche',  'Flèche',     PICTO('<path d="M4 18L18 6M18 6h-7M18 6v7"/>')],
  ['mur',     'Mur',        PICTO('<path d="M4 12h16" stroke-width="4"/>')],
  ['fenetre', 'Fenêtre',    PICTO('<path d="M4 10h16M4 14h16"/>')],
  ['vert',    'Fond vert',  PICTO('<path d="M4 12h16" stroke-width="4"/><path d="M6 12h2M11 12h2M16 12h2" stroke="#fff" stroke-width="1.6"/>')],
  ['cote',    'Mesure',     PICTO('<path d="M4 12h16M4 12l3-3M4 12l3 3M20 12l-3-3M20 12l-3 3"/>')],
  ['txt',     'Texte',      PICTO('<path d="M5 6h14M12 6v13"/>')]
];
/* trois gestes : poser puis orienter ; tirer d'un bout a l'autre ; tirer coin a coin */
const OBJ_POSE = ['cam', 'lum', 'perso', 'table', 'chaise'], OBJ_SEG = ['mur', 'fenetre', 'vert', 'cote', 'fleche'], OBJ_RECT = ['bloc', 'rond'];
let dessin = null;   // l'editeur ouvert

const fondDecor = lieu => (DB.prod.fonds || {})[(lieu || '').trim()] || '';
/* Le decor dont le plan sert de fond au croquis : celui du plan, sauf si on en a choisi un autre. */
const lieuFond = p => (p.fondLieu || p.lieu || '').trim();
/* Les decors ou l'on tourne vraiment (le full CG n'a pas de plateau), les plus frequents d'abord. */
function decorsTournage(){
  return frequences(DB.plans.filter(p => p.jour !== 'CG').map(p => (p.lieu || '').trim())).map(x => x[0]);
}
function chargerImage(src){
  return new Promise((ok, ko) => { if (!src) return ok(null); const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
}

/* A-t-on dessine quelque chose ? Et : y a-t-il quelque chose a montrer, le
   plan du decor seul comptant pour un apercu. */
const aTraits = p => {
  const c = p && p.croquis;
  return !!(c && ((c.traits && c.traits.length) || (c.objets && c.objets.length)));
};
const aCroquis = p => aTraits(p) || !!fondDecor(lieuFond(p));

let choixFondOuvert = false;   // « Changer le plan du decor » : les vignettes des decors sont depliees
function htmlCroquis(p){
  const lieu = lieuFond(p), fond = fondDecor(lieu);
  const decors = fusion(decorsTournage(), lieu ? [lieu] : []);
  const montrer = aCroquis(p);
  // les trois gestes du croquis : des pictos poses en haut de l'image, leur nom au survol
  const outil = (cls, action, nom, ico) =>
    `<button type="button" class="${cls}" onclick="${action}('${p.id}')" title="${nom}" aria-label="${nom}">${ico}</button>`;
  return `<div class="croq">
    <div class="croq-cadre${montrer ? '' : ' vide'}">
      ${montrer ? `<canvas id="croq-apercu" onclick="ouvrirCroquis('${p.id}')" title="Modifier le croquis"></canvas>`
                : `<button type="button" class="croq-vide" onclick="ouvrirCroquis('${p.id}')">${ICONES.crayon}<span>Dessiner le set</span></button>`}
      <div class="croq-outils">
        ${outil('', 'ouvrirCroquis', montrer ? 'Modifier le croquis' : 'Dessiner le set', ICONES.crayon)}
        ${outil(choixFondOuvert ? 'on' : '', 'basculerChoixFond', fond ? 'Changer le plan du décor' : 'Choisir le plan du décor', ICONES.decor)}
        ${fond ? outil('d', 'retirerFond', 'Retirer le plan du décor', ICONES.corbeille) : ''}
      </div>
    </div>
    ${choixFondOuvert ? `<div class="fonds">
      ${decors.map(l => { const img = fondDecor(l), ici = memeVal(l, lieu);
        return `<button type="button" class="fond${ici ? ' on' : ''}" data-l="${esc(l)}" onclick="prendreFond('${p.id}', this.dataset.l)">
          ${img ? `<img src="${img}" alt="">` : `<span class="fond-vide">${ICONES.image}<em>Importer</em></span>`}
          <b>${esc(l)}</b><i>${img ? (ici ? 'utilisé ici' : 'plan importé') : 'pas encore de plan'}</i>
        </button>`; }).join('')}
      ${fond ? `<button type="button" class="fond-autre" onclick="choisirFond('${p.id}')">Remplacer l’image de « ${esc(lieu)} »…</button>` : ''}
    </div>` : ''}
  </div>`;
}

/* L'etat de l'editeur pour un plan, sur le fond donne : le croquis garde est remis a l'echelle du fond. */
function etatCroquis(p, img){
  // sans plan du decor : le format du croquis existant, sinon une feuille dans le sens de l'ecran
  const anc = p.croquis || {}, portrait = innerHeight > innerWidth;
  const plein = (anc.traits && anc.traits.length) || (anc.objets && anc.objets.length);
  const w = img ? img.naturalWidth : (plein && anc.w ? anc.w : (portrait ? 1200 : 1600));
  const h = img ? img.naturalHeight : (plein && anc.h ? anc.h : (portrait ? 1600 : 1200));
  const kx = anc.w ? w / anc.w : 1, ky = anc.h ? h / anc.h : 1;
  let seq = 0;
  const traits = (anc.traits || []).map(t => ({ c:t.c, w:t.w, pts:t.pts.map(q => [q[0] * kx, q[1] * ky]), n:++seq }));
  const objets = (anc.objets || []).map(o => {
    const c = Object.assign({}, o, { n:++seq });
    ['x', 'x1', 'x2'].forEach(k => { if (o[k] != null) c[k] = o[k] * kx; });
    ['y', 'y1', 'y2'].forEach(k => { if (o[k] != null) c[k] = o[k] * ky; });
    return c;
  });
  return { planId:p.id, fond:img, w, h, traits, objets, seq, outil:'crayon', couleur:CROQUIS_COULEURS[0], largeur:1, courant:null, sale:false, zoom:1, histo:[] };
}

function ouvrirCroquis(id){
  const p = plan(id); if (!p) return;
  chargerImage(fondDecor(lieuFond(p))).catch(() => null).then(img => {
    dessin = etatCroquis(p, img);
    const v = $('voile-dessin');
    v.querySelector('.dtitre b').textContent = 'Croquis · plan ' + (p.plan || '?');
    v.querySelector('.dtitre span').textContent = (lieuFond(p) || 'Sans décor') + (img ? ' — sur le plan du décor' : ' — feuille blanche');
    v.hidden = false;
    majOutils(); tailleCroquis(); rendreCroquis();
  });
}

/* L'apercu de la fiche se redessine a l'ouverture, depuis les traits gardes dans
   le projet. Il n'est plus enregistre en image : c'etait la meme information,
   quinze fois plus lourde, recopiee dans chaque plan avec le plan du decor cuit
   dedans — les soixante plans d'un meme decor en portaient soixante copies. Le
   decor change ? Il n'y a plus rien a refaire dans le projet, on redessine.
   La largeur du canvas ne part nulle part : elle peut etre genereuse. */
const APERCU = 900;
function dessinerApercu(p){
  const cv = $('croq-apercu');
  if (!cv) return;
  chargerImage(fondDecor(lieuFond(p))).catch(() => null).then(img => {
    // la fiche a pu se redessiner, ou changer de plan, pendant le chargement
    if ($('croq-apercu') !== cv) return;
    const garde = dessin;
    dessin = etatCroquis(p, img);
    cv.width = APERCU; cv.height = Math.round(APERCU * dessin.h / dessin.w);
    rendreCroquis(cv);
    dessin = garde;
  });
}
function fermerCroquis(demander){
  if (!dessin) return false;
  const fermer = () => { dessin = null; $('voile-dessin').hidden = true; };
  if (demander && dessin.sale){
    confirmer('Abandonner les modifications du croquis ?', { ok:'Abandonner', danger:true, annuler:'Continuer' })
      .then(oui => { if (oui && dessin) fermer(); });
    return true;
  }
  fermer();
  return true;
}

/* Le canevas garde la resolution du fond (ou 1600 x 1200) et s'affiche a
   l'echelle dans la zone disponible. */
/* ancre : un point de l'ecran (clientX/Y) qui doit rester sous le doigt apres le zoom */
function tailleCroquis(ancre){
  if (!dessin) return;
  const c = $('croquis'), zone = $('dzone'), z = zone.getBoundingClientRect();
  const fit = Math.min((z.width - 24) / dessin.w, (z.height - 24) / dessin.h), k = fit * (dessin.zoom || 1);
  let fx = .5, fy = .5, sx = z.width / 2, sy = z.height / 2;
  if (ancre){
    const r = c.getBoundingClientRect();
    fx = ancre.fx != null ? ancre.fx : (ancre.x - r.left) / r.width; fy = ancre.fy != null ? ancre.fy : (ancre.y - r.top) / r.height;
    sx = ancre.x - z.left; sy = ancre.y - z.top;
  }
  c.width = dessin.w; c.height = dessin.h;
  const cw = Math.floor(dessin.w * k), ch = Math.floor(dessin.h * k);
  c.style.width = cw + 'px'; c.style.height = ch + 'px';
  // le canevas commence a 12 px du bord de la zone quand il deborde
  zone.scrollLeft = Math.max(0, fx * cw + 12 - sx); zone.scrollTop = Math.max(0, fy * ch + 12 - sy);
  const e = $('dzoom'); if (e) e.textContent = Math.round((dessin.zoom || 1) * 100) + ' %';
  rendreCroquis();
}
function zoomCroquis(facteur, ancre){
  if (!dessin) return;
  dessin.zoom = facteur == null ? 1 : Math.max(.5, Math.min(6, (dessin.zoom || 1) * facteur));
  tailleCroquis(ancre);
}
/* Ctrl + molette (ou le pincement d'un pave tactile) zoome autour du curseur. */
function moletteCroquis(e){
  if (!dessin) return;
  if (e.ctrlKey || e.metaKey){ e.preventDefault(); zoomCroquis(e.deltaY < 0 ? 1.15 : 1 / 1.15, { x:e.clientX, y:e.clientY }); return; }
  const o = dessin.selection;
  if (dessin.outil === 'move' && o && OBJ_POSE.includes(o.t)){
    e.preventDefault();
    souvenir('molette' + o.n);
    o.a = (o.a || 0) + (e.deltaY > 0 ? 1 : -1) * Math.PI / 36;
    dessin.sale = true; rendreCroquis();
  }
}
/* Deux doigts sur le canevas : on pince pour zoomer, le trait en cours est abandonne. */
const doigts = new Map();
let pince = null;
function doigtPose(e){
  doigts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (doigts.size === 2 && dessin){
    const [a, b] = [...doigts.values()], r = $('croquis').getBoundingClientRect();
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    // on garde sous les deux doigts le point du croquis qu'ils tenaient : pincer zoome, glisser deplace
    pince = { d0: Math.hypot(a.x - b.x, a.y - b.y), z0: dessin.zoom || 1, fx: (mx - r.left) / r.width, fy: (my - r.top) / r.height };
    dessin.courant = null; rendreCroquis();
  }
}
function doigtBouge(e){
  if (!doigts.has(e.pointerId)) return;
  doigts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pince && doigts.size === 2){
    const [a, b] = [...doigts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    dessin.zoom = Math.max(.5, Math.min(6, pince.z0 * d / Math.max(1, pince.d0)));
    tailleCroquis({ x:(a.x + b.x) / 2, y:(a.y + b.y) / 2, fx:pince.fx, fy:pince.fy });
  }
}
function doigtLeve(e){ doigts.delete(e.pointerId); if (doigts.size < 2) pince = null; }
/* la barre d'espace tenue : la vue se deplace a la souris, quel que soit l'outil */
let espaceTenu = false;
document.addEventListener('keydown', e => {
  if (e.key === ' ' && dessin && !DLG.resoudre && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ e.preventDefault(); espaceTenu = true; $('dzone').classList.add('main'); }
});
document.addEventListener('keyup', e => { if (e.key === ' '){ espaceTenu = false; const z = $('dzone'); if (z) z.classList.remove('main'); } });

/* Les objets sont dessines a une taille fixe par rapport a une feuille de
   1600 de large : la meme camera sur un petit ou un grand plan de decor. */
function dessinerObjet(g, o, k, u){
  const X = v => v * k, Y = X;   // meme echelle sur les deux axes
  g.save();
  if (o.t === 'bloc'){
    // un rectangle tire coin a coin : praticable, caisse, meuble
    const x = Math.min(o.x1, o.x2), y = Math.min(o.y1, o.y2), w = Math.abs(o.x2 - o.x1), h = Math.abs(o.y2 - o.y1);
    g.fillStyle = 'rgba(58,51,48,.16)'; g.strokeStyle = '#3a3330'; g.lineWidth = 4 * u; g.lineJoin = 'miter';
    g.fillRect(X(x), Y(y), X(w), Y(h)); g.strokeRect(X(x), Y(y), X(w), Y(h));
  } else if (o.t === 'rond'){
    // un rond (ou un ovale) inscrit dans le rectangle tire : table ronde, tapis, zone
    const cx = X((o.x1 + o.x2) / 2), cy = Y((o.y1 + o.y2) / 2), rx = Math.abs(X(o.x2 - o.x1)) / 2, ry = Math.abs(Y(o.y2 - o.y1)) / 2;
    g.fillStyle = 'rgba(58,51,48,.16)'; g.strokeStyle = o.c || '#3a3330'; g.lineWidth = 4 * u;
    g.beginPath(); g.ellipse(cx, cy, Math.max(rx, 1), Math.max(ry, 1), 0, 0, Math.PI * 2); g.fill(); g.stroke();
  } else if (o.t === 'fleche'){
    // un deplacement : un trait en pointille long, une pointe a l'arrivee
    const ax = X(o.x1), ay = Y(o.y1), bx = X(o.x2), by = Y(o.y2), ang = Math.atan2(by - ay, bx - ax);
    g.strokeStyle = o.c || '#1c1410'; g.fillStyle = o.c || '#1c1410'; g.lineWidth = 5 * u; g.lineCap = 'round';
    g.setLineDash([16 * u, 12 * u]);
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx - Math.cos(ang) * 14 * u, by - Math.sin(ang) * 14 * u); g.stroke();
    g.setLineDash([]);
    g.beginPath(); g.moveTo(bx, by);
    g.lineTo(bx - Math.cos(ang - .45) * 26 * u, by - Math.sin(ang - .45) * 26 * u);
    g.lineTo(bx - Math.cos(ang + .45) * 26 * u, by - Math.sin(ang + .45) * 26 * u); g.closePath(); g.fill();
  } else if (o.t === 'cote'){
    // une cote : la fleche a deux pointes, et la mesure ecrite au milieu, dans le sens de la ligne
    const ax = X(o.x1), ay = Y(o.y1), bx = X(o.x2), by = Y(o.y2), ang = Math.atan2(by - ay, bx - ax), l = Math.hypot(bx - ax, by - ay);
    g.strokeStyle = '#4f8fd6'; g.fillStyle = '#4f8fd6'; g.lineWidth = 3 * u; g.lineCap = 'round';
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
    const pointe = (x, y, d) => { g.beginPath(); g.moveTo(x, y);
      g.lineTo(x - Math.cos(d - .42) * 16 * u, y - Math.sin(d - .42) * 16 * u); g.lineTo(x - Math.cos(d + .42) * 16 * u, y - Math.sin(d + .42) * 16 * u); g.closePath(); g.fill(); };
    if (l > 30 * u){ pointe(bx, by, ang); pointe(ax, ay, ang + Math.PI); }
    if (o.txt){
      g.translate((ax + bx) / 2, (ay + by) / 2); g.rotate(ang > Math.PI / 2 || ang < -Math.PI / 2 ? ang + Math.PI : ang);
      g.font = '700 ' + Math.round(30 * u) + 'px Figtree, "Segoe UI", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'bottom'; g.lineJoin = 'round';
      g.lineWidth = 8 * u; g.strokeStyle = 'rgba(255,255,255,.9)'; g.strokeText(o.txt, 0, -8 * u);
      g.fillText(o.txt, 0, -8 * u);
    }
  } else if (o.t === 'fenetre'){
    // une fenetre : un double trait bleu clair dans l'epaisseur du mur
    g.lineCap = 'butt';
    g.strokeStyle = '#4f8fd6'; g.lineWidth = 12 * u;
    g.beginPath(); g.moveTo(X(o.x1), Y(o.y1)); g.lineTo(X(o.x2), Y(o.y2)); g.stroke();
    g.strokeStyle = '#fff'; g.lineWidth = 4 * u;
    g.beginPath(); g.moveTo(X(o.x1), Y(o.y1)); g.lineTo(X(o.x2), Y(o.y2)); g.stroke();
  } else if (o.t === 'mur' || o.t === 'vert'){
    g.lineCap = 'butt';

  const sans = l => l.map(o => { const c = Object.assign({}, o); delete c.n; return c; });
  patch('plan', p.id, { croquis: { w: dessin.w, h: dessin.h, traits: sans(dessin.traits), objets: sans(dessin.objets) } });
  // on reste dans l'editeur : la fiche derriere se met a jour, la fleche ramene quand on veut
  dessin.sale = false;
  redessinerFichePlan(p); renderList();
  toast('Croquis enregistré');
}

function basculerChoixFond(id){

/* Une vignette du choix : ce croquis se pose sur le plan de ce decor ; s'il n'a
   pas encore d'image, on l'importe d'abord. */
function prendreFond(id, lieu){
  const p = plan(id); if (!p || !lieu) return;
  if (!fondDecor(lieu)) return choisirFond(id, lieu);
  utiliserFond(p, lieu);
}
function utiliserFond(p, lieu){
  // le decor du plan lui-meme ne se note pas : c'est le fond par defaut
  const v = memeVal(lieu, p.lieu) ? '' : lieu;
  if ((p.fondLieu || '') !== v) patch('plan', p.id, { fondLieu: v });
  choixFondOuvert = false;

}
function fondChoisi(input){
  const f = input.files && input.files[0], p = plan(input.dataset.id);
  const lieu = (input.dataset.lieu || (p ? lieuFond(p) : '')).trim();
  input.value = ''; input.dataset.lieu = '';

    utiliserFond(p, lieu);

function poserFond(lieu, url){
  const fonds = Object.assign({}, DB.prod.fonds || {});
  if (url) fonds[lieu] = url; else delete fonds[lieu];
  patch('prod', 'prod', { fonds });
}
function retirerFond(id){
  const p = plan(id), lieu = p ? lieuFond(p) : ''; if (!p || !fondDecor(lieu)) return;
  confirmer('Retirer le plan du décor « ' + lieu + ' » ?',
            { detail:'Les croquis posés dessus repasseront sur feuille blanche.', ok:'Retirer', danger:true }).then(oui => {

}

   se redessine jamais sous les doigts. Le reste se regle dans la fiche. */
function champPrep(p, k, label, opt){
  opt = opt || {};
  const at = liaison(p, k, opt.area ? ';autoHauteur(this)' : '') + ` onkeydown="touchePrep(event, '${p.id}')"` +
             (opt.cap ? ` autocapitalize="${opt.cap}"` : '') + (opt.im ? ` inputmode="${opt.im}"` : '');
  const ph = opt.ph ? ` placeholder="${esc(opt.ph)}"` : '';
  const champ = opt.area
    ? `<textarea rows="1" ${at}${ph}>${esc(p[k])}</textarea>`
    : `<input ${at} value="${esc(p[k])}"${ph} autocomplete="off">`;
  return `<label class="pc ${opt.cls || ''}"><span>${label}</span>${champ}` +
    (opt.dl ? `<button type="button" class="deroul" data-liste="${opt.dl}"${opt.multi ? ' data-multi="1"' : ''} onclick="ouvrirMenu(this)" aria-label="Choisir dans la liste">${CHEVRON_BAS}</button>` : '') +
    `</label>`;
}
// masquee (section repliee, vue cachee), la zone ne mesure rien : on la laisse a sa ligne
function autoHauteur(ta){ ta.style.height = 'auto'; if (ta.scrollHeight) ta.style.height = ta.scrollHeight + 'px'; }

/* Une note de plateau commence souvent par l'heure (« 14h30 on a enregistre juste
   du son ») : le bouton la pose en tete d'une nouvelle ligne, il reste a ecrire. */
function horodater(btn){
  const ta = btn.previousElementSibling;
  const h = maintenant().replace(':', 'h') + ' ';
  ta.value = ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n' + h : h;
  live(ta); autoHauteur(ta);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

function renderPrep(){
  const l = $('l-prep'); if (!l) return;
  const ids = DB.plans.map(p => p.id).join(',');
  // quelqu'un tape ici : on ne redessine pas, les autres champs se mettent a niveau

  jours.forEach(j => {

/* Le mode Ordonner : les cartes se glissent (souris) ou montent et descendent
   (fleches, au doigt) ; un plan ne change pas de jour en bougeant. */
let modeOrdre = false, plansTire = null;
/* La page Preparation se redessine au prochain rendu, meme si l'on y tape. */
function oublierPrep(){ const l = $('l-prep'); if (l) l.dataset.ids = ''; }
function basculerOrdre(){
  modeOrdre = !modeOrdre;
  oublierPrep(); renderPrep();
}
function deplacerLocal(id, apres){
  const i = DB.plans.findIndex(p => p.id === id); if (i < 0) return false;
  const [p] = DB.plans.splice(i, 1);
  const j = apres === '' ? -1 : DB.plans.findIndex(x => x.id === apres);
  DB.plans.splice(j + 1, 0, p);
  return true;
}
function deplacerPlan(id, apres){
  if (id === apres || !deplacerLocal(id, apres)) return;
  operer({ op:'move', kind:'plan', id, apres });
  oublierPrep(); renderAll();
}
/* La position d'un plan dans sa journee, et l'inverse : taper un numero
   l'insere a cette place, les autres se decalent (jamais deux fois le meme). */
const positionPlan = p => plansDuJour(p.jour).indexOf(p) + 1;
function placerPlan(id, val){
  const p = plan(id); if (!p) return;
  const jour = plansDuJour(p.jour), autres = jour.filter(x => x !== p);
  const n = Math.max(1, Math.min(autres.length + 1, parseInt(val, 10) || 0));
  if (!parseInt(val, 10) || n === positionPlan(p)){ oublierPrep(); renderPrep(); return; }   // on remet le numero en place
  // en tete de journee : juste avant le premier plan du jour ; sinon apres le (n-1)e
  deplacerPlanVisible(id, n === 1 ? DB.plans[DB.plans.indexOf(autres[0]) - 1] : autres[n - 2]);
}
function monterPlan(id, sens){
  const p = plan(id); if (!p) return;
  const jour = plansDuJour(p.jour), v = jour[jour.indexOf(p) + sens]; if (!v) return;
  // monter = se placer avant le voisin du dessus ; descendre = juste apres celui du dessous
  deplacerPlanVisible(id, sens < 0 ? DB.plans[DB.plans.indexOf(v) - 1] : v);
}
/* Deplace le plan juste apres `avant` (en tete sans lui) et garde sa carte sous les yeux. */
function deplacerPlanVisible(id, avant){
  deplacerPlan(id, avant ? avant.id : '');
  const r = document.querySelector(`#l-prep .prow[data-id="${id}"]`); if (r) r.scrollIntoView({ block:'nearest' });
}
function brancherOrdre(){
  const l = $('l-prep'); if (!l || l.dataset.dnd) return;
  l.dataset.dnd = '1';
  const carte = e => e.target.closest && e.target.closest('.prow.ordo');
  l.addEventListener('dragstart', e => {
    const r = carte(e); if (!r) return;
    plansTire = r.dataset.id; r.classList.add('tire');
    try { e.dataTransfer.setData('text/plain', plansTire); e.dataTransfer.effectAllowed = 'move'; } catch (x) {}
  });
  l.addEventListener('dragover', e => {
    const r = carte(e); if (!r || !plansTire || r.dataset.id === plansTire) return;
    const a = plan(plansTire), b = plan(r.dataset.id);
    if (!a || !b || (a.jour || '') !== (b.jour || '')) return;
    e.preventDefault();
    const av = e.clientY < r.getBoundingClientRect().top + r.offsetHeight / 2;
    r.classList.toggle('av', av); r.classList.toggle('ap', !av);
  });
  l.addEventListener('dragleave', e => { const r = carte(e); if (r) r.classList.remove('av', 'ap'); });
  l.addEventListener('drop', e => {
    const r = carte(e); if (!r || !plansTire) return;
    e.preventDefault();
    const av = r.classList.contains('av'), cible = plan(r.dataset.id), id = plansTire;
    r.classList.remove('av', 'ap');
    if (!cible || id === cible.id) return;
    const avant = av ? DB.plans[DB.plans.indexOf(cible) - 1] : cible;
    deplacerPlan(id, avant && avant.id !== id ? avant.id : (av ? '' : cible.id));
  });
  l.addEventListener('dragend', () => {
    plansTire = null;
    l.querySelectorAll('.tire, .av, .ap').forEach(x => x.classList.remove('tire', 'av', 'ap'));
  });
}

function ajouterPlanPrep(j){
  const p = creerPlan(j, false);
  renderAll();
  const i = document.querySelector(`#l-prep .prow[data-id="${p.id}"] input[data-k="plan"]`);
  if (i){ i.scrollIntoView({ block:'center' }); i.focus(); }
}
function supprimerPlanPrep(id){
  const p = plan(id);
  if (p) supprimerPlanConfirme(p).then(fait => { if (fait) renderAll(); });
}
/* Entree passe au champ suivant de la carte ; sur le dernier, elle rend la main.
   Maj+Entree garde son sens dans la description. */
function touchePrep(e, id){
  if (e.key !== 'Enter' || e.shiftKey) return;
  e.preventDefault();
  const champs = [...e.target.closest('.prow').querySelectorAll('input, textarea')];
  const suivant = champs[champs.indexOf(e.target) + 1];
  if (suivant) suivant.focus(); else e.target.blur();
}

/* Un plan de plus, range apres le dernier plan du meme jour. Sur le plateau
   (horsDT), il porte l'etiquette HORS DT pour se distinguer du decoupage. */
function creerPlan(j, horsDT){
  const ref = dernierPlan && plan(dernierPlan);
  const voisins = plansDuJour(j);
  const modele = voisins.length ? voisins[voisins.length - 1] : ref;
  const p = Object.assign({ id: uid() }, PLAN_NEUF(), {
    seq: modele ? modele.seq : '', seqTitre: modele ? modele.seqTitre : '',
    plan: '', desc: '', lieu: modele ? modele.lieu : '', cadrage: '', mouv: '',
    focale: '', duree: '', tags: horsDT ? ['LIVE', 'TBC', 'HORS DT'] : ['LIVE', 'TBC'],
    assets: '', previz: true, ref: '', jour: j, horsDT: !!horsDT
  });
  const dernier = voisins.length ? DB.plans.indexOf(voisins[voisins.length - 1]) : DB.plans.length - 1;
  DB.plans.splice(dernier + 1, 0, p);
  operer({ op:'add', kind:'plan', data: p, apres: dernier >= 0 ? DB.plans[dernier].id : '' });
  dernierPlan = p.id;
  return p;
}

function envoyerVersServeur(){
  demanderTexte('Adresse du serveur de plateau', { valeur:'http://localhost:8765', ok:'Continuer', im:'url' }).then(v => {
    const adr = (v || '').trim().replace(/\/+$/, '');
    if (!adr) return;
    confirmer('Remplacer le projet du serveur par celui de cette page ?',
              { detail: DB.prises.length + ' prise(s) et tous les plans seront envoyés.', ok:'Remplacer' }).then(oui => {
      if (!oui) return;
      poster(adr + '/api/ops', corpsOps([{ op:'remplacer', db: DB }]))
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(() => { toast('Projet envoyé'); return confirmer('Projet envoyé. Ouvrir la version partagée ?', { ok:'Ouvrir', annuler:'Rester ici' }); })

      .catch(() => prevenir('Serveur injoignable à ' + adr + '.', { detail:'Lancez Lancer.bat, puis réessayez.' }));
    });
  });
}
