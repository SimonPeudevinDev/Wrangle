<body>

<div class="top">
  <div class="ttl">
    <!-- Le logo vit dans public/wrangle-logo.svg ; --wrangle-ink (voir la feuille
         de style) lui donne la couleur du texte, et l ombre du pli, du noir
         translucide, tient sur les deux themes. -->

  </div>
  <button class="pill local" id="pres" onclick="openProd()" title="Appareils connectés"><i></i><span>Local</span></button>
  <!-- L engrenage est dessine, pas ecrit : le caractere U+2699 passait en emoji
       couleur sur iOS, hors du theme. Meme trace que le reste (ICONES). -->

<main>

<!-- =============== TOURNAGE : la page de saisie =============== -->
<!-- =============== PREPARATION =============== -->
<section class="view" id="v-prep" hidden>
  <div class="fbar" id="fbar-prep"></div>
  <div class="list" id="l-prep"></div>
</section>

<section class="view" id="v-shoot">
  <div class="fbar" id="fbar-shoot">
    <!-- la rangee des jours est posee au demarrage (barresJours) :
         les deux pages ont la meme, elle n'est ecrite qu'une fois -->
    <div class="panneau" id="c-filtre" hidden></div>
  </div>
  <div class="list" id="l-shoot"></div>
</section>

<!-- =============== RAPPORT =============== -->
<section class="view" id="v-report" hidden>
  <div class="fbar" id="fbar-report"></div>
  <div class="list" id="report" style="padding-top:22px"></div>
</section>

<!-- La fiche remise au montage et aux VFX : construite a la demande, visible
     seulement a l'impression. -->
<div id="post"></div>

</main>

<div class="fabs">
  <button class="fab2" id="fab3" onclick="nouveauPlan()" title="Ajouter un plan hors découpage dans la journée affichée">+ Plan</button>
  <button class="fab2" id="fab2" onclick="nouvellePrise()" title="Ajouter une prise sans chrono">+ Prise</button>
  <button class="fab" id="fab" onclick="fabAction()"></button>
</div>

<nav>
  <button data-v="prep"><i>&#9679;</i>Préparation</button>
  <button class="on" data-v="shoot"><i>&#9679;</i>Tournage</button>
  <button data-v="report"><i>&#9679;</i>Rapports</button>
</nav>

<aside class="sheet" id="sheet">
  <div class="shead">
    <button class="ico" onclick="closeSheet()">&#8592;</button>
    <div style="flex:1;min-width:0"><h2 id="stitle"></h2><p id="ssub"></p></div>
    <div class="snav" id="snav"></div>
  </div>
  <div class="sbody" id="sbody"></div>
  <div class="sfoot" id="sfoot" hidden></div>
</aside>
<div class="voile-fiche" onclick="closeSheet()"></div>

<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-btn" hidden></button></div>
<input type="file" id="imp" accept=".json" hidden onchange="importJSON(this)">
<input type="file" id="rap-in" accept=".json" multiple hidden onchange="lireSources(this)">
<input type="file" id="fond-in" accept="image/*" hidden onchange="fondChoisi(this)">

<!-- Le croquis du set : un editeur plein ecran, par-dessus tout. -->
<div class="voile-dessin" id="voile-dessin" hidden>
  <div class="dtete">
    <button type="button" class="ico" onclick="fermerCroquis(true)" aria-label="Fermer">&#8592;</button>
    <div class="dtitre"><b></b><span></span></div>
    <div class="dzoomb">
      <button type="button" class="ico" onclick="zoomCroquis(1 / 1.25)" aria-label="Réduire" title="Réduire (Ctrl + molette)">&minus;</button>
      <button type="button" class="dzoom" id="dzoom" onclick="zoomCroquis(null)" title="Revenir à la vue entière, la feuille droite">100 %</button>
      <button type="button" class="ico" onclick="zoomCroquis(1.25)" aria-label="Agrandir" title="Agrandir (Ctrl + molette)">+</button>
      <button type="button" class="ico" onclick="pivoterCroquis()" aria-label="Pivoter la feuille" title="Pivoter la feuille d'un quart de tour (la vue seule, le dessin ne bouge pas)">&#8635;</button>
    </div>
    <!-- a droite, trois icones serrees : le plan du decor, enregistrer, la corbeille (dessinees par majOutils) -->
    <div class="ddroite">
      <button type="button" class="ico dicone" id="ddecor" onclick="choisirFond()" aria-label="Plan du décor" title="Plan du décor"></button>
      <button type="button" class="ico dicone dsauver" id="dsauver" onclick="enregistrerCroquis()" aria-label="Enregistrer" title="Enregistrer"></button>
      <button type="button" class="ico dicone dsuppr" id="dsuppr" onclick="supprimerCroquisSel()" aria-label="Supprimer" title="Supprimer ce qui est sélectionné (sans sélection : tout effacer)"></button>
    </div>
  </div>
  <div class="dpal" id="dpal"></div>
  <div class="dzone" id="dzone" onwheel="moletteCroquis(event)">
    <div id="dpivot"><canvas id="croquis" onpointerdown="debutTrait(event)" onpointermove="mouvTrait(event)" onpointerup="finTrait(event)" onpointercancel="finTrait(event)"></canvas></div>
  </div>
  <div class="doutils" id="doutils"></div>
  <div class="dactions" id="dactions"></div>
  <div class="dconseil" id="dconseil"></div>
  <div class="dpick" id="dpick" hidden>
    <div class="dpick-sv" id="dpick-sv"><i id="dpick-pt"></i></div>
    <input type="range" class="dpick-h" id="dpick-h" min="0" max="359" step="1" aria-label="Teinte" oninput="teintePick(this.value)">
    <div class="dpick-bas">
      <span class="dpick-ap" id="dpick-ap"></span>
      <input class="dpick-hex" id="dpick-hex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Code couleur" oninput="hexPick(this.value)">
      <button type="button" class="btn sm p" onclick="fermerPick()">OK</button>
    </div>
    <div class="dpick-rec" id="dpick-rec"></div>
  </div>
</div>

<div class="voile" id="voile-nom" hidden>
  <div class="boite">
    <h2>Qui saisit sur cet appareil ?</h2>
    <p>Votre prénom est noté sur les prises que vous ajoutez, et les autres voient sur quel plan vous êtes.</p>
    <div class="choix" id="choix-nom"></div>
  </div>
</div>
<!-- la boite de dialogue : confirmer, demander un texte ou prevenir, a la place des fenetres du navigateur -->
<div class="voile dlg" id="dlg" hidden>
  <div class="boite" role="dialog" aria-modal="true" aria-labelledby="dlg-titre" aria-describedby="dlg-msg">
    <h2 id="dlg-titre"></h2>
    <p id="dlg-msg"></p>
    <input id="dlg-saisie" class="dlg-champ" type="text" autocomplete="off" hidden>
    <div class="dlg-btns">
      <button type="button" class="btn" id="dlg-non">Annuler</button>
      <button type="button" class="btn p" id="dlg-oui">OK</button>
    </div>
  </div>
</div>

 menton. Il recrache aussitôt le morceau au sol.","passages":"","cadrage":"Très gros plan","mouv":"Fixe","support":"Trépied","focale":"135 mm","intExt":"Int","momentJour":"Jour","duree":"","vfxDesc":"","assets":"","tags":["LIVE","TBC"],"notesClient":""},{"seq":"02","seqTitre":"Academy","plan":"05","lieu":"Royal Academy","previz":false,"ref":"","jour":"J5","desc":"D'un pas impérial, Lord Halloway s’écarte froidement. Sa voix s'élève, métallique, écrasant l'assemblée.","passages":"1/2 EDWARD : (voix porteuse, posture de showman)\n..chers membres du ministère, j’ai l’honneur de vous présenter une invention…\n2/2 D'un pas impérial, Lord Halloway s’écarte froidement. Sa voix s'élève, métallique, écrasant l'assemblée.\nLORD HALLOWAY\n(à l’assemblée)\nVous riez comme des imbéciles...","cadrage":"Ensemble","mouv":"Fixe","support":"Trépied","focale":"14 mm","intExt":"Int","momentJour":"Jour","duree":"","vfxDesc":"","assets":"","tags":["LIVE","TBC"],"notesClient":""}]}

<script>
/* =========================================================================
   WRANGLE — journal de plateau.

   Une seule page de saisie : la journee, plan par plan, chaque plan portant
   ses prises. Tout ce qui concerne un shot se remplit la.
   Deux pages a cote qui ne parlent pas de shots : les cartes a copier
   et le rapport de fin de journee.

   Reprend la feuille "Shoot Sheet (Strict)" du tournage : elements captes
   par plan, releves camera par prise (focale, points de map, hauteurs,
   pan/tilt/roll).

   Version 2 — plusieurs appareils en meme temps.
   Servie par serveur.py, la page envoie chaque modification (champ par
   champ) au serveur, qui la rediffuse a tous les appareils connectes.
   Ouverte directement comme fichier, elle travaille seule dans le
   navigateur, comme avant. Dans les deux cas, tout est aussi garde en
   cache local : une coupure de Wi-Fi ne perd rien, les saisies repartent
   au retour du reseau.
   ========================================================================= */

const KEY    = 'fstdw.v1';     // cache local du projet
const KEY_UI = 'fstdw.ui';     // preferences propres a cet appareil (jour affiche, nom, theme)
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const SEED   = window.DT_SEED   || null;

const BLANK = {
  version: 2,
  prod: { titre:'', prod:'', real:'', dop:'', firstAD:'', producer:'',
          vfxStudio:'', vfxSuper:'', wrangler:'', dit:'',
          jour:'', date:'', lieu:'', unit:'',
          // verrouilles pour tout le projet : chaque prise les porte (Reglages → Camera du projet)
          objectif:'Sigma Classic Prime', lut:'ARRI LogC4 to Gamma24 Rec709 D65 v1' },
  optiques: [],
  plans: [], prises: []
};
const COLL = { plan:'plans', prise:'prises' };

/* La serie d'optiques du tournage : Sigma Classic Prime (partenariat Sigma),
   sans 85 ni 135 mm. Le decoupage prevoit parfois d'autres focales : le menu ne
   les propose pas, il n'affiche que la valeur deja notee sur la fiche si elle
   sort de la serie. */
const SERIE = ['14 mm', '20 mm', '24 mm', '28 mm', '35 mm', '40 mm', '50 mm', '105 mm'];

/* Elements captes sur le plateau. Les huit premiers sont ceux de la feuille
   de tournage ; les fonds et le mur LED s'y ajoutent car ils changent tout
   pour la post. Le quatrieme champ marque ceux qui meritent d'etre colores. */
/* dans l'ordre de la colonne « On set » du breakdown VFX ; puis ceux de l'app seule */
const ELEMENTS = [
  ['photogram',  'Photogrammétrie', 'PHOTOGRAM', ''],
  ['hdri',       'HDRI',           'HDRI',       ''],
  ['chrome',     'Chrome / grey ball', 'BALLS',    ''],
  ['vert',       'Fond vert',      'FOND VERT',  'v'],
  ['bleu',       'Fond bleu',      'FOND BLEU',  'v'],
  ['splat',      'Gaussian splat', 'SPLAT',      ''],
  ['chart',      'Color charts',   'CHARTS',     ''],
  ['plates',     'Extra plates',   'PLATES',     ''],
  ['cleanplate', 'Clean plate',    'CLEANPLATE', ''],
  ['wide',       'Wide angle camera', 'WIDE CAM', ''],
  ['trackers',   'Trackers',       'TRACKERS',   ''],
  ['lidar',      'Lidar',          'LIDAR',      ''],
  ['camtrack',   'CamTrack live',  'CAMTRACK',   ''],
  ['led',        'Mur LED',        'MUR LED',    'v'],
];
/* Les elements captes sont a chacun : chacun coche les siens (elements@Prenom),
   sans toucher a ceux des autres ; le plan etant partage, tous voyagent
   ensemble. Ceux d'avant, communs (p.elements), restent a qui les a coches
   (p.auteurs) ; ceux sans auteur sont a chacun, tant qu'il n'a pas les siens.
   Au premier element qu'on touche, les siens passent sous son prenom.
   elementsTous : l'ensemble, pour la liste, les filtres, les PDF et exports. */
function elementsDe(p, nom, moi){
  const out = {};
  if (!p) return out;
  const perso = p['elements@' + nom];
  if (perso && typeof perso === 'object'){ Object.keys(perso).forEach(k => { if (perso[k]) out[k] = true; }); return out; }
  const au = p.auteurs || {};
  Object.keys(p.elements || {}).forEach(k => {
    const a = au['el:' + k];
    if (p.elements[k] && (a ? a === nom : moi)) out[k] = true;
  });
  return out;
}
function elementsTous(p){
  const out = {};
  if (!p) return out;
  Object.keys(p.elements || {}).forEach(k => { if (p.elements[k]) out[k] = true; });
  let saisis = false;
  Object.keys(p).forEach(c => {
    if (c.indexOf('elements@') !== 0 || !p[c] || typeof p[c] !== 'object') return;
    saisis = true;
    Object.keys(p[c]).forEach(k => { if (p[c][k]) out[k] = true; });
  });
  // personne n'a rien saisi sur un plan tourne : la presaisie (On set de la Preparation), laissee telle quelle, fait foi
  if (!saisis && !Object.keys(out).length && (p.onSet || []).length &&
      (p.etat === 'done' || p.termine || DB.prises.some(t => t.planId === p.id)))
    p.onSet.forEach(k => { out[k] = true; });
  return out;
}
/* Ceux qui ont coche des elements sur ce plan : leurs prenoms. */
function quiAElements(p){
  const l = [];
  Object.keys(p || {}).forEach(c => { if (c.indexOf('elements@') === 0) l.push(c.slice(9)); });
  Object.keys((p && p.auteurs) || {}).forEach(c => { if (c.indexOf('el:') === 0 && p.elements && p.elements[c.slice(3)]) l.push(p.auteurs[c]); });
  return l.filter((n, i) => n && l.indexOf(n) === i);
}

/* Repris automatiquement d'une prise a la suivante : sur le plateau,
   la camera et l'optique ne changent pas entre deux prises d'un meme plan. */
/* Une cle de comparaison sans accents ni casse : « Épaules », « Epaules » et « épaules »
   sont un seul cadrage. Lue par normaliser : declaree avant le chargement. */
const cleSimple = v => String(v || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* Les petites mains que tout le fichier se passe : un element par son id, deux
   chiffres, l'heure « 14:35 », le pluriel, la fleche « depart → arrivee », un
   pictogramme au trait (le trace, sa taille, l'epaisseur du trait). Declarees
   avant le chargement du projet, comme cleSimple. */
const $ = id => document.getElementById(id);
const deuxCh = n => String(n).padStart(2, '0');
const hhmm = d => deuxCh(d.getHours()) + ':' + deuxCh(d.getMinutes());
const maintenant = () => hhmm(new Date());
const plur = n => n > 1 ? 's' : '';
// depart et arrivee ; la meme valeur aux deux bouts ne s'ecrit qu'une fois (« 14 mm », pas « 14 mm → 14 mm »)

/* Garantit la forme du projet, d'ou qu'il vienne (cache, serveur, import). */
function normaliser(d){
  const db = Object.assign(structuredClone(BLANK), d || {});
  db.prod = Object.assign(structuredClone(BLANK.prod), db.prod || {});
  ['plans', 'prises'].forEach(c => { if (!Array.isArray(db[c])) db[c] = []; });
  if (!Array.isArray(db.optiques)) db.optiques = [];
  delete db.ui;
  // le projet a ete renomme : on reprend l ancien titre des projets deja ouverts
  if (db.prod.titre === 'Foresight 2.0') db.prod.titre = 'Foresight';
  db.plans.forEach(p => {
    p.elements = p.elements || {};
    if (!Array.isArray(p.acteurs)) p.acteurs = [];
    // un personnage renomme reprend son nom definitif, sans doublon
    p.acteurs = [...new Set(p.acteurs.map(a => ACTEUR_ANCIEN[cleSimple(a)] || a))];
    // le decoupage ecrit « Epaule », « Epaules », « Épaules » : un seul cadrage
    const cad = cleSimple(p.cadrage);
    if (cad === 'epaule' || cad === 'epaules') p.cadrage = 'Épaules';
    else if (cad === 'tgp') p.cadrage = 'Très gros plan';
    // les deux boules ne font plus qu'un element : une ancienne boule grise cochee compte
    if (p.elements.grey){ p.elements.chrome = true; delete p.elements.grey; }
    // l'apercu du croquis n'est plus garde en image : il se redessine des traits
    if (p.croquisImg) delete p.croquisImg;
    // repare un projet dont les prises auraient garde un ancien jour
    db.prises.filter(t => t.planId === p.id)
             .forEach(t => { t.jour = p.jour || ''; t.plan = p.plan; t.seq = p.seq; });
  });
  // pan, tilt et roll ont gagne une arrivee : l'ancienne valeur unique devient le depart
  // un support note comme mouvement (Handheld, Steadicam…) rejoint sa case
  const ranger = (o, k) => { const s = SUPPORT_ANCIEN[String(o[k] || '').trim().toLowerCase()]; if (s){ if (!o.support) o.support = s; o[k] = ''; } };
  db.plans.forEach(p => ranger(p, 'mouv'));
  db.prises.forEach(t => ranger(t, 'mouvement'));
  // Pick-up etait un resultat parmi d'autres : c'est une marque a part, qui s'ajoute a OK ou NG
  db.prises.forEach(t => { if (t.statut === 'Pick-up'){ t.statut = ''; t.pickup = true; } });
  verrouillerPrises(db);
  // une prise sans heure reprend celle de sa creation : son identifiant commence par cet instant
  // (uid : l'horloge en base 36, puis cinq caracteres au hasard)
  db.prises.forEach(t => {
    if (t.heure || !t.id) return;
    const ms = parseInt(String(t.id).slice(0, -5), 36);
    if (!(ms > 1.5e12 && ms < 4e12)) return;   // un identifiant d'une autre forme : on ne devine pas
    t.heure = hhmm(new Date(ms));
  });
  db.prises.forEach(t => ['pan', 'tilt', 'roll'].forEach(k => {
    if (t[k] && !t[k + 'Start']) t[k + 'Start'] = t[k];
    delete t[k];
  }));
  return db;
}

/* ---- Le carnet d'avant les prenoms ------------------------------------
   Le site, et le serveur du plateau, ne gardaient qu'un carnet par
   navigateur, ou tout le monde saisissait. Chaque prise y porte le prenom de
   qui l'a saisie : ce carnet se partage donc, il ne se donne pas. Quand une
   personne se nomme, elle y prend le decoupage et ses prises a elle, et laisse
   celles des autres, qui les prendront a leur tour ; quand il n'y reste plus
   de prise, il s'efface. Seules des prises sans nom laissent un doute : la
   page demande alors, une fois par personne. */
const auteursDe = db => [...new Set(((db && db.prises) || []).map(t => (t.par || '').trim()).filter(Boolean))];
const estDe = (t, nom) => !!(t.par || '').trim() && espaceDe(t.par) === espaceDe(nom);
function ancienCarnet(){
  try{
    const brut = localStorage.getItem(KEY);
    if (!brut) return null;
    const db = JSON.parse(brut);
    if (!db || !Array.isArray(db.plans)) return null;
    if (!Array.isArray(db.prises)) db.prises = [];
    return { brut, db, prises: db.prises.length, auteurs: auteursDe(db) };
  }catch(e){ return null; }
}
/* la part d'une personne : le decoupage, et ses prises a elle */
const partDe = (a, nom) => Object.assign({}, a.db, { prises: a.db.prises.filter(t => estDe(t, nom)) });
/* ce qu'elle laisse aux autres ; plus de prise, plus de carnet */
function laisserLeReste(a, nom){
  const reste = a.db.prises.filter(t => !estDe(t, nom));
  try{
    if (reste.length) localStorage.setItem(KEY, JSON.stringify(Object.assign({}, a.db, { prises: reste })));
    else localStorage.removeItem(KEY);
  }catch(e){}
}
const ancienADemander = a => !!a && a.prises > 0 && a.auteurs.length === 0;   // il ne reste que des prises sans nom

function load(){
  let db = null;
  try{
    const cle = cleLocale();
    let raw = localStorage.getItem(cle);
    // le carnet d'avant les prenoms se partage : chacun y prend le decoupage et ses prises
    if (!raw && cle !== KEY){
      const a = ancienCarnet();
      if (a){ raw = JSON.stringify(partDe(a, UI.nom)); localStorage.setItem(cle, raw); laisserLeReste(a, UI.nom); }
    }
    if (raw) db = JSON.parse(raw);
  }catch(e){}
  // ancienne version : le jour affiche etait range dans le projet lui-meme
  if (db && db.ui && db.ui.jour && !localStorage.getItem(KEY_UI)){ UI.jour = db.ui.jour; ecrireUI(); }
  db = normaliser(db);
  // la graine integree passe aussi par la normalisation (cadrages, meteo, supports…)
  if (!db.plans.length && SEED){ seed(db); db = normaliser(db); }
  return db;
}

function seed(db){
  Object.assign(db.prod, SEED.prod || {});
  db.plans = (SEED.plans || []).map(p => Object.assign({ id: uid() }, PLAN_NEUF(), p));
}

/* A la place des fenetres du navigateur (confirm, prompt, alert) : une boite
   dans la charte, au doigt comme au clavier (Entree valide, Echap renonce).
   Chaque fonction rend une promesse ; une boite ouverte chasse la precedente. */
const DLG = { resoudre: null, annulation: false, retour: null };
function ouvrirDialogue(o){
  return new Promise(res => {
    if (DLG.resoudre) DLG.resoudre(DLG.annulation);
    DLG.resoudre = res; DLG.annulation = o.saisie == null ? false : null;
    DLG.retour = document.activeElement;
    const titre = $('dlg-titre'), msg = $('dlg-msg'), s = $('dlg-saisie'), oui = $('dlg-oui'), non = $('dlg-non');
    titre.textContent = o.titre || ''; titre.hidden = !o.titre;
    msg.textContent = o.detail || ''; msg.hidden = !o.detail;
    s.hidden = o.saisie == null;
    if (o.saisie != null){ s.value = o.saisie; s.placeholder = o.aide || ''; s.inputMode = o.im || 'text'; }
    oui.textContent = o.ok || 'OK'; oui.className = 'btn ' + (o.danger ? 'd' : 'p');
    non.textContent = o.annuler || 'Annuler'; non.hidden = o.annuler === false;
    const d = $('dlg'); d.hidden = false;
    requestAnimationFrame(() => { d.classList.add('on'); if (o.saisie != null){ s.focus(); s.select(); } else oui.focus(); });
  });
}
function fermerDialogue(valeur){
  const d = $('dlg'); if (d.hidden) return;
  d.classList.remove('on'); d.hidden = true;
  const r = DLG.resoudre, ret = DLG.retour; DLG.resoudre = null; DLG.retour = null;
  if (ret && ret.focus && document.contains(ret)) ret.focus();
  if (r) r(valeur);
}

/* ------------------------------------------------------------------ Reseau */
/* Servie par serveur.py, la page envoie ses modifications sous forme
   d'operations : patch (des champs d'une fiche), add, del, optiques,
   remplacer (projet complet). Le serveur les applique, tranche les
   conflits (numero de prise) et les rediffuse a tous.
   Les modifications de champs sont regroupees 250 ms avant l'envoi : une
   frappe au clavier ne fait pas une requete par lettre. */

/* La page est-elle servie par serveur.py ? Quand c'est lui, il le dit en tete
   (window.WRANGLE_SERVEUR) : c'est le seul signe sur des que le serveur est
   pose ailleurs que sur le Wi-Fi du plateau — un nom de domaine, une IP de
   reseau prive. A defaut, on juge sur l'adresse : machine locale, IP privee,
   nom sans point (pc-dit) ou en .local. Partout ailleurs — github.io, site
   publie — il n'y a pas d'API derriere la page : on reste en mode local. */
function serveurPossible(h){
  h = (h || '').replace(/^\[|\]$/g, '');
  return h === 'localhost' || h === '::1' || h.indexOf('.') < 0
      || /\.local$/.test(h) || /^127\./.test(h) || /^10\./.test(h)
      || /^192\.168\./.test(h) || /^169\.254\./.test(h)
      || /^172\.(1[6-9]|2\d|3[01])\./.test(h);
}

const RESEAU = {
  possible: PARTAGE,
  // le site chez l'hebergeur fait serveur en PHP : pas de flux, la page
  // l'interroge (SERVEUR_PHP)
  php: PARTAGE && SERVEUR_PHP,
  etat: 'local',          // local | ok | coupe
  rev: 0,
  attente: [],            // operations pas encore acceptees par le serveur
  tampon: {},             // modifications de champs en cours de regroupement
  presence: [],
  adresses: [],
  src: null,
  envoi: false,
  // change a chaque changement de personne : une reponse partie sous l'ancien
  // prenom ne doit ni s'appliquer ici, ni pousser ce carnet dans le nouvel espace
  session: 0,
  tTampon: null, tEnvoi: null, tPresence: null, tInterroge: null
};
/* l'adresse d'un appel : /api/etat chez serveur.py, api/etat.php chez l'hebergeur */
/* Chez l'hebergeur, les scripts sont a cote de la page (api/…). Publiee
   ailleurs — GitHub Pages, tant que le domaine n'y est pas rattache — la page
   porte en tete l'adresse du serveur a appeler (window.WRANGLE_API). */
const API = nom => RESEAU.php ? (window.WRANGLE_API ? String(window.WRANGLE_API).replace(/\/*$/, '/') : 'api/') + nom + '.php' : '/api/' + nom;
/* l'espace de cet appareil sur le serveur : celui de son prenom */
const monEspace = () => RESEAU.possible ? espaceDe(UI.nom) : '';
/* Ce qui n'est pas encore parti est garde par onglet ET par espace : sinon,
   apres un rechargement, les operations d'une personne partiraient sous le
   prenom d'une autre. Celles d'un prenom qu'on quitte restent garees la,
   pour le jour ou l'on y revient. */
const cleAttente = () => 'fstdw.attente.' + CLIENT + (monEspace() ? '.' + monEspace() : '');
/* La memoire d'un onglet meurt avec lui : un telephone qui saisit en zone
   blanche puis ferme l'appli (ou que le systeme ferme) avant le retour de la
   4G perdrait ce qui n'est pas parti, la copie locale etant ensuite remplacee
   par celle du serveur. La file est donc aussi gardee sur l'appareil, datee :
   un onglet vivant la redate toutes les cinq secondes ; celle qui n'a plus
   bouge depuis vingt est d'un onglet ferme, et le premier qui s'ouvre sous le
   meme prenom la reprend et l'envoie. Le serveur reconnait une prise deja
   recue a son identifiant : un double envoi ne fait pas de doublon. */
const ATTENTE_ORPHELINE = 20000;
function lireAttente(){
  let a = [];
  try{ a = JSON.parse(sessionStorage.getItem(cleAttente()) || '[]') || []; }catch(e){}
  const orphelines = [];
  try{
    const esp = monEspace(), t = Date.now();
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (!k || k.indexOf('fstdw.attente.') !== 0 || k === cleAttente()) continue;
      const f = JSON.parse(localStorage.getItem(k) || 'null');
      if (f && f.espace === esp && f.client !== CLIENT && t - (f.t || 0) > ATTENTE_ORPHELINE && Array.isArray(f.ops))
        orphelines.push({ k, t: f.t || 0, ops: f.ops });
    }
  }catch(e){}
  if (!orphelines.length) return a;
  // les plus anciennes d'abord : elles ont ete saisies avant celles de cet onglet
  orphelines.sort((x, y) => x.t - y.t);
  orphelines.forEach(o => { try{ localStorage.removeItem(o.k); }catch(e){} });
  return orphelines.reduce((l, o) => l.concat(o.ops), []).concat(a);
}
function ecrireAttente(){
  try{ sessionStorage.setItem(cleAttente(), JSON.stringify(RESEAU.attente)); }catch(e){}
  try{
    if (RESEAU.attente.length)
      localStorage.setItem(cleAttente(), JSON.stringify({ client: CLIENT, espace: monEspace(), t: Date.now(), ops: RESEAU.attente }));
    else localStorage.removeItem(cleAttente());
  }catch(e){}
}
if (RESEAU.possible){
  RESEAU.attente = lireAttente();
  if (RESEAU.attente.length) ecrireAttente();
  setInterval(() => { if (RESEAU.attente.length) ecrireAttente(); }, 5000);
}

/* Modifie des champs d'une fiche : ici tout de suite, chez les autres ensuite. */
/* Un shot valide (coche verte) est verrouille : ni lui, ni ses prises ne se modifient tant
   qu'on ne l'a pas rouvert. Seul le decocher passe. */
function shotDe(kind, id){ return kind === 'plan' ? plan(id) : kind === 'prise' ? (p => p && plan(p.planId))(prise(id)) : null; }
/* Une journee verrouillee (Journee -> Jours de tournage) l'est pour toute l'equipe :
   ses shots, leurs prises, sa preparation, sa date et son decor ne se modifient
   plus tant qu'on ne l'a pas rouvert. verrouille rend le jour en cause, ou true
   pour un shot valide, ou false. */
const jourFige = j => !!(j && DB.prod && DB.prod['verrou_' + j]);
const bloque = p => !!p && (!!p.termine || jourFige(p.jour));
function verrouille(kind, id, data){
  if (kind === 'prod')
    return (data && Object.keys(data).map(k => (/^(?:date|decor)_(.+)$/.exec(k) || [])[1]).find(jourFige)) || false;
  const p = shotDe(kind, id);
  // un shot ne passe pas dans une journee verrouillee
  if (kind === 'plan' && data && data.jour && jourFige(data.jour) && (!p || p.jour !== data.jour)) return data.jour;
  if (!p) return false;
  if (jourFige(p.jour)) return p.jour;
  if (!p.termine) return false;
  if (kind === 'plan' && data && Object.keys(data).every(k => k === 'termine' || k === 'auteurs')) return false;
  return true;
}
function prevenirVerrou(p, j){
  if (!j && p && jourFige(p.jour)) j = p.jour;
  toast(j ? nomJour(j) + ' verrouillé : rouvrez-le dans Journée pour le modifier'
          : 'Shot ' + ((p && p.plan) || '') + ' validé : décochez-le pour le modifier');
  // ce qui a ete tape a l'ecran reprend la valeur gardee
  if (openType === 'plan' || openType === 'prise') setTimeout(rouvrirFiche, 0);
}
function patch(kind, id, data){
  const o = kind === 'prod' ? DB.prod : cible(id);
  if (!o) return;
  const v = verrouille(kind, id, data);
  if (v) return prevenirVerrou(shotDe(kind, id), typeof v === 'string' ? v : '');
  if (kind === 'plan') data = avecAuteurs(o, data);
  Object.assign(o, data);
  save();
  if (!RESEAU.possible) return;
  const k = kind + '|' + (id || '');
  const t = RESEAU.tampon[k] || (RESEAU.tampon[k] = { op:'patch', kind, id: kind === 'prod' ? undefined : id, data:{} });
  Object.assign(t.data, data);
  clearTimeout(RESEAU.tTampon); RESEAU.tTampon = setTimeout(viderTampon, 250);
}
/* Qui a pose quoi sur un plan. Le plan est partage : ce qu'un seul coche
   arrive chez tout le monde ; la fiche ne montre la pastille que de celui qui
   l'a coche ou change (p.auteurs : { 'el:hdri': 'Romain', etat: 'Simon' }). */
// l'etat, et tout le contexte du shot : chaque champ garde le nom de qui l'a saisi
const AUTEURS_SUIVIS = ['etat', 'meteo', 'lieu', 'intExt', 'momentJour', 'acteurs', 'figu', 'cadrage', 'mouv', 'support', 'focale', 'duree'];
/* Le contexte du shot reste commun (une valeur par ligne, pour la liste, les PDF, les exports),
   mais chacun garde aussi ce qu'il y a saisi lui-meme (saisie@Prenom : { meteo:'Couvert', … }) :
   la fiche compare, comme pour une prise — vert si l'on a saisi pareil, rouge sinon. */
const CONTEXTE_DOUBLE = ['lieu', 'intExt', 'momentJour', 'meteo', 'acteurs', 'figu', 'cadrage', 'mouv', 'support', 'focale', 'duree'];
function saisiesDe(p, k){
  const out = {};
  Object.keys(p || {}).forEach(c => { if (c.indexOf('saisie@') === 0 && p[c] && typeof p[c] === 'object' && k in p[c]) out[c.slice(7)] = p[c][k]; });
  // d'avant : qui a saisi la ligne (p.auteurs) y a mis la valeur commune
  const a = ((p && p.auteurs) || {})[k];
  if (a && !(a in out) && valRap(p[k])) out[a] = p[k];
  return out;
}
function avecAuteurs(o, data){
  if (!UI.nom || 'auteurs' in data) return data;
  // la page Preparation prevoit, elle ne saisit pas : ce qu'on y tape reste la presaisie du tournage
  if (view === 'prep' && openType !== 'plan') return data;
  const au = Object.assign({}, o.auteurs || {}), cleS = 'saisie@' + UI.nom.trim();
  let change = false, mes = null;
  const leurs = {};
  Object.keys(data).forEach(k => {
    if (CONTEXTE_DOUBLE.indexOf(k) >= 0){
      const v = data[k];
      mes = mes || Object.assign({}, o[cleS] || {});
      if (v != null && v !== false && valRap(v)) mes[k] = Array.isArray(v) ? v.slice() : v; else delete mes[k];
      // une valeur d'avant, saisie par un autre sans saisie a son nom : elle passe sous son nom avant d'etre remplacee
      const x = au[k], cx = 'saisie@' + x;
      if (x && x !== UI.nom.trim() && valRap(o[k]) && !(o[cx] && typeof o[cx] === 'object' && k in o[cx]))
        leurs[cx] = Object.assign({}, leurs[cx] || o[cx] || {}, { [k]: o[k] });
    }
    if (k === 'elements'){
      const av = o.elements || {}, ap = data.elements || {};
      new Set(Object.keys(av).concat(Object.keys(ap))).forEach(e => {
        if (!!av[e] === !!ap[e]) return;
        if (ap[e]) au['el:' + e] = UI.nom; else delete au['el:' + e];
        change = true;
      });
    } else if (AUTEURS_SUIVIS.indexOf(k) >= 0){
      const v = data[k]; if (v != null && v !== false && String(v).trim()) au[k] = UI.nom; else delete au[k];
      change = true;
    }
  });
  const out = change ? Object.assign({}, data, { auteurs: au }) : data;
  return mes ? Object.assign({}, out, leurs, { [cleS]: mes }) : out;
}
function viderTampon(){
  clearTimeout(RESEAU.tTampon); RESEAU.tTampon = null;
  const l = Object.values(RESEAU.tampon); RESEAU.tampon = {};
  if (!l.length) return;
  l.forEach(op => RESEAU.attente.push(op));
  ecrireAttente(); planifierEnvoi();
}
/* Ajout, suppression, serie d'optiques, remplacement complet. */
function operer(op){
  save();
  if (!RESEAU.possible) return;
  viderTampon();
  RESEAU.attente.push(op); ecrireAttente(); planifierEnvoi();
}
function planifierEnvoi(){ if (!RESEAU.tEnvoi) RESEAU.tEnvoi = setTimeout(envoyer, 0); }

/* Ce que la page envoie au serveur : qui elle est, et la charge. */
const corpsOps = ops => JSON.stringify({ client: CLIENT, nom: UI.nom, espace: monEspace() || undefined, ops });
const poster = (url, corps) => fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: corps });

function envoyer(){
  RESEAU.tEnvoi = null;
  if (RESEAU.envoi || !RESEAU.attente.length || !RESEAU.possible) return;
  RESEAU.envoi = true;
  const lot = RESEAU.attente.slice(0, 200), s = RESEAU.session;
  poster(API('ops'), corpsOps(lot))
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(rep => {
    if (s !== RESEAU.session) return;   // envoi de la personne d'avant : sa reponse ne nous concerne plus
    RESEAU.attente.splice(0, lot.length); ecrireAttente();
    // en interrogation, c'est l'interrogation qui avance la revision : sauter
    // dessus ici ferait manquer ce que les autres ont fait entre-temps
    if (!RESEAU.php) RESEAU.rev = rep.rev || RESEAU.rev;
    let change = false;
    (rep.ops || []).forEach(op => { if (appliquerEcho(op)) change = true; });
    if (change) rafraichirDoux();
    setEtatReseau('ok');
    interrogerBientot();
  })
  .catch(() => { if (s !== RESEAU.session) return; setEtatReseau('coupe'); RESEAU.tEnvoi = setTimeout(envoyer, 3000); })
  .then(() => { RESEAU.envoi = false; if (s === RESEAU.session && RESEAU.attente.length && RESEAU.etat === 'ok' && !RESEAU.tEnvoi) planifierEnvoi(); });
}

/* Le serveur renvoie nos propres operations, parfois corrigees : un numero
   de prise deja pris par un autre appareil, une renumerotation apres
   suppression. On ne reprend que ces numeros, jamais les autres champs,
   qui ont pu changer ici entre-temps. */
function appliquerEcho(op){
  if (!op || !op.data || !('n' in op.data)) return false;
  if (op.op !== 'add' && !(op.op === 'patch' && Object.keys(op.data).length === 1)) return false;
  const t = prise(op.op === 'add' ? op.data.id : op.id);
  if (!t || t.n === op.data.n) return false;
  t.n = op.data.n; save();
  return true;
}

/* Applique une operation venue d'un autre appareil. Retourne vrai si le
   projet a change. Ne redessine rien. */
function appliquerOp(op){
  if (!op) return false;
  if (op.op === 'remplacer'){ if (!op.db) return false; DB = normaliser(op.db); return true; }
  if (op.op === 'optiques'){ DB.optiques = (op.liste || []).slice(); return true; }
  if (op.op === 'move'){
    if (op.kind !== 'plan' || !deplacerLocal(op.id, op.apres == null ? '' : op.apres)) return false;
    oublierPrep();
    return true;
  }
  if (op.op === 'patch'){
    const o = op.kind === 'prod' ? DB.prod : cible(op.id);
    if (!o || !op.data) return false;
    Object.assign(o, op.data);
    if (op.kind === 'plan' && ['jour', 'plan', 'seq'].some(k => k in op.data)) propagerLocal(o);
    return true;
  }
  if (op.op === 'add'){
    const coll = COLL[op.kind];
    if (!coll || !op.data || !op.data.id) return false;
    const ex = cible(op.data.id);
    if (ex){ Object.assign(ex, op.data); return true; }
    if (op.kind === 'plan' && op.apres != null){
      // '' : en tete de liste ; sinon juste apres le plan indique
      const i = op.apres === '' ? -1 : DB.plans.findIndex(p => p.id === op.apres);
      if (op.apres === '' || i >= 0){ DB.plans.splice(i + 1, 0, op.data); return true; }
    }
    DB[coll].push(op.data);
    return true;
  }
  if (op.op === 'del'){
    const coll = COLL[op.kind];
    if (!coll) return false;
    const n = DB[coll].length;
    DB[coll] = DB[coll].filter(e => e.id !== op.id);
    if (op.kind === 'plan') DB.prises = DB.prises.filter(t => t.planId !== op.id);
    if (chrono && !prise(chrono.priseId)) chrono = null;
    if (dernierPlan && !plan(dernierPlan)) dernierPlan = null;
    return DB[coll].length !== n;
  }
  return false;
}

function connecter(){
  if (!RESEAU.possible) return;
  if (RESEAU.php){ interroger(); return; }
  if (!('EventSource' in window)) return;
  if (RESEAU.src){ RESEAU.src.close(); RESEAU.src = null; }
  if (!UI.nom) return;   // l'espace, c'est le prenom : on se branche une fois nomme
  const src = new EventSource('/api/flux?client=' + encodeURIComponent(CLIENT) +
                              '&nom=' + encodeURIComponent(UI.nom) + '&espace=' + encodeURIComponent(monEspace()));
  src.onopen = () => setEtatReseau('ok');
  src.onerror = () => setEtatReseau('coupe');     // EventSource se reconnecte tout seul
  src.onmessage = e => { let m; try{ m = JSON.parse(e.data); }catch(x){ return; } recevoir(m); };
  RESEAU.src = src;
}

/* Sans flux (le site chez l'hebergeur), la page interroge le serveur : toutes
   les deux secondes quand elle est visible, toutes les quinze sinon, et tout
   de suite apres un envoi. Elle recoit ce qui a change depuis sa revision, ou
   le projet entier quand elle a trop de retard. */
function interroger(){
  clearTimeout(RESEAU.tInterroge); RESEAU.tInterroge = null;
  if (!RESEAU.php) return;
  const suivant = ms => { clearTimeout(RESEAU.tInterroge); RESEAU.tInterroge = setTimeout(interroger, ms); };
  if (!UI.nom){ suivant(1000); return; }   // l'espace, c'est le prenom : on attend qu'il soit choisi
  const s = RESEAU.session;
  fetch(API('depuis') + '?rev=' + RESEAU.rev + '&client=' + encodeURIComponent(CLIENT) +
        '&nom=' + encodeURIComponent(UI.nom || '') + '&espace=' + encodeURIComponent(monEspace()), { cache:'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(m => {
    if (s !== RESEAU.session) return;   // reponse pour la personne d'avant : ni son projet ni sa revision ici
    recevoir({ type:'presence', liste: m.presence || [] });   // d'abord : les noms servent aux ops
    if ('db' in m) recevoir({ type:'etat', db: m.db, rev: m.rev, adresses: [] });
    else {
      (m.ops || []).forEach(e => recevoir({ type:'ops', client: e.client, rev: e.rev, ops: e.ops }));
      RESEAU.rev = m.rev || RESEAU.rev;
    }
    setEtatReseau('ok');
    suivant(document.hidden ? 15000 : 2000);
  })
  .catch(() => { if (s !== RESEAU.session) return; setEtatReseau('coupe'); suivant(5000); });
}
function interrogerBientot(){
  if (!RESEAU.php) return;
  clearTimeout(RESEAU.tInterroge); RESEAU.tInterroge = setTimeout(interroger, 50);
}
/* Changer d'espace sur le serveur (autre personne, carnet rendu ou repris) :
   les reponses en route ne valent plus rien, la revision repart de zero, et
   on se rebranche — le flux sur le nouvel espace, ou l'interrogation. */
function nouvelleSession(attente){
  if (!RESEAU.possible) return;
  RESEAU.session++; RESEAU.rev = 0; RESEAU.attente = attente || [];
  if (RESEAU.php) interrogerBientot(); else connecter();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ interrogerBientot(); verifierVersion(); } });

/* La page publiee change souvent, et un telephone la garde ouverte des jours :
   il tournerait alors sur une version d'avant sans le savoir. La publication
   ecrit son numero dans version.txt, a cote de la page ; on le compare de loin
   en loin, et on propose de recharger. Rien en local, ou le fichier n'existe pas. */
let tVersion = 0;
function verifierVersion(){
  if (!window.WRANGLE_VERSION || Date.now() - tVersion < 300000) return;
  tVersion = Date.now();
  fetch('version.txt', { cache:'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    if ((v || '').trim() && v.trim() !== window.WRANGLE_VERSION)
      toastAction('Une nouvelle version du carnet est en ligne.', 'Recharger', () => location.reload());
  }).catch(() => {});
}

function recevoir(m){
  if (m.type === 'etat'){
    RESEAU.adresses = m.adresses || [];
    RESEAU.rev = m.rev || 0;
    if (!m.db){
      // le serveur n'a encore rien : cet appareil envoie son projet, decoupage compris.
      // siVide : si un autre appareil l'a devance, le sien reste et celui-ci est ignore
      // (une seule fois : en interrogation, la reponse suivante peut arriver avant l'envoi)
      if (!RESEAU.attente.some(op => op.op === 'remplacer')){
        operer({ op:'remplacer', db: DB, siVide: true });
        toast('Projet envoyé au serveur');
      }
    } else {
      DB = normaliser(m.db);
      // ce qui a ete saisi hors ligne est rejoue par-dessus, puis renvoye
      RESEAU.attente.forEach(op => appliquerOp(op));
      if (fJour !== '*' && joursConnus().indexOf(fJour) < 0) setJour('*');
      save(); rafraichirDoux();
    }
    setEtatReseau('ok');
    envoyerPresence(); planifierEnvoi();
  } else if (m.type === 'ops'){
    if (m.client === CLIENT) return;
    RESEAU.rev = m.rev || RESEAU.rev;
    let change = false;
    (m.ops || []).forEach(op => { if (appliquerOp(op)) change = true; });
    if (change){ save(); rafraichirDouxBientot(); signalerDistant(m); }
  } else if (m.type === 'presence'){
    RESEAU.presence = m.liste || [];
    majPresence();
  }
}

/* Un mot quand un autre appareil ajoute une prise : on sait ou en est le plateau. */
function signalerDistant(m){
  const qui = (RESEAU.presence.find(x => x.client === m.client) || {}).nom || 'Un autre appareil';
  const ajouts = m.ops.filter(op => op.op === 'add' && op.kind === 'prise');
  if (ajouts.length === 1){
    const t = ajouts[0].data;
    toast(qui + ' : prise ' + t.n + ' · shot ' + (t.plan || 'sans n°'));
  } else if (m.ops.some(op => op.op === 'remplacer')) toast(qui + ' a remplacé le projet');
}

function setEtatReseau(e){
  if (RESEAU.etat === e) return;
  RESEAU.etat = e; majPresence();
}

/* Qui est la, et ce qu'il regarde : envoye a chaque ouverture ou fermeture de fiche. */
function envoyerPresence(){
  if (!RESEAU.possible) return;
  clearTimeout(RESEAU.tPresence);
  RESEAU.tPresence = setTimeout(() => {
    const v = planVise();
    RESEAU.viseEnvoye = v ? v.id : '';
    const actif = [openType === 'prise' || openType === 'plan' ? openType + ':' + openId : '',
                   v ? 'vise:' + v.id : '', typeof ouvrirCroquis === 'function' && dessin ? 'croquis:' + dessin.planId : ''].filter(Boolean).join(';');
    poster(API('presence'), JSON.stringify({ client: CLIENT, nom: UI.nom, actif, espace: monEspace() || undefined })).catch(() => {});
  }, 300);
}
const initiale = n => ((n || '').trim().charAt(0) || '?').toUpperCase();
/* La couleur d'une personne, la meme sur tous les appareils : sa place dans
   l'equipe (un prenom hors de la liste prend une couleur tiree de ses lettres). */
function couleurDe(nom){
  const pal = ['var(--tag-bleu)', '#b48ad6', 'var(--tag-orange)', '#5fb3b3', 'var(--tag-rouge)', '#c9a27a'];
  let i = EQUIPE.indexOf(nom);
  if (i < 0) i = [...String(nom || '')].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  return pal[i % pal.length];
}
const autres = () => RESEAU.presence.filter(x => x.client !== CLIENT);

/* Les connectes, une ligne par personne : un meme prenom sur deux onglets ou
   deux appareils (ou un navigateur relance, dont l'ancien onglet n'a pas encore
   expire) ne compte qu'une fois ; cet appareil d'abord. */
function personnesConnectees(){
  const vus = new Map();
  RESEAU.presence.slice().sort((a, b) => (a.client === CLIENT ? 0 : 1) - (b.client === CLIENT ? 0 : 1))
    .forEach(x => { const k = x.nom ? 'n:' + x.nom : 'c:' + x.client; if (!vus.has(k)) vus.set(k, x); });
  return [...vus.values()];
}
function majPresence(){
  const b = $('pres');
  const gens = personnesConnectees(), n = gens.length;
  b.className = 'pill ' + RESEAU.etat;
  // le prenom de qui saisit sur cet appareil ; le point dit l'etat du reseau,
  // et porte le nombre de connectes quand ils sont plusieurs : la pastille
  // reste courte, dans la colonne comme sur un telephone
  const moi = UI.nom || '';
  b.querySelector('span').textContent =
    RESEAU.etat === 'local' ? (moi ? moi + ' · local' : 'Local') :
    RESEAU.etat === 'coupe' ? (moi ? moi + ' · hors ligne' : 'Hors ligne') :
    (moi || 'En ligne');
  const point = b.querySelector('i');
  if (RESEAU.etat === 'ok' && n > 1) point.dataset.n = n; else delete point.dataset.n;
  b.title = RESEAU.etat === 'local' ? 'Page ouverte en local : un seul appareil'
          : (n > 1 ? n + ' en ligne : ' : '') + gens.map(x => x.nom || 'sans nom').join(', ');
  majMarqueurs();
  const e = $('equipe');
  if (e) e.innerHTML = htmlListeEquipe();
}

/* L'initiale de la personne qui a une prise ou un plan ouvert, dans la liste. */
/* Le schema est commun : qui d'autre le dessine en ce moment (son editeur ouvert sur ce plan). */
const quiDessine = id => [...new Set(autres().filter(x => (x.actif || '').split(';').includes('croquis:' + id)).map(x => x.nom || 'Quelqu’un'))];
const texteDessine = l => l.length ? l.join(' et ') + (l.length > 1 ? ' modifient' : ' modifie') + ' déjà ce schéma' : '';
function majDejaCroquis(){
  // appelee des le demarrage, avant meme que l'editeur (dessin) soit declare : elle ne doit rien arreter
  try{
    // l'editeur ouvert : une fenetre pour qui dessine deja ce schema, ou s'y met pendant qu'on dessine ;
    // une seule fois par personne, et jamais par-dessus une autre question (elle attend la suivante)
    if (dessin && dessin.prevenus && !DLG.resoudre){
      const neufs = quiDessine(dessin.planId).filter(n => !dessin.prevenus.has(n));
      if (neufs.length){
        neufs.forEach(n => dessin.prevenus.add(n));
        prevenir(texteDessine(neufs), { detail: 'Vous pouvez dessiner aussi, mais le dernier enregistré l’emporte.' });
      }
    }
    document.querySelectorAll('.croq-deja[data-plan]').forEach(e => { const t = texteDessine(quiDessine(e.dataset.plan)); e.textContent = t; e.hidden = !t; });

function majMarqueurs(){

    // actif : « prise:id » ou « plan:id » (la fiche ouverte), puis « ;vise:id » (le plan du Moteur)

/* Un bouton par personne, celui en cours en or. Sert a l'arrivee comme dans

/* Chacun a ses saisies : on range celles de la personne qui part sous son
   prenom, on ouvre celles de celle qui arrive (le decoupage seul si elle n'a
   encore rien saisi). Avec un serveur, on change aussi d'espace dessus : le
   flux (ou l'interrogation) repart sur celui du nouveau prenom. */
function changerDePersonne(n){
  if (n === UI.nom){ setNom(n); return; }
  const partant = UI.nom, sonEspace = monEspace(), saCle = cleAttente();
  viderTampon(); flush();
  // ce que le partant n'a pas eu le temps d'envoyer part sous son prenom a lui,
  // jamais sous celui qui arrive ; tant que ce n'est pas passe, ca reste garde
  const reste = RESEAU.attente.slice();
  if (RESEAU.possible && partant && reste.length)
    poster(API('ops'), JSON.stringify({ client: CLIENT, nom: partant, espace: sonEspace, ops: reste }))
      .then(r => { if (r.ok) try{ sessionStorage.removeItem(saCle); localStorage.removeItem(saCle); }catch(e){} }).catch(() => {});
  setNom(n);
  DB = load();
  dernierPlan = null; chrono = null; corbeille = null; fQui = ''; RAP.sources = []; RAP.equipier = []; oublierAutres(); RAP.equipe = true; RAP.tente = false; UI.equipe = true;
  if (fJour !== '*' && joursConnus().indexOf(fJour) < 0){ fJour = '*'; UI.jour = '*'; ecrireUI(); }
  // les reponses parties sous l'ancien prenom ne valent plus rien : on change de session
  nouvelleSession(lireAttente());
  closeSheet(); renderAll();
  veillerAuCarnet();
}

/* Deux verifications au moment d'entrer, et a chaque changement de personne :
   un carnet d'avant les prenoms attend peut-etre son proprietaire, et le
   carnet ouvert n'est peut-etre pas celui de la personne en cours (herite par
   erreur du temps ou le navigateur n'en avait qu'un). On ne demande qu'une
   fois par personne. */
const carnetMarque = () => !!(UI.carnetOk || {})[espaceDe(UI.nom)];
function marquerCarnet(){ UI.carnetOk = Object.assign(UI.carnetOk || {}, { [espaceDe(UI.nom)]: true }); ecrireUI(); }
function veillerAuCarnet(){
  if (!UI.nom || carnetMarque()) return;
  const autres = auteursDe(DB).filter(x => espaceDe(x) !== espaceDe(UI.nom));
  if (autres.length) return rendreLesPrises(autres);
  const a = ancienCarnet();
  if (ancienADemander(a)) proposerAncienCarnet(a);
}
/* Le carnet ouvert porte des prises saisies par d'autres — reprises en bloc
   du temps ou le navigateur n'avait qu'un carnet. On propose de les rendre,
   chacune a son auteur : dans son carnet sur cet appareil, et dans son espace
   sur le serveur s'il y en a un. Les prises de la personne restent ici. */
function rendreLesPrises(autres){
  const leurs = DB.prises.filter(t => autres.some(x => estDe(t, x)));
  const n = leurs.length, toutes = n === DB.prises.length;
  confirmer(toutes && autres.length === 1
      ? 'Ce carnet a été saisi par ' + esc(autres[0]) + ', pas par vous.'
      : 'Ce carnet porte ' + n + ' prise' + plur(n) + ' saisie' + plur(n) + ' par ' + esc(autres.join(', ')) + '.', {
    detail: (toutes ? n + ' prise' + plur(n) + ' à son nom, et aucune à vous. ' : '')
      + 'Sans doute reprises par erreur, du temps où ce navigateur n’avait qu’un carnet. Les rendre les remet chez '
      + (autres.length > 1 ? 'chacun' : esc(autres[0])) + ', ici et sur le serveur' + (toutes ? ' ; vous repartez du découpage.' : ' ; les vôtres restent ici.'),
    ok: autres.length === 1 ? 'Les rendre à ' + esc(autres[0]) : 'Les rendre',
    annuler: toutes ? 'C’est le mien' : 'Elles sont à moi' }).then(oui => {
    if (!oui) return marquerCarnet();
    autres.forEach(qui => rendreA(qui, DB.prises.filter(t => estDe(t, qui))));
    DB.prises = DB.prises.filter(t => !autres.some(x => estDe(t, x)));
    dernierPlan = null; chrono = null; corbeille = null; RAP.sources = []; RAP.equipier = [];
    marquerCarnet(); flush();
    if (RESEAU.possible){ nouvelleSession([]); ecrireAttente(); operer({ op:'remplacer', db: DB }); }
    closeSheet(); renderAll();
    toast(n + ' prise' + plur(n) + ' rendue' + plur(n) + (autres.length === 1 ? ' à ' + autres[0] : ''));
  });
}
/* les prises d'une personne, remises dans son carnet : celui de cet appareil,
   et son espace sur le serveur. Son carnet fait foi ; les prises s'y ajoutent
   par la fusion du rapprochement, qui retrouve chaque plan par son numero. */
function rendreA(qui, prises){
  const apport = { nom: UI.nom, db: Object.assign({}, DB, { prises }) };
  const fondre = db => normaliser(fusionRap([{ nom: qui, db: normaliser(db) }, apport]));
  const cle = KEY + ':' + espaceDe(qui);
  try{ localStorage.setItem(cle, JSON.stringify(fondre(JSON.parse(localStorage.getItem(cle) || 'null')))); }catch(e){}
  if (!RESEAU.possible) return;
  fetch(API('etat') + '?espace=' + encodeURIComponent(espaceDe(qui)), { cache:'no-store' }).then(r => r.json())
    .then(x => poster(API('ops'), JSON.stringify({ client: CLIENT, nom: qui, espace: espaceDe(qui),
                                                    ops: [{ op:'remplacer', db: fondre(x.db) }] })))
    .catch(() => {});
}
/* il ne reste, dans le carnet d'avant, que des prises sans nom : a qui sont-elles ? */
function proposerAncienCarnet(a){
  confirmer('Reprendre le carnet déjà commencé sur cet appareil ?', {
    detail: a.prises + ' prise' + plur(a.prises) + ' sans nom de saisisseur, d’avant que chacun ait le sien. Les reprendre les met sous votre prénom ; sinon elles restent ici, pour leur auteur.',
    ok: 'Reprendre', annuler: 'Pas à moi' }).then(oui => {
    if (!oui) return marquerCarnet();
    DB = normaliser(a.db);
    try{ localStorage.removeItem(KEY); }catch(e){}
    dernierPlan = null; chrono = null; corbeille = null; RAP.sources = []; RAP.equipier = [];
    marquerCarnet(); flush();
    if (RESEAU.possible){ nouvelleSession([]); ecrireAttente(); operer({ op:'remplacer', db: DB }); }
    closeSheet(); renderAll();
    toast('Carnet repris');
  });
}

/* --------------------------------------------------------------- Jours */

const numJour  = j => String(j).replace(/\D/g, '');
const rangJour = j => !j ? 999 : j === 'CG' ? 500 : (parseInt(numJour(j), 10) || 400);
/* Le nom entier ; et sur une pastille « J4 », qui tient la ou « Jour 4 » deborde :
   sept jours de tournage entrent alors d'un coup sur un telephone. */
const libelleJour = (j, prefixe) => !j ? 'Non planifiés' : j === 'CG' ? 'Hors plateau' : prefixe + numJour(j);
const nomJour  = j => libelleJour(j, 'Jour ');
const miniJour = j => libelleJour(j, 'J');

function joursConnus(){
  return [...new Set(DB.plans.map(p => p.jour || ''))].sort((a, b) => rangJour(a) - rangJour(b));
}
/* Les plans et les prises d'un jour ('' : non planifies). */
const plansDuJour  = j => DB.plans.filter(p => (p.jour || '') === (j || ''));
const prisesDuJour = j => DB.prises.filter(t => (t.jour || '') === (j || ''));

/* Les plans tournes sur les plans prevus, pour un jour ou pour le tournage. */
function avancement(j){
  const t = j === '*' ? DB.plans : plansDuJour(j);
  return { fait: t.filter(p => p.etat === 'done').length, total: t.length };
}

/* Le jour que l'on tourne : celui de la fiche Journee si elle est remplie,
   sinon le premier jour commence mais pas fini. Il porte un point d'or dans
   la rangee des jours : sur le plateau, c'est la seule pastille qui compte. */
function jourDuTournage(){
  const jours = joursConnus();
  // le jour dont la date (Jours de tournage, dans les reglages) est aujourd'hui
  const auj = new Date(), iso = auj.getFullYear() + '-' + deuxCh(auj.getMonth() + 1) + '-' + deuxCh(auj.getDate());
  const parDate = jours.find(x => x && x !== 'CG' && DB.prod['date_' + x] === iso);
  if (parDate) return parDate;
  const m = String(DB.prod.jour || '').match(/\d+/);
  if (m){
    const n = String(parseInt(m[0], 10));
    const j = jours.find(x => x && x !== 'CG' && numJour(x) === n);
    if (j) return j;
  }
  return jours.find(x => { const a = avancement(x); return a.fait > 0 && a.fait < a.total; }) || null;
}
/* Chaque jour de tournage a sa date et son decor (prod.date_J1, prod.decor_J1…),
   reglés dans les reglages ; sans decor note, c'est celui de ses plans. */
const decorDesPlans = j => frequences(plansDuJour(j).map(p => p.lieu || '—')).slice(0, 2).map(x => x[0]).join(' + ');
function decorJour(j){
  return String(DB.prod['decor_' + j] || '').trim() || decorDesPlans(j);
}
const dateJourFr = j => dateFr(DB.prod['date_' + j] || '') || (j && j === jourDuTournage() ? DB.prod.date || '' : '');

/* Les focales proposees : la serie du tournage, plus toute focale deja
   employee dans le decoupage ou saisie sur le plateau. */
function focales(){
  const l = [];
  // "100 mm Macro" et "100 mm macro" sont la meme optique : on ne la propose qu'une fois
  const vus = new Set();
  const voir = v => {
    v = (v || '').trim(); if (!v) return;
    const k = v.toLowerCase();
    if (!vus.has(k)){ vus.add(k); l.push(v); }
  };
  serieOptiques().forEach(voir);
  return trierFocales(l);
}
const serieOptiques = () => DB.optiques && DB.optiques.length ? DB.optiques : SERIE;
const trierFocales = l => l.sort((a, b) => (parseFloat(a) || 9999) - (parseFloat(b) || 9999) || a.localeCompare(b));

/* ------------------------------------------------------ Edition en direct */

/* Les prises recopient le jour, le numero de plan et la sequence pour
   l'affichage et l'export. Si le plan change, ces copies doivent suivre,
   sinon une prise se retrouve comptee dans la mauvaise journee. */
function propager(p){
  if (!p) return;
  prisesDe(p.id).forEach(t => patch('prise', t.id, { jour: p.jour || '', plan: p.plan, seq: p.seq }));
}
function propagerLocal(p){
  prisesDe(p.id).forEach(t => { t.jour = p.jour || ''; t.plan = p.plan; t.seq = p.seq; });
}

/* Une sequence sur deux chiffres : « 3 » devient « 03 », comme le decoupage. */
const seqPropre = v => /^\s*\d\s*$/.test(String(v || '')) ? '0' + String(v).trim() : String(v || '').trim();
function live(el){
  const id = el.dataset.o, k = el.dataset.k, kind = kindDe(id);
  if (!kind) return;
  // la sequence se complete quand on quitte le champ (pas a chaque frappe : « 1 » puis « 12 »)
  if (kind === 'plan' && k === 'seq' && !(typeof event !== 'undefined' && event && event.type === 'input')){
    const v = seqPropre(el.value); if (v !== el.value) el.value = v;
  }
  patch(kind, id, { [k]: el.type === 'checkbox' ? el.checked : el.value });
  if (kind === 'prise' && k === 'clip') carteSuitClip(cible(id));
  if (kind === 'prise' && k === 'carte') clipSuitCarte(cible(id));
  if (kind === 'plan' && ['jour', 'plan', 'seq'].indexOf(k) >= 0) propager(cible(id));
  if (kind === 'plan' && ['seqTitre', 'lieu', 'seq'].indexOf(k) >= 0) titrerSequence(cible(id), k);
  if (openType === kind){ majResumes(); decorerFiche(); }
  if (!el.dataset.refresh) return;
  // a la frappe, la liste attend une pause ; un choix ou une sortie de champ l'actualise tout de suite
  if (typeof event !== 'undefined' && event && event.type === 'input') renderListBientot(); else renderList();
}
/* Le titre et le decor d'une sequence valent pour toute la sequence : tapes
   sur un plan, ils se posent sur les autres plans du meme numero de sequence ;
   un plan qui change de sequence prend ceux qu'elle porte deja. Les cartes a
   l'ecran suivent. */
const CHAMPS_SEQ = ['seqTitre', 'lieu'];
function titrerSequence(p, k){
  if (!p) return;
  const seq = (p.seq || '').trim();
  if (!seq) return;
  const freres = DB.plans.filter(x => x !== p && (x.seq || '').trim() === seq);
  if (k === 'seq'){
    const d = {};
    CHAMPS_SEQ.forEach(c => {
      const v = freres.map(x => (x[c] || '').trim()).find(Boolean);
      if (v && v !== (p[c] || '')) d[c] = v;
    });
    if (Object.keys(d).length) patch('plan', p.id, d);
  } else {
    freres.forEach(x => { if ((x[k] || '') !== (p[k] || '')) patch('plan', x.id, { [k]: p[k] || '' }); });
  }
  CHAMPS_SEQ.forEach(c => document.querySelectorAll(`input[data-k="${c}"]`).forEach(el => {
    if (el === document.activeElement) return;
    const o = plan(el.dataset.o); if (!o) return;
    const v = o[c] || '';
    if (el.value !== v) el.value = v;
  }));
}
let tListe = null;
function renderListBientot(){
  clearTimeout(tListe);
  tListe = setTimeout(() => { tListe = null; renderList(); }, 250);
}

/* Une ligne de fiche technique : etiquette a gauche, valeur a droite.
   opt.im : clavier du telephone (decimal, numeric) ; opt.cap : majuscules.
   opt.auto : un texte libre qui tient sur une ligne au repos et grandit avec ce
   qu'on ecrit ; opt.heure lui ajoute le bouton qui pose l'heure en tete de ligne. */
/* Ce qui relie un champ a sa fiche : la fiche, la cle, et live() a chaque frappe. */
const liaison = (o, k, plus) => `data-o="${o.id || 'prod'}" data-k="${k}" oninput="live(this)${plus || ''}" onchange="live(this)"`;
const F = (o, label, k, opt) => {
  opt = opt || {};
  const v = esc(o[k]);
  const at = liaison(o, k, opt.auto ? ';autoHauteur(this)' : '') +
             (opt.refresh ? ' data-refresh="1"' : '') +
             (opt.im ? ` inputmode="${opt.im}"` : '') +
             (opt.cap ? ` autocapitalize="${opt.cap}"` : '');
  const ph = opt.ph ? ` placeholder="${esc(opt.ph)}"` : '';
  if (opt.auto)
    return `<div class="spec auto${opt.heure ? ' bouton' : ''}"><label>${label}</label><textarea class="auto" rows="1" ${at}${ph}>${v}</textarea>` +
      (opt.heure ? `<button type="button" class="mini" onclick="horodater(this)" title="Poser l’heure en tête de ligne">&#65291; heure</button>` : '') +
      `</div>`;
  if (opt.area)
    return `<div class="spec col"><label>${label}</label><textarea ${at}${ph}>${v}</textarea></div>`;
  if (opt.opts)
    return `<div class="spec"><label>${label}</label><select ${at}>` +
      opt.opts.map(x => `<option${x === o[k] ? ' selected' : ''}>${esc(x)}</option>`).join('') +
      `</select></div>`;
  return `<div class="spec"><label>${label}</label><input ${at} value="${v}"${ph}>` +
         (opt.dl ? `<button type="button" class="deroul" data-liste="${opt.dl}" onclick="ouvrirMenu(this)" aria-label="Choisir dans la liste">${CHEVRON_BAS}</button>` : '') +
         `</div>`;
};

/* Deux champs qui vont toujours ensemble : depart et arrivee d'un mouvement. */
const DUO = (o, label, ka, kb, ph) => {
  const un = k => `<input ${liaison(o, k)} data-refresh="1" value="${esc(o[k])}" placeholder="${ph}">`;
  return `<div class="spec"><label>${label}</label><div class="duo">${un(ka)}<em>&#8594;</em>${un(kb)}</div></div>`;
};

/* ------------------------------------------------------- Menus deroulants */

/* Les listes proposees par les menus. Le champ reste libre : le menu ne fait
   que remplir plus vite. Le jour suit ceux deja connus du projet. */
function fusion(base, plus){
  const vus = new Set(), out = [];
  base.concat(plus).forEach(v => { v = (v || '').trim(); const c = cleSimple(v); if (v && !vus.has(c)){ vus.add(c); out.push(v); } });
  return out;
}
const connus = (l, k) => fusion([], l.map(o => o[k]));
/* Les valeurs d'une liste, de la plus frequente a la plus rare : [valeur, nombre]. Les vides ne comptent pas. */
function frequences(vals){
  const n = {};
  vals.forEach(v => { if (v) n[v] = (n[v] || 0) + 1; });
  return Object.entries(n).sort((a, b) => b[1] - a[1]);
}
const LISTES = {

  // les sequences sur deux chiffres (« 3 » est « 03 »), dans l'ordre
  'dl-seq':     () => fusion([], connus(DB.plans, 'seq').map(seqPropre))
                        .sort((a, b) => (parseInt(a, 10) || 999) - (parseInt(b, 10) || 999) || a.localeCompare(b)),
  'dl-camname': () => fusion(['CAM-A', 'CAM-B', 'CAM-C'], connus(DB.prises, 'cam')),
  'dl-focale': () => focales(),
  'dl-jour': () => {
    // les cinq jours du tournage, et ceux que le decoupage connait deja ; CG s'il sert

    const l = new Set(['J1', 'J2', 'J3', 'J4', 'J5'].concat(connusJ));
    l.delete('CG');
    const num = j => parseInt(numJour(j), 10) || 0;
    return [...l].sort((a, b) => num(a) - num(b)).concat(connusJ.indexOf('CG') >= 0 ? ['CG'] : []);
  },

  'dl-cam':   () => fusion(['ARRI Alexa 35'], connus(DB.prises, 'camModel')),
  'dl-codec': () => fusion(['ARRIRAW', 'ProRes 4444 XQ', 'ProRes 4444', 'ProRes 422 HQ'], connus(DB.prises, 'codec')),
  // le diaph de l'optique (l'Alexa 35 affiche celui de l'objectif) : la serie cinema, par tiers
  'dl-diaph': () => fusion(['1.3', '1.4', '1.6', '1.8', '2', '2.2', '2.5', '2.8', '3.2', '3.5', '4', '4.5', '5', '5.6',
                            '6.3', '7.1', '8', '9', '10', '11', '13', '14', '16', '18', '20', '22'], connus(DB.prises, 'diaph')),
  // les formats capteur de l'Alexa 35 (Open Gate et anamorphiques compris)
  //   ceux du tournage d'abord : l'Open Gate, puis les deux 2:1
  'dl-reso':  () => fusion(['4.6K 3:2 Open Gate (4608 x 3164)', '4K 2:1 (4096 x 2048)', '2K 2:1 (2048 x 1024)',
                            '4.6K 16:9 (4608 x 2592)', '4K 16:9 (4096 x 2304)', 'UHD (3840 x 2160)', '3.3K 6:5 (3328 x 2790)',
                            '3K 1:1 (3072 x 3072)', '2.7K 8:9 (2743 x 3086)', '2K 16:9 S16 (2048 x 1152)', 'HD (1920 x 1080)'], connus(DB.prises, 'reso')),
  // la cadence : 0.75 a 120 i/s selon le format
  'dl-fps':   () => fusion(['23.976', '24', '25', '29.97', '30', '48', '50', '60', '75', '96', '100', '120'], connus(DB.prises, 'fps')),
  // les ND internes de l'Alexa 35 (FSND motorises)
  'dl-nd':    () => fusion(['Aucun', '0.6', '1.2', '1.8'], connus(DB.prises, 'nd')),
  // l'obturateur de l'ARRI Alexa 35 : en temps d'exposition (1 s a 1/8000) ou en angle (5 a 356°)
  'dl-shut':  () => fusion(['1/24', '1/48', '1/50', '1/60', '1/96', '1/100', '1/120', '1/200', '1/250', '1/500', '1/1000',
                            '5°', '11.2°', '22.5°', '45°', '90°', '144°', '172.8°', '180°', '270°', '356°'], connus(DB.prises, 'shutter')),

/* Le menu s'ouvre sous la ligne (au-dessus s'il manque de place), la valeur
   en cours cochee ; choisir remplit le champ comme si on l'avait tape. */
function ouvrirMenu(btn){
  const deja = btn.classList.contains('on');
  fermerMenu();
  if (deja) return;
  const row = btn.closest('.spec, .pc'), input = row.querySelector('input');
  let liste = LISTES[btn.dataset.liste] || [];
  if (typeof liste === 'function') liste = liste();
  // un champ a plusieurs valeurs (« Large / Poitrine ») coche chacune d'elles
  const multi = !!btn.dataset.multi;
  const choisis = multi ? valeursDe(input.value) : [(input.value || '').trim()];
  const m = document.createElement('div');
  m.className = 'menu' + (multi ? ' multi' : '');
  const ajout = AJOUTS[btn.dataset.liste];
  const indice = INDICES_MENU[btn.dataset.liste] || {};
  m.innerHTML = (liste.map(x => `<button type="button" class="${choisis.some(c => memeVal(c, x)) ? 'on' : ''}" data-v="${esc(x)}"
      onclick="choisirMenu(this)">${esc(x)}${indice[x] ? ` <em class="indice">${esc(indice[x])}</em>` : ''}</button>`).join('') || (ajout ? '' : '<div class="vide">Rien à proposer</div>')) +
    (ajout ? `<button type="button" class="autre" onclick="ajoutMenu('${btn.dataset.liste}', this)">${ajout.nom}</button>` : '');
  row.appendChild(m);
  btn.classList.add('on');
  // au bas de la fiche, le menu s'ouvre vers le haut
  const sb = m.closest('#sbody'), r = row.getBoundingClientRect(), h = m.offsetHeight;
  const cadre = sb ? sb.getBoundingClientRect() : { top:0, bottom:innerHeight };
  if (r.bottom + h > cadre.bottom && r.top - h > cadre.top) m.classList.add('haut');
  setTimeout(() => document.addEventListener('click', clicHorsMenu), 0);
}
/* Une explication a cote d'un choix du menu, sans toucher a la valeur notee */
const INDICES_MENU = {
  'dl-nd': { 'Aucun':'pas de filtre', '0.6':'2 diaphs de moins', '1.2':'4 diaphs de moins', '1.8':'6 diaphs de moins' },
  'dl-prio': { '1':'Principal', '2':'Optionnel', '3':'Plan de réserve' },
  'dl-sync': { 'Clap':'le clap à l’image', 'Jam TC':'timecode partagé caméra / son', 'MOS / muet':'sans son' }
};
function fermerMenu(){
  const m = document.querySelector('.menu'); if (!m) return false;
  const sp = m.closest('.spec, .pc'), b = sp ? sp.querySelector('.deroul') : document.querySelector('.ptag.on');
  window.removeEventListener('scroll', fermerMenu, { capture:true });
  if (b) b.classList.remove('on');
  m.remove();
  document.removeEventListener('click', clicHorsMenu);
  return true;
}
function clicHorsMenu(e){
  if (!e.target.isConnected) return;
  if (!e.target.closest('.menu') && !e.target.closest('.deroul') && !e.target.closest('.ptag')) fermerMenu();
}
/* Les listes qui s'allongent depuis leur menu : le nom du bouton, et ce qu'il fait
   (une promesse de la valeur ajoutee, vide si on renonce). */
/* « + Custom… » au bas d'un menu : une valeur hors liste, tapee ; elle revient ensuite dans le menu */
const custom = (titre, aide) => ({ nom: '+ Custom…', faire: () => demanderTexte(titre, { aide, ok:'Poser' })
  .then(v => String(v || '').trim()) });
const AJOUTS = {
  'dl-lieu': { nom: '+ Ajouter un décor…', faire: () => ajouterDecor() },

  'dl-codec': custom('Codec', 'ARRICORE, ProRes 422 LT…'),
  'dl-reso':  custom('Résolution', '4.6K 3:2 Open Gate 2x ana…'),

  'dl-wb':   { nom: '+ Valeur personnalisée…', faire: () => demanderTexte('Balance des blancs', { aide:'4850 K, 5600 K +3 CC…', im:'text', ok:'Poser' })
                 .then(v => { v = String(v || '').trim(); return /^\d+$/.test(v) ? v + ' K' : v; }) }
};
function ajoutMenu(cle, b){
  const input = b.closest('.spec, .pc').querySelector('input');
  fermerMenu();
  AJOUTS[cle].faire().then(v => { if (!v) return; input.value = v; live(input); });
}
/* Les valeurs d'un champ qui en porte plusieurs, separees par « / ». */
const valeursDe = s => String(s || '').split('/').map(x => x.trim()).filter(Boolean);
function choisirMenu(b){
  const input = b.closest('.spec, .pc').querySelector('input');
  if (b.closest('.menu').classList.contains('multi')){
    // on coche et decoche : le menu reste ouvert, le champ s'ecrit « Large / Poitrine »
    const v = b.dataset.v, actuels = valeursDe(input.value);
    const i = actuels.findIndex(x => memeVal(x, v));
    if (i >= 0) actuels.splice(i, 1); else actuels.push(v);
    input.value = actuels.join(' / ');
    live(input);
    b.classList.toggle('on', i < 0);
    return;
  }
  // la valeur deja cochee se decoche : le champ revient a vide
  input.value = b.classList.contains('on') ? '' : b.dataset.v;
  live(input);
  fermerMenu();
}

/* Deux valeurs sont les memes a la casse et aux espaces pres. */
const memeVal = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
/* Les capsules encore en place (la distribution, en preparation) suivent le projet. */
function majChoix(racine){
  document.querySelectorAll((racine || '#sbody') + ' .capsules').forEach(g => {
    const o = cible(g.dataset.cible); if (!o) return;
    const v = o[g.dataset.k];
    g.querySelectorAll('.fc[data-f]').forEach(b => b.classList.toggle('on',
      Array.isArray(v) ? v.some(x => memeVal(x, b.dataset.f)) : memeVal(b.dataset.f, v)));
    g.querySelectorAll('.fc[data-case]').forEach(b => b.classList.toggle('on', !!o[b.dataset.case]));
  });
}

/* Plusieurs a la fois : les acteurs d'un plan. Chaque capsule s'allume ou
   s'eteint seule ; le « + » ajoute un nom, connu ensuite de tous les plans. */
const ACTEURS = ['Edward', 'Lord Halloway', 'Associé d’Halloway', 'Président Académie', 'Académicien', 'Homme de main A', 'Homme de main B',
                 'Portier', 'Ménagère'];
const acteursConnus = () => fusion(ACTEURS, DB.plans.flatMap(p => p.acteurs || []));
const MULTI = (o, label, k, liste, opt) => {
  opt = opt || {};
  const v = o[k] || [];
  liste = fusion(liste, v);
  return `<div class="spec col"><label>${label}</label>
    <div class="capsules" data-cible="${o.id}" data-k="${k}">
      ${liste.map(x => `<button type="button" class="fc${v.some(y => memeVal(y, x)) ? ' on' : ''}" data-f="${esc(x)}"
          onclick="basculerListe('${o.id}', '${k}', this.dataset.f)">${esc(x)}</button>`).join('')}

      ${opt.cases ? `<span class="cases"><i class="sep"></i>` + opt.cases.map(([ck, nom]) => `<button type="button" class="fc${o[ck] ? ' on' : ''}" data-case="${ck}"
          onclick="basculerCase('${o.id}', '${ck}')">${nom}</button>`).join('') + `</span>` : ''}

/* La liste avec ou sans cette valeur : on l'y ajoute si elle n'y est pas, on l'en retire sinon. */
function avecOuSans(l, val){
  l = (l || []).slice();
  const i = l.findIndex(x => memeVal(x, val));
  if (i >= 0) l.splice(i, 1); else l.push(val);
  return l;
}
/* Apres un choix : les capsules de la fiche et de la preparation, les resumes, la liste. */
function majApresChoix(){ majChoix(); majChoix('#l-prep'); majResumes(); renderList(); }
function basculerListe(id, k, val){
  const o = cible(id); if (!o) return;
  patch(kindDe(id), id, { [k]: avecOuSans(o[k], val) });
  majApresChoix();
}
function basculerCase(id, k){
  const o = cible(id); if (!o) return;
  patch(kindDe(id), id, { [k]: !o[k] });
  majApresChoix();
}
function autreListe(id, k, el){ ligneSaisie(id, k, el, 'Nom du rôle…', 'poserDansListe'); }
/* Ce qu'une ligne de saisie designe : la fiche, le champ, la valeur tapee.
   Rien de tape : le curseur y retourne et on ne fait rien. */
function lireSaisie(input){
  const id = input.dataset.cible, o = cible(id), val = (input.value || '').trim();
  if (!o) return null;
  if (!val){ input.focus(); return null; }
  return { id, k: input.dataset.k, o, kind: kindDe(id), val };
}
function poserDansListe(input){
  const s = lireSaisie(input); if (!s) return;
  const l = (s.o[s.k] || []).slice();
  if (!l.some(x => memeVal(x, s.val))) l.push(s.val);
  patch(s.kind, s.id, { [s.k]: l });
  rouvrirFiche(); oublierPrep(); renderAll();
}

/* L'ambiance d'un plan (interieur ou exterieur, moment, meteo) est presque toujours
   celle du plan tourne juste avant : un appui la reprend. On ne touche qu'aux cases
   encore vides, et on dit d'avance ce qui sera pose. */
const AMBIANCE = ['intExt', 'momentJour', 'meteo'];
function ambianceVoisine(p){
  const i = DB.plans.indexOf(p);
  for (let j = i - 1; j >= 0; j--){
    const q = DB.plans[j];
    if ((q.jour || '') !== (p.jour || '')) continue;
    const d = {};
    AMBIANCE.forEach(k => { if (q[k] && !p[k]) d[k] = q[k]; });
    if (AMBIANCE.some(k => q[k])) return Object.keys(d).length ? { de: q, data: d } : null;
  }
  return null;
}
function htmlAmbianceVoisine(p){
  const v = ambianceVoisine(p);
  return v ? `<button type="button" class="comme" onclick="reprendreAmbiance('${p.id}')">
    <b>&#8630; Comme le shot ${esc(v.de.plan || '?')}</b><span>${AMBIANCE.map(k => v.data[k]).filter(Boolean).map(esc).join(' · ')}</span></button>` : '';
}
function reprendreAmbiance(id){
  const p = plan(id), v = p && ambianceVoisine(p); if (!v) return;
  patch('plan', id, v.data);
  toast('Ambiance du shot ' + (v.de.plan || '?') + ' reprise');
  renderList();
  champOuvert = '';
  redessinerFichePlan(p);
}

/* Les lignes que le plan et la prise ont en commun : la meteo, la focale (une valeur tapee
   rejoint la serie du tournage), le mouvement et le support. */
const CHAMP_METEO   = () => ({ k:'meteo', nom:'Météo', liste: METEOS, ico:1, autre:'poserValeur' });
const CHAMP_FOCALE  = (k, nom) => ({ k, nom, liste: focales(), court:1, autre:'ajouterFocale', trier: trierFocales, aide:'32, 18-35 zoom, 150 Macro…', im:'decimal' });

const CHAMP_SUPPORT = () => ({ k:'support', nom:'Support', liste: SUPPORTS, sep:' + ', autre:'poserDansTexte' });
const CHAMPS_PLAN = () => [
  { k:'lieu',       nom:'Décor',         liste: fusion(decorsTournage(), LISTES['dl-lieu']()), autre:'poserValeur' },
  { k:'intExt',     nom:'Int / Ext',     liste: ['Int', 'Ext', 'Int/Ext'], court:1 },

  { k:'acteurs',    nom:'Distribution',  liste: acteursConnus(), multi:1, cases:[['figu', 'Figuration']], autre:'poserDansListe', aide:'Nom du rôle…' },
  { k:'cadrage',    nom:'Cadrage',       liste: LISTES['dl-cadrage'](), sep:' / ', autre:'poserDansTexte' },

];
