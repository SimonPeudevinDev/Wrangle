/* ------------------------------------------------- Reprendre sa place */

/* Recharger la page ne doit pas ramener en haut, fiche fermee : sur le plateau
   on recharge pour prendre une mise a jour, et on veut retrouver le plan qu'on
   avait sous les yeux. L'onglet, le jour du rapport, la fiche ouverte, la ligne
   ouverte dedans et les deux defilements sont notes a chaque mouvement et au
   moment de quitter, dans la session de l'onglet : un nouvel onglet part
   propre. Le jour du tournage, lui, est deja garde dans les preferences. */
const CLE_PLACE = 'fstdw.place';
let tPlace = null;
function noterPlace(){
  const sb = $('sbody');
  const place = { view, jr: fJourR, openType, openId, champ: champOuvert,
                  y: window.scrollY, ys: sb ? sb.scrollTop : 0 };
  try{ sessionStorage.setItem(CLE_PLACE, JSON.stringify(place)); }catch(e){}
}
function noterPlaceBientot(){ clearTimeout(tPlace); tPlace = setTimeout(noterPlace, 150); }
window.addEventListener('scroll', noterPlaceBientot, { passive:true });
$('sbody').addEventListener('scroll', noterPlaceBientot, { passive:true });
window.addEventListener('pagehide', noterPlace);
document.addEventListener('visibilitychange', () => { if (document.hidden) noterPlace(); });

/* Une image qui se charge encore rend la page, ou la fiche, plus courte que la
   position visee : posee trop tot, elle serait rognee. On la repose a chaque
   image d'ecran tant qu'elle n'est pas atteinte, pendant deux secondes au plus.
   On s'arrete des qu'elle l'est : on ne se bat pas avec le doigt de l'usager. */
function remettreDefilement(el, y){
  if (!y) return;
  const boite = el === window ? document.scrollingElement : el;
  const poser = () => { if (el === window) window.scrollTo(0, y); else el.scrollTop = y; };
  let n = 120;
  const encore = () => {
    poser();
    if (Math.abs(boite.scrollTop - y) <= 1 || --n <= 0) return;
    requestAnimationFrame(encore);
  };
  encore();
}

function reprendrePlace(){
  let place = null;
  try{ place = JSON.parse(sessionStorage.getItem(CLE_PLACE) || 'null'); }catch(e){}
  if (!place) return;
  if (place.jr && place.jr !== '*' && joursConnus().indexOf(place.jr) >= 0) fJourR = place.jr;
  if (place.view && place.view !== view){
    const b = document.querySelector(`nav button[data-v="${place.view}"]`);
    if (b) b.click();
  }
  // la fiche, si ce qu'elle montrait existe encore ; y != null garde la ligne ouverte telle quelle
  if (place.openType === 'plan' && plan(place.openId)){
    champOuvert = place.champ || ''; openPlan(place.openId, place.ys || 0);
    remettreDefilement($('sbody'), place.ys);
  } else if (place.openType === 'prise' && prise(place.openId)){
    champOuvert = place.champ || ''; openPrise(place.openId, place.ys || 0);
    remettreDefilement($('sbody'), place.ys);
  }
  remettreDefilement(window, place.y);
}

/* Le logo ramene en haut de la page Tournage, d'ou que l'on vienne. */
/* La preparation (le decoupage) ne se modifie que par Simon ; les autres la
   consultent en lecture, jour par jour. Changer de prenom redessine la page. */
const PREPARATEURS = ['Simon'];
function prepare(){ return PREPARATEURS.indexOf((UI.nom || '').trim()) >= 0; }
/* Alex (DIT) ne saisit rien : il n'a que le Rapport, ni Preparation ni Tournage. */
const RAPPORT_SEUL = ['Alex'];
const rapportSeul = () => RAPPORT_SEUL.indexOf((UI.nom || '').trim()) >= 0;
function majOnglets(){
  oublierPrep();
  const seul = rapportSeul();
  document.querySelectorAll('nav button[data-v="prep"], nav button[data-v="shoot"]').forEach(b => b.hidden = seul);
  // apres le demarrage : la barre des jours du Rapport n'est construite qu'a la fin
  if (seul && view !== 'report') return void setTimeout(() => { if (rapportSeul() && view !== 'report') allerVue('report'); }, 0);
  if (view === 'prep') renderList();
}
function accueil(){
  if (openType) closeSheet();
  const v = rapportSeul() ? 'report' : 'shoot';
  if (view !== v) document.querySelector(`nav button[data-v="${v}"]`).click();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* Changer de page. Depuis le menu, la page pose sa marque dans l'historique :
   Retour y ramene ; depuis l'historique (Retour), elle ne s'y ajoute pas. */
function allerVue(v){
  if (rapportSeul()) v = 'report';
  const b = document.querySelector(`nav button[data-v="${v}"]`);
  if (!b) return;
  // le menu reste atteignable une fiche ouverte : on la referme d abord (ses marques
  // restent : Retour y revient, a la page ou elle etait ouverte)
  if (openType){ const r = RETOUR.rejoue; RETOUR.rejoue = true; try{ closeSheet(); } finally { RETOUR.rejoue = r; } }
  view = v;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(x => x.hidden = (x.id !== 'v-' + view));
  renderList();
  majFab();
  window.scrollTo(0, 0);
  if (!RETOUR.rejoue){
    const h = history.state;
    try{ if (!h || h.vue !== v || h.fiche) history.pushState({ vue: v }, ''); }catch(e){}
  }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => allerVue(b.dataset.v));
// la page d'ouverture porte sa marque : Retour depuis une autre page y revient
try{ if (!history.state) history.replaceState({ vue: view }, ''); }catch(e){}
majOnglets();
setTimeout(() => majAutres(true), 1500);   // le controle des prises, dans la liste, sans attendre quinze secondes

document.addEventListener('keydown', e => {
  if (DLG.resoudre) return;   // une boite de dialogue a la main
  // les fleches : d'un jour a l'autre sur la liste, d'une fiche a l'autre quand une est ouverte
  const sens = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
  if (sens && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '')){
    if (!openType && view !== 'prep' && $('voile-nom').hidden) jourVoisin(sens, view === 'report' ? 'report' : 'shoot');
    else if (openType === 'prise' || openType === 'plan') (openType === 'plan' ? voisinPlan : voisinePrise)(sens);
    return;
  }
  if (e.key !== 'Escape') return;
  if (dessin && !$('dpick').hidden){ fermerPick(); return; }
  if (dessin){ fermerCroquis(true); return; }
  if (fermerCalendrier()) return;
  if (fermerMenu()) return;
  if (fermerFiltres()) return;
  if (openType) closeSheet();
});

/* En arriere-plan, le telephone peut couper les requetes en cours :
   sendBeacon part quand meme. Les doublons eventuels sont sans effet. */
function envoyerBalise(){
  viderTampon();
  if (!RESEAU.possible || !RESEAU.attente.length || !navigator.sendBeacon) return;
  try{
    // en texte brut : une balise ne sait pas poser la question prealable qu'un
    // JSON exigerait vers un serveur d'une autre origine ; les serveurs lisent le corps tel quel
    navigator.sendBeacon(API('ops'), new Blob([corpsOps(RESEAU.attente)], { type:'text/plain' }));
  }catch(e){}
}
window.addEventListener('pagehide', e => {
  sauverCroquisEnCours(); flush(); envoyerBalise();
  // l'onglet part (et ne reste pas en memoire pour un retour arriere) : il sort des connectes
  if (!e.persisted && RESEAU.possible && navigator.sendBeacon)
    try{ navigator.sendBeacon(API('presence'), new Blob([JSON.stringify({ client: CLIENT, quitte: true, espace: monEspace() || undefined })], { type:'text/plain' })); }catch(x){}
});
window.addEventListener('pageshow', e => { if (e.persisted) envoyerPresence(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ sauverCroquisEnCours(); flush(); envoyerBalise(); }
  else if (RESEAU.possible && RESEAU.src && RESEAU.src.readyState === 2) connecter();
});

/* La rangee des jours : deux fleches autour des onglets, et sur la page Tournage
   le bouton des filtres. Les deux pages ont la meme rangee, elle n'est donc ecrite
   qu'une fois. `cadrerJour` eteint les fleches aux bouts en lisant les voisins de
   la rangee dans la page : leur ordre ici compte. */
const BTN_FILTRES = `<button type="button" class="filtres" id="btn-filtres" onclick="ouvrirFiltres()" aria-label="Filtres"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Filtres</span><b hidden></b></button>`;
function htmlJours(page, id, avecFiltres){
  const f = (sens, nom) => `<button class="fleche" onclick="jourVoisin(${sens}, '${page}')" aria-label="${nom}">${CHEVRON(sens)}</button>`;
  return `<div class="jours">${f(-1, 'Jour précédent')}<div class="chips" id="${id}"></div>${f(1, 'Jour suivant')}` +
         (avecFiltres ? BTN_FILTRES : '') + `</div>`;
}
function barresJours(){
  $('fbar-shoot').insertAdjacentHTML('afterbegin', htmlJours('shoot', 'c-jour', true));
  $('fbar-report').innerHTML = htmlJours('report', 'c-jourr', false);
  $('fbar-prep').innerHTML = htmlJours('prep', 'c-jourp', false);
  // la cale de gauche (telephone) suit la largeur du bouton Filtres : les jours se centrent sur l'ecran
  const bf = $('btn-filtres');
  if (bf && window.ResizeObserver) new ResizeObserver(() => {
    const j = bf.closest('.jours'); if (!j) return;
    const cale = (bf.offsetWidth + (parseFloat(getComputedStyle(bf).marginLeft) || 0)) + 'px';
    if (j.style.getPropertyValue('--cale') === cale) return;
    j.style.setProperty('--cale', cale);
    // la rangee a change de largeur : le jour actif se recale au milieu
    cadreFait = null; cadrerJour('c-jour', fJour);
  }).observe(bf);
}

/* La rangee des jours colle sous la barre haute : sa hauteur depend de
   l'encoche du telephone et de la taille du titre, on la mesure. */
function majHauteurBarre(){
  const t = document.querySelector('.top');
  if (t) document.documentElement.style.setProperty('--toph',
    (getComputedStyle(t).position === 'fixed' ? 0 : Math.round(t.getBoundingClientRect().height)) + 'px');
}
window.addEventListener('resize', majHauteurBarre);
window.addEventListener('orientationchange', () => setTimeout(majHauteurBarre, 200));

/* La barre de defilement d'une liste de prises mange le bord droit de cette
   liste, et d'elle seule : sans rien faire, les ronds d'un plan a sept prises
   ne tomberaient pas sous ceux d'un plan a trois, ni sous le rond Moteur de
   leur propre carte. On mesure sa largeur une fois — nulle sur telephone, ou
   elle flotte par-dessus — et on reserve la meme gouttiere partout. */
function mesurerGouttiere(){
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;top:-9999px;width:100px;height:100px;overflow-y:scroll;scrollbar-width:thin';
  document.body.appendChild(d);
  const barre = d.offsetWidth - d.clientWidth;
  d.remove();
  document.documentElement.style.setProperty('--gouttiere', 'calc(var(--air) + ' + barre + 'px)');
}

mesurerGouttiere();
barresJours();
appliquerTheme();
majHauteurBarre();
renderAll();
reprendrePlace();
majPresence();
if (RESEAU.possible) connecter();   // une fois nomme : l'espace, c'est le prenom

if (!UI.nom || EQUIPE.indexOf(UI.nom) < 0) demanderNom();
else veillerAuCarnet();       // le carnet ouvert est-il bien le sien ?
setTimeout(verifierVersion, 20000);
setInterval(verifierVersion, 1800000);
