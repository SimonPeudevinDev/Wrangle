/* --------------------------------------------- Les saisies de l'equipe */
/* Sur le serveur, chacun a son espace : le DIT ramene le projet de chacun
   des autres pour les reunir ou les rapprocher, sans fichier a echanger. */
function recupererEspaces(){
  RAP.chargement = true;
  return fetch(API('espaces'), { cache:'no-store' }).then(r => r.json()).then(rep => {
    const autres = (rep.espaces || []).filter(e => e.espace !== monEspace());
    return Promise.all(autres.map(e =>
      fetch(API('etat') + '?espace=' + encodeURIComponent(e.espace), { cache:'no-store' })
        .then(r => r.json()).then(x => ({ espace: e.espace, nom: e.nom || e.espace, db: x.db, quand: e.quand }))));
  }).then(liste => {
    RAP.equipier = [];
    liste.forEach(d => {
      if (!d.db) return;
      try{ RAP.equipier.push({ espace: d.espace, nom: d.nom, db: normaliser(d.db), quand: d.quand }); }catch(e){}
    });
    appliquerChoix();
    RAP.chargement = false;
    renderReport();
    const n = RAP.sources.filter(s => s.espace).length;
    toast(n ? n + ' personne' + plur(n) + ' réunie' + plur(n)
            : RAP.equipier.some(aSaisi) ? 'Personne n’est choisi' : 'Personne d’autre n’a encore saisi');
    return n;
  }).catch(() => { RAP.chargement = false; prevenir('Impossible de lire les saisies de l’équipe.', { detail:'Serveur injoignable. Réessayez.' }); return 0; });
}
/* Qui reunir : une personne, plusieurs, ou toutes. Le choix est garde sur
   l'appareil (UI.choixEquipe : les espaces coches ; absent, c'est « Tous »).
   « Tous », ce sont ceux qui ont saisi au moins une prise : un prenom choisi
   un jour par erreur, sans rien dedans, ne vient pas encombrer le rapport,
   mais reste propose, grise, et se coche comme les autres. Le choix vaut pour
   tout le rapport : bilan, rapprochement, PDF et exports. */
const aSaisi = e => e.db.prises.length > 0;
const choisi = e => UI.choixEquipe ? UI.choixEquipe.indexOf(e.espace) >= 0 : aSaisi(e);
function appliquerChoix(){
  RAP.sources = RAP.sources.filter(s => !s.espace).concat(RAP.equipier.filter(choisi));
}
function basculerChoix(espace){
  const actuels = RAP.equipier.filter(choisi).map(e => e.espace);
  const i = actuels.indexOf(espace);
  if (i >= 0) actuels.splice(i, 1); else actuels.push(espace);
  UI.choixEquipe = actuels; RAP.equipe = true; UI.equipe = true; ecrireUI();
  appliquerChoix(); renderReport();
}
function choisirTous(){
  UI.choixEquipe = null; RAP.equipe = true; UI.equipe = true; ecrireUI();
  appliquerChoix(); renderReport();
}
const quandDepot = iso => { const d = new Date(iso); return isNaN(d) ? '' : deuxCh(d.getDate()) + '/' + deuxCh(d.getMonth() + 1) + ' ' + hhmm(d); };

/* ------------------------------------------ Ce que les autres ont note */
/* Dans la fiche d'une prise ou d'un plan, ce que les autres ont saisi sur la
   meme prise (meme plan, meme numero) ou le meme plan se lit a cote : sur un
   champ a taper, une barre a leur couleur quand eux seuls l'ont rempli, verte
   quand on a ecrit la meme chose, rouge quand on differe, et leur valeur
   dessous, qui se reprend d'un appui. Sur une bulle (resultat, etoile, notes
   rapides, elements captes, etat, tuiles), un rond a leur initiale ; toucher
   la meme bulle la confirme, elle s'entoure de vert. Les projets des autres
   sont relus toutes les quinze secondes tant qu'une fiche est ouverte, et
   seulement ceux qui ont change (la revision de chaque espace). */
const AUTRES = { liste: [], revs: {}, t: 0, encours: false };
// l'heure, les timecodes et la duree ne sont pas des desaccords ; le reste de la liste est a chacun ou au decoupage
const A2_IGNORE = ['par', 'heure', 'tcIn', 'tcOut', 'duree', 'n', 'jour', 'plan', 'seq', 'seqTitre', 'lieu', 'desc'];
// les textes libres s'ajoutent au sien au lieu de le remplacer
const A2_AJOUT = ['notes', 'notesClient', 'notesInternes', 'vfxDesc', 'elementsAutre'];
const ficheA2 = () => openType === 'prise' || openType === 'plan';
function oublierAutres(){ AUTRES.liste = []; AUTRES.revs = {}; AUTRES.t = 0; }
function majAutres(force){
  if (!RESEAU.possible || !UI.nom || AUTRES.encours) return;
  if (!force && Date.now() - AUTRES.t < 10000) return;
  AUTRES.encours = true; AUTRES.t = Date.now();
  const s = RESEAU.session;
  fetch(API('espaces'), { cache:'no-store' }).then(r => r.json()).then(rep => {
    const autres = (rep.espaces || []).filter(e => e.espace !== monEspace());
    const changes = autres.filter(e => AUTRES.revs[e.espace] !== e.rev);
    return Promise.all(changes.map(e => fetch(API('etat') + '?espace=' + encodeURIComponent(e.espace), { cache:'no-store' })
      .then(r => r.json()).then(x => ({ e, db: x.db })).catch(() => null)))
    .then(res => {
      if (s !== RESEAU.session) return;   // on a change de personne entre-temps
      const garde = new Map(AUTRES.liste.map(a => [a.espace, a]));
      res.forEach(x => {
        if (!x || !x.db) return;
        try{ garde.set(x.e.espace, { espace: x.e.espace, nom: x.e.nom || x.e.espace, db: normaliser(x.db) }); AUTRES.revs[x.e.espace] = x.e.rev; }catch(err){}
      });
      const la = new Set(autres.map(e => e.espace));
      AUTRES.liste = [...garde.values()].filter(a => la.has(a.espace)).sort((a, b) => a.nom.localeCompare(b.nom));
      AUTRES.liste.forEach(a => { a.coul = couleurDe(a.nom); });
      if (changes.length){ decorerFiche(); if (view === 'shoot') renderListBientot(); }
    });
  }).catch(() => {}).then(() => { AUTRES.encours = false; });
}
setInterval(() => { if ((ficheA2() || view === 'shoot') && !document.hidden) majAutres(); }, 15000);

/* La meme prise, ou le meme plan, chez chacun des autres : [{ a, o }]. */
function jumelles(o){
  if (!o || !AUTRES.liste.length || !ficheA2()) return [];
  const p = openType === 'prise' ? plan(o.planId) : o;
  if (!p) return [];
  const out = [];
  AUTRES.liste.forEach(a => {
    const q = a.db.plans.find(x => x.id === p.id) || ((p.seq || p.plan) ? a.db.plans.find(x => clePlan(x) === clePlan(p)) : null);
    if (!q) return;
    const x = openType === 'prise' ? a.db.prises.find(t => t.planId === q.id && t.n === o.n && !t.pasSaisie) : q;
    if (x) out.push({ a, o: x });
  });
  return out;
}
const pastilleA2 = a => `<span class="a2-pt" style="--c:${a.coul}" title="${esc(a.nom)}">${esc(initiale(a.nom))}</span>`;

/* Une ligne a taper (un champ, ou les deux d'un depart / arrivee) et ce que les autres y ont mis. */
function decorerSpec(s, o, j){
  const suite = s.nextElementSibling;
  if (suite && suite.classList.contains('a2-row')) suite.remove();
  s.classList.remove('a2-autre', 'a2-accord', 'a2-ecart');
  const ks = [...s.querySelectorAll('[data-o][data-k]')].map(el => el.dataset.k).filter(k => A2_IGNORE.indexOf(k) < 0);
  if (!ks.length || !j.length) return;
  const mien = ks.map(k => valRap(o[k])), rien = mien.every(v => !v);
  const avis = j.map(x => {
    const leur = ks.map(k => valRap(x.o[k]));
    if (leur.every(v => !v)) return null;
    const pareil = ks.every((k, i) => memeVal(mien[i], leur[i]));
    return { x, leur, etat: pareil ? 'accord' : rien ? 'autre' : 'ecart' };
  }).filter(Boolean);
  if (!avis.length) return;
  const etat = avis.some(v => v.etat === 'ecart') ? 'ecart' : avis.some(v => v.etat === 'autre') ? 'autre' : 'accord';
  s.classList.add('a2-' + etat);
  s.style.setProperty('--c', (avis.find(v => v.etat === 'autre') || avis[0]).x.a.coul);
  // la barre verte suffit a dire qu'on concorde : la ligne ne montre que ce qui differe
  if (etat === 'accord') return;
  const html = avis.filter(v => v.etat !== 'accord').map(v =>
    `<button type="button" class="a2-val" style="--c:${v.x.a.coul}" onclick="reprendreAutre('${esc(v.x.a.espace)}','${ks.join(',')}')"
         title="Reprendre ce que ${esc(v.x.a.nom)} a noté">${pastilleA2(v.x.a)}<span>${esc(ks.length > 1 ? fleche(v.leur[0], v.leur[1]) : v.leur[0])}</span><b>${
         A2_AJOUT.indexOf(ks[0]) >= 0 && !rien ? '+ ajouter' : 'reprendre'}</b></button>`).join('');
  s.insertAdjacentHTML('afterend', `<div class="a2-row a2-${etat}" style="--c:${s.style.getPropertyValue('--c')}">${html}</div>`);
}
/* Une bulle : qui l'a choisie parmi les autres, et moi ? */
function decorerBulle(b, moi, qui){
  b.querySelectorAll('.a2-pt').forEach(x => x.remove());
  b.classList.remove('a2-lui', 'a2-deux');
  if (!qui.length) return;
  b.classList.add(moi ? 'a2-deux' : 'a2-lui');
  b.style.setProperty('--c', qui[0].coul);
  b.insertAdjacentHTML('beforeend', `<span class="a2-pts">${qui.map(pastilleA2).join('')}</span>`);
}
function decorerFiche(){
  const sb = $('sbody');
  if (!sb || !ficheA2()) return;
  majAlertesPrise();
  const o = cible(openId); if (!o) return;
  if (openType === 'plan') return decorerPlan(sb, o);
  const j = jumelles(o);
  // le rond de l'anneau du Moteur est a majVise : on n'y touche pas, il clignoterait
  sb.querySelectorAll('.a2-pts').forEach(x => { if (!x.closest('.viser')) x.remove(); });
  // en tete : qui a aussi note cette prise
  const tete = sb.querySelector('.a2-tete');
  const texte = j.length ? `<div class="a2-tete">${j.map(x => pastilleA2(x.a)).join('')}
      <span><b>${esc(j.map(x => x.a.nom).join(', '))}</b> ${j.length > 1 ? 'ont' : 'a'} aussi noté ${openType === 'prise' ? 'cette prise' : 'ce plan'}</span></div>` : '';
  if (tete) tete.outerHTML = texte || '<i class="a2-tete" hidden></i>';
  else if (texte) sb.insertAdjacentHTML('afterbegin', texte);
  const specs = new Set();

  specs.forEach(s => decorerSpec(s, o, j));

  if (openType === 'prise'){
    sb.querySelectorAll('#seg-statut button[data-st]').forEach(b => {
      const a = x => verdictDe(x, b.dataset.st) === b.dataset.st;
      decorerBulle(b, a(o), qui(a));
    });
    const k = $('btn-star'); if (k) decorerBulle(k, !!o.retenue, qui(x => !!x.retenue));
    sb.querySelectorAll('.chips-notes button[data-n]').forEach(b => decorerBulle(b, aNote(o, b.dataset.n), qui(x => aNote(x, b.dataset.n))));
  } else {
    sb.querySelectorAll('#seg-etat button[data-et]').forEach(b => decorerBulle(b, o.etat === b.dataset.et, qui(x => x.etat === b.dataset.et)));
    sb.querySelectorAll('.el[data-el]').forEach(b => decorerBulle(b, !!(o.elements || {})[b.dataset.el], qui(x => !!(x.elements || {})[b.dataset.el])));
  }
  // les lignes a tuiles : la valeur des autres dans l'en-tete, leur initiale sur la tuile
  sb.querySelectorAll('.champ[data-champ]').forEach(c => {
    const k = c.dataset.champ, def = champsDe().find(d => d.k === k);
    const a = x => Array.isArray(x) ? x : !valRap(x) ? [] : def && def.sep ? morceaux(x, def.sep) : [valRap(x)];
    const mien = a(o[k]), porte = (l, v) => l.some(y => memeVal(y, v));
    c.classList.remove('a2-autre', 'a2-accord', 'a2-ecart');
    const avis = j.filter(x => a(x.o[k]).length);
    if (avis.length){
      const pareil = x => a(x.o[k]).length === mien.length && a(x.o[k]).every(v => porte(mien, v));
      const etat = avis.every(pareil) ? 'accord' : !mien.length ? 'autre' : 'ecart';
      c.classList.add('a2-' + etat);

        pastilleA2(x.a) + '<em>' + esc(a(x.o[k]).join(', ')) + '</em>').join('')}</span>`);
    }
    c.querySelectorAll('.tuile[data-f]').forEach(b => decorerBulle(b, porte(mien, b.dataset.f), avis.filter(x => porte(a(x.o[k]), b.dataset.f)).map(x => x.a)));

/* La fiche d'un plan : le plan est partage, il n'y a rien a comparer. Une
   pastille dit seulement qui a coche un element ou change l'etat (s'il n'est
   pas soi), et les descriptions et notes des autres se lisent en italique. */
/* Reprendre ce qu'un autre a saisi dans le contexte du shot : la valeur commune devient la sienne, et la mienne aussi. */
function reprendreContexte(k, nom){
  const p = plan(openId); if (!p) return;
  const v = saisiesDe(p, k)[nom]; if (v == null) return;
  patch('plan', p.id, { [k]: v });
  rouvrirFiche(); renderList();
}
const personneA2 = nom => AUTRES.liste.find(a => a.nom === nom)
  || { nom, coul: couleurDe(nom) };
function decorerPlan(sb, p){
  sb.querySelectorAll('.a2-pts').forEach(x => { if (!x.closest('.viser')) x.remove(); });
  const t = sb.querySelector('.a2-tete'); if (t) t.remove();
  const au = p.auteurs || {}, de = cle => au[cle] && au[cle] !== UI.nom ? [personneA2(au[cle])] : [];
  // les elements sont a chacun : ceux des autres portent leur rond ; coches a deux, entoures de vert
  const mes = mesElements(p), autres = quiAElements(p).filter(n => n !== (UI.nom || '').trim())
    .map(n => ({ a: personneA2(n), el: elementsDe(p, n, false) }));
  sb.querySelectorAll('.el[data-el]').forEach(b => decorerBulle(b, !!mes[b.dataset.el], autres.filter(x => x.el[b.dataset.el]).map(x => x.a)));
  // la barre du bloc : vert si chacun a coche les memes elements, rouge sinon (ou si un autre seul en a coche)
  const blocEl = sb.querySelector('.elems');
  if (blocEl){
    blocEl.classList.remove('a2-accord', 'a2-ecart');
    const cles = o => Object.keys(o).filter(e => o[e]).sort().join(',');
    if (autres.length) blocEl.classList.add(autres.every(x => cles(x.el) === cles(mes)) ? 'a2-accord' : 'a2-ecart');
  }
  sb.querySelectorAll('#seg-etat button[data-et]').forEach(b => decorerBulle(b, false, p.etat === b.dataset.et ? de('etat') : []));
  // le contexte du shot : la valeur est commune, mais chacun garde ce qu'il a saisi (saisiesDe).
  // Comme pour une prise : vert si tous ceux qui l'ont saisi ont mis pareil, rouge sinon (et ce que
  // chacun a mis, avec son rond) ; saisi par un autre seul, sa couleur et son rond sur sa valeur.
  const moi = (UI.nom || '').trim();
  sb.querySelectorAll('.a2-row.ctx').forEach(x => x.remove());
  CONTEXTE_DOUBLE.filter(k => k !== 'figu').forEach(k => {
    const sp = sb.querySelector('.spec [data-k="' + k + '"]'), c = sb.querySelector('.champ[data-champ="' + k + '"]') || (sp && sp.closest('.spec'));
    if (!c) return;
    c.classList.remove('a2-autre', 'a2-accord', 'a2-ecart');
    const def = champsDe().find(d => d.k === k);
    const liste = x => Array.isArray(x) ? x : !valRap(x) ? [] : def && def.sep ? morceaux(x, def.sep) : [valRap(x)];
    const pareil = (x, y) => { const a = liste(x), b = liste(y); return a.length === b.length && a.every(v => b.some(w => memeVal(v, w))); };
    const s = saisiesDe(p, k), noms = Object.keys(s).filter(n => valRap(s[n]));
    const autres = noms.filter(n => n !== moi);
    if (!autres.length) return;
    const etat = noms.length < 2 ? 'autre' : noms.every(n => pareil(s[n], s[noms[0]])) ? 'accord' : 'ecart';
    // saisi par un autre seul : ce n'est pas encore verifie a deux, la barre est rouge comme un desaccord
    c.classList.add('a2-' + (etat === 'autre' ? 'ecart' : etat));
    c.style.setProperty('--c', personneA2(autres[0]).coul);
    // ce que chacun a mis, quand ce n'est pas la valeur affichee (en desaccord), ou le rond de l'autre seul
    const montrer = etat === 'autre' ? autres : etat === 'ecart' ? noms.filter(n => !pareil(s[n], p[k])) : [];
    const pts = montrer.map(n => pastilleA2(personneA2(n)).replace(/title="[^"]*"/, 'title="Saisi par ' + esc(n) + '"')
      + (etat === 'ecart' ? '<em>' + esc(liste(s[n]).join(', ')) + '</em>' : '')).join('');
    if (c.classList.contains('champ')){
      const v = c.querySelector('.champ-val');
      if (v && pts) v.insertAdjacentHTML('beforeend', `<span class="a2-pts">${pts}</span>`);
      // les tuiles : le rond de chacun sur ce qu'il a choisi ; choisie aussi par moi, entouree de vert
      c.querySelectorAll('.tuile[data-f]').forEach(b => decorerBulle(b, moi in s && liste(s[moi]).some(y => memeVal(y, b.dataset.f)),
        autres.filter(n => liste(s[n]).some(y => memeVal(y, b.dataset.f))).map(personneA2)));
    } else if (montrer.length){
      // une ligne tapee (la duree) : ce que chacun a mis, a reprendre d'un appui
      c.insertAdjacentHTML('afterend', `<div class="a2-row ctx a2-${etat === 'autre' ? 'ecart' : etat}" style="--c:${personneA2(autres[0]).coul}">${montrer.map(n =>
        `<button type="button" class="a2-val" style="--c:${personneA2(n).coul}" onclick="reprendreContexte('${k}', '${esc(n)}')" title="Reprendre ce que ${esc(n)} a saisi">${
          pastilleA2(personneA2(n))}<span>${esc(valRap(s[n]))}</span><b>reprendre</b></button>`).join('')}</div>`);
    }
  });
  // mon texte a moi porte aussi mon rond, des qu'il est rempli : on voit qui a ecrit quoi
  sb.querySelectorAll('.spec > .a2-pt.moi').forEach(x => x.remove());
  if (UI.nom) sb.querySelectorAll('.spec [data-k*="@"]').forEach(el => {
    const lab = el.closest('.spec').querySelector('label');
    if (lab && String(el.value || '').trim())
      lab.insertAdjacentHTML('afterend', `<i class="a2-pt moi" style="--c:${couleurDe(UI.nom.trim())}" title="${esc(UI.nom)}">${esc(initiale(UI.nom))}</i>`);
  });
  sb.querySelectorAll('.textes-autres[data-texte]').forEach(d => {
    d.innerHTML = textesDe(p, d.dataset.texte).filter(([n]) => n !== (UI.nom || '').trim()).map(([n, v]) =>
      `<div class="texte-autre${n ? '' : ' prevu'}">${n ? pastilleA2(personneA2(n)) : ''}<b>${esc(n || 'Préparation')}</b><i>${esc(v)}</i></div>`).join('');
  });
  // les champs texte encore prevus (la duree) : en bleu, avec Valider, comme les lignes a tuiles
  sb.querySelectorAll('.spec [data-k]').forEach(el => {
    const k = el.dataset.k, sp = el.closest('.spec');
    if (PREVUS_PLAN.indexOf(k) < 0 || el.dataset.o !== p.id) return;
    const prevu = estPrevu(p, k), b = sp.querySelector('.prevu-ok');
    sp.classList.toggle('prevu', prevu);
    if (prevu && !b) sp.insertAdjacentHTML('beforeend', `<button type="button" class="mini prevu-ok" onclick="validerPrevu('${k}')" title="Garder ce qui était prévu">Valider</button>`);
    if (!prevu && b) b.remove();
  });
}
/* Reprendre ce qu'un autre a note : sa valeur devient la mienne (une note s'ajoute a la mienne). */
function reprendreAutre(espace, cles){
  const o = cible(openId), kind = kindDe(openId); if (!o || !kind) return;
  const x = jumelles(o).find(y => y.a.espace === espace); if (!x) return;
  const d = {};
  cles.split(',').forEach(k => {
    const lui = x.o[k] == null ? '' : x.o[k], moi = (o[k] || '').trim();
    if (A2_AJOUT.indexOf(k) < 0 || !moi) { d[k] = lui; return; }
    const segs = moi.split(/\s*·\s*/);
    String(lui).split(/\s*·\s*/).forEach(sg => { if (sg.trim() && !segs.some(y => memeVal(y, sg))) segs.push(sg.trim()); });
    d[k] = segs.join(' · ');
  });
  patch(kind, o.id, d);
  majFicheEnPlace(); majResumes(); renderListBientot();
}

/* ------------------------------------------------ Rapprocher les saisies */
/* Chacun saisit de son cote, dans son navigateur ; le DIT depose ici les
   sauvegardes des autres. On met les prises cote a cote, plan par plan :
   ce qui ne concorde pas (un ecart), ce qu'un seul a rempli (un complement),
   ce qu'un seul a saisi (une prise chez un seul). La fusion garde tout : la
   premiere source, ce navigateur, fait foi sur les ecarts ; les autres
   comblent les vides et apportent leurs prises en plus. */
const RAP = { sources: [], equipier: [], equipe: true, tente: false, chargement: false };   // le rapport porte toujours sur toute l'equipe   // equipe : le bilan porte sur l'equipe ; equipier : chacun des autres sur le serveur, choisi ou non
const RAP_PRISE = [['statut', 'Statut'], ['pickup', 'Pick-up'], ['retenue', 'À monter'], ['clip', 'Clip'], ['carte', 'Carte'], ['cam', 'Caméra'],
  ['tcIn', 'TC in'], ['tcOut', 'TC out'], ['duree', 'Durée'], ['heure', 'Heure'], ['notes', 'Note'], ['focale', 'Focale'],
  ['focaleStop', 'Focale fin'], ['diaph', 'Diaph'], ['mouvement', 'Mouvement'], ['support', 'Support'], ['meteo', 'Météo'],
  ['codec', 'Codec'], ['reso', 'Résolution'], ['fps', 'Cadence'], ['shutter', 'Obturateur'], ['ei', 'EI'], ['wb', 'Balance'],
  ['nd', 'ND'], ['lut', 'LUT'], ['objectif', 'Objectif'], ['filtre', 'Filtres'], ['sonRoll', 'Bande son'], ['sync', 'Synchro'],
  ['sonFile', 'Fichier son']];
const RAP_PLAN = [['etat', 'État'], ['elements', 'Éléments captés'], ['elementsAutre', 'Autre élément'], ['notesClient', 'Client note'],
  ['notesInternes', 'Internal note'], ['vfxDesc', 'Description VFX']];
const valRap = v => v === true ? 'oui' : v === false || v == null ? '' : Array.isArray(v) ? v.join(', ') : String(v).trim();
const clePlan = p => (p.seq || '') + '|' + (p.plan || '');
const champPlan = (p, k) => k === 'etat' ? (ETATS[p.etat] || valRap(p.etat))
  : k === 'elements' ? Object.keys(elementsTous(p)).sort().join(', ')
  : TEXTES_A_CHACUN.indexOf(k) >= 0 ? texteDe(p, k) : valRap(p[k]);
/* les saisies a rapprocher : celles de ce navigateur d'abord, puis les fichiers deposes */
const sourcesRap = () => [{ nom: UI.nom || 'Ce navigateur', db: DB, ici: true }].concat(RAP.sources);

/* Une prise marquee « non saisie » s'efface devant celle d'un
   autre, au meme plan et au meme numero : elle ne compare rien, ne comble rien,
   et sa personne la connait (s.pas) : ce n'est pas une prise « chez un seul ».
   Seule a exister, elle reste. */
function sansPasSaisies(sources){
  const saisies = new Set();
  sources.forEach(s => s.db.prises.forEach(t => {
    const p = t.pasSaisie ? null : s.db.plans.find(x => x.id === t.planId);
    if (p) saisies.add(clePlan(p) + '#' + t.n);
  }));
  return sources.map(s => {
    const reste = s.db.prises.filter(t => {
      if (!t.pasSaisie) return true;
      const p = s.db.plans.find(x => x.id === t.planId);
      return !(p && saisies.has(clePlan(p) + '#' + t.n));
    });
    if (reste.length === s.db.prises.length) return s;
    const pas = new Set(s.db.prises.filter(t => reste.indexOf(t) < 0)
      .map(t => clePlan(s.db.plans.find(x => x.id === t.planId)) + '#' + t.n));
    return Object.assign({}, s, { pas, db: Object.assign({}, s.db, { prises: reste }) });
  });
}
function rapprocher(sources){
  sources = sansPasSaisies(sources);
  const plans = new Map();   // cle -> { seq, plan, versions: Map(nom -> plan), prises: Map(n -> Map(nom -> prise)) }
  sources.forEach(s => {
    s.db.plans.forEach(p => {
      const c = clePlan(p);
      if (!plans.has(c)) plans.set(c, { seq: p.seq || '', plan: p.plan || '', versions: new Map(), prises: new Map() });
      plans.get(c).versions.set(s.nom, p);
    });
    s.db.prises.forEach(t => {
      const p = s.db.plans.find(x => x.id === t.planId); if (!p) return;
      const e = plans.get(clePlan(p)), n = String(t.n || '');
      if (!e.prises.has(n)) e.prises.set(n, new Map());
      e.prises.get(n).set(s.nom, t);
    });
  });
  /* un champ a la fois : des valeurs differentes, c'est un ecart ; une valeur
     chez certains seulement, c'est un complement */
  const comparer = (versions, champs, lire) => {
    const ecarts = [], complements = [];
    champs.forEach(([k, label]) => {
      const vals = [];
      versions.forEach((o, nom) => { const v = lire(o, k); if (v) vals.push([nom, v]); });
      if (!vals.length) return;
      if (new Set(vals.map(x => x[1].toLowerCase())).size > 1) ecarts.push({ champ: label, valeurs: vals });
      else if (vals.length < versions.size) complements.push({ champ: label, valeur: vals[0][1], par: vals.map(x => x[0]) });
    });
    return { ecarts, complements };
  };
  const ordre = new Map(sources[0].db.plans.map((p, i) => [clePlan(p), i]));
  const total = { ecarts: 0, complements: 0, seuls: 0 }, out = [];
  [...plans.entries()].sort((a, b) => (ordre.has(a[0]) ? ordre.get(a[0]) : 9999) - (ordre.has(b[0]) ? ordre.get(b[0]) : 9999))
    .forEach(([c, e]) => {
      const bloc = { seq: e.seq, plan: e.plan, plan_: comparer(e.versions, RAP_PLAN, champPlan), prises: [],
                     planSeul: e.versions.size < sources.length ? [...e.versions.keys()] : null };
      [...e.prises.entries()].sort((a, b) => (+a[0] || 0) - (+b[0] || 0)).forEach(([n, versions]) => {
        const r = comparer(versions, RAP_PRISE, (t, k) => valRap(t[k]));
        const connue = versions.size + sources.filter(s => s.pas && s.pas.has(c + '#' + n)).length;
        const seuls = connue < sources.length ? [...versions.keys()] : null;
        total.ecarts += r.ecarts.length; total.complements += r.complements.length; if (seuls) total.seuls++;
        if (r.ecarts.length || r.complements.length || seuls) bloc.prises.push(Object.assign({ n, seuls }, r));
      });
      total.ecarts += bloc.plan_.ecarts.length; total.complements += bloc.plan_.complements.length;
      if (bloc.prises.length || bloc.plan_.ecarts.length || bloc.plan_.complements.length) out.push(bloc);
    });
  return { plans: out, total, noms: sources.map(s => s.nom) };
}

/* La fusion : la premiere source pour base, les autres comblent ses vides,
   ajoutent leurs plans et leurs prises absents ; les elements captes s'additionnent.
   Deux personnes ont saisi la meme prise (meme plan, meme numero) : une seule
   ligne, qui porte les deux noms, et un ecart note dessus quand ce qui compte
   differe — statut, a monter, focale, carte, clip, reglages… L'heure, les
   timecodes et la duree ne comptent pas : un chrono oublie ou quelques
   secondes d'ecart ne sont pas un desaccord. Les notes s'ajoutent l'une a
   l'autre. Le journal DIT signale ces ecarts sous chaque plan. */
const CHAMPS_ECART = RAP_PRISE.filter(([k]) => ['heure', 'tcIn', 'tcOut', 'duree', 'notes'].indexOf(k) < 0);
const minutesDe = h => { const m = String(h || '').match(/^(\d{1,2})[:h](\d{2})$/); return m ? +m[1] * 60 + +m[2] : null; };
function noterEcart(o, champ, nomA, a, nomB, b){
  o.ecarts = o.ecarts || [];
  let e = o.ecarts.find(x => x.champ === champ);
  if (!e){ e = { champ, valeurs: [[nomA, a]] }; o.ecarts.push(e); }
  if (!e.valeurs.some(([n]) => n === nomB)) e.valeurs.push([nomB, b]);
}
function fusionRap(sources){
  sources = sansPasSaisies(sources);
  const base = structuredClone(sources[0].db), nomBase = sources[0].nom || '';
  const parCle = new Map(base.plans.map(p => [clePlan(p), p]));
  // qui a apporte chaque prise ou plan ajoute a la base : un ecart nomme la vraie personne,
  // pas celle de la base (le DIT qui ne saisit rien et fabrique le rapport, par exemple)
  const origine = new Map(), deQui = o => origine.get(o) || nomBase;
  const combler = (b, o, sauf) => Object.keys(o).forEach(k => {
    if (sauf.indexOf(k) >= 0 || (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k]))) return;
    if (!valRap(b[k]) && valRap(o[k])) b[k] = o[k];
  });
  sources.slice(1).forEach(s => {
    s.db.plans.forEach(p => {
      let b = parCle.get(clePlan(p));
      if (!b){ b = structuredClone(p); base.plans.push(b); parCle.set(clePlan(p), b); origine.set(b, s.nom); }
      else {
        const ea = champPlan(b, 'etat'), eb = champPlan(p, 'etat');
        if (ea && eb && ea !== eb) noterEcart(b, 'État', deQui(b), ea, s.nom, eb);
        combler(b, p, ['id', 'ecarts']);
        b.elements = b.elements || {};
        Object.keys(p.elements || {}).forEach(k => { if (p.elements[k]) b.elements[k] = true; });
      }
      const prisesB = base.prises.filter(t => t.planId === b.id);
      s.db.prises.filter(t => t.planId === p.id).forEach(t => {
        const tb = prisesB.find(x => String(x.n) === String(t.n));
        if (!tb){ const c = structuredClone(t); c.planId = b.id; base.prises.push(c); prisesB.push(c); origine.set(c, s.nom); return; }
        CHAMPS_ECART.forEach(([k, label]) => {
          const a = valRap(tb[k]), v = valRap(t[k]);
          if (a && v && a.toLowerCase() !== v.toLowerCase()) noterEcart(tb, label, deQui(tb), a, s.nom, v);
        });
        if (valRap(t.notes) && valRap(tb.notes) && valRap(t.notes) !== valRap(tb.notes)) tb.notes = tb.notes.trim() + ' · ' + s.nom + ' : ' + t.notes.trim();
        // deux montres a quelques minutes pres : l'heure du milieu
        const ha = minutesDe(tb.heure), hb = minutesDe(t.heure);
        if (ha != null && hb != null && ha !== hb && Math.abs(ha - hb) <= 10){
          const v = Math.round((ha + hb) / 2);
          tb.heure = String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
        }
        // deux chronos de la meme prise : leur moyenne
        const da = secondesDe(tb.duree), db = secondesDe(t.duree);
        if (da != null && db != null && da !== db){
          tb.nDurees = (tb.nDurees || 1) + 1;
          tb.duree = fmtDuree(Math.round((da * (tb.nDurees - 1) + db) / tb.nDurees));
        }
        if (t.par && (tb.par || '').split(', ').indexOf(t.par) < 0) tb.par = tb.par ? tb.par + ', ' + t.par : t.par;
        combler(tb, t, ['id', 'planId', 'ecarts']);
      });
    });
  });
  return base;
}

/* les fichiers deposes : chacun nomme d'apres qui a saisi ses prises */
function lireSources(input){
  const fichiers = [...input.files]; input.value = '';
  let restant = fichiers.length;
  if (!restant) return;
  fichiers.forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result); if (!d.plans) throw 0;
        const db = normaliser(d);
        RAP.sources.push({ nom: nomDeSource(db, f.name), db, fichier: f.name });
      }catch(e){ toast('Fichier illisible : ' + f.name); }
      if (!--restant) renderReport();
    };
    r.readAsText(f);
  });
}
function nomDeSource(db, fichier){
  const f = frequences(db.prises.map(t => t.par).filter(Boolean));
  const nom = f.length ? f[0][0] : fichier.replace(/\.json$/i, '');
  const memes = sourcesRap().filter(s => s.nom === nom || s.nom.indexOf(nom + ' (') === 0).length;
  return memes ? nom + ' (' + (memes + 1) + ')' : nom;
}
function retirerSource(i){ RAP.sources.splice(i, 1); renderReport(); }

/* Le rapprochement en resume : par prise, une ligne pour les ecarts (a trancher, valeurs
   cote a cote) et une pour ce qu'un seul a note, regroupe par personne ; la valeur d'un
   complement se lit au survol. */
function ligneRap(qui, c){
  const tete = qui ? `<b>${esc(qui)}</b> · ` : '';
  const ecarts = c.ecarts.length ? `<div class="alert o"><i>&#9888;</i><div>${tete}${c.ecarts.map(e => `${esc(e.champ)} : ${
    e.valeurs.map(([nom, v]) => `<b>${esc(nom)}</b> ${esc(v)}`).join(' · ')}`).join(' — ')}</div></div>` : '';
  const groupes = new Map();
  c.complements.forEach(e => { const k = e.par.join(', '); if (!groupes.has(k)) groupes.set(k, []); groupes.get(k).push(e); });
  const compl = groupes.size ? `<div class="alert"><i></i><div>${tete}${[...groupes].map(([par, l]) => `seulement chez ${esc(par)} : ${
    l.map(e => `<span class="rval" title="${esc(e.champ)} : ${esc(e.valeur)}">${esc(e.champ.toLowerCase())}</span>`).join(', ')}`).join(' · ')}</div></div>` : '';
  const seuls = c.seuls ? `<div class="alert"><i></i><div>${esc(qui)} seulement chez ${esc(c.seuls.join(', '))}</div></div>` : '';
  return ecarts + compl + seuls;
}
function resumeRap(t){
  return [t.ecarts + ' écart' + plur(t.ecarts), t.complements + ' complément' + plur(t.complements),
          t.seuls + ' prise' + plur(t.seuls) + ' chez un seul'].join(' · ');
}
function htmlRapprochement(){
  const s = sourcesRap();
  // ce navigateur, puis chacun des autres sur le serveur, a cocher ; les
  // sauvegardes deposees a la main se retirent d'une croix
  const tous = !UI.choixEquipe;
  // l'ordre : Tous, puis soi (ce navigateur), puis les autres par nom, « Autres » en dernier
  const bouton = e => { const on = choisi(e), n = e.db.prises.length;
    return `<button type="button" class="rsource coche${on ? ' on' : ''}${n ? '' : ' vide'}" onclick="basculerChoix('${esc(e.espace)}')" aria-pressed="${on}">${
      esc(e.nom)} <em>${n ? n + ' prise' + plur(n) : 'rien saisi'}</em></button>`; };
  // un ancien profil qui n'a rien saisi (Georges, Marie…) ne s'affiche plus
  const autresGens = RAP.equipier.filter(e => e.db.prises.length || EQUIPE.some(n => memeVal(n, e.nom)))
    .sort((a, b) => (memeVal(a.nom, 'Autres') ? 1 : 0) - (memeVal(b.nom, 'Autres') ? 1 : 0) || a.nom.localeCompare(b.nom, 'fr'));
  const puces = (RAP.equipier.length ? `<button type="button" class="rsource coche${tous ? ' on' : ''}" onclick="choisirTous()" aria-pressed="${tous}">Tous</button>` : '') +
    `<span class="rsource ici">${esc(s[0].nom)} <em>ce navigateur</em></span>` + autresGens.map(bouton).join('') +
    RAP.sources.map((x, i) => x.espace ? '' : `<span class="rsource">${esc(x.nom)}${x.quand ? ` <em>${esc(quandDepot(x.quand))}</em>` : ''}
      <button type="button" onclick="retirerSource(${i})" aria-label="Retirer ${esc(x.nom)}">&times;</button></span>`).join('');
  let corps = '';
  if (s.length > 1){
    const r = rapprocher(s);
    // le bilan en titre ; la liste se deroule d'un appui, et le reste sur cet appareil
    const ouvert = !!(UI.rapOuvert || {}).rapprocher;
    corps = (r.plans.length ? `<details class="repli-rap"${ouvert ? ' open' : ''} ontoggle="replierRap('rapprocher', this.open)">
      <summary class="rresume">${resumeRap(r.total)}</summary>` : `<div class="rresume">${resumeRap(r.total)}</div>`) +
      (r.plans.length ? '<div class="rliste">' + r.plans.map(b => `<div class="rplan"><b>Séquence ${esc(b.seq || '—')} · Shot ${esc(b.plan || '—')}</b>${
          b.planSeul ? ` <em>seulement chez ${esc(b.planSeul.join(', '))}</em>` : ''}
          ${ligneRap('', b.plan_)}${b.prises.map(t => ligneRap('Prise ' + t.n, t)).join('')}</div>`).join('') + '</div></details>'
        : '<div class="alert g"><i>&#10003;</i><div>Rien ne se contredit : les saisies concordent.</div></div>') +
      (RESEAU.possible ? '' : `<div class="btns" style="margin-top:14px">
        <button class="btn p" onclick="garderFusion()">Garder la fusion comme projet</button></div>`);
  }
  // Actualiser en premier ; plus de depot de sauvegardes a la main (le serveur reunit tout le monde)
  return `<div class="rsources">${RESEAU.possible ? `<button type="button" class="btn sm p" onclick="reunirEquipe()">${
      RAP.equipier.length ? 'Actualiser' : 'Récupérer les saisies de l’équipe'}</button>` : ''}${puces}</div>${corps}`;
}
function garderFusion(){
  const s = sourcesRap();
  if (s.length < 2) return prevenir('Déposez d’abord une sauvegarde à rapprocher.');
  confirmer('Garder la version fusionnée comme projet' + (RESEAU.possible ? ', sur tous vos appareils' : '') + ' ?',
            { detail:'Vos saisies font foi sur les écarts ; les autres comblent les vides et apportent leurs prises en plus.', ok:'Fusionner' })
  .then(oui => {
    if (!oui) return;
    DB = normaliser(fusionRap(s));
    dernierPlan = null; chrono = null; RAP.sources = []; RAP.equipier = [];
    marquerCarnet();   // ce carnet porte les saisies des autres, c'est voulu : ne rien demander
    operer({ op:'remplacer', db: DB });
    flush(); renderAll(); toast('Projet fusionné');
  });
}
/* ------------------------------------------------ Fiche data wrangling */
/* Les ecarts entre saisies, a trancher avant d'exporter le journal DIT et la
   fiche VFX : une journee par page, un ecart par ligne, une colonne par
   personne et une case a cocher quand la saisie fautive est corrigee dans
   l'app. Puis les prises qu'une seule personne a notees : un oubli chez les
   autres, ou une prise en trop. Ce qu'un seul a rempli n'y est pas : la
   fusion le reprend d'elle-meme, ce n'est pas un desaccord. */
/* Un shot du releve : son etat, son contexte tel que saisi (une ligne par champ, les desaccords
   entre personnes en clair), et ses prises avec ce qui y manque ou s'ecarte du prevu. */
const CTX_WRANGLING = [['lieu', 'Décor'], ['intExt', 'Int / Ext'], ['momentJour', 'Moment'], ['meteo', 'Météo'],
  ['cadrage', 'Cadrage'], ['mouv', 'Mouvement'], ['support', 'Support'], ['focale', 'Focale prévue'], ['acteurs', 'Distribution'],
  ['duree', 'Durée prévue']];
const TEXTES_WRANGLING = [['elements', 'Éléments captés'], ['elementsAutre', 'Autre élément'], ['vfxDesc', 'Description VFX'],
  ['notesClient', 'Note client'], ['notesInternes', 'Note interne']];
const nomElement = k => (ELEMENTS.find(e => e[0] === k) || [k, k])[1];
function shotWrangling(x, f, r, compte, doublons){
  const rb = r.plans.find(b => b.seq === (x.seq || '') && b.plan === (x.plan || ''));
  const ecPlan = new Map((rb ? rb.plan_.ecarts.filter(compte) : []).map(e => [e.champ, e.valeurs]));
  const dans = x.fusionDans && f.plans.find(y => y.id === x.fusionDans);
  // le contexte : la valeur commune, et si chacun a saisi autre chose, ce que chacun a mis
  const contexte = CTX_WRANGLING.map(([k, label]) => {
    const vals = Object.entries(saisiesDe(x, k)).map(([n, v]) => [n, valRap(v)]).filter(v => v[1]);
    return { label, v: valRap(x[k]), ecart: new Set(vals.map(v => v[1].toLowerCase())).size > 1 ? vals : null };
  }).concat(TEXTES_WRANGLING.map(([k, label]) => {
    const lab = (RAP_PLAN.find(q => q[0] === k) || [])[1];
    const v = k === 'elements' ? elementsCoches(x).map(e => e[1]).join(', ') : texteDe(x, k);
    // les elements sont a chacun : un desaccord, c'est deux personnes qui n'ont pas coche les memes
    const parQui = k === 'elements' ? quiAElements(x).map(n => [n, ELEMENTS.filter(e => elementsDe(x, n, false)[e[0]]).map(e => e[1]).join(', ') || 'aucun']) : [];
    const ec = k === 'elements' ? (new Set(parQui.map(q => q[1])).size > 1 ? parQui : null) : ecPlan.get(lab) || null;
    return { label, v, ecart: ec };
  }));
  const prises = f.prises.filter(t => t.planId === x.id).sort((a, b) => (a.n || 0) - (b.n || 0)).map(t => {
    const erreurs = [];
    if (!t.pasSaisie){
      if (!valRap(t.clip)) erreurs.push(['clip', 'Clip manquant']);
      if (!valRap(t.carte)) erreurs.push(['carte', 'Carte manquante']);
      if (t.statut !== 'OK' && t.statut !== 'NG') erreurs.push(['statut', 'Ni OK ni NG']);
    }
    const fh = focaleHorsPlan(t, x);
    if (fh) erreurs.push(['focale', 'Focale ' + fleche(t.focale, t.focaleStop) + ', prévue ' + fh]);
    // le meme nom de clip sur deux prises de la journee : l'une des deux est fausse
    const autres = ((doublons && doublons.get(cleSimple(t.clip))) || []).filter(q => q.t !== t);
    if (valRap(t.clip) && autres.length) erreurs.push(['clip', 'Clip ' + t.clip + ' en double (aussi ' + autres.map(q => q.ref).join(', ') + ')']);
    return Object.assign({}, t, { erreurs, ecarts: t.ecarts || [] });
  });
  return {
    ref: (x.seq ? 'Séq ' + x.seq + ' · ' : '') + 'Shot ' + (x.plan || '—'), seqTitre: x.seqTitre || '', desc: x.desc || '',
    etat: dans ? 'Fusionné dans ' + (dans.seq ? 'Séq ' + dans.seq + ' · ' : '') + 'Shot ' + (dans.plan || '—')
        : x.termine ? 'Terminé' : ETATS[x.etat] || '',
    couleurEtat: dans ? 'caramel' : x.etat === 'drop' ? 'ng' : x.etat === 'done' ? 'ok' : 'tan',
    ecartEtat: ecPlan.get('État') || (x.ecarts || []).filter(e => e.champ === 'État').map(e => e.valeurs)[0] || null,
    contexte, prises
  };
}
function modeleWrangling(j){
  const s = sourcesRap(), r = rapprocher(s), f = fusionRap(s), p = DB.prod, d = new Date();
  // le plan et les prises de chacun, par cle : pour le jour, le clip et « retenue »
  const planDe = new Map(), prisesDe_ = new Map();
  s.forEach(src => {
    const parId = new Map(src.db.plans.map(x => [x.id, x]));
    src.db.plans.forEach(x => { if (!planDe.has(clePlan(x))) planDe.set(clePlan(x), x); });
    src.db.prises.forEach(t => {
      const x = parId.get(t.planId); if (!x) return;
      const k = clePlan(x) + '|' + String(t.n || '');
      prisesDe_.set(k, (prisesDe_.get(k) || []).concat([Object.assign({ qui: src.nom }, t)]));
    });
  });
  const jourDe = b => (planDe.get((b.seq || '') + '|' + (b.plan || '')) || {}).jour || '';
  // ce qui compte, comme pour la fusion : ni l'heure, ni les timecodes, ni la duree, ni les notes (elles s'ajoutent)
  const compte = e => CHAMPS_ECART.some(c => c[1] === e.champ) || ['État', 'Éléments captés', 'Autre élément', 'Description VFX'].indexOf(e.champ) >= 0;
  const lesPrises = (b, n) => prisesDe_.get((b.seq || '') + '|' + (b.plan || '') + '|' + n) || [];
  const jours = j === '*' ? joursConnus().filter(x => r.plans.some(b => jourDe(b) === x)) : [j];
  const pied = [p.titre || '', 'rapport VFX édité le ' + deuxCh(d.getDate()) + '/' + deuxCh(d.getMonth() + 1) + '/' + d.getFullYear() +
                ' à ' + hhmm(d) + (UI.nom ? ' par ' + UI.nom : ''), 'Wrangle'].filter(Boolean).join(' · ');
  return (jours.length ? jours : ['*']).map(jour => {
    const P = r.plans.filter(b => jour === '*' || jourDe(b) === jour);
    const ecarts = [], seuls = [];
    P.forEach(b => {
      b.plan_.ecarts.filter(compte).forEach(e => ecarts.push({ seq: b.seq, plan: b.plan, n: '', clip: '', retenue: false, champ: e.champ, valeurs: e.valeurs }));
      b.prises.forEach(t => {
        const l = lesPrises(b, t.n), clip = (l.find(x => x.clip) || {}).clip || '', retenue = l.some(x => x.retenue);
        t.ecarts.filter(compte).forEach(e => ecarts.push({ seq: b.seq, plan: b.plan, n: t.n, clip, retenue, champ: e.champ, valeurs: e.valeurs }));
      });
      // les prises d'un plan notees par une seule personne, regroupees par personne
      const parQui = new Map();
      b.prises.filter(t => t.seuls && t.seuls.length === 1 && s.length > 1).forEach(t => {
        const qui = t.seuls[0], x = lesPrises(b, t.n)[0] || {};
        parQui.set(qui, (parQui.get(qui) || []).concat([{ n: t.n, clip: x.clip || '', statut: libStatut(x), retenue: !!x.retenue }]));
      });
      parQui.forEach((l, qui) => seuls.push({ seq: b.seq, plan: b.plan, qui, prises: l }));
    });
    // les personnes du jour : celles qui ont une prise sur un plan de ce jour-la, dans l'ordre des saisies
    const noms = s.filter(src => src.db.prises.some(t => {
      const x = src.db.plans.find(y => y.id === t.planId);
      return x && (jour === '*' || x.jour === jour);
    })).map(src => src.nom);
    const duJour = f.plans.filter(x => jour === '*' || x.jour === jour);
    // les noms de clip de la journee, pour reperer ceux qui servent deux fois
    const doublons = new Map();
    duJour.forEach(x => f.prises.filter(t => t.planId === x.id && valRap(t.clip)).forEach(t => {
      const k = cleSimple(t.clip);
      doublons.set(k, (doublons.get(k) || []).concat([{ t, ref: (x.seq ? 'Séq ' + x.seq + ' · ' : '') + 'Shot ' + (x.plan || '—') + ' · Prise ' + t.n }]));
    }));
    const shots = duJour.filter(x => f.prises.some(t => t.planId === x.id) || x.etat !== 'todo')
      .map(x => shotWrangling(x, f, r, compte, doublons));
    return {
      jour, titre: p.titre || 'Projet sans titre', pied, ecarts, seuls, noms, shots,
      sous: ['Rapport VFX', jour === '*' ? 'Tout le tournage' : nomJour(jour), noms.length ? 'Saisies de ' + noms.join(', ') : '']
              .filter(Boolean).join(' · '),
      chiffres: [[ecarts.length, 'écart' + plur(ecarts.length) + ' à trancher'],
                 [ecarts.filter(e => e.retenue).length, 'sur des prises retenues'],
                 [seuls.reduce((a, x) => a + x.prises.length, 0), 'prises notées par une seule personne'],
                 [noms.length, 'personne' + plur(noms.length) + ' ont saisi']]
    };
  });
}
/* Le releve de ce que l'equipe a saisi : une page par shot, toutes de la meme forme, en paysage.
   En tete le bilan du shot ; son titre, son etat, sa description ; le contexte et le VFX cote a
   cote, tous leurs champs a la meme place (« — » quand rien n'est saisi) ; ses prises, toujours
   les memes colonnes ; enfin ce qui est a reprendre. En rouge : une saisie qui manque ou s'ecarte
   du prevu, et un desaccord entre deux saisies (chacun avec ses initiales). */
function pdfWrangling(j){
  const jours = modeleWrangling(j), doc = nouveauPdf(true), L = doc.largeur - 2 * PDF_M;
  const ini = n => String(n || '').slice(0, 2);
  const desaccord = vals => vals.map(([n, v]) => ini(n) + ' ' + v).join(' / ');
  const ROUGE = { police: 'HB', couleur: 'ng' };
  const COLS = [['n', 'Pr.', 22, 'HB', t => t.n], ['clip', 'Clip', 72, 'C', t => t.clip], ['carte', 'Carte', 46, 'H', t => t.carte],
    ['statut', 'Statut', 54, 'HB', libStatut], ['retenue', 'Montage', 48, 'H', t => t.retenue ? 'retenue' : ''],
    ['focale', 'Focale', 66, 'H', t => fleche(t.focale, t.focaleStop)], ['diaph', 'Diaph', 34, 'H', t => t.diaph],
    ['ei', 'ISO', 32, 'H', t => t.ei], ['wb', 'Balance', 44, 'H', t => t.wb], ['shutter', 'Obtur.', 38, 'H', t => t.shutter],
    ['mouvement', 'Mouvement', 64, 'H', t => t.mouvement], ['support', 'Support', 50, 'H', t => t.support],
    ['duree', 'Durée', 32, 'H', t => t.duree], ['heure', 'Heure', 32, 'H', t => t.heure],
    ['par', 'Saisi par', 40, 'H', t => String(t.par || '').split(/\s*,\s*/).filter(Boolean).map(ini).join(', ')],
    ['notes', 'Note', 0, 'H', t => t.notes]];
  COLS[COLS.length - 1][2] = L - COLS.reduce((a, c) => a + c[2], 0);
  const labelDe = k => (RAP_PRISE.find(q => q[0] === k) || [])[1];
  const ecartDe = (t, k) => t.ecarts.find(e => e.champ === labelDe(k) || (k === 'focale' && e.champ === 'Focale fin'));
  const tcols = COLS.map(([k, titre, w, police, lire]) => [titre, w, police, t => {
    const e = ecartDe(t, k), err = t.erreurs.find(q => q[0] === k), v = valRap(lire(t));
    if (e) return Object.assign({ t: desaccord(e.valeurs) }, ROUGE);
    if (err) return Object.assign({ t: v || 'manque' }, ROUGE);
    if (k === 'statut') return { t: v, police: 'HB', couleur: t.statut === 'OK' ? 'ok' : 'ng' };
    if (k === 'retenue' && v) return { t: v, puce: 'caramel', police: 'HB', couleur: 'encre' };
    return k === 'n' ? { t: v, police: 'HB', couleur: 'encre' } : v;
  }]);
  // un titre de bloc : petites capitales encre, un filet dessous
  const titreBloc = (x, y, w, titre) => {
    doc.texte(x, y - 8, titre.toUpperCase(), { taille: 7.2, police: 'HB', couleur: 'encre', esp: .9 });
    doc.ligne(x, y - 12, x + w, y - 12, .7, 'filet2');
    return y - 20;
  };
  // un champ : le libelle a gauche, la valeur a sa droite (trois lignes au plus) ; rend sa hauteur
  const lignesChamp = (c, w) => {
    const l = lignesPdf(c.ecart ? desaccord(c.ecart) : c.v || '—', w, 8.2, c.ecart ? 'HB' : 'H');
    if (l.length > 3){ l.length = 3; l[2] = l[2].replace(/\s*\S*$/, '') + ' …'; }
    return l;
  };
  const champ = (x, y, wl, c, l) => {
    doc.texte(x, y - 8.2, c.label.toUpperCase(), { taille: 5.8, police: 'HB', couleur: 'tan', esp: .5 });
    l.forEach((s, n) => doc.texte(x + wl, y - 8.6 - n * 10.2, s, c.ecart ? Object.assign({ taille: 8.2 }, ROUGE)
                                                              : { taille: 8.2, couleur: c.v ? 'encre' : 'filet2', esp: 0 }));
    return l.length * 10.2 + 3.5;
  };
  const texte = (s, o) => lignesPdf(s, L, o.taille, o.police || 'H').forEach(l => {
    doc.place(o.taille * 1.5); doc.texte(PDF_M, doc.y - o.taille, l, o); doc.y -= o.taille * 1.45;
  });

  let pages = 0;
  jours.forEach(m => {
    const legende = m.noms.length > 1 ? 'Initiales : ' + m.noms.map(n => ini(n) + ' = ' + n).join(', ') + '.' : '';
    if (!m.shots.length){
      if (pages++) doc.nouvellePage();
      entetePdf(doc, m.titre, m.sous, [[0, 'shot']]);
      texte('Aucun shot tourné ce jour-là.', { taille: 9, couleur: 'tan' });
      return;
    }
    m.shots.forEach(x => {
      if (pages++) doc.nouvellePage();
      const nErr = x.prises.reduce((a, t) => a + t.erreurs.length, 0);
      const nEc = x.contexte.filter(c => c.ecart).length + (x.ecartEtat ? 1 : 0) + x.prises.reduce((a, t) => a + t.ecarts.length, 0);
      entetePdf(doc, m.titre, m.sous, [[x.prises.length, 'prise' + plur(x.prises.length)],
        [x.prises.filter(t => t.statut === 'OK').length, 'OK'], [x.prises.filter(t => t.statut === 'NG').length, 'NG'],
        [x.prises.filter(t => t.retenue).length, 'à monter'], [nErr, 'erreur' + plur(nErr) + ' de saisie'],
        [nEc, 'désaccord' + plur(nEc) + ' entre saisies']]);

      // le titre du shot, son etat en pastille a droite, sa description
      const yT = doc.y - 4;
      doc.texte(PDF_M, yT - 17, x.ref, { taille: 17, police: 'HB', couleur: 'encre' });
      if (x.seqTitre) doc.texte(PDF_M + largeurPdf(x.ref, 17, 'HB') + 12, yT - 17, x.seqTitre, { taille: 10, couleur: 'tan' });
      const et = x.etat || 'À tourner', wp = largeurPdf(et, 8, 'HB') + 18, clair = x.couleurEtat === 'tan';
      doc.rect(PDF_M + L - wp, yT - 21, wp, 16, clair ? 'creme2' : x.couleurEtat);
      doc.texte(PDF_M + L - wp + 9, yT - 15.6, et, { taille: 8, police: 'HB', couleur: clair ? 'encre' : 'blanc' });
      doc.y = yT - 26;
      const desc = lignesPdf(x.desc || '', L, 9, 'H');
      if (desc.length > 2){ desc.length = 2; desc[1] = desc[1].replace(/\s*\S*$/, '') + ' …'; }
      desc.forEach(l => { doc.texte(PDF_M, doc.y - 9, l, { taille: 9, couleur: 'brun' }); doc.y -= 12.5; });
      if (x.ecartEtat){ doc.texte(PDF_M, doc.y - 8.5, 'État : ' + desaccord(x.ecartEtat), Object.assign({ taille: 8.5 }, ROUGE)); doc.y -= 12.5; }
      doc.y -= 6;

      // le contexte (deux colonnes) et le VFX, cote a cote
      const g = 22, wl = (L - g) * .52, wr = L - g - wl, xr = PDF_M + wl + g, y0 = doc.y;
      const ctx = x.contexte.slice(0, CTX_WRANGLING.length), vfx = x.contexte.slice(CTX_WRANGLING.length);
      let yl = titreBloc(PDF_M, y0, wl, 'Contexte du shot'), yr = titreBloc(xr, y0, wr, 'VFX');
      const cw = (wl - 14) / 2, lab = 64, labV = 82;
      for (let a = 0; a < ctx.length; a += 2){
        const paire = ctx.slice(a, a + 2).map(c => [c, lignesChamp(c, cw - lab - 4)]);
        const h = Math.max(...paire.map(([, l]) => l.length * 10.2 + 3.5));
        paire.forEach(([c, l], k) => champ(PDF_M + k * (cw + 14), yl, lab, c, l));
        yl -= h;
      }
      vfx.forEach(c => { yr -= champ(xr, yr, labV, c, lignesChamp(c, wr - labV - 4)); });
      doc.y = Math.min(yl, yr) - 4;

      // les prises : toujours les memes colonnes, d'une page a l'autre
      const yP = titreBloc(PDF_M, doc.y, L, 'Prises — ' + x.prises.length);
      doc.y = yP + 6;
      if (x.prises.length) tableauPdf(doc, tcols, x.prises.map(t => ({ v: tcols.map(c => c[3](t)), fond: t.retenue })), 7.8, x.ref + ', prises, suite');
      else { doc.texte(PDF_M, doc.y - 9, 'Aucune prise sur ce shot.', { taille: 8.5, couleur: 'tan' }); doc.y -= 14; }

      // ce qui est a reprendre : le contexte, puis prise par prise ; ou rien, en vert
      const items = x.contexte.filter(c => c.ecart).map(c => c.label + ' : ' + c.ecart.map(([n, v]) => n + ' « ' + v + ' »').join(', '))
        .concat(x.prises.map(t => [t, t.erreurs.map(q => q[1]).concat(t.ecarts.map(e =>
          e.champ + ' : ' + e.valeurs.map(([n, v]) => n + ' « ' + v + ' »').join(', ')))]).filter(q => q[1].length)
          .map(([t, l]) => 'Prise ' + t.n + ' — ' + l.join(' · ')));
      doc.place(40); doc.y -= 6;
      doc.y = titreBloc(PDF_M, doc.y, L, 'À reprendre — ' + items.length) + 6;
      if (items.length) items.forEach(s => texte('•  ' + s, { taille: 8.3, couleur: 'ng' }));
      else texte('Rien à reprendre : les saisies de ce shot sont complètes et concordent.', { taille: 8.3, police: 'HB', couleur: 'ok' });
      if (legende){ doc.y -= 2; texte(legende, { taille: 7.3, couleur: 'tan' }); }
    });
  });
  return doc.fichier(jours.length ? jours[0].pied : '');
}

/* ------------------------------------------------- Journal DIT par mail */
/* Le serveur expedie ce que la page fabrique : le PDF de la journee en cours,
   aux destinataires regles dans la fiche Journee. A la main, ou tout seul :
   toutes les heures (ou les deux heures) a l'heure pile dans la plage reglee,
   ou une fois par jour a l'heure dite, les journees cochees. Rien ne part si
   rien n'a change depuis le dernier envoi ; et un creneau ne part qu'une fois,
   meme si plusieurs appareils sont ouverts : le serveur ne garde que le premier. */
const destinatairesMail = () => String(DB.prod.mailA || '').split(/[,;\s]+/).map(x => x.trim()).filter(x => x.indexOf('@') > 0);
/* la journee du journal : celle de la derniere prise, sinon celle du plan vise, sinon celle affichee */
function jourDuJournal(){
  const t = DB.prises[DB.prises.length - 1];
  if (t && t.jour) return t.jour;
  const p = planVise();
  if (p && p.jour) return p.jour;
  return fJour !== '*' ? fJour : '*';
}
/* une heure ecrite comme on veut (« 20h », « 20:00 », « 8:5 ») -> « 20:00 », ou '' */
function heureLue(s){
  const m = String(s || '').trim().match(/^(\d{1,2})\s*[:hH]?\s*(\d{0,2})$/);
  return m ? deuxCh(Math.min(23, +m[1])) + ':' + deuxCh(Math.min(59, +(m[2] || 0))) : '';
}
/* ce qui a change : une empreinte des prises et des etats, pour ne pas renvoyer le meme journal */
function empreinteMail(){
  const s = JSON.stringify(DB.prises) + '|' + DB.plans.map(p => p.etat + (p.croquis ? 'c' : '') + (p.croquisPlus || []).length).join('');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return s.length + ':' + h;
}
/* le creneau d'envoi automatique du moment (« 2026-09-23 J1 14h »), ou '' s'il n'y en a pas :
   entre les deux dates reglees, a l'heure pile dans la plage, ou a l'heure dite */
function creneauMail(d){
  d = d || new Date();
  const c = DB.prod.mailCadence || '';
  if (!c) return '';
  const jour = jourDuJournal();
  const date = d.getFullYear() + '-' + deuxCh(d.getMonth() + 1) + '-' + deuxCh(d.getDate());
  if ((DB.prod.mailDu && date < DB.prod.mailDu) || (DB.prod.mailAu && date > DB.prod.mailAu)) return '';
  if (c === 'jour'){ const h = heureLue(DB.prod.mailHeure); return h && hhmm(d) === h ? date + ' ' + jour : ''; }
  if (d.getMinutes() !== 0) return '';
  const h = d.getHours();
  const de = +(heureLue(DB.prod.mailDebut) || '00:00').slice(0, 2), a = +(heureLue(DB.prod.mailFin) || '23:59').slice(0, 2);
  if (h < de || h > a) return '';
  if (c === '2h' && (h - de) % 2) return '';
  return date + ' ' + jour + ' ' + deuxCh(h) + 'h';
}
const base64De = u8 => {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
};
function envoyerJournalMail(auto, creneau){

        if (openType === 'prod') openProd();

      return rep;
    })
    .catch(() => { if (!auto) prevenir('Le journal n’est pas parti.', { detail:'Serveur injoignable.' }); return null; });
}
/* La plage horaire se regle au curseur : deux poignees sur le meme rail, de
   0 h a 23 h, ou une seule pour l'heure d'un envoi quotidien (par demi-heure). */
function htmlPlageMail(p){
  const quotidien = p.mailCadence === 'jour';
  const de = +(heureLue(p.mailDebut) || '08:00').slice(0, 2), a = +(heureLue(p.mailFin) || '20:00').slice(0, 2);
  const h = heureLue(p.mailHeure) || '20:00', demi = +h.slice(0, 2) * 2 + (+h.slice(3) >= 30 ? 1 : 0);
  return `<div class="spec col"><label>${quotidien ? 'À' : 'Plage horaire'}</label>
    <div class="plage${quotidien ? ' seule' : ''}" id="plage-mail">
      <div class="rail"><i id="plage-fill"></i></div>
      ${quotidien
        ? `<input type="range" min="0" max="47" step="1" value="${demi}" data-k="mailHeure" oninput="glisserPlage(this)" aria-label="Heure d’envoi">`
        : `<input type="range" min="0" max="23" step="1" value="${de}" data-k="mailDebut" oninput="glisserPlage(this)" aria-label="Début">
           <input type="range" min="0" max="23" step="1" value="${a}" data-k="mailFin" oninput="glisserPlage(this)" aria-label="Fin">`}
      <b id="plage-txt"></b>
    </div></div>`;
}
function glisserPlage(input){
  const z = $('plage-mail'), r = z.querySelectorAll('input[type=range]'), txt = $('plage-txt'), fill = $('plage-fill');
  if (r.length === 1){
    const v = +r[0].value, h = deuxCh(Math.floor(v / 2)) + ':' + (v % 2 ? '30' : '00');
    if (input) patch('prod', 'prod', { mailHeure: h });
    txt.textContent = h; fill.style.left = '0'; fill.style.width = (v / 47 * 100) + '%';
    return;
  }
  let de = +r[0].value, a = +r[1].value;
  // une poignee qui croise l'autre la pousse : le debut reste avant la fin
  if (de > a){ if (input === r[0]) a = de; else de = a; r[0].value = de; r[1].value = a; }
  if (input) patch('prod', 'prod', { mailDebut: deuxCh(de) + ':00', mailFin: deuxCh(a) + ':00' });
  txt.textContent = deuxCh(de) + ':00 → ' + deuxCh(a) + ':00';
  fill.style.left = (de / 23 * 100) + '%'; fill.style.width = ((a - de) / 23 * 100) + '%';
}
/* ---------------------------------------------------------- Calendrier */
/* Un calendrier dans la charte, a la place de celui du navigateur : un mois
   a la fois, lundi en tete, la date choisie en caramel, la periode jusqu'a
   l'autre borne teintee. Il s'ouvre sous son champ, comme un menu. */
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const ICO_CAL = ICO('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', 16, 2);
const isoDate = d => d.getFullYear() + '-' + deuxCh(d.getMonth() + 1) + '-' + deuxCh(d.getDate());
const dateFr = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
/* un champ de date : la date en clair, le calendrier au doigt. `autre` est la cle de l'autre borne. */
function champDate(o, label, k, autre){
  return `<div class="spec"><label>${label}</label>
    <input readonly value="${esc(dateFr(o[k]))}" placeholder="jj/mm/aaaa" data-o="${o.id || 'prod'}" data-k="${k}" data-autre="${autre || ''}"
      onclick="ouvrirCalendrier(this)">
    <button type="button" class="deroul" onclick="ouvrirCalendrier(this.previousElementSibling)" aria-label="Choisir une date">${ICO_CAL}</button></div>`;
}
let calendrier = null;   // { input, mois } : le champ servi et le premier jour du mois affiche
function ouvrirCalendrier(input){
  if (calendrier && calendrier.input === input){ fermerCalendrier(); return; }
  fermerMenu(); fermerCalendrier();
  const o = cible(input.dataset.o), v = (o && o[input.dataset.k]) || '';
  const base = v ? new Date(+v.slice(0, 4), +v.slice(5, 7) - 1, 1) : new Date();
  calendrier = { input, mois: new Date(base.getFullYear(), base.getMonth(), 1) };
  const m = document.createElement('div');
  m.className = 'menu calendrier';
  input.closest('.spec').appendChild(m);
  dessinerCalendrier();
  const sb = m.closest('#sbody'), r = input.closest('.spec').getBoundingClientRect();
  const cadre = sb ? sb.getBoundingClientRect() : { top:0, bottom:innerHeight };
  if (r.bottom + m.offsetHeight > cadre.bottom && r.top - m.offsetHeight > cadre.top) m.classList.add('haut');
  setTimeout(() => document.addEventListener('click', clicHorsCalendrier), 0);
}
function dessinerCalendrier(){
  const c = calendrier; if (!c) return;
  const m = c.input.closest('.spec').querySelector('.calendrier'), o = cible(c.input.dataset.o);
  const choisi = o[c.input.dataset.k] || '', borne = c.input.dataset.autre ? o[c.input.dataset.autre] || '' : '';
  const [d1, d2] = [choisi, borne].filter(Boolean).sort();
  const y = c.mois.getFullYear(), mo = c.mois.getMonth(), auj = isoDate(new Date());
  const decal = (new Date(y, mo, 1).getDay() + 6) % 7;      // lundi en tete
  let jours = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(y, mo, 1 - decal + i), iso = isoDate(d);
    const cls = ['j', d.getMonth() !== mo && 'hors', iso === auj && 'auj', iso === choisi && 'on', iso === borne && 'borne',
                 d1 && d2 && iso > d1 && iso < d2 && 'entre'].filter(Boolean).join(' ');
    jours += `<button type="button" class="${cls}" data-d="${iso}" onclick="choisirDate('${iso}')">${d.getDate()}</button>`;
  }
  m.innerHTML = `<div class="ctete">
      <button type="button" class="ico" onclick="bougerMois(-1)" aria-label="Mois précédent">${CHEVRON(-1)}</button>
      <b>${MOIS[mo].charAt(0).toUpperCase() + MOIS[mo].slice(1)} ${y}</b>
      <button type="button" class="ico" onclick="bougerMois(1)" aria-label="Mois suivant">${CHEVRON(1)}</button></div>
    <div class="cjours">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span>${x}</span>`).join('')}${jours}</div>
    <div class="cpied"><button type="button" onclick="choisirDate('${auj}')">Aujourd’hui</button>
      <button type="button" onclick="choisirDate('')">Effacer</button></div>`;
}
function bougerMois(n){
  if (!calendrier) return;
  calendrier.mois = new Date(calendrier.mois.getFullYear(), calendrier.mois.getMonth() + n, 1);
  dessinerCalendrier();
}
function choisirDate(iso){
  const c = calendrier; if (!c) return;
  patch(kindDe(c.input.dataset.o), c.input.dataset.o, { [c.input.dataset.k]: iso });
  c.input.value = dateFr(iso);
  fermerCalendrier();
}
function fermerCalendrier(){
  if (!calendrier) return false;
  const sp = calendrier.input.closest('.spec'), m = sp && sp.querySelector('.calendrier');
  if (m) m.remove();
  calendrier = null;
  document.removeEventListener('click', clicHorsCalendrier);
  return true;
}
function clicHorsCalendrier(e){
  if (!e.target.isConnected) return;
  if (!e.target.closest('.calendrier') && !e.target.closest('.spec input[readonly]') && !e.target.closest('.deroul')) fermerCalendrier();
}

/* La jauge du stockage : chez l'hebergeur, la place prise sur le quota de l'offre
   (1 Go), qui se remplit a chaque croquis et chaque prise (les sauvegardes
   horodatees les gardent aussi) ; sur le PC du plateau, la place des donnees seule. */
/* en base 1024, comme Windows et l'hebergeur : 1 Go = 1024 Mo */
const KO = 1024, MO = KO * KO, GO = MO * KO;
const octetsLisibles = n => n >= GO ? (n / GO).toFixed(2).replace('.', ',') + ' Go'
  : n >= MO ? (n / MO).toFixed(1).replace('.', ',') + ' Mo' : n > 0 && n < KO ? '< 1 ko' : Math.round(n / KO) + ' ko';
/* la couleur de chaque type dans la jauge */
const COULEURS_STOCK = { shots:'var(--acc)', schemas:'var(--tag-bleu)', prises:'var(--ok)', sauvegardes:'#b48ad6',
                         divers:'var(--tag-orange)', site:'var(--dim2)', reste:'var(--line2)' };
const pourcent = x => x < 10 ? x.toFixed(1).replace('.', ',') : String(Math.round(x));
/* Le site de l'equipe, chez l'hebergeur : sur le PC (serveur local), la jauge le montre
   aussi — c'est la que tous les appareils ecrivent. */
const SITE_EQUIPE = 'https://foresight-movie.com/api/';
function htmlStock(s, titre){
  const l = (s.parties || []).filter(x => x.octets > 0);
  const coul = x => COULEURS_STOCK[x.cle] || 'var(--dim2)';
  // comme sur un telephone : le pourcentage, « 32,5 Mo / 1 Go », une barre ou chaque type
  // a sa couleur et le libre est gris ; puis la liste des types
  const base = s.quota || l.reduce((a, x) => a + x.octets, 0) || 1, pc = s.quota ? Math.min(100, s.utilise / s.quota * 100) : 100;
  const go = n => n === GO ? '1 Go' : octetsLisibles(n);
  return `<div class="stock-carte${s.quota && pc >= 90 ? ' plein' : s.quota && pc >= 75 ? ' haut' : ''}">
    ${titre ? `<div class="stock-titre">${esc(titre)}</div>` : ''}
    <div class="stock-pc"><b>${s.quota ? pourcent(pc) + ' %' : octetsLisibles(s.utilise)}</b> utilisé</div>
    ${s.quota ? `<div class="stock-bornes"><span>${octetsLisibles(s.utilise)} / ${go(s.quota)}</span></div>` : ''}
    <div class="stock-barre" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pc)}" aria-label="Stockage utilisé">${l.map(x =>
      `<i style="width:${x.octets / base * 100}%;background:${coul(x)}" title="${esc(x.nom)} : ${octetsLisibles(x.octets)}"></i>`).join('')}</div>
    <div class="stock-liste">${l.map(x => `<div><i style="background:${coul(x)}"></i><span>${esc(x.nom)}</span><b>${octetsLisibles(x.octets)}</b></div>`).join('')}</div>
    ${pc >= 75 && s.quota ? `<div class="note">Bientôt plein : la liste dit ce qui pèse le plus.</div>` : ''}
  </div>`;
}
function majStockage(){
  if (!$('stockage')) return;
  // seul compte l'abonnement chez l'hebergeur (1 Go) : sur le site comme sur le PC, c'est sa jauge
  fetch(RESEAU.php ? API('stockage') : SITE_EQUIPE + 'stockage.php', { cache:'no-store' })
    .then(r => r.ok ? r.json() : null).catch(() => null).then(s => {
      const z = $('stockage'); if (!z) return;
      z.innerHTML = s ? htmlStock(s, 'Abonnement OVH') : '<div class="note">Le site ne répond pas pour l’instant.</div>';
    });
}

function majEtatMail(){

const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
const plat = v => String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' ').trim();

/* Un ZIP sans compression (les PDF le sont deja) : les fichiers les uns apres les autres,
   puis leur sommaire. Assez pour ranger trois PDF d'un geste. */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u){ let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC_TABLE[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(fichiers){
  const enc = new TextEncoder(), morceaux = [], centraux = [];
  const d = new Date(), heure = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
        jour = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let pos = 0;
  fichiers.forEach(([nom, octets]) => {
    const n = enc.encode(nom), crc = crc32(octets), t = octets.length;
    const local = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, heure, 2], [12, jour, 2], [14, crc, 4],
     [18, t, 4], [22, t, 4], [26, n.length, 2], [28, 0, 2]].forEach(([o, v, l]) => l === 4 ? local.setUint32(o, v, true) : local.setUint16(o, v, true));
    const central = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, heure, 2], [14, jour, 2], [16, crc, 4],
     [20, t, 4], [24, t, 4], [28, n.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, pos, 4]]
      .forEach(([o, v, l]) => l === 4 ? central.setUint32(o, v, true) : central.setUint16(o, v, true));
    morceaux.push(new Uint8Array(local.buffer), n, octets);
    centraux.push(new Uint8Array(central.buffer), n);
    pos += 30 + n.length + t;
  });
  const tailleC = centraux.reduce((a, u) => a + u.length, 0), fin = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, fichiers.length, 2], [10, fichiers.length, 2], [12, tailleC, 4], [16, pos, 4], [20, 0, 2]]
    .forEach(([o, v, l]) => l === 4 ? fin.setUint32(o, v, true) : fin.setUint16(o, v, true));
  const tout = morceaux.concat(centraux, [new Uint8Array(fin.buffer)]), out = new Uint8Array(tout.reduce((a, u) => a + u.length, 0));
  let o = 0; tout.forEach(u => { out.set(u, o); o += u.length; });
  return out;
}
/* Le backup : tous les jours de tournage, chacun dans son dossier avec ses trois PDF (DIT,
   rapport VFX, data wrangling), dans un seul ZIP telecharge sur cet appareil. */
function telechargerBackup(){
  const d = new Date();
  toast('Backup en préparation…');
  const octets = x => x instanceof Uint8Array ? x : new TextEncoder().encode(String(x));
  chargerLogo().then(() => (RESEAU.possible ? recupererEspaces() : Promise.resolve())).then(() => avecEquipeAJour(() => {
    const jours = surLePerimetre(() => joursConnus().filter(j => j && plansDuJour(j).length));
    const fichiers = [];
    // un jour apres l'autre : les croquis du data wrangling se rendent en images, en asynchrone
    return jours.reduce((suite, j) => suite.then(() => surLePerimetre(() => imagesVFX(j)).then(ims => {
      const dossier = nomJour(j) + '/', sfx = '-' + j;
      surLePerimetre(() => {
        fichiers.push([dossier + fname('journal-DIT' + sfx, 'pdf'), octets(pdfDIT(j))]);
        fichiers.push([dossier + fname('rapport-VFX' + sfx, 'pdf'), octets(pdfWrangling(j))]);
        fichiers.push([dossier + fname('data-wrangling' + sfx, 'pdf'), octets(pdfVFX(j, ims))]);
      });
    })), Promise.resolve()).then(() => {
      if (!fichiers.length) return prevenir('Rien à sauvegarder pour l’instant.');
      download(fname('backup-' + deuxCh(d.getDate()) + '-' + deuxCh(d.getMonth() + 1) + '-' + deuxCh(d.getHours()) + 'h' + deuxCh(d.getMinutes()), 'zip'),
               zipStore(fichiers), 'application/zip');
      toast('Backup téléchargé : ' + jours.length + ' jour' + plur(jours.length) + ', ' + fichiers.length + ' PDF');
    });
  }));
}
function download(name, content, mime){
  const b = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Fichier exporté');
}

function fname(sfx, ext){
  const p = DB.prod;
  // "4 / 7" doit donner J4 et non J47 : on ne garde que le premier nombre
  const j = (String(p.jour || '').match(/\d+/) || [])[0];
  return [(p.titre || 'Wrangle').replace(/[^\w\-]+/g, '_'), j ? 'J' + j : '', p.date, sfx, equipeReunie() ? 'equipe' : '']
         .filter(Boolean).join('_').replace(/[^\w.-]+/g, '-') + '.' + ext;
}

/* Remet a jour le decoupage sans toucher au travail du plateau. */
function resync(){
  if (!SEED) return toast('Découpage introuvable');
  confirmer('Recharger le découpage technique' + (RESEAU.possible ? ' pour tous les appareils' : '') + ' ?',
            { detail:'Les prises, éléments, notes, états et jours sont conservés.', ok:'Recharger' }).then(oui => {
    if (!oui) return;
    /* Un plan du decoupage se reconnait a sa sequence et son numero (clePlan) :
       le decoupage integre n'a pas de refs. S'il est la plusieurs fois — un
       ancien rechargement l'ajoutait en double — on garde le premier et on lui
       rend les prises des doubles. Ce qui a ete saisi sur le plateau (etat,
       elements, notes, jour, croquis…) est conserve ; le reste vient du DT. Puis
       les plans reprennent l'ordre du decoupage, les plans ajoutes sur le plateau
       a la suite : le meme ordre sur tous les appareils. */
    let maj = 0, add = 0, plies = 0;
    const parCle = new Map();
    DB.plans.forEach(p => {
      const k = clePlan(p), premier = parCle.get(k);
      if (!premier){ parCle.set(k, p); return; }
      DB.prises.forEach(t => { if (t.planId === p.id) t.planId = premier.id; });
      plies++;
    });
    const gardes = new Set([...parCle.values()].map(p => p.id));
    DB.plans = DB.plans.filter(p => gardes.has(p.id));
    const ordre = [];
    for (const s of SEED.plans){
      const ex = parCle.get(clePlan(s));
      if (ex){
        const garde = { id: ex.id, jour: ex.jour || s.jour, etat: ex.etat, elements: ex.elements,
                        elementsAutre: ex.elementsAutre, vfxDesc: ex.vfxDesc, intExt: ex.intExt, croquis: ex.croquis,
                        momentJour: ex.momentJour, meteo: ex.meteo, acteurs: ex.acteurs, figu: ex.figu, notesClient: ex.notesClient, notesInternes: ex.notesInternes };
        Object.assign(ex, s, garde); propagerLocal(ex); ordre.push(ex); maj++;
      } else { const n = Object.assign({ id: uid() }, PLAN_NEUF(), s); parCle.set(clePlan(s), n); ordre.push(n); add++; }
    }
    const dedans = new Set(ordre.map(p => p.id));
    DB.plans = ordre.concat(DB.plans.filter(p => !dedans.has(p.id)));   // les plans hors decoupage suivent
    if (DB.prises.some(t => t.planId === dernierPlan) === false) dernierPlan = null;
    operer({ op:'remplacer', db: DB });
    flush(); renderAll();
    toast(maj + ' plans mis à jour, ' + add + ' ajouté' + plur(add) + (plies ? ', ' + plies + ' doublon' + plur(plies) + ' replié' + plur(plies) : ''));
  });
}

function wipe(){
  confirmer('Effacer tout le projet, prises comprises' + (RESEAU.possible ? ', sur tous vos appareils' : '') + ' ?',
            { detail:'Exportez une sauvegarde JSON avant si besoin.', ok:'Tout effacer', danger:true }).then(oui => {
    if (!oui) return;
    DB = normaliser(null);
    if (SEED) seed(DB);
    fJour = '*'; UI.jour = '*'; ecrireUI(); fEtat = ''; fCrit = {}; fQui = ''; dernierPlan = null; chrono = null;
    operer({ op:'remplacer', db: DB });
    flush(); closeSheet(); toast('Projet réinitialisé');
  });
}
