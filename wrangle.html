   se note sans changer de mode ; sans zoom, la fin reste vide. */
const CHAMPS_PRISE = () => [
  CHAMP_METEO(),
  CHAMP_FOCALE('focale', 'Focale'),   // « Focale  14 mm → 20 mm » : debut, fin (la fin a son nom, cache sur la ligne)
  Object.assign(CHAMP_FOCALE('focaleStop', 'Focale fin'), { aucun: 'Pas de zoom' }),
  CHAMP_MOUV('mouvement'),
  CHAMP_SUPPORT()
];
const champsDe = () => openType === 'plan' ? CHAMPS_PLAN() : openType === 'prise' ? CHAMPS_PRISE() : [];
/* Les morceaux d'un choix multiple garde en texte : « Poitrine / Américain ». */
// le separateur est celui de la ligne : « / » (cadrage, mouvement), « + » (support : « Rail / dolly » est une seule valeur)
const morceaux = (v, sep) => String(v || '').split((sep || ' / ').trim() === '+' ? /\s*\+\s*/ : /\s*\/\s*/).map(x => x.trim()).filter(Boolean);
function htmlChamp(p, c){
  const multi = !!c.multi, sep = !!c.sep, v = multi ? (p[c.k] || []) : (p[c.k] || '').trim();
  const parts = sep ? morceaux(v, c.sep) : null;
  // un choix multiple : des tuiles simples (les combinaisons du decoupage se decomposent)
  let liste = multi ? fusion(c.liste, v) : sep ? fusion(c.liste.filter(x => morceaux(x, c.sep).length < 2), parts) : c.liste.slice();
  if (!multi && !sep && v && !liste.some(x => memeVal(x, v))){ liste.push(v); if (c.trier) c.trier(liste); }
  const lu = multi ? v.concat((c.cases || []).filter(x => p[x[0]]).map(x => x[1])).join(', ') : v;
  const ouvert = champOuvert === c.k, pris = x => multi ? v.some(y => memeVal(y, x)) : sep ? parts.some(y => memeVal(y, x)) : memeVal(x, v);
  const prevu = openType === 'plan' && estPrevu(p, c.k);
  // la focale d'une prise qui s'ecarte de celle du decoupage (ou pas encore notee) : la prevue, en bleu
  const prevuF = openType === 'prise' && c.k === 'focale' ? focalePrevue(p) : '';
  return `<div class="champ${ouvert ? ' ouvert' : ''}${prevu ? ' prevu' : ''}" data-champ="${c.k}">
    <button type="button" class="champ-tete" onclick="ouvrirChamp('${c.k}')" aria-expanded="${ouvert}">
      <span class="champ-nom">${c.nom}</span><span class="champ-val${lu ? '' : ' vide'}">${lu ? esc(lu) : '—'}${prevuF ? `<em class="prevu-tag">prévu ${esc(prevuF)}</em>` : ''}</span><i></i>
    </button>${prevu ? `<button type="button" class="mini prevu-ok" onclick="validerPrevu('${c.k}')" title="Garder ce qui était prévu">Valider</button>` : ''}
    ${ouvert ? `<div class="tuiles${c.court ? ' courtes' : ''}${c.ico ? ' pictos' : ''}">
      ${c.aucun ? `<button type="button" class="tuile aucun${v ? '' : ' on'}" onclick="choisirChamp('${c.k}', '')"><span>${esc(c.aucun)}</span></button>` : ''}
      ${liste.map(x => `<button type="button" class="tuile${pris(x) ? ' on' : ''}${prevuF && memeVal(x, prevuF) ? ' prevu' : ''}" data-f="${esc(x)}"
          onclick="choisirChamp('${c.k}', this.dataset.f)">${c.ico ? ICO_AMBIANCE[cleSimple(x)] || '' : ''}<span>${esc(x)}</span></button>`).join('')}
      ${(c.cases || []).map(x => `<button type="button" class="tuile case${p[x[0]] ? ' on' : ''}"
          onclick="basculerCaseChamp('${x[0]}')"><span>${x[1]}</span></button>`).join('')}
      ${!c.autre ? '' : champSaisie
        ? `<div class="tuile-saisie"><input placeholder="${esc(c.aide || AIDE_AUTRE[c.k] || 'Autre valeur…')}" data-cible="${p.id}" data-k="${c.k}"${c.im ? ` inputmode="${c.im}"` : ''}
             onkeydown="if(event.key==='Enter'){event.preventDefault();poserChamp(this)}">
           <button type="button" class="mini" onclick="poserChamp(this.previousElementSibling)">Ajouter</button></div>`
        : `<button type="button" class="tuile plus" onclick="saisirChamp()"><span>&#65291; Autre</span></button>`}
      ${multi || sep ? `<button type="button" class="tuile fin" onclick="ouvrirChamp('${c.k}')"><span>Terminé</span></button>` : ''}
    </div>` : ''}
  </div>`;
}
/* La presaisie : ce que la Preparation a prevu pour le tournage s'affiche dans la fiche du plan
   d'une autre couleur, tant que personne ne l'a saisi au tournage. On le valide d'un geste, ou
   on le change ; laisse tel quel, il compte quand meme dans les rapports. */
const PREVUS_PLAN = ['lieu', 'intExt', 'momentJour', 'meteo', 'acteurs', 'cadrage', 'mouv', 'support', 'focale', 'duree'];
const estPrevu = (p, k) => !!p && PREVUS_PLAN.includes(k) && !!valRap(p[k]) && !Object.keys(saisiesDe(p, k)).length;
function validerPrevu(k){
  const p = plan(openId); if (!p) return;
  patch('plan', p.id, { [k]: p[k] });   // la meme valeur, saisie a son nom : elle n'est plus seulement prevue
  majChamps(); majResumes(); renderList();
}
/* Un bloc de lignes dans la fiche : il retient ses cles pour se redessiner seul. Une fiche
   peut en porter plusieurs (la prise : la meteo sous la note, le reste dans les releves). */
const blocChamps = (o, cles, cls) => `<div class="champs${cls ? ' ' + cls : ''}" data-champs="${cles.join(',')}">${
  champsDe().filter(c => cles.includes(c.k)).map(c => htmlChamp(o, c)).join('')}</div>`;
function majChamps(){
  const o = (openType === 'plan' || openType === 'prise') && cible(openId); if (!o) return;
  const defs = champsDe();
  document.querySelectorAll('#sbody .champs[data-champs]').forEach(b => {
    const cles = b.dataset.champs.split(',');
    b.innerHTML = defs.filter(c => cles.includes(c.k)).map(c => htmlChamp(o, c)).join('');
  });
  decorerFiche();
}
function ouvrirChamp(k){
  champOuvert = champOuvert === k ? '' : k; champSaisie = false;
  majChamps();
  voirChampOuvert();
}
// les tuiles ne doivent pas s'ouvrir sous le pied de la fiche
function voirChampOuvert(){
  const t = document.querySelector('#sbody .champ.ouvert .tuiles');
  if (t) t.scrollIntoView({ block:'nearest', behavior:'smooth' });
}
/* La saisie s'enchaine : une valeur posee referme sa ligne et ouvre la suivante
   du meme bloc, jusqu'au bout. On descend le contexte d'un plan en tapant une
   fois par ligne, sans viser les chevrons. L'ordre est celui du bloc affiche. */
function champSuivant(k){
  const bloc = [...document.querySelectorAll('#sbody .champs[data-champs]')]
    .map(b => b.dataset.champs.split(',')).find(l => l.includes(k));
  return bloc ? (bloc[bloc.indexOf(k) + 1] || '') : '';
}
function choisirChamp(k, val){
  const o = cible(openId), kind = kindDe(openId), c = champsDe().find(x => x.k === k); if (!o || !c) return;
  if (c.multi) patch(kind, o.id, { [k]: avecOuSans(o[k], val) });
  else if (c.sep) patch(kind, o.id, { [k]: avecOuSans(morceaux(o[k], c.sep), val).join(c.sep) });   // la ligne reste ouverte
  else {
    const pose = !memeVal(o[k], val);
    patch(kind, o.id, { [k]: pose ? val : '' });
    // pose : la ligne se referme et la suivante du bloc s'ouvre ; un retrait la laisse ouverte
    if (pose) champOuvert = champSuivant(k);
  }
  renderList();
  // le decor choisit aussi le plan de decor du croquis : toute la fiche se redessine, sur place
  if (kind === 'plan' && k === 'lieu'){ rouvrirFiche(); return voirChampOuvert(); }
  majChamps(); majResumes();
  voirChampOuvert();
}
function basculerCaseChamp(ck){
  const o = cible(openId); if (!o) return;
  patch(kindDe(openId), o.id, { [ck]: !o[ck] });
  majChamps(); majResumes(); renderList();
}
function saisirChamp(){
  champSaisie = true; majChamps();
  const i = document.querySelector('#sbody .tuile-saisie input'); if (i) i.focus();
}
/* La valeur tapee passe par les memes portes que partout ailleurs (la focale rejoint
   la serie du tournage, le role devient connu de tous les plans) ; la fiche se redessine. */
function poserChamp(input){
  const c = champsDe().find(x => x.k === input.dataset.k);
  if (!c || !(input.value || '').trim()){ input.focus(); return; }
  champSaisie = false; if (!c.multi && !c.sep) champOuvert = champSuivant(c.k);
  window[c.autre](input);
}
/* Une ligne de saisie sous les capsules ; Entree ou le bouton pose la valeur. */
function ligneSaisie(id, k, el, ph, action){
  const row = el.closest('.spec');
  if (row.nextElementSibling && row.nextElementSibling.classList.contains('focale-plus')){
    row.nextElementSibling.querySelector('input').focus(); return;
  }
  row.insertAdjacentHTML('afterend', `<div class="spec focale-plus"><label>Nouvelle</label>
    <input placeholder="${ph}" data-cible="${id}" data-k="${k}"
      onkeydown="if(event.key==='Enter'){event.preventDefault();${action}(this)}">
    <button class="mini" onclick="${action}(this.previousElementSibling)">Ajouter</button></div>`);
  row.nextElementSibling.querySelector('input').focus();
}
/* Ce que « + Autre » suggere de taper, selon le champ. */
const AIDE_AUTRE = { lieu:'Nom du décor…', cadrage:'Plongée, plan de coupe…', meteo:'Orage, contre-jour…', support:'Tête télécommandée…',
                     mouv:'Zoom, dolly, motion control…', mouvement:'Zoom, dolly, motion control…' };
/* Une valeur tapee dans un choix multiple : elle s'ajoute aux autres. */
function poserDansTexte(input){
  const s = lireSaisie(input); if (!s) return;
  const c = champsDe().find(x => x.k === s.k);
  const l = morceaux(s.o[s.k], c && c.sep);
  if (!l.some(x => memeVal(x, s.val))) l.push(s.val);

}
function poserValeur(input){

/* Voile : le soleil passe encore, adouci ; Couvert : plus de soleil du tout. Deux lumieres

/* La focale : la serie du tournage ; une valeur tapee l'enrichit pour tous. */
function ajouterFocale(input){

/* Les elements captes : une ligne de texte, les fonds en couleur. */
/* Les elements coches sur un plan, dans l'ordre de la feuille. */
const elementsCoches = p => { const t = elementsTous(p); return ELEMENTS.filter(e => t[e[0]]); };
function lisElements(p){
  if (!p) return '';
  // les fonds d'abord : c'est ce qui change tout pour la post ; tous de la meme couleur
  const l = elementsCoches(p).sort((a, b) => (b[3] === 'v') - (a[3] === 'v'))
    .map(e => `<span>${e[2]}</span>`);

}

/* ------------------------------ Page Tournage ------------------------------ */

function setJour(j){ fJour = j; UI.jour = j; ecrireUI(); renderShoot(); window.scrollTo(0, 0); }
/* En Preparation aussi, la liste se parcourt jour par jour ; « Tout » les montre a la suite. */
let fJourP = '*';
function setJourP(j){ fJourP = j; oublierPrep(); renderPrep(); window.scrollTo(0, 0); }

/* Les fleches : le jour precedent ou suivant, dans l'ordre des onglets
   (Tout, puis les jours connus). Au bout, on ne bouge plus. */
function ordreJours(page){ return ['*'].concat(page === 'prep' ? joursPrep() : joursConnus()); }
function jourVoisin(sens, page){
  const ids = ordreJours(page), actuel = page === 'report' ? fJourR : page === 'prep' ? fJourP : fJour;
  const i = Math.max(0, ids.indexOf(actuel)), n = Math.max(0, Math.min(ids.length - 1, i + sens));
  if (n === i) return;
  page === 'report' ? setJourR(ids[n]) : page === 'prep' ? setJourP(ids[n]) : setJour(ids[n]);
}

/* L'etat repond a « ou en est ce plan ? » : il n'y en a qu'un. Les marqueurs
   repondent a d'autres questions et s'additionnent : on peut demander les
   plans a monter qui portent aussi des elements VFX. Recliquer l'etat actif
   le releve, pour revenir a la liste entiere sans viser « Tous ». */
/* Le panneau des filtres s'ouvre sous la rangee des jours ; un clic ailleurs
   ou Echap le referme, les filtres restent poses. */
function ouvrirFiltres(){
  const p = $('c-filtre'), b = $('btn-filtres');
  if (!p.hidden){ fermerFiltres(); return; }
  p.hidden = false; b.classList.add('ouvert');
  setTimeout(() => document.addEventListener('click', clicHorsFiltres), 0);
}
function fermerFiltres(){
  const p = $('c-filtre'); if (!p || p.hidden) return false;
  p.hidden = true; $('btn-filtres').classList.remove('ouvert');
  document.removeEventListener('click', clicHorsFiltres);
  return true;
}
function clicHorsFiltres(e){
  // un bouton du panneau vient d'etre redessine : sa cible n'est plus dans la page, ce n'est pas un clic dehors
  if (!e.target.isConnected) return;
  if (!e.target.closest('#c-filtre') && !e.target.closest('#btn-filtres')) fermerFiltres();
}
/* L'ordre des plans est celui du projet : c'est l'ordre de tournage, que la page
   Preparation permet de changer. En vue « Tout », les jours se suivent. */
function trierPlans(l, parJour){
  const pos = new Map(DB.plans.map((p, i) => [p.id, i]));
  return l.slice().sort((a, b) =>
    (parJour ? rangJour(a.jour || '') - rangJour(b.jour || '') : 0) || pos.get(a.id) - pos.get(b.id));
}
function setEtatF(v){ fEtat = fEtat === v ? '' : v; renderShoot(); }
function setQui(v){ fQui = fQui === v ? '' : v; renderShoot(); }
function basculerCritere(k){ fCrit[k] = !fCrit[k]; renderShoot(); }
function razFiltres(){
  fEtat = ''; fCrit = {}; fQui = '';
  const q = $('q'); if (q) q.value = '';
  renderShoot(); window.scrollTo(0, 0);
}

/* Une prise sans nom de clip ou sans carte ne se retrouve pas en post, et un
   plan dit tourne sans aucune prise n'a laisse aucune trace : ce sont les deux
   trous qu'il faut boucher avant de rendre la journee. Ce sont aussi les
   alertes du rapport, atteignables ici directement depuis la liste. */
// une prise marquee « non saisie » n'est pas a completer : ce sont les saisies des autres qui comptent ;
// une « saisie differee » l'est toujours, jusqu'a ce qu'on retire la marque
const priseIncomplete = t => !t.pasSaisie && (!!t.differee || !String(t.clip || '').trim() || !String(t.carte || '').trim());
/* La focale de la prise n'est pas celle que le plan prevoit : rend la focale
   prevue, sinon ''. « 14 mm » et « 14 » sont la meme ; un zoom prevu
   (« 18-35 zoom ») accepte tout ce qui tombe dedans. Depart et arrivee comptent. */
const nombresDe = s => (String(s || '').replace(/,/g, '.').match(/\d+(\.\d+)?/g) || []).map(Number);
function focaleHorsPlan(t, pl){
  const p = pl || (t && plan(t.planId));
  if (!p || !String(p.focale || '').trim() || !String(t.focale || '').trim()) return '';
  const prevue = nombresDe(p.focale); if (!prevue.length) return '';
  const zoom = prevue.length > 1 && /[-–]|à/.test(p.focale);
  const bon = v => { const n = nombresDe(v)[0]; if (n == null) return true;
    return zoom ? n >= Math.min(prevue[0], prevue[1]) && n <= Math.max(prevue[0], prevue[1]) : n === prevue[0]; };
  return [t.focale, t.focaleStop].filter(x => String(x || '').trim()).every(bon) ? '' : p.focale.trim();
}
/* La focale prevue au decoupage, a rappeler sur la prise : quand celle-ci s'en ecarte ou n'est pas notee. */
function focalePrevue(t){
  const p = t && plan(t.planId), pf = p ? String(p.focale || '').trim() : '';
  return pf && (!String(t.focale || '').trim() || focaleHorsPlan(t)) ? pf : '';
}
/* Qui a saisi la prise : le prenom note dessus. */
const quiDe = t => (t.par || '').trim();

const CRITERES = [
  ['keep',   'À monter',         (p, pr) => pr.some(t => t.retenue), ICONES.etoile],
  ['elem',   'Éléments captés',  p => aElements(p), ICONES.elements],

/* La pastille active reste visible : on ouvre souvent la page sur le jour 5
   alors que la rangee commence au jour 1. On ne recadre qu'au changement,
   pour ne pas ramener la rangee sous les doigts de celui qui la parcourt. */
let cadreFait = null;
function cadrerJour(id, actif){
  const row = $(id);
  if (!row) return;
  const ids = ordreJours(id === 'c-jourp' ? 'prep' : ''), i = ids.indexOf(actif);
  if (row.previousElementSibling) row.previousElementSibling.disabled = i <= 0;
  if (row.nextElementSibling) row.nextElementSibling.disabled = i >= ids.length - 1;
  if (!row.clientWidth) return;               // vue masquee : on recadrera a l'ouverture
  const cle = id + '|' + actif;
  if (cadreFait === cle) return;
  const el = row.querySelector('.chip.on'); if (!el) return;
  cadreFait = cle;
  // la place de l'onglet dans la rangee elle-meme (offsetLeft compte depuis le bandeau : fleche et cale comprises)
  const x = el.getBoundingClientRect().left - row.getBoundingClientRect().left + row.scrollLeft;
  row.scrollLeft = Math.max(0, x - (row.clientWidth - el.offsetWidth) / 2);
  bordsChips(row);
}

/* Le degrade de bord dit « la rangee continue par la ». Pose des deux cotes
   en dur, il rongeait le premier onglet alors qu on etait deja au debut : on
   lisait « ut » au lieu de « Tout ». Il ne se met donc que du cote ou il reste
   des jours a atteindre. */
function bordsChips(row){
  if (!row) return;
  const reste = row.scrollWidth - row.clientWidth;
  row.classList.toggle('bord-g', row.scrollLeft > 2);
  row.classList.toggle('bord-d', row.scrollLeft < reste - 2);
}
document.addEventListener('scroll', e => {
  if (e.target instanceof Element && e.target.classList.contains('chips')) bordsChips(e.target);
}, true);
window.addEventListener('resize', () => document.querySelectorAll('.chips').forEach(bordsChips));

/* Une pastille par jour : son libelle, son compte et un trait d'avancement en
   pied. `info` decrit ce que compte la page qui appelle (plans ici, prises
   dans le rapport). */
function chipsJours(actif, fn, info, jours){
  const un = (j, label) => {
    const d = info(j) || {};
    const fini = d.total > 0 && d.fait === d.total;
    return `<button class="chip${actif === j ? ' on' : ''}${fini ? ' fini' : ''}${d.vide ? ' vide' : ''}"
      onclick="${fn}('${esc(j)}')"${d.titre ? ` title="${esc(d.titre)}"` : ''}>${label}</button>`;
  };
  // le nom du jour seul : les comptes et l'avancement sont dans la ligne de
  // filtres et dans l'en-tete de chaque journee
  return un('*', 'Tout') + (jours || joursConnus()).map(j => un(j, nomJour(j) + (jourFige(j) ? ICO_JOUR_FIGE : ''))).join('');
}

function renderShoot(){
  /* La page Tournage n'a plus de champ de recherche : la liste se parcourt par
     jour et par filtre. Le tri par mot reste ecrit ici, inerte, pour le jour ou
     on le rebranchera sur une loupe dans la barre. */
  const ch = $('q');
  const q = ch ? ch.value.toLowerCase().trim() : '';

  /* La recherche porte sur le plan, sa sequence et toutes ses prises. */
  const corr = p => {
    if (!q) return true;
    return [p.plan, p.desc, p.lieu, p.cadrage, p.mouv, p.assets, texteDe(p, 'vfxDesc'), p.seqTitre, p.seq, p.jour]
      .concat(p.tags || [], prisesDe(p.id).map(t => [t.clip, t.carte, t.cam, t.notes, t.tcIn, t.par].join(' ')))
      .join(' ').toLowerCase().indexOf(q) >= 0;
  };
  const trouves = q ? DB.plans.filter(corr) : DB.plans;

  /* Les jours affichent leur avancement, et le nombre de resultats des qu'une
     recherche est en cours : on voit ou chercher sans changer de jour. */
  $('c-jour').innerHTML = chipsJours(fJour, 'setJour', j => {
    const a = avancement(j);
    if (q){
      const n = j === '*' ? trouves.length : trouves.filter(p => (p.jour || '') === j).length;
      return { txt: n, vide: !n, titre: n + ' plan' + plur(n) + ' trouvé' + plur(n) };
    }
    const d = j === '*' ? '' : (j === 'CG' ? 'Full CG' : decorJour(j));
    return { txt: a.fait + '/' + a.total, fait: a.fait, total: a.total,
             titre: [j === '*' ? 'Tout le tournage' : nomJour(j), d].filter(Boolean).join(' · ') };
  });
  cadrerJour('c-jour', fJour);

  /* Les comptes des filtres se lisent dans le jour affiche et la recherche en
     cours, sans tenir compte des autres filtres : « À monter 3 » veut dire
     trois plans a monter ce jour-la, quoi qu'on ait coche par ailleurs. */
  const base = trouves.filter(p => fJour === '*' || (p.jour || '') === fJour);
  const nb = f => base.filter(p => f(p, prisesDe(p.id))).length;

  /* Qui a saisi : on ne propose que les prenoms qu'on trouve vraiment dans
     les prises du jour affiche. Trois personnes sur le plateau, trois
     boutons. Celui qui est coche reste propose meme s'il n'a rien saisi
     ici, sinon on ne pourrait plus le decocher. */
  const gens = [];
  base.forEach(p => prisesDe(p.id).forEach(t => {
    const n = quiDe(t);
    if (n && gens.indexOf(n) < 0) gens.push(n);
  }));
  gens.sort((a, b) => a.localeCompare(b, 'fr'));
  if (fQui && gens.indexOf(fQui) < 0) gens.push(fQui);

  const etats = [['todo', 'À tourner', p => p.etat === 'todo'],
                 ['done', 'Tournés',   p => p.etat === 'done']];
  if (DB.plans.some(p => p.etat === 'drop')) etats.push(['drop', 'Abandonnés', p => p.etat === 'drop']);

  let rows = base.filter(p => {
    if (fEtat && p.etat !== fEtat) return false;
    const pr = prisesDe(p.id);
    if (fQui && !pr.some(t => quiDe(t) === fQui)) return false;
    return CRITERES.every(c => !fCrit[c[0]] || c[2](p, pr));
  });

  const enCours = fEtat || fQui || CRITERES.some(c => fCrit[c[0]]) || q;
  const seg = (k, label, n, on) => {
    const off = !n && !on;
    return `<button type="button" class="${on ? 'on' : ''}${off ? ' off' : ''}"${off ? ' disabled' : ''} onclick="setEtatF('${k}')">${label}<b>${n}</b></button>`;
  };
  $('c-filtre').innerHTML =
    `<div class="ptete"><div><b>Filtres</b><span>${fJour === '*' ? 'Tout le tournage' : nomJour(fJour)}</span></div>` +
      `${enCours ? '<button type="button" class="raz" onclick="razFiltres()">Effacer</button>' : ''}</div>` +
    `<h4>État</h4><div class="segm">` +
      seg('', 'Tous', base.length, !fEtat) +
      etats.map(e => seg(e[0], e[1], nb(e[2]), fEtat === e[0])).join('') +
    `</div>` +
    // une seule personne a saisi : le filtre ne trierait rien, on l'omet
    (gens.length > 1 ? `<h4>Saisie par</h4><div class="gens">` +
      gens.map(n => {
        const on = fQui === n;
        // le prenom traverse une chaine JS puis un attribut HTML
        const arg = esc(n.replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        return `<button type="button" class="${on ? 'on' : ''}" onclick="setQui('${arg}')">` +
               `${esc(n)}<b>${nb((p, pr) => pr.some(t => quiDe(t) === n))}</b></button>`;
      }).join('') + `</div>` : '') +
    `<h4>Marqueurs</h4><div class="marq">` +
      CRITERES.map(c => { const n = nb(c[2]), on = !!fCrit[c[0]], off = !n && !on;
        return `<button type="button" class="${on ? 'on' : ''}${off ? ' off' : ''}"${off ? ' disabled' : ''} onclick="basculerCritere('${c[0]}')">` +
               `<i>${c[3]}</i><span>${c[1]}</span><b>${n}</b><u></u></button>`; }).join('') +
    `</div>` +
    `<button type="button" class="btn p voir" onclick="fermerFiltres()">Voir ${rows.length === 1 ? 'le plan' : 'les ' + rows.length + ' plans'}</button>`;
  // le bouton de la rangee porte le nombre de filtres poses
  const actifs = (fEtat ? 1 : 0) + (fQui ? 1 : 0) + CRITERES.filter(c => fCrit[c[0]]).length;
  const bf = $('btn-filtres');
  if (bf){ bf.classList.toggle('on', actifs > 0); const b = bf.querySelector('b'); b.textContent = actifs || ''; b.hidden = !actifs; }

  rows = trierPlans(rows, fJour === '*');

  /* L'entete de journee est toujours la, meme sur un seul jour : elle rappelle
     le decor et l'avancement, que la pastille seule ne dit pas. */
  let html = '', lastJour = null, lastSeq = null;
  for (const p of rows){
    const j = p.jour || '';
    if (j !== lastJour){
      lastJour = j; lastSeq = null;
      const a = avancement(j);
      html += `<div class="jour${jourFige(j) ? ' fige' : ''}"><b>${nomJour(j)}${jourFige(j) ? ICO_JOUR_FIGE : ''}</b>
        <span>${esc(j === 'CG' ? 'Full CG' : decorJour(j))}</span>
        <i>${a.fait}/${a.total}</i></div>`;
    }
    const sk = p.seq + '|' + (p.seqTitre || '');
    if (sk !== lastSeq){
      lastSeq = sk;
      html += `<div class="seq seqbar"><b>Séquence ${esc(p.seq)}</b>${p.seqTitre ? `<em>${esc(p.seqTitre)}</em>` : ''}</div>`;
    }
    html += blocPlan(p, !!fCrit.keep, fQui);
  }

  /* Chercher un clip du jour 5 depuis le jour 1 ne doit pas finir sur une
     page vide : on dit combien il y en a ailleurs et on y va d'un geste. */
  const ailleurs = q && fJour !== '*' ? trouves.filter(p => (p.jour || '') !== fJour).length : 0;
  const passerelle = ailleurs
    ? `<div class="ailleurs"><span>${ailleurs} ${ailleurs > 1 ? 'autres plans trouvés' : 'autre plan trouvé'}
         dans les autres jours</span>
       <button class="btn sm" onclick="setJour('*')">Voir tout le tournage</button></div>`
    : '';

  const vide = `<div class="empty">${
    !DB.plans.length ? 'Aucun plan chargé.'
    : ailleurs ? 'Rien ne correspond dans ' + esc(nomJour(fJour)) + '.'
    : enCours ? 'Aucun plan ne correspond.<br><button class="btn sm" style="margin-top:14px" onclick="razFiltres()">Tout afficher</button>'
    : 'Aucun plan ce jour-là.'}</div>`;

  memoDefilPrises('#l-shoot');
  $('l-shoot').innerHTML =
    (rows.length ? html : vide) + passerelle +
    `<button class="addplan" onclick="nouveauPlan()">+ Plan hors découpage</button>`;
  calerPrises('#l-shoot');

  majMarqueurs();
  majFab();
}

/* Au-dela de cinq prises, la liste d'un plan defile dans sa propre fenetre,
   haute de cinq lignes tout rond (la feuille de style s'en charge : toutes
   les prises font la meme hauteur). Un redessin remplace la liste : on remet
   chacune ou elle etait. 'fin' : on regardait les dernieres prises, on y
   reste quand il en arrive une d'un autre appareil. Meme chose dans la fiche
   du plan (racine '#fiche-prises'), qui garde sa propre position. */
const defilPrises = {};
const cleDefil = b => b.parentNode.dataset.id || 'fiche:' + openId;
function memoDefilPrises(racine){
  document.querySelectorAll(racine + ' .prises.defile').forEach(b => {
    if (!b.clientHeight) return;   // vue masquee : rien a retenir
    const fin = b.scrollTop > 0 && b.scrollTop + b.clientHeight >= b.scrollHeight - 2;
    defilPrises[cleDefil(b)] = fin ? 'fin' : b.scrollTop;
  });
}
function calerPrises(racine){
  document.querySelectorAll(racine + ' .prises.defile').forEach(b => {
    const y = defilPrises[cleDefil(b)];
    b.scrollTop = y === 'fin' ? b.scrollHeight : y || 0;
  });
}

/* « Tourne » s'affiche une fois qu'on est passe a la suite : la derniere prise
   notee est sur un autre shot. Le shot qu'on tourne encore ne le dit pas. */
/* Un shot termine (toutes ses prises faites) : coche sur sa carte, pour toute l'equipe ; son nom passe au vert. */
// le petit cadenas d'une journee verrouillee, dans la rangee des jours et l'en-tete du jour
const ICO_JOUR_FIGE = '<svg class="jfige" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="verrouillé">' +
  '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
// le cadenas : ferme, le shot est valide et verrouille ; ouvert, il peut l'etre
const ICO_FINI = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2"/></svg>';
const ICO_FINI_OUVERT = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 7.6-1.7"/><path d="M12 14.5v2"/></svg>';
/* Le bandeau d'un shot valide, en tete de sa fiche et de celles de ses prises */
const bandeauVerrou = p => p && jourFige(p.jour) ? `<div class="verrou-shot">${ICO_FINI}<span>${esc(nomJour(p.jour))} verrouillé : rien ne s’y modifie.</span>
  <button type="button" class="btn sm" onclick="verrouillerJour('${esc(p.jour)}')">Rouvrir le jour</button></div>`
  : p && p.termine ? `<div class="verrou-shot">${ICO_FINI}<span>Shot validé : il ne se modifie plus.</span>
  <button type="button" class="btn sm" onclick="terminerShot('${p.id}')">Rouvrir le shot</button></div>` : '';
/* Verrouiller une journee demande confirmation ; la rouvrir, non. */
function verrouillerJour(j){
  const appliquer = v => {
    patch('prod', 'prod', { ['verrou_' + j]: v });
    if (v && UI.vise && (plan(UI.vise) || {}).jour === j){ UI.vise = null; ecrireUI(); }   // plus de Moteur dessus
    oublierPrep(); renderAll();
    if (openType === 'prod') openProd(); else if (openType === 'plan' || openType === 'prise') rouvrirFiche();
    toast(nomJour(j) + (v ? ' verrouillé : plus rien ne s’y modifie' : ' rouvert'));
  };
  if (jourFige(j)) return appliquer(false);
  confirmer('Verrouiller le ' + nomJour(j).toLowerCase() + ' ?', { detail: 'Ses shots, leurs prises et sa préparation ne se modifieront plus, pour toute l’équipe. Il se rouvre ici, dans Journée.', ok: 'Verrouiller' })
    .then(oui => { if (oui) appliquer(true); });
}
/* Valider un shot demande confirmation (la double validation) ; le rouvrir, non. */
function terminerShot(id){
  const p = plan(id); if (!p) return;
  const appliquer = v => {
    patch('plan', id, { termine: v });
    if (v && UI.vise === id){ UI.vise = null; ecrireUI(); }   // un shot valide ne se tourne plus
    if (v) OUVERTS.delete(id);                                 // et ses prises se replient
    renderList(); if (openType === 'plan' || openType === 'prise') rouvrirFiche();
    toast('Shot ' + (p.plan || '') + (v ? ' validé : verrouillé' : ' rouvert'));
  };
  if (p.termine) return appliquer(false);
  confirmer('Valider le shot ' + (p.plan || 'sans n°') + ' ?', { detail: 'Toutes ses prises sont faites : il passe en vert, pour toute l’équipe.', ok: 'Valider' })
    .then(oui => { if (oui && plan(id)) appliquer(true); });
}
/* Tourne : seulement quand on le marque a la main (« Tourne » dans la fiche). Des prises ne suffisent
   pas : un shot reste a tourner tant qu'on n'a pas dit qu'il etait fini, puis se verrouille d'un geste. */
const estTourne = p => p.etat === 'done';
/* Une fusion se lit sur la carte : « + 06 » sur le shot garde, « dans 05 » sur l'autre. */
function htmlFusion(p){
  const dans = p.fusionDans && plan(p.fusionDans);
  return dans ? `<span class="pfusion">fusionné dans ${esc(dans.plan || '?')}</span>` : '';
}
/* dans le numero meme, de la meme typo : « Shot 1 + 2 » */
function plusFusion(p){
  const avec = (p.fusionAvec || []).map(plan).filter(Boolean);
  return avec.length ? `<span class="pno-plus">+ ${avec.map(x => esc(x.plan || '?')).join(' + ')}</span>` : '';
}
/* Le plan que le Moteur vise deplie ses prises ; les autres les replient en
   une ligne (« 8 prises · 2 OK »), qu'un appui deplie sans changer le plan vise
   (pour revoir un shot precedent), et qu'un « Replier » referme. Un filtre qui
   trie les prises (a monter, saisie par) les montre partout. */
const OUVERTS = new Set();
function basculerOuvert(id){
  if (OUVERTS.has(id)) OUVERTS.delete(id); else OUVERTS.add(id);
  renderList();
}
function blocPlan(p, seulementRetenues, qui){
  let pr = prisesDe(p.id);
  const total = pr.length;
  const vise = (planVise() || {}).id === p.id, ouvert = OUVERTS.has(p.id) && !vise;
  const deplie = seulementRetenues || qui || vise || ouvert;
  if (seulementRetenues) pr = pr.filter(t => t.retenue);
  if (qui) pr = pr.filter(t => quiDe(t) === qui);
  const el = lisElements(p);

  /* Le contexte du plan, en clair : decor, cadrage, mouvement, focale, duree. */
  // ce qui vient de la Preparation et que personne n'a encore saisi au tournage : en bleu, comme dans la fiche
  const pv = k => estPrevu(p, k) ? ' class="prevu" title="Prévu en préparation"' : '';
  const ctx = [
    p.lieu && `<span${pv('lieu')}><b>${esc(p.lieu)}</b></span>`,
    p.cadrage && `<span${pv('cadrage')}>${esc(p.cadrage)}</span>`,
    p.mouv && `<span${pv('mouv')}>${esc(p.mouv)}</span>`,
    p.support && `<span${pv('support')}>${esc(p.support)}</span>`,
    (p.acteurs || []).length && `<span${pv('acteurs')}>${esc(p.acteurs.join(', '))}</span>`,
    p.figu && `<span>Figuration</span>`,
    p.focale && `<span${pv('focale')}>${esc(p.focale)}</span>`,
    (d => d && `<span${d.prevue ? ' class="prevu"' : ''} title="${d.prevue ? 'Durée prévue' : 'Durée de la prise ' + esc(d.prise)}">${esc(d.v)}${d.prevue ? ' prévus' : ''}</span>`)(dureeShot(p)),
    p.intExt && `<span${pv('intExt')}>${esc(p.intExt)}</span>`,
    p.momentJour && `<span${pv('momentJour')}>${esc(p.momentJour)}</span>`
  ].filter(Boolean).join('');

  return `<div class="plan ${p.etat === 'done' ? 'done' : p.etat === 'drop' ? 'drop' : ''}${p.termine ? ' termine' : ''}${p.fusionDans ? ' fusionne' : ''}" data-id="${p.id}">
    <div class="phead" onclick="openPlan('${p.id}')">
      <div class="pmain">
        <div class="pnum"><span class="pno">${p.seq ? `<small class="pno-seq">Séq ${esc(p.seq)}</small>` : ''}<small>Shot</small>${p.plan ? esc(p.plan) : 'sans n°'}${plusFusion(p)}</span>${
          p.termine ? '<span class="ptourne">Terminé</span>' : p.etat === 'drop' && !p.fusionDans ? '<span class="ptourne">Abandonné</span>'
          : estTourne(p) ? '<span class="ptourne">Tourné</span>' : ''}${htmlFusion(p)}<span class="ptags">${htmlPtags(p)}</span>
          <span class="pactions">${estTourne(p) || p.termine ? `<button type="button" class="fini${p.termine ? ' on' : ''}" onclick="event.stopPropagation();terminerShot('${p.id}')"
            title="${p.termine ? 'Shot terminé : toucher pour le rouvrir' : 'Marquer le shot terminé, pour toute l’équipe'}" aria-pressed="${!!p.termine}"
            aria-label="Shot terminé">${p.termine ? ICO_FINI : ICO_FINI_OUVERT}</button>` : ''}
          <button type="button" class="viser${(planVise() || {}).id === p.id ? ' on' : ''}" data-vise="${p.id}"
            onclick="event.stopPropagation();viser('${p.id}')"
            title="Tourner ce plan : le Moteur et + Prise enregistrent dessus" aria-label="Tourner ce plan">${ICO_VISER}<span>Moteur</span></button></span></div>
        ${p.desc ? `<div class="pdesc">${esc(p.desc)}</div>` : ''}
        ${ctx ? `<div class="pctx">${ctx}</div>` : ''}
        ${el ? `<div class="pelem">${el}</div>` : ''}
      </div>
    </div>
    ${deplie ? htmlPrises(pr) + (ouvert && !seulementRetenues && !qui ? `<button type="button" class="prises-replier" onclick="basculerOuvert('${p.id}')">Replier<i></i></button>` : '')
      : pr.length ? `<button type="button" class="prises-repliees" onclick="basculerOuvert('${p.id}')"
        aria-label="Déplier les prises"><span class="res">${resumePrises(p)}</span><i></i></button>` : ''}
    ${p.fusionDans ? '' : `<button class="addtake" onclick="viser('${p.id}', true);ajouterPrise('${p.id}')">+ Prise ${total + 1}</button>`}
  </div>`;
}

/* Sur la meme prise (meme plan, meme numero), les autres ont-ils note le meme
   clip et la meme focale ? [{ a, diff }] : diff dit ce qui differe chez lui. */
function accordPrise(t){
  try{ if (!AUTRES.liste.length || t.pasSaisie) return null; }catch(e){ return null; }
  const p = plan(t.planId); if (!p) return null;
  const avis = [];
  AUTRES.liste.forEach(a => {
    const q = a.db.plans.find(x => x.id === p.id) || ((p.seq || p.plan) ? a.db.plans.find(x => clePlan(x) === clePlan(p)) : null);
    const x = q && a.db.prises.find(y => y.planId === q.id && y.n === t.n && !y.pasSaisie);
    if (!x) return;
    const diff = [];
    if (valRap(x.clip) && valRap(t.clip) && !memeVal(x.clip, t.clip)) diff.push(valRap(x.clip));
    const fa = fleche(t.focale, t.focaleStop), fb = fleche(x.focale, x.focaleStop);
    if (fa && fb && !memeVal(fa, fb)) diff.push(fb);
    if (valRap(x.clip) || fb) avis.push({ a, diff });
  });
  return avis.length ? avis : null;
}
function htmlAccord(t){
  const acc = accordPrise(t); if (!acc) return '';
  const pt = a => `<i class="a2-pt" style="--c:${a.coul}">${esc(initiale(a.nom))}</i>`;
  const non = acc.filter(v => v.diff.length), oui = acc.filter(v => !v.diff.length);
  return (non.length ? `<span class="accord non" title="Pas la même saisie : ${esc(non.map(v => v.a.nom + ' ' + v.diff.join(' · ')).join(', '))}">&#9888; ${
            non.map(v => pt(v.a) + esc(v.diff.join(' · '))).join(' ')}</span>` : '') +
         (oui.length ? `<span class="accord oui" title="Même clip et même focale chez ${esc(oui.map(v => v.a.nom).join(', '))}">&#10003; ${oui.map(v => pt(v.a)).join('')}</span>` : '');
}
function ligne(t, sansActions){
  // « non saisie », « saisie differee » : devant les boutons, a leur hauteur
  const marque = t.pasSaisie ? `<span class="tstat pas non">non saisie</span>` : t.differee ? `<span class="tstat pas diff">saisie différée</span>` : '';
  const map = fleche(t.focusStart, t.focusStop), haut = fleche(t.hauteurStart, t.hauteurStop);
  const ptr = [fleche(t.panStart, t.panStop), fleche(t.tiltStart, t.tiltStop), fleche(t.rollStart, t.rollStop)].filter(Boolean).join(' / ');
  const enCours = chrono && chrono.priseId === t.id;
  const meta = [
    t.cam && `<span>${esc(t.cam)}</span>`,
    t.carte && `<span>${esc(t.carte)}</span>`,
    t.focale && (focaleHorsPlan(t)
      ? `<span class="hors" title="Le plan prévoit ${esc(focaleHorsPlan(t))}">&#9888; ${esc(fleche(t.focale, t.focaleStop))}</span>`
      : `<span>${esc(fleche(t.focale, t.focaleStop))}</span>`),
    t.diaph && `<span>${esc(t.diaph)}</span>`,
    t.fps && `<span>${esc(t.fps)}&#8239;i/s</span>`,
    t.tcIn && `<span>${esc(t.tcIn)}</span>`,
    t.heure && `<span>${esc(t.heure)}</span>`,
    enCours ? `<span style="color:var(--ng);font-weight:700">&#9679; ça tourne</span>` : t.duree && `<span>${esc(t.duree)}</span>`,
    t.par && `<span>${esc(t.par)}</span>`,
    htmlAccord(t)
  ].filter(Boolean).join('');
  const rel = [
    map && `<span><b>Map</b> ${esc(map)}</span>`,
    haut && `<span><b>Haut.</b> ${esc(haut)}</span>`,
    ptr && `<span><b>P/T/R</b> ${esc(ptr)}</span>`
  ].filter(Boolean).join('');

  return `<div class="prise ${t.statut === 'OK' ? 'ok' : t.statut === 'NG' ? 'ng' : ''}"
    data-id="${t.id}" onclick="openPrise('${t.id}')">
    <div class="tn">${t.n}</div>
    <div class="tbody">
      <div class="trow">
        <span class="clip${t.clip ? '' : ' vide'}">${esc(t.clip || 'clip à renseigner')}</span>
        ${t.notes ? `<span class="tnote" title="${esc(t.notes)}">${esc(t.notes)}</span>` : ''}
        ${t.statut && t.statut !== 'OK' && t.statut !== 'NG'
          ? `<span class="tstat">${esc(t.statut)}</span>` : ''}
        ${t.pickup ? '<span class="tstat">Pick-up</span>' : ''}
        ${sansActions ? marque : ''}
      </div>
      ${meta || rel ? `<div class="tmeta">${meta}${rel}</div>` : ''}
    </div>
    ${sansActions ? '' : `<div class="tact" onclick="event.stopPropagation()">${marque}
      <button class="kp ${t.retenue ? 'on' : ''}" onclick="basculerEtoile('${t.id}')"
        title="Prise à monter" aria-label="Prise à monter">${ICONES.etoile}</button>
      <button class="ok ${t.statut === 'OK' ? 'on' : ''}" onclick="marquer('${t.id}','OK')" title="Bonne" aria-label="Bonne">${ICONES.coche}</button>
      <button class="ng ${t.statut === 'NG' ? 'on' : ''}" onclick="marquer('${t.id}','NG')" title="Mauvaise" aria-label="Mauvaise">${ICONES.croix}</button>
    </div>`}
  </div>`;
}

/* Marquer, depuis la liste comme depuis la fiche, sans bouger la page. */
function marquer(id, s){
  const t = prise(id); if (!t) return;
  // Pick-up s'allume et s'eteint seul : il ne remplace ni OK ni NG
  if (s === 'Pick-up'){ patch('prise', id, { pickup: !t.pickup }); return rafraichirDoux(); }
  const d = { statut: t.statut === s ? '' : s };
  // premiere bonne prise du plan : on la retient d'office, quitte a changer ensuite
  if (d.statut === 'OK' && !t.retenue && !prisesDe(t.planId).some(x => x.retenue)) d.retenue = true;
  patch('prise', id, d);
  rafraichirDoux();
}

function basculerEtoile(id){
  const t = prise(id); if (!t) return;
  patch('prise', id, { retenue: !t.retenue });
  rafraichirDoux();
  toast(t.retenue ? 'Prise ' + t.n + ' retenue pour le montage' : 'Prise ' + t.n + ' retirée du montage');
}

/* Redessine sans rien faire bouger : ni la page, ni la fiche ouverte,
   ni le champ en cours de frappe. C'est aussi ce qui se passe quand une
   modification arrive d'un autre appareil. */
function rafraichirDoux(){
  appliquerFusions();
  const y = window.scrollY;
  const sb = $('sbody');
  const ys = openType ? sb.scrollTop : 0;
  if (openType && openType !== 'picker' && openType !== 'prod' && !cible(openId)){
    closeSheet();
    toast('Cette fiche a été supprimée sur un autre appareil');
  } else {
    renderList(); majFicheEnPlace();
  }
  window.scrollTo(0, y);
  if (openType) sb.scrollTop = ys;
}

/* Quand un autre appareil tape, ses modifications arrivent par paquets toutes
   les 250 ms : on ne redessine pas plus d'une fois toutes les 400 ms. */
let tDoux = null;
function rafraichirDouxBientot(){
  if (tDoux) return;
  tDoux = setTimeout(() => { tDoux = null; rafraichirDoux(); }, 400);
}

/* Met la fiche ouverte au niveau du projet sans la reconstruire :
   chaque champ non focalise reprend la valeur courante, les boutons suivent. */
function majFicheEnPlace(){
  if (!openType || openType === 'picker') return;
  document.querySelectorAll('#sbody [data-o][data-k]').forEach(el => {
    if (el === document.activeElement) return;
    const c = cible(el.dataset.o); if (!c) return;
    const v = c[el.dataset.k];
    if (el.type === 'checkbox'){ el.checked = !!v; return; }
    const s = v == null ? '' : String(v);
    if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === s)) el.add(new Option(s, s));
    if (el.value !== s){ el.value = s; if (el.classList.contains('auto')) autoHauteur(el); }
  });
  document.querySelectorAll('#sbody .wb-val').forEach(majCurseurWb);   // le curseur suit la valeur venue d'ailleurs
  if (openType === 'prise'){
    const t = prise(openId);
    $('stitle').textContent = 'Prise ' + t.n;
    majBoutonsPrise(); majChronoFiche();
  }
  if (openType === 'plan'){ majBoutonsPlan(); majPrisesFiche(); }
  // les lignes de choix suivent aussi, sauf si l'on est en train d'y taper une valeur
  const a = document.activeElement;
  if (!(a && a.tagName === 'INPUT' && a.closest('.tuile-saisie'))) majChamps();
  decorerFiche();
}

/* Le bouton flottant : Moteur pour ouvrir une prise et lancer le chrono,
   Coupez pour l'arreter et noter la duree. Le petit bouton ajoute une prise
   sans chrono, pour ceux qui notent apres coup. */
function majFab(){
  const f = $('fab'), f2 = $('fab2'), f3 = $('fab3');
  // pendant une prise, REC reste a l'ecran partout : sur chaque page, par-dessus une fiche ou
  // le croquis, pour couper d'ou qu'on soit ; + Prise et + Plan restent a la page Tournage
  document.body.classList.toggle('en-rec', !!chrono);
  f.hidden = view !== 'shoot' && !chrono;
  [f2, f3].forEach(b => { b.hidden = view !== 'shoot'; });
  if (f.hidden) return;
  const p = planVise();
  // le bouton est redessine deux fois par seconde pendant une prise : on ne
  // touche au DOM que si son texte change, sinon l'onde du bouton tressaute
  let cls, html;
  if (chrono){
    const t = prise(chrono.priseId);
    cls = 'fab rec';
    // comme sur une camera : le point rouge qui clignote, REC, le chrono ; le carre pour couper
    html = `<i class="rec-point"></i><b class="rec-mot">REC</b><em>${fmtChrono(Date.now() - chrono.debut)}${t ? ' · prise ' + t.n : ''}</em><span class="rec-stop" title="Coupez">${ICO_COUPEZ}</span>`;
  } else {
    cls = 'fab';
    html = ICO_MOTEUR + (p ? ` Moteur <em>shot ${esc(p.plan || '?')} · prise ${prisesDe(p.id).length + 1}</em>` : ' Moteur');
  }
  if (f.className !== cls) f.className = cls;
  if (f.dataset.html !== html){ f.dataset.html = html; f.innerHTML = html; }
  f2.textContent = p ? '+ Prise ' + (prisesDe(p.id).length + 1) : '+ Prise';
  majMoteurFiche();
  if (view === 'shoot') majVise();
}

/* --------------------------------------------------------------- Chrono */

const fmtDuree = s => s < 60 ? s + 's' : Math.floor(s / 60) + 'm' + deuxCh(s % 60) + 's';
function secondesDe(d){
  const v = String(d || '').trim().toLowerCase(); if (!v) return null;
  let m = v.match(/^(\d+)\s*m\s*(\d+)\s*s?$/); if (m) return +m[1] * 60 + +m[2];
  m = v.match(/^(\d+):(\d{2})$/); if (m) return +m[1] * 60 + +m[2];
  m = v.match(/^(\d+)\s*s?$/); if (m) return +m[1];
  return null;
}
/* La duree d'un shot : celle de sa prise a monter, sinon de sa derniere prise chronometree ;
   a defaut, la duree prevue en Preparation */
function dureeShot(p){
  const pr = prisesDe(p.id).filter(t => String(t.duree || '').trim());
  const t = pr.filter(x => x.retenue).pop() || pr.pop();
  return t ? { v: t.duree, prise: t.n } : p.duree ? { v: p.duree, prevue: true } : null;
}
const fmtChrono = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return deuxCh(Math.floor(s / 60)) + ':' + deuxCh(s % 60); };

/* Le plan vise : celui que le Moteur et + Prise vont tourner. L'anneau d'une
   carte le choisit, et ce choix passe avant tout : ouvrir ou ajouter une
   prise ailleurs ne le deplace pas. Sans choix, on suit le dernier plan
   touche. L'appareil se souvient du choix d'un chargement a l'autre. */
const ICO_VISER = ICO('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>', 14, 2);
/* Le meme oeil, en plus grand, sur les boutons Moteur : l'anneau d'une carte
   dit quel plan tourne, le bouton le lance. Un carre plein pour couper, comme
   sur une camera. */
const ICO_MOTEUR = ICO('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>', 17, 2);
const ICO_COUPEZ = ICO('<rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/>', 17, 2);
function planVise(){
  const p = (UI.vise && plan(UI.vise)) || (dernierPlan && plan(dernierPlan)) || null;
  return p && !bloque(p) && p.etat !== 'drop' ? p : null;   // un shot valide ne se tourne plus : il ne reste pas vise, ses prises se replient
}
/* toucher l'anneau du plan deja vise rend la main au suivi automatique */
/* Viser un plan : le Moteur et + Prise enregistrent dessus, et il deplie ses
   prises (les autres se replient). Le plan touche reste a sa place a l'ecran,
   meme si celui du dessus se replie. `garder` : viser sans basculer. */
function viser(id, garder){
  if (!plan(id)) return;
  if (bloque(plan(id)) && UI.vise !== id) return prevenirVerrou(plan(id));
  const avant = document.querySelector('#l-shoot .plan[data-id="' + id + '"]');
  const y0 = avant ? avant.getBoundingClientRect().top : null;
  UI.vise = UI.vise === id && !garder ? null : id; ecrireUI();
  if (view === 'shoot'){
    renderList();
    const apres = document.querySelector('#l-shoot .plan[data-id="' + id + '"]');
    if (y0 != null && apres) window.scrollBy(0, apres.getBoundingClientRect().top - y0);
  }
  majFab();
}
function majVise(){
  const v = planVise(), id = v ? v.id : null;
  document.querySelectorAll('.viser').forEach(b => b.classList.toggle('on', b.dataset.vise === id));
  // le plan vise a change : les autres le sauront a la prochaine presence
  if (RESEAU.possible && (id || '') !== (RESEAU.viseEnvoye || '')){ RESEAU.viseEnvoye = id || ''; envoyerPresence(); }
  // qui d'autre tourne ce plan : sa pastille sur l'anneau (en <b>/<i> : l'anneau cache ses <span>)
  const qui = {};
  autres().forEach(x => {
    if (!x.nom || x.nom === UI.nom) return;
    (x.actif || '').split(';').forEach(a => {
      if (a.indexOf('vise:') !== 0) return;
      const l = qui[a.slice(5)] = qui[a.slice(5)] || [];
      if (l.indexOf(x.nom) < 0) l.push(x.nom);
    });
  });
  // un anneau ne change que si ses ronds changent : appele souvent, il ne doit pas clignoter
  document.querySelectorAll('.viser[data-vise]').forEach(b => {
    const l = qui[b.dataset.vise] || [], sig = l.join('|');
    const d = b.querySelector('.a2-pts');
    if ((d ? d.dataset.qui : '') === sig) return;
    if (d) d.remove();
    if (sig) b.insertAdjacentHTML('beforeend', `<b class="a2-pts" data-qui="${esc(sig)}">` + l.map(n =>
      `<i class="a2-pt" style="--c:${couleurDe(n)}" title="${esc(n)} tourne ce plan">${esc(initiale(n))}</i>`).join('') + '</b>');
  });
}

function fabAction(){ if (chrono) couper(); else moteur(); }
function moteur(){
  const p = planVise();
  if (!p){ choisirPlan(true); return; }
  moteurSur(p.id);
}
function moteurSur(planId){
  const t = ajouterPrise(planId, false, { heure: maintenant() });
  if (!t) return;
  chrono = { priseId: t.id, debut: Date.now() };
  majFab(); majChronoFiche(); rafraichirDoux();
}
function couper(){
  if (!chrono) return;
  const t = prise(chrono.priseId);
  const s = Math.max(1, Math.round((Date.now() - chrono.debut) / 1000));
  chrono = null;
  if (t){ patch('prise', t.id, { duree: fmtDuree(s) }); toast('Coupez — prise ' + t.n + ', ' + fmtDuree(s)); }
  rafraichirDoux();
}
setInterval(() => { if (chrono){ majFab(); majChronoFiche(); } }, 500);

/* La ligne Coupez dans la fiche de la prise qui tourne : la feuille recouvre
   le bouton flottant sur un telephone. */
function majChronoFiche(){
  const r = $('rec-row'); if (!r) return;
  const t = prise(openId);
  if (chrono && t && chrono.priseId === t.id)
    r.innerHTML = `<button class="btn rec" onclick="couper()">&#9632; Coupez <em>${fmtChrono(Date.now() - chrono.debut)}</em></button>`;
  else if (chrono)
    r.innerHTML = '';
  else if (t && !t.duree)
    r.innerHTML = `<button class="btn w" onclick="chronoSur('${t.id}')">&#9679; Lancer le chrono</button>`;
  else r.innerHTML = '';
}
function chronoSur(id){
  const t = prise(id); if (!t || chrono) return;
  chrono = { priseId: id, debut: Date.now() };
  if (!t.heure) patch('prise', id, { heure: maintenant() });
  majFab(); majChronoFiche(); rafraichirDoux();
}

function renderList(){
  view === 'shoot' ? renderShoot() : view === 'prep' ? renderPrep() : renderReport();
}

function renderAll(){
  verrouillerPrises(DB);
  renderShoot(); renderReport(); renderPrep();
}

/* --------------------------------------------------------- Feuille prise */

function nouvellePrise(){
  const p = planVise();
  if (p) ajouterPrise(p.id); else choisirPlan(false);
}

/* Ajoute une prise. Par defaut elle apparait dans la liste sans ouvrir de
   fiche : sur le plateau on enchaine les prises, on les detaille apres.
   Le numero est provisoire : si un autre appareil ajoute une prise au meme
   plan au meme moment, le serveur tranche et le numero est corrige. */
function ajouterPrise(planId, ouvrir, extra){
  const p = plan(planId); if (!p) return null;
  if (bloque(p)){ prevenirVerrou(p); return null; }
  const sœurs = prisesDe(planId);
  const modele = sœurs[sœurs.length - 1] || DB.prises[DB.prises.length - 1];
  const n = sœurs.reduce((m, x) => Math.max(m, x.n || 0), 0) + 1;
  // l'heure de la prise, c'est celle de sa creation ; le chrono ou un appel explicite peuvent la fixer autrement
  const t = Object.assign({ id: uid(), planId, seq: p.seq, plan: p.plan, jour: p.jour || '' },
                          NEUVE(), { n, par: UI.nom || '', heure: maintenant() }, extra || {});
  if (modele) HERITE.forEach(k => { if (modele[k]) t[k] = modele[k]; });
  // la premiere prise d'un shot : la camera suit la prise d'avant, mais l'optique et le mouvement
  // sont ceux du shot (prevus au decoupage), jamais ceux d'un autre shot
  if (!sœurs.length){
    HERITE_SHOT.forEach(k => { t[k] = ''; });
    if (p.focale) t.focale = p.focale; if (p.mouv) t.mouvement = p.mouv;
    if (!modele && p.meteo) t.meteo = p.meteo;
  }
  VERROU_PROJET.forEach(k => { if (DB.prod[k]) t[k] = DB.prod[k]; });
  // le nom de clip suit la numerotation de la camera : AA005 puis AA006, sans rien taper
  if (!t.clip){ const s = clipSuivant(t); if (s) t.clip = s; }
  { const c = carteDuClip(t.clip); if (c && (!t.carte || FORME_BOBINE.test(String(t.carte).trim()))) t.carte = c; }
  DB.prises.push(t);
  operer({ op:'add', kind:'prise', data: t });
  dernierPlan = planId;

  if (ouvrir){ renderAll(); openPrise(t.id); return t; }

  if (openType === 'picker') closeSheet();
  const y = window.scrollY;
  const ys = openType === 'plan' ? $('sbody').scrollTop : 0;
  renderAll();
  if (openType === 'plan'){ majPrisesFiche(); $('sbody').scrollTop = ys; }
  window.scrollTo(0, y);

  // on amene la nouvelle prise sous les yeux et on la signale
  // dans la liste comme dans la fiche, la fenetre des prises descend sur la nouvelle
  document.querySelectorAll('.prise[data-id="' + t.id + '"]').forEach(e => {
    const b = e.closest('.prises.defile'); if (b) b.scrollTop = b.scrollHeight;
  });
  const el = document.querySelector((openType === 'plan' ? '#sbody ' : '#l-shoot ') + '.prise[data-id="' + t.id + '"]');
  if (el){
    el.classList.add('neuve');
    const r = el.getBoundingClientRect();
    if (r.top < 90 || r.bottom > window.innerHeight - 150)
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  toast('Prise ' + t.n + ' — shot ' + (p.plan || 'sans n°'));
  return t;
}

/* Le nom du clip qui suit le dernier clip saisi : A001C003 devient A001C004.
   Une suggestion a verifier sur la camera, jamais remplie d'office. */
/* Le fantome du clip : pendant la saisie, la suite du nom attendu en gris (« A_0001C0 » → « 002 ») ;
   si le debut tape s'en ecarte, seulement la forme (des zeros) pour savoir combien de chiffres mettre.
   Tab ou → au bout du texte reprennent la suggestion. */
function majFantome(i){
  const f = i && i.parentNode.querySelector('.fantome'); if (!f) return;
  const sug = i.dataset.sug || '', v = i.value || '';
  let reste = '';
  if (v && sug){
    if (sug.toUpperCase().startsWith(v.toUpperCase())) reste = sug.slice(v.length);
    else { const forme = sug.replace(/\d/g, '0'); if (v.length < forme.length) reste = forme.slice(v.length); }
  }
  f.innerHTML = reste ? `<i>${esc(v)}</i>${esc(reste)}` : '';
}
document.addEventListener('input', e => { if (e.target && e.target.id === 'clip-in') majFantome(e.target); });
document.addEventListener('keydown', e => {
  const i = e.target; if (!i || i.id !== 'clip-in' || (e.key !== 'Tab' && e.key !== 'ArrowRight')) return;
  const sug = i.dataset.sug || '', v = i.value || '';
  if (!v || !sug || v.length >= sug.length || i.selectionStart !== v.length || !sug.toUpperCase().startsWith(v.toUpperCase())) return;
  e.preventDefault(); i.value = sug; live(i); majFantome(i);
});
function clipSuivant(t){
  const autres = DB.prises.filter(x => x.id !== t.id && x.clip);
  const memeCam = t.cam ? autres.filter(x => x.cam === t.cam) : [];
  const ref = memeCam[memeCam.length - 1] || autres[autres.length - 1];
  if (!ref) return '';
  // le nom complet d'un fichier ARRI (A_0001C007_260921_095621_a1F6K) : on ne
  // garde que bobine et clip, la date, l'heure et l'identifiant sont a la camera
  const c = ref.clip.trim().replace(/_\d{6}_\d{6}_[A-Za-z0-9]+(\.\w+)?$/, '');
  const m = c.match(/^(.*?C)(\d+)(.*)$/i);
  if (m) return m[1] + String(+m[2] + 1).padStart(m[2].length, '0') + m[3];
  const d = c.match(/^(.*?)(\d+)(\D*)$/);
  if (d) return d[1] + String(+d[2] + 1).padStart(d[2].length, '0') + d[3];
  return '';
}
/* La carte se lit dans le nom du clip ARRI : la bobine, avant le « C » du clip
   (A_0001C0004 -> A_0001, A001C003 -> A001), nom complet du fichier compris.
   Elle suit le clip tant qu'elle a la forme d'une bobine ; un identifiant tape
   a la main (1F6K) reste tel quel. */
const FORME_BOBINE = /^[A-Za-z]{1,2}[_-]?\d{2,5}$/;
function carteDuClip(clip){
  const c = String(clip || '').trim().replace(/_\d{6}_\d{6}_[A-Za-z0-9]+(\.\w+)?$/, '');
  const m = c.match(/^(.+?)[_-]?C\d+/i);
  return m && FORME_BOBINE.test(m[1]) ? m[1] : '';
}
function carteSuitClip(t){
  const c = t && carteDuClip(t.clip);
  if (!c || memeVal(t.carte, c)) return;
  if (String(t.carte || '').trim() && !FORME_BOBINE.test(String(t.carte).trim())) return;
  patch('prise', t.id, { carte: c });
  document.querySelectorAll('#sbody [data-k="carte"]').forEach(i => { if (i !== document.activeElement) i.value = c; });
}
/* L'inverse : la carte changee a la main (A_0002) reecrit la bobine du clip
   (A_0001C0004 -> A_0002C0004). Seulement une carte en forme de bobine, et un
   clip dont on sait lire la bobine. */
function clipSuitCarte(t){
  if (!t) return;
  const carte = String(t.carte || '').trim(), ancienne = carteDuClip(t.clip);
  if (!ancienne || !FORME_BOBINE.test(carte) || memeVal(carte, ancienne)) return;
  const clip = carte + String(t.clip).trim().slice(ancienne.length);
  patch('prise', t.id, { clip });
  const i = $('clip-in'); if (i && i !== document.activeElement && i.dataset.o === t.id) i.value = clip;
}
/* La balance des blancs au curseur : 2 000 a 11 000 K (la plage de l'ARRI
   Alexa 35), par pas de 100 K. La valeur se tape aussi a la main, a cote (une
   valeur exacte, une teinte « 5600 K +3 CC ») ; le curseur la suit. */
const kelvinDe = v => { const m = String(v || '').match(/\d{4,5}/); return m ? Math.min(11000, Math.max(2000, +m[0])) : 0; };
function curseurWb(r){
  const i = r.parentNode.querySelector('.wb-val'); if (!i) return;
  i.value = r.value + ' K';
  live(i);
}
/* Une valeur libre, hors du curseur : « 4850 » -> « 4850 K », « 5600 K +3 CC » tel quel. */
function wbCustom(b){
  const i = b.parentNode.querySelector('.wb-val'); if (!i) return;
  demanderTexte('Balance des blancs', { valeur: i.value, aide:'4850 K, 5600 K +3 CC…', ok:'Poser' }).then(v => {
    if (v == null) return;
    v = String(v).trim();
    i.value = /^\d+$/.test(v) ? v + ' K' : v;
    live(i); majCurseurWb(i);
  });
}
function majCurseurWb(i){
  const r = i.parentNode.querySelector('.curseur-wb'), k = kelvinDe(i.value);
  if (r && k) r.value = k;
}
function appliquerClip(id){
  const t = prise(id); const s = t && clipSuivant(t);
  if (!s) return;
  patch('prise', id, { clip: s });
  carteSuitClip(t);
  const i = document.querySelector('#sbody input[data-k="clip"]'); if (i) i.value = s;
  const m = document.querySelector('#sbody .clip-ligne .mini'); if (m) m.remove();   // le nom est pose, le bouton n'a plus d'objet
  renderList();
}

const aNote = (t, n) => (t.notes || '').split(/\s*·\s*/).some(s => s.trim().toLowerCase() === n.toLowerCase());
function noteRapide(n){
  const t = prise(openId); if (!t || !n) return;
  let segs = (t.notes || '').split(/\s*·\s*/).map(s => s.trim()).filter(Boolean);
  if (segs.some(s => s.toLowerCase() === n.toLowerCase())) segs = segs.filter(s => s.toLowerCase() !== n.toLowerCase());
  else segs.push(n);
  patch('prise', t.id, { notes: segs.join(' · ') });
  const ta = document.querySelector('#sbody textarea[data-k="notes"]'); if (ta){ ta.value = t.notes; autoHauteur(ta); }
  document.querySelectorAll('.chips-notes button').forEach(b => b.classList.toggle('on', aNote(t, b.dataset.n)));
  decorerFiche();
  renderList();
}

/* Ce qu'une section repliee doit dire d'un coup d'oeil : les valeurs qu'elle
   contient, pour verifier sans l'ouvrir que la prise herite des bons reglages. */
const RESUME_PRISE = {
  fichier: t => [t.cam, t.tcIn && 'TC ' + t.tcIn, t.duree],
  releves: t => [t.focale && fleche(t.focale, t.focaleStop), t.diaph, t.focusStart && fleche(t.focusStart, t.focusStop), t.wb, t.ei && 'ISO ' + t.ei, t.shutter, t.mouvement, t.support],
  image:   t => [t.codec, t.reso, t.fps && t.fps + ' fps', t.nd && 'ND ' + t.nd, t.lut],
  son:     t => [t.sonRoll, t.sync, t.sonFile]
};
// la table est lue a l'usage : RESUME_PLAN n'est declare que plus bas
const resumesDe = () => ({ prise: RESUME_PRISE, plan: RESUME_PLAN })[openType];
const resumeFiche = (id, o) => (((resumesDe() || {})[id]) || (() => []))(o).filter(Boolean).map(esc).join(' · ');

/* Une section de la fiche qui se replie. De base tout est deplie ; celles qu'on
   replie, l'appareil s'en souvient. */
/* `plie` : la section s'ouvre repliee tant qu'on ne l'a pas touchee */
function sectionFiche(id, titre, o, contenu, plie){
  const ouvert = id in UI.plie ? !UI.plie[id] : !plie;
  return `<details class="det" data-sec="${id}"${ouvert ? ' open' : ''} ontoggle="memoDet(this)">
    <summary><h3>${titre}</h3><span class="res" data-res="${id}">${resumeFiche(id, o)}</span><i></i></summary>
    <div class="det-corps">${contenu}</div>
  </details>`;
}
function memoDet(el){
  if (el.open) el.querySelectorAll('textarea.auto').forEach(autoHauteur);   // repliee, elle ne mesurait rien
  if (UI.plie[el.dataset.sec] === !el.open) return;
  UI.plie[el.dataset.sec] = !el.open; ecrireUI();
}
function majResumes(){
  const o = cible(openId); if (!o || !resumesDe()) return;
  document.querySelectorAll('#sbody .res[data-res]').forEach(s => { s.innerHTML = resumeFiche(s.dataset.res, o); });
}

/* Dans l'en-tete, d'une prise a l'autre du meme plan. */
const CHEVRON = sens => ICO(`<path d="${sens < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}"/>`, 18, 2.2);
/* Les deux chevrons de l'en-tete : le precedent et le suivant, eteints au bout. */
function htmlNav(fn, i, n, avant, apres){
  return `<button class="ico" onclick="${fn}(-1)" aria-label="${avant}"${i <= 0 ? ' disabled' : ''}>${CHEVRON(-1)}</button>` +
         `<button class="ico" onclick="${fn}(1)" aria-label="${apres}"${i < 0 || i >= n - 1 ? ' disabled' : ''}>${CHEVRON(1)}</button>`;
}
function majNavPrise(){
  const t = prise(openId), n = $('snav'); if (!t || !n) return;
  const s = prisesDe(t.planId);
  n.innerHTML = htmlNav('voisinePrise', s.findIndex(x => x.id === t.id), s.length, 'Prise précédente', 'Prise suivante');
}
function voisinePrise(sens){
  const t = prise(openId); if (!t) return;
  const s = prisesDe(t.planId), v = s[s.findIndex(x => x.id === t.id) + sens];
  if (v){ flush(); openPrise(v.id); }
}

/* La feuille s'affiche, ses zones de texte prennent leur hauteur, au defilement demande. */
/* Le bouton Retour du navigateur (le geste retour du telephone) revient en
   arriere dans la page au lieu de quitter le site : il ferme la fiche ouverte,
   ramene d'une prise a son plan, et d'une page a l'autre (Preparation,
   Tournage, Rapport). Chaque fiche et chaque page posent une marque dans
   l'historique, avec la page ou l'on etait ; la meme sorte de fiche (la prise
   suivante, aux fleches) prend la place de la precedente. Fermer la fiche par
   sa fleche retire ses marques. */
const RETOUR = { rejoue: false, ignorer: false };
function noterFiche(){
  if (RETOUR.rejoue || !openType) return;
  const h = history.state, e = { fiche: openType, id: openId || '', vue: view };
  try{
    if (h && h.fiche){
      if (h.fiche === e.fiche && h.id === e.id) return;
      if (h.fiche === e.fiche) history.replaceState(Object.assign(e, { prof: h.prof || 1 }), '');
      else history.pushState(Object.assign(e, { prof: (h.prof || 1) + 1 }), '');
    } else history.pushState(Object.assign(e, { prof: 1 }), '');
  }catch(x){}
}
window.addEventListener('popstate', ev => {
  if (RETOUR.ignorer){ RETOUR.ignorer = false; return; }
  const st = ev.state;
  RETOUR.rejoue = true;
  try{
    // le Retour depuis l'editeur du croquis : il enregistre et ferme, la fiche reste
    if (dessin){ fermerCroquis(true); return; }
    if (st && st.vue && st.vue !== view) allerVue(st.vue);
    if (st && st.fiche === 'plan' && plan(st.id)) openPlan(st.id);
    else if (st && st.fiche === 'prise' && prise(st.id)) openPrise(st.id);
    else if (openType) closeSheet();
  } finally { RETOUR.rejoue = false; }
});
function montrerFiche(y){
  $('sheet').classList.add('on');
  noterFiche();
  document.querySelectorAll('#sbody textarea.auto').forEach(autoHauteur);
  $('sbody').scrollTop = y || 0;
}
/* La fiche ouverte se reconstruit sur place, au meme defilement : une valeur nouvelle
   doit entrer dans ses capsules, un decor choisi change le fond du croquis. */
function rouvrirFiche(){
  const y = $('sbody').scrollTop;
  if (openType === 'prise') openPrise(openId, y);
  else if (openType === 'plan') openPlan(openId, y);
}
function redessinerFichePlan(p){ if (p && openType === 'plan' && openId === p.id) rouvrirFiche(); }

/* Ce qui n'est pas propre a la prise ouverte quitte l'en-tete et le pied de fiche. */

/* Les verdicts d'une prise et les etats d'un plan : la valeur, et la couleur du bouton choisi. */
const VERDICTS = [['OK', 'g'], ['NG', 'r'], ['Série', ''], ['Faux départ', ''], ['Pick-up', '']];
/* Pick-up se coche en plus du resultat : une prise peut etre « OK » et « Pick-up » a la fois. */
const verdictDe = (t, v) => v === 'Pick-up' ? (t.pickup ? v : '') : t.statut;
const libStatut = t => [t.statut, t.pickup ? 'Pick-up' : ''].filter(Boolean).join(' · ');
const ETATS_SEG = [['todo', 'a'], ['done', 'g'], ['drop', '']];
const classeSeg = (v, actuel, couleur) => v !== actuel ? '' : 'on' + (couleur ? ' ' + couleur : '');
const htmlEtoile = t => `<em>${t.retenue ? '&#9733;' : '&#9734;'}</em>${t.retenue ? 'Prise retenue pour le montage' : 'Marquer comme prise à monter'}`;
/* Les boutons d'une barre de choix suivent la valeur, sans reconstruire la feuille. */
function majSeg(sel, attr, defs, actuel){
  document.querySelectorAll(sel + ' button').forEach(b => {
    const v = b.dataset[attr], d = defs.find(x => x[0] === v);
    b.className = classeSeg(v, actuel, d ? d[1] : '');
  });
}

/* Met a jour les boutons en place, sans reconstruire la feuille. */
function majBoutonsPrise(){
  const t = prise(openId); if (!t) return;
  document.querySelectorAll('#seg-statut button').forEach(b => {
    const v = b.dataset.st, d = VERDICTS.find(x => x[0] === v);
    b.className = classeSeg(v, verdictDe(t, v), d ? d[1] : '');
  });
  const k = $('btn-star');
  if (k){ k.className = 'star' + (t.retenue ? ' on' : ''); k.innerHTML = htmlEtoile(t); }
  document.querySelectorAll('.chips-notes button').forEach(b => b.classList.toggle('on', aNote(t, b.dataset.n)));
  majResumes(); majNavPrise(); majChoix();
  decorerFiche();
}

/* « Prise non saisie » (pas eu le temps de la noter) : la prise reste, marquee. Elle sort de « A
   completer », et quand le DIT reunit l'equipe ce sont les saisies des autres
   qui comptent pour elle ; ce que la page a repris de la prise d'avant ne fait
   pas de faux ecart. Un second appui retire la marque. */
function basculerPasSaisie(){
  const t = prise(openId); if (!t) return;
  patch('prise', t.id, t.pasSaisie ? { pasSaisie: false } : { pasSaisie: true, differee: false });
  majMarquesPrise();
  toast(t.pasSaisie ? 'Prise ' + t.n + ' non saisie : les saisies des autres font foi' : 'Prise ' + t.n + ' : marque retirée');
}
/* « Saisie differee » : on la remplira plus tard. Elle reste dans « A completer »,
   marquee, tant qu'on ne retire pas la marque. Les deux marques s'excluent. */
function basculerDifferee(){
  const t = prise(openId); if (!t) return;
  patch('prise', t.id, t.differee ? { differee: false } : { differee: true, pasSaisie: false });
  majMarquesPrise();
  toast(t.differee ? 'Prise ' + t.n + ' : saisie différée, à compléter' : 'Prise ' + t.n + ' : marque retirée');
}
function majMarquesPrise(){
  const t = prise(openId); if (!t) return;
  [['btn-pas-saisie', t.pasSaisie, 'Prise non saisie'], ['btn-differee', t.differee, 'Saisie différée']].forEach(([id, on, txt]) => {
    const b = $(id); if (b){ b.classList.toggle('on', !!on); b.innerHTML = (on ? '&#10003; ' : '') + txt; }
  });
  majAlertesPrise(); renderList();
}
/* En tete de la fiche d'une prise : ce qui cloche, a voir sans ouvrir les sections. */
function majAlertesPrise(){
  const b = $('alertes-prise'), t = openType === 'prise' && prise(openId);
  if (!b || !t) return;
  const f = focaleHorsPlan(t);
  b.innerHTML = [
    f && `<div class="alert o fiche-alerte"><i>&#9888;</i><div>Focale <b>${esc(fleche(t.focale, t.focaleStop))}</b> : le plan prévoit <b>${esc(f)}</b>.</div></div>`,
    t.pasSaisie && `<div class="alert fiche-alerte"><i></i><div>Prise non saisie : les saisies des autres font foi.</div></div>`,
    t.differee && `<div class="alert fiche-alerte"><i></i><div>Saisie différée : à compléter plus tard.</div></div>`
  ].filter(Boolean).join('');
}

function delPrise(){
  const t = prise(openId); if (!t) return;
  if (bloque(plan(t.planId))) return prevenirVerrou(plan(t.planId));
  confirmer('Supprimer la prise ' + t.n + ' ?', { ok:'Supprimer', danger:true }).then(oui => {
    if (!oui || !prise(t.id)) return;
    supprimerPrise(t);
    closeSheet();
  });
}

function supprimerPrise(t){
  const pid = t.planId;
  DB.prises = DB.prises.filter(x => x.id !== t.id);
  // les suivantes se renumerotent (le serveur fait de meme et confirme)
  prisesDe(pid).forEach((x, i) => { x.n = i + 1; });
  if (chrono && chrono.priseId === t.id) chrono = null;
  operer({ op:'del', kind:'prise', id: t.id, planId: pid });
  corbeille = { type:'prise', prise: t };
  toastAction('Prise ' + t.n + ' supprimée', 'Annuler', restaurer);
}

/* Ce qui vient d'etre supprime revient a sa place. */
function restaurer(){
  const c = corbeille; corbeille = null;
  if (!c) return;
  if (c.type === 'prise'){
    const t = c.prise;
    if (!plan(t.planId)) return toast('Le plan n’existe plus');
    // les numeros ont bouge : les suivantes se decalent, la prise reprend le sien
    prisesDe(t.planId).filter(x => x.n >= t.n).forEach(x => patch('prise', x.id, { n: x.n + 1 }));
    DB.prises.push(t);
    operer({ op:'add', kind:'prise', data: t });
  } else if (c.type === 'plan'){
    const i = DB.plans.findIndex(x => x.id === c.apres);
    DB.plans.splice(i + 1, 0, c.plan);
    operer({ op:'add', kind:'plan', data: c.plan, apres: c.apres });
    c.prises.forEach(t => { DB.prises.push(t); operer({ op:'add', kind:'prise', data: t }); });
    }
  flush(); renderAll(); toast('Rétabli');
}

/* L'image d'un plan et le plan du decor sous le croquis : choisies sur
   l'appareil, reduites avant d'etre gardees. */

/* Ouvre le selecteur d'image de l'appareil, en retenant pour quelle fiche (et quel decor). */
function demanderImage(quel, id, lieu){
  const i = $(quel);
  i.dataset.id = id; i.dataset.lieu = lieu || ''; i.value = ''; i.click();
}
/* Reduite avant d'etre gardee : une vignette lisible pese 20 a 40 Ko,
   pas les 4 Mo d'une photo de telephone. */
/* Ce navigateur sait-il ecrire du WebP ? Mesure une fois, au chargement. */
const SAIT_WEBP = (() => {
  try{
    const c = document.createElement('canvas'); c.width = c.height = 1;
    return c.toDataURL('image/webp', .5).indexOf('image/webp') === 5;
  }catch(e){ return false; }
})();

function reduirePhoto(f, max, q){
  /* On encode dans les deux formats et on garde le plus leger. Le WebP gagne
     largement sur du trait et des aplats, mais le JPEG reprend l'avantage sur
     une photo tres granuleuse : a qualite nommee egale, les deux codecs ne
     visent pas la meme fidelite. Plutot que de parier, on compare. Une image
     importee est rare, le second encodage ne se sent pas. */
  const dessine = (img, w, h) => {
    const r = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * r)); c.height = Math.max(1, Math.round(h * r));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const jpeg = c.toDataURL('image/jpeg', q);
    if (!SAIT_WEBP) return jpeg;
    const webp = c.toDataURL('image/webp', q);
    return webp.length < jpeg.length ? webp : jpeg;
  };
  const viaImage = () => new Promise((ok, ko) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => { try{ ok(dessine(im, im.naturalWidth, im.naturalHeight)); }catch(e){ ko(e); } URL.revokeObjectURL(u); };
    im.onerror = ko; im.src = u;
  });
  if (window.createImageBitmap)
    return createImageBitmap(f, { imageOrientation:'from-image' })
      .then(b => dessine(b, b.width, b.height)).catch(viaImage);
  return viaImage();
}

/* Les prises d'un plan, en lignes ; au-dela de cinq, dans une fenetre qui defile. */
const htmlPrises = (pr, style) => pr.length
  ? `<div class="prises${pr.length > 5 ? ' defile' : ''}"${style ? ` style="${style}"` : ''}>${pr.map(t => ligne(t)).join('')}</div>` : '';
function htmlPrisesFiche(p){
  return htmlPrises(prisesDe(p.id), 'margin-top:0;margin-left:0')
      || '<div style="color:var(--dim2);font-size:13.5px">Aucune prise pour ce plan.</div>';
}
/* Le plan en chiffres, a cote du titre : la fenetre ne montre que cinq prises,
   le compte dit ce qu'il y a derriere. */
function resumePrises(p){
  const pr = prisesDe(p.id), n = pr.length;
  if (!n) return '';
  const ok = pr.filter(t => t.statut === 'OK').length, ng = pr.filter(t => t.statut === 'NG').length,
        kp = pr.filter(t => t.retenue).length;
  return [`<span>${n} prise${plur(n)}</span>`,
    ok && `<span class="ok">${ok} OK</span>`,
    ng && `<span class="ng">${ng} NG</span>`,
    kp && `<span class="kp">${kp} à monter</span>`].filter(Boolean).join('');
}
function majPrisesFiche(){
  const p = plan(openId), b = $('fiche-prises');
  if (p && b){
    memoDefilPrises('#fiche-prises');
    b.innerHTML = htmlPrisesFiche(p);
    calerPrises('#fiche-prises');
    $('fiche-prises-res').innerHTML = resumePrises(p);
  }
  const plus = $('prise-plus-fiche');
  if (p && plus) plus.textContent = '+ Prise ' + (prisesDe(p.id).length + 1);
}

/* Ce qu'une section repliee de la fiche du plan dit d'un coup d'oeil. */
const court = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const RESUME_PLAN = {
  ppassages: p => { const n = (String(p.passages || '').match(/^\d+\/\d+ /gm) || []).length;
                    return [n > 1 ? n + ' passages' : '', court(p.passages, 60)]; },
  pvfx:      p => [court(texteDe(p, 'vfxDesc'), 40), court(texteDe(p, 'notesInternes'), 30), court(texteDe(p, 'notesClient'), 30)],
  pcroquis:  p => [aTraits(p) ? (croquisListe(p).filter(pleinCroquis).length > 1 ? croquisListe(p).filter(pleinCroquis).length + ' croquis' : 'Un croquis') : '', fondDecor(lieuFond(p)) ? 'sur le plan « ' + lieuFond(p) + ' »' : ''],
  pcontexte: p => [p.lieu, p.intExt, p.momentJour, p.meteo, (p.acteurs || []).join(', '), p.figu && 'Figuration', p.cadrage, p.mouv, p.support, p.focale, p.duree],
  preperes:  p => [p.jour && nomJour(p.jour), p.plan && 'Shot ' + p.plan, p.seq && 'Séq ' + p.seq]
};

/* Dans l'en-tete, d'un plan a l'autre, dans l'ordre de la liste affichee. */
function ordrePlans(){
  const vus = [...document.querySelectorAll('#l-shoot .plan[data-id]')].map(e => e.dataset.id);
  return vus.indexOf(openId) >= 0 ? vus : DB.plans.map(p => p.id);
}
function majNavPlan(){
  const n = $('snav'); if (!n || openType !== 'plan') return;
  const l = ordrePlans();
  n.innerHTML = htmlNav('voisinPlan', l.indexOf(openId), l.length, 'Plan précédent', 'Plan suivant');
}
function voisinPlan(sens){
  const l = ordrePlans(), v = l[l.indexOf(openId) + sens];
  if (v && plan(v)){ flush(); openPlan(v); }
}

/* Le Moteur du pied de fiche : lance une prise sur ce plan, puis devient
   Coupez tant que son chrono tourne. */
function majMoteurFiche(){
  const b = $('moteur-fiche'), p = openType === 'plan' && plan(openId);
  const t = chrono && prise(chrono.priseId), ici = !!(b && p && t && t.planId === p.id);
  // la prise tourne sur ce plan : REC prend la place du Moteur, la pastille flottante s'efface
  document.body.classList.toggle('rec-fiche', ici);
  if (!b || !p) return;
  if (ici){
    const cls = 'btn rec rec-cam', html = `<i class="rec-point"></i><b class="rec-mot">REC</b><em>${fmtChrono(Date.now() - chrono.debut)} · prise ${t.n}</em><span class="rec-stop" title="Coupez">${ICO_COUPEZ}</span>`;
    if (b.className !== cls) b.className = cls;
    b.disabled = false;
    // redessine deux fois par seconde : seulement si le texte change, sinon le point clignote de travers
    if (b.dataset.html !== html){ b.dataset.html = html; b.innerHTML = html; }
    b.onclick = couper;
  } else {
    b.className = 'btn moteur'; b.disabled = !!chrono; b.innerHTML = ICO_MOTEUR + ' Moteur'; b.dataset.html = '';
    b.onclick = chrono ? null : () => moteurSur(p.id);
  }
}
/* Les etiquettes du plan : deux familles exclusives, ce qu'il est (LIVE, VFX,
   CG) et ce qu'il devient (TBC, VAL, KILLED). Un clic sur la puce, sur la
   carte comme dans la fiche, ouvre un petit menu de sa famille. */
const TAGS_GROUPES = [['LIVE', 'VFX', 'CG'], ['VAL', 'TBC', 'KILLED']];
const TAG_COULEURS = { LIVE:'vert', VFX:'bleu', CG:'rouge', TBC:'orange', VAL:'vert', KILLED:'rouge' };
const classeTag = t => TAG_COULEURS[String(t).toUpperCase()] ? ' t-' + TAG_COULEURS[String(t).toUpperCase()] : '';
const rangTag = t => { const i = TAGS_GROUPES.findIndex(x => x.includes(t)); return i < 0 ? 9 : i; };
function htmlPtags(p){
  const tags = (p.tags || []).slice().sort((a, b) => rangTag(a) - rangTag(b));
  const out = [];
  TAGS_GROUPES.forEach((g, i) => {
    const t = tags.find(x => g.includes(x));
    out.push(t ? `<button type="button" class="ptag${classeTag(t)}" data-tag="${esc(t)}" data-g="${i}"
        onclick="event.stopPropagation();menuTag(this, '${p.id}')">${esc(t)}</button>`
               : `<button type="button" class="ptag vide" data-tag="" data-g="${i}"
        onclick="event.stopPropagation();menuTag(this, '${p.id}')">${g[0]}</button>`);
  });
  tags.filter(t => rangTag(t) === 9).forEach(t => out.push(`<span class="ptag">${esc(t)}</span>`));
  // la priorite du shot : une pastille a trois niveaux, en Tournage comme en Preparation ; un clic ouvre son menu
  const pr = niveauPrio(p);
  out.push(pr ? `<button type="button" class="ptag prio p${pr}" data-g="prio" title="Priorité : ${PRIOS[pr - 1]}"
        onclick="event.stopPropagation();menuPrio(this, '${p.id}')">${PRIOS[pr - 1]}</button>`
             : `<button type="button" class="ptag vide prio" data-g="prio" title="Donner une priorité"
        onclick="event.stopPropagation();menuPrio(this, '${p.id}')">Prio</button>`);
  return out.join('');
}
/* La priorite : 1 le plan principal, 2 optionnel, 3 le plan de reserve. Les 4 et 5 d'avant (cinq niveaux) comptent comme 3. */
const PRIOS = ['Principal', 'Optionnel', 'Plan de réserve'];
const niveauPrio = p => { const n = parseInt(String((p && p.prio) || '').trim(), 10); return n >= 1 ? Math.min(3, n) : 0; };
function menuPrio(btn, id){
  const deja = btn.classList.contains('on');
  fermerMenu();
  if (deja) return;
  const actuel = niveauPrio(plan(id));
  const m = document.createElement('div');
  // chaque niveau s'y montre tel qu'il sera sur la carte : sa pastille teintee
  m.className = 'menu puce prios';
  m.innerHTML = PRIOS.map((nom, i) => `<button type="button" class="${actuel === i + 1 ? 'on' : ''}"
      onclick="event.stopPropagation();poserPrio('${id}', ${i + 1})"><span class="ptag prio p${i + 1}">${nom}</span></button>`).join('') +
    (actuel ? `<button type="button" class="aucune" onclick="event.stopPropagation();poserPrio('${id}', 0)">Aucune</button>` : '');
  const r = btn.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - 180)) + 'px'; m.style.top = (r.bottom + 5) + 'px';
  document.body.appendChild(m);
  btn.classList.add('on');
  setTimeout(() => document.addEventListener('click', clicHorsMenu), 0);

}
function poserPrio(id, n){
  fermerMenu();
  const p = plan(id); if (!p) return;
  patch('plan', p.id, { prio: n ? String(n) : '' });
  if (openType === 'plan' && openId === p.id) majBoutonsPlan();
  renderList();
}
/* Le petit menu sous la puce : les etiquettes de sa famille, celle en place cochee. */
function menuTag(btn, id){
  const deja = btn.classList.contains('on');
  fermerMenu();
  if (deja) return;
  const g = TAGS_GROUPES[+btn.dataset.g] || TAGS_GROUPES[0], actuel = btn.dataset.tag;
  const m = document.createElement('div');
  m.className = 'menu puce';
  m.innerHTML = g.map(t => `<button type="button" class="${t === actuel ? 'on' : ''}${classeTag(t)}"
      onclick="event.stopPropagation();poserTag('${id}', '${t}')">${t}</button>`).join('');
  // pose sur la page, au-dessus de tout, a l'aplomb de la puce ; le defilement le referme
  const r = btn.getBoundingClientRect();
  m.style.left = r.left + 'px'; m.style.top = (r.bottom + 5) + 'px';
  document.body.appendChild(m);
  btn.classList.add('on');
  setTimeout(() => document.addEventListener('click', clicHorsMenu), 0);
  window.addEventListener('scroll', fermerMenu, { once:true, capture:true });
}
function poserTag(id, tag){
  fermerMenu();
  const p = plan(id); if (!p) return;
  const g = TAGS_GROUPES.find(x => x.includes(tag)); if (!g) return;
  const tags = (p.tags || []).filter(t => !g.includes(t)).concat([tag]).sort((a, b) => rangTag(a) - rangTag(b));
  patch('plan', p.id, { tags });
  if (openType === 'plan' && openId === p.id) majBoutonsPlan();
  renderList();
}
