function setJourR(j){ fJourR = j; renderReport(); window.scrollTo(0, 0); }

/* ------------------------------------------- Le bilan de toute l'equipe */
/* Chacun saisit dans son coin et ne voit que ses prises. Le DIT, lui, doit
   tout avoir : dans Rapport, « Toute l'équipe » va chercher les saisies de
   chacun (son espace sur le serveur) et les réunit à celles
   d'ici. Le bilan, le journal DIT, la fiche pour la post et les exports
   portent alors sur l'ensemble — sans toucher au projet de cet appareil :
   le projet réuni n'est calculé que le temps de rendre ou d'exporter. */
const equipeReunie = () => RAP.equipe && RAP.sources.length > 0;
function projetEquipe(){ return fusionRap(sourcesRap()); }
/* fait tourner fn avec ce projet a la place du mien, puis remet le mien */
function avecProjet(db, fn){ const mien = DB; DB = db; try{ return fn(); } finally{ DB = mien; } }
const surLePerimetre = fn => equipeReunie() ? avecProjet(projetEquipe(), fn) : fn();
/* Le choix « Toute l'equipe » est garde sur l'appareil : le DIT le retrouve
   apres un rechargement, et le rapport va chercher les saisies tout seul. */
function voirEquipe(){
  // le rapport porte toujours sur toute l'equipe : il n'y a plus de « Mes saisies »
  RAP.equipe = true; UI.equipe = true; ecrireUI();
  if (!RAP.sources.length && RESEAU.possible) return actualiserEquipe();
  renderReport();
}
/* Le bouton du rapprochement fait la meme chose que « Toute l'equipe » : on va
   chercher les saisies de chacun, et tout le rapport — bilan, ecarts, PDF —
   porte sur l'ensemble. Un seul geste, pas deux boutons qui se ressemblent. */
function reunirEquipe(){
  RAP.equipe = true; UI.equipe = true; ecrireUI();
  return actualiserEquipe();
}
function actualiserEquipe(){
  RAP.tente = true;
  if (!RESEAU.possible) return renderReport();   // sans serveur, il n'y a que les fichiers deposes
  return recupererEspaces();                      // rend le rapport une fois les saisies la
}
/* Avant un PDF ou un export sur toute l'equipe, on va rechercher les saisies
   de chacun : rien ne manque, meme si la page est restee ouverte longtemps ou
   vient d'etre rechargee. Puis on dit sur quoi le document porte. */
function avecEquipeAJour(fn){
  if (!(RAP.equipe && RESEAU.possible)) return Promise.resolve(fn());
  return recupererEspaces().then(() => fn());
}
function direPerimetre(quoi){
  if (!RAP.equipe) return toast(quoi + ' : vos saisies');
  const s = sourcesRap();
  toast(equipeReunie() ? quoi + ' : toute l’équipe · ' + s.map(x => x.nom).join(', ')
                       : quoi + ' : vos saisies seulement, personne d’autre n’a encore saisi');
}
function htmlPerimetre(){
  const noms = sourcesRap().map(x => esc(x.nom) + (x.ici ? ' (ici)' : x.quand ? ' (' + esc(quandDepot(x.quand)) + ')' : ''));
  const note = !RAP.equipe
    ? 'Ce bilan et ses exports ne portent que sur vos saisies. Pour le journal de toute l’équipe, choisissez « Toute l’équipe ».'
    : RAP.sources.length
      ? 'Saisies réunies : ' + noms.join(', ') + '. Le bilan, le journal DIT, la fiche pour la post et les exports portent sur l’ensemble ; le projet de cet appareil n’est pas modifié.'
      : RAP.equipier.some(aSaisi)
        ? 'Personne n’est coché dans « Rapprocher les saisies », plus bas : le bilan ne porte que sur vos saisies.'
        : 'Personne d’autre n’a encore saisi : le bilan ne porte que sur vos saisies. Actualiser ira revoir.';
  // plus de choix « Mes saisies / Toute l'equipe » : le rapport porte toujours sur toute l'equipe
  void note;
  return '';
}

function renderReport(){
  // « Toute l'equipe » retenu d'une fois sur l'autre : au premier rendu, on va
  // chercher les saisies des autres (une fois ; Actualiser ira revoir)
  if (RAP.equipe && !RAP.sources.length && RESEAU.possible && !RAP.tente && !RAP.chargement) actualiserEquipe();
  // le rapprochement compare les saisies d'ici a celles des autres : il se
  // calcule avant que le projet reuni prenne la place du mien
  const perimetre = htmlPerimetre(), rapprochement = htmlRapprochement();
  surLePerimetre(() => renderBilan(perimetre, rapprochement));
}
function renderBilan(perimetre, rapprochement){
  const tous = fJourR === '*';
  if (!tous && joursConnus().indexOf(fJourR) < 0) fJourR = '*';
  const P = tous ? DB.plans : plansDuJour(fJourR);
  const T = tous ? DB.prises : prisesDuJour(fJourR);
  const p = DB.prod;

  /* Ici la pastille compte les prises du jour ; le trait en pied garde le meme
     sens que sur la page Tournage : les plans tournes sur ceux prevus. */
  $('c-jourr').innerHTML = chipsJours(fJourR, 'setJourR', j => {
    const a = avancement(j);
    const n = j === '*' ? DB.prises.length : prisesDuJour(j).length;
    const d = j === '*' ? '' : (j === 'CG' ? 'Full CG' : decorJour(j));
    return { txt: n, fait: a.fait, total: a.total,
             titre: [j === '*' ? 'Tout le tournage' : nomJour(j), d,
                     a.fait + '/' + a.total + ' plans tournés'].filter(Boolean).join(' · ') };
  });
  cadrerJour('c-jourr', fJourR);

  const done = P.filter(x => x.etat === 'done').length;
  const ok = T.filter(t => t.statut === 'OK').length;
  const ng = T.filter(t => t.statut === 'NG').length;
  const keep = T.filter(t => t.retenue).length;
  const avecEl = P.filter(aElements).length;

  const al = [];
  T.filter(t => t.retenue && !t.clip).forEach(t =>
    al.push(['o', `Prise ${esc(t.n)} du plan <b>${esc(t.plan)}</b> retenue pour le montage mais sans nom de clip.`]));
  T.filter(t => t.clip && !t.carte).forEach(t =>
    al.push(['o', `Clip <b>${esc(t.clip)}</b> sans carte renseignée : introuvable à l’offload.`]));
  P.filter(x => x.etat === 'done' && !prisesDe(x.id).length).forEach(x =>
    al.push(['o', `Shot <b>${esc(x.plan)}</b> marqué tourné mais sans aucune prise.`]));
  P.filter(x => aElements(x) && !prisesDe(x.id).length).forEach(x =>
    al.push(['o', `Shot <b>${esc(x.plan)}</b> : des éléments sont cochés mais aucune prise n’est enregistrée.`]));
  P.filter(x => prisesDe(x.id).length && !prisesDe(x.id).some(t => t.retenue)).forEach(x =>
    al.push(['o', `Shot <b>${esc(x.plan)}</b> : ${prisesDe(x.id).length} prise(s), aucune retenue pour le montage.`]));
  if (!al.length && T.length) al.push(['g', 'Rien à signaler : clips et prises retenues sont cohérents.']);

  const compte = ELEMENTS.map(e => [e[1], P.filter(x => elementsTous(x)[e[0]]).length]).filter(x => x[1]);
  const parJour = joursConnus().map(j => [j, prisesDuJour(j).length]);
  const maxJ = Math.max(1, ...parJour.map(x => x[1]));
  const parQui = frequences(T.map(t => t.par || '—'));

  $('report').innerHTML = perimetre + `
    <div class="kpis">
      <div class="kpi"><div class="v">${T.length}</div><div class="l">Prises</div></div>
      <div class="kpi"><div class="v" style="color:var(--acc)">${keep}</div><div class="l">À monter</div></div>
      <div class="kpi"><div class="v" style="color:var(--ok)">${ok}</div><div class="l">OK</div></div>
      <div class="kpi"><div class="v" style="color:var(--ng)">${ng}</div><div class="l">NG</div></div>
      <div class="kpi"><div class="v">${done}<small>/${P.length}</small></div><div class="l">Shots tournés</div></div>
      <div class="kpi"><div class="v">${avecEl}</div><div class="l">Avec éléments</div></div>
    </div>

    ${blocRepli('verifier', 'À vérifier avant de rendre la journée', al.filter(a => a[0] !== 'g').length,
      `<div class="cinq">${al.length ? al.map(a => `<div class="alert ${a[0]}"><i>${a[0] === 'g' ? '&#10003;' : '&#9888;'}</i><div>${a[1]}</div></div>`).join('')
                  : '<div style="color:var(--dim2);font-size:13.5px">Rien d’enregistré pour l’instant.</div>'}</div>`)}

    ${compte.length ? blocRepli('elements', 'Éléments captés', compte.length,
      `<div class="cinq">${compte.map(x => `<div class="ligne"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')}</div>`) : ''}

    ${blocRepli('parjour', 'Prises par jour', parJour.reduce((a, x) => a + x[1], 0),
      `<div class="cinq">${parJour.map(([j, n]) => `<div class="ligne"><span>${nomJour(j)}</span>
          <span class="jauge"><i style="width:${n / maxJ * 100}%"></i></span>
          <b>${n}</b></div>`).join('') || '<div style="color:var(--dim2);font-size:13.5px">Aucun plan.</div>'}</div>`)}

    ${parQui.length > 1 || (parQui.length && parQui[0][0] !== '—') ? blocRepli('parqui', 'Prises saisies par', parQui.length,
      `<div class="cinq">${parQui.map(x => `<div class="ligne"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')}</div>`) : ''}

    <div class="bloc" id="rapprocher">
      <h3>Rapprocher les saisies</h3>
      <div class="note">Chacun saisit de son côté ; ${RESEAU.possible ? 'le bouton ci-dessous ramène les saisies de l’équipe, telles qu’elles sont sur le serveur ; cochez qui réunir — une personne, plusieurs, ou « Tous », c’est-à-dire tous ceux qui ont saisi'
          : 'déposez ici les sauvegardes JSON des autres (⚙ → Données → Sauvegarde JSON)'}.
        Le rapport montre ce qui ne concorde pas, plan par plan. ${RESEAU.possible
          ? 'Ce choix vaut pour tout le rapport : le bilan, les trois PDF et les exports portent sur les personnes cochées. Votre carnet reste le vôtre.'
          : 'La fusion garde tout : vos saisies font foi sur les écarts, les autres comblent les vides et apportent leurs prises en plus.'}</div>
      ${rapprochement}
    </div>

    <div class="btns noprint" style="margin-bottom:30px">
      <button class="btn p" onclick="telechargerDIT()">DIT (PDF)</button>
      <button class="btn p" onclick="telechargerWrangling()">Rapport VFX (PDF)</button>
      <button class="btn p" onclick="telechargerVFX()">Data wrangling (PDF)</button>
      <button class="btn rouge droite" onclick="telechargerBackup()" title="Tous les jours, chacun avec ses trois PDF, dans un seul fichier ZIP sur cet appareil">Backup (ZIP)</button>
    </div>
    <div class="note noprint" style="margin:-18px 0 30px">Les trois PDF reprennent le jour choisi en haut.
      Le DIT : les prises retenues pour le montage. Le rapport VFX : tout ce que l’équipe a saisi, une
      page par shot, avec en rouge les erreurs de saisie et les désaccords à corriger. Le data wrangling :
      la feuille caméra du plateau, une par plan — les réglages et relevés de chaque prise, les éléments
      captés, les notes, le croquis du décor et les distances.</div>`;
}

/* -------------------------------------- Fiche de transmission a la post */

/* Le seul document de l'application ecrit pour quelqu'un d'autre : le monteur
   et le studio VFX. Il repond a leurs deux questions, dans cet ordre — quelle
   prise fait foi, et qu'a-t-on capte sur ce plan. Les plans muets ne sont pas
   imprimes : une liasse de 126 plans vides ne se lit pas. */

const optiqueDe = t => [t.focale, t.objectif, t.diaph, t.filtre].filter(Boolean).join(' · ');

function relevesDe(t){
  const ptr = [['pan', fleche(t.panStart, t.panStop)], ['tilt', fleche(t.tiltStart, t.tiltStop)], ['roll', fleche(t.rollStart, t.rollStop)]]
    .filter(x => x[1]).map(x => x[0] + ' ' + x[1]).join(' / ');
  return [['Point de map', fleche(t.focusStart, t.focusStop)], ['Hauteur', fleche(t.hauteurStart, t.hauteurStop)],
          ['Mesuré depuis', t.mesureDepuis], ['Orientation', ptr], ['Mouvement', t.mouvement], ['Support', t.support]].filter(x => x[1]);
}

const imageDe = t => [t.cam, t.camModel, t.codec, t.reso, t.fps && t.fps + ' i/s',
                      t.shutter, t.ei && 'EI ' + t.ei, t.wb, t.nd && 'ND ' + t.nd, t.lut]
                     .filter(Boolean).join(' · ');

function htmlPost(j){
  const tous = j === '*';
  const P = tous ? DB.plans : plansDuJour(j);
  const T = tous ? DB.prises : prisesDuJour(j);
  const p = DB.prod;
  const gardees = T.filter(t => t.retenue);
  const parlants = P.filter(x => prisesDe(x.id).length || aElements(x));
  // les cartes ou sont les rushes de la periode : une par nom de carte note sur les prises
  const cartes = [...new Set(T.map(t => (t.carte || '').trim()).filter(Boolean))];
  const d = new Date();

  /* 1. Pour le monteur : la liste des clips qui font foi, rien d'autre. */
  /* Dans l'ordre du tournage : c'est celui dans lequel le monteur derushe. */
  const ordre = new Map(DB.plans.map((x, i) => [x.id, i]));
  const suite = gardees.slice().sort((a, b) =>
    rangJour(a.jour || '') - rangJour(b.jour || '') ||
    (ordre.get(a.planId) || 0) - (ordre.get(b.planId) || 0) || (a.n || 0) - (b.n || 0));

  const montage = suite.length ? `<table>
      <thead><tr>${tous ? '<th>Jour</th>' : ''}<th>Clip</th><th>Séq</th><th>Plan</th><th>Pr.</th>
        <th>Durée</th><th>Carte</th><th>Note</th></tr></thead>
      <tbody>${suite.map(t => `<tr>
        ${tous ? `<td>${esc(miniJour(t.jour || ''))}</td>` : ''}
        <td class="mono">${esc(t.clip || '—')}</td><td>${esc(t.seq || '')}</td>
        <td>${esc(t.plan || '')}</td><td>${esc(t.n)}</td><td>${esc(t.duree || '')}</td>
        <td>${esc(t.carte || '')}</td><td>${esc(t.notes || '')}</td></tr>`).join('')}</tbody>
    </table>` : `<div class="pvide">Aucune prise marquée à monter.</div>`;

  /* 2. Pour les VFX : le plan, ce qui a ete capte, et les releves du matchmove. */
  const vfx = parlants.length ? parlants.map(x => {
    const pr = prisesDe(x.id);
    const keep = pr.filter(t => t.retenue);
    const ref = keep[0] || pr[pr.length - 1];
    const autres = pr.filter(t => keep.indexOf(t) < 0);
    const el = elementsCoches(x).map(e => `<span>${esc(e[2])}</span>`).join('') +
      (texteDe(x, 'elementsAutre') ? `<span>${esc(texteDe(x, 'elementsAutre').toUpperCase())}</span>` : '');
    const rel = ref ? relevesDe(ref) : [];
    return `<article class="pplan">
      <div class="ptete">
        <div>
          <div class="pno">Shot ${esc(x.plan || '—')}${
            (x.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
          <div class="pdes">${esc(x.desc || '')}</div>
          <div class="pmet">${[nomJour(x.jour || ''), 'Séq ' + (x.seq || ''), x.lieu, x.cadrage, x.mouv]
            .filter(Boolean).map(esc).join(' · ')}</div>
          ${x.assets ? `<div class="pmet">Découpage VFX : ${esc(x.assets)}</div>` : ''}
          ${texteDe(x, 'vfxDesc') ? `<div class="pmet">${esc(texteDe(x, 'vfxDesc'))}</div>` : ''}
        </div>
      </div>
      ${keep.length ? keep.map(t => `<div class="pgarde">
        <b>${esc(t.clip || 'clip non renseigné')}</b>
        <i>${[t.carte && 'carte ' + t.carte, optiqueDe(t), t.duree, t.tcIn].filter(Boolean).map(esc).join(' · ')}</i>
        ${t.notes ? `<div class="pnote">${esc(t.notes)}</div>` : ''}
        ${imageDe(t) ? `<div class="pnote"><em style="color:#666">${esc(imageDe(t))}</em></div>` : ''}
      </div>`).join('') : `<div class="pgarde"><i>Aucune prise retenue pour le montage sur ce plan.</i></div>`}
      ${el || rel.length ? `<div class="pcols">
        ${el ? `<div><h4>Éléments captés</h4><div class="pel">${el}</div></div>` : ''}
        ${rel.length ? `<div><h4>Relevés matchmove</h4><div class="prel">${
          rel.map(r => `<em>${r[0]}</em> ${esc(r[1])}`).join('<br>')}</div></div>` : ''}
      </div>` : ''}
      ${autres.length ? `<div class="pautres">Autres prises : ${autres.map(t => {
        const q = [libStatut(t), t.clip].filter(Boolean).join(' · ');
        return esc(t.n + (q ? ' (' + q + ')' : ''));
      }).join(', ')}</div>` : ''}
    </article>`;
  }).join('') : `<div class="pvide">Aucun plan tourné ni élément capté sur cette période.</div>`;

  return `
    <h1>${esc(p.titre || 'Projet sans titre')} — transmission post-production</h1>
    <div class="psous">${[tous ? 'Tout le tournage' : nomJour(j), !tous && dateJourFr(j), !tous && decorJour(j), p.unit,
        p.dit && 'DIT ' + p.dit, p.wrangler && 'Wrangler ' + p.wrangler].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="pchiffres">
      <span><b>${P.filter(x => x.etat === 'done').length}</b>plans tournés sur ${P.length}</span>
      <span><b>${gardees.length}</b>prises à monter</span>
      <span><b>${T.length}</b>prises au total</span>
      <span><b>${P.filter(aElements).length}</b>plans avec éléments</span>
      <span><b>${cartes.length}</b>cartes</span>
    </div>

    <h2>Pour le montage — prises retenues</h2>
    ${montage}

    <h2>Pour les VFX — plan par plan</h2>
    ${vfx}

    <div class="ppied">${esc(p.titre || '')} · édité le ${deuxCh(d.getDate())}/${deuxCh(d.getMonth() + 1)}/${d.getFullYear()}
      à ${hhmm(d)}${UI.nom ? ' par ' + esc(UI.nom) : ''} ·
      Wrangle</div>`;
}

/* ------------------------------------------------------- Journal du DIT */

/* Le second document : pour le DIT lui-meme. Il s'ouvre sur ce que le montage
   attend en temps reel (les prises retenues, avec leurs clips), puis liste
   tous les plans, chacun avec ses prises, celle qui est retenue, et qui a
   saisi quoi a quelle heure. Les plans sans prise y figurent aussi, en une
   ligne : le journal dit ce qui reste a tourner. Il se telecharge en PDF,
   ecrit par la page elle-meme (voir plus bas). */
/* Un journal par journee : « Tout » en donne un par jour, a la suite, chacun
   sur sa page. Une journee dit ses chiffres, les prises retenues, les plans
   tournes avec leurs prises, puis ce qui reste a tourner, en liste. */
function modeleDIT(j){
  const jours = j === '*' ? joursConnus().filter(x => plansDuJour(x).length) : [j];
  const p = DB.prod, d = new Date();
  const pied = [p.titre || '', 'journal DIT édité le ' + deuxCh(d.getDate()) + '/' + deuxCh(d.getMonth() + 1) + '/' + d.getFullYear() +
                ' à ' + hhmm(d) + (UI.nom ? ' par ' + UI.nom : ''), 'Wrangle'].filter(Boolean).join(' · ');
  const qui = t => [t.par, t.heure].filter(Boolean).join(' · ');
  const prise = t => ({ n: String(t.n || ''), clip: t.clip || '', carte: t.carte || '', statut: t.statut || '', pickup: !!t.pickup,
                        retenue: !!t.retenue, tcIn: t.tcIn || '', tcOut: t.tcOut || '', duree: t.duree || '',
                        note: t.notes || '', qui: qui(t), par: t.par || '', heure: t.heure || '', seq: t.seq || '', plan: t.plan || '',
                        dureePrevue: (plan(t.planId) || {}).duree || '', ecarts: t.ecarts || [] });
  const ordre = new Map(DB.plans.map((x, i) => [x.id, i]));
  const refShot = x => (x.seq ? 'Séq ' + x.seq + ' · ' : '') + 'Shot ' + (x.plan || '—');

  return jours.map(jour => {
    const P = plansDuJour(jour), T = prisesDuJour(jour);
    const gardees = T.filter(t => t.retenue);
    const cartes = [...new Set(T.map(t => (t.carte || '').trim()).filter(Boolean))];
    /* 1. Pour le montage, dans l'ordre du tournage. */
    const montage = gardees.slice().sort((a, b) =>
      (ordre.get(a.planId) || 0) - (ordre.get(b.planId) || 0) || (a.n || 0) - (b.n || 0)).map(prise);
    /* 2. Les plans tournes (ou marques tels), sous leur sequence ; le reste en liste. */
    const tournes = [], reste = [], abandonnes = [];
    let seqCourante = null;
    P.forEach(x => {
      const pr = prisesDe(x.id);
      const meta = [x.cadrage, x.mouv, x.support, x.focale].filter(Boolean).join(' · ');
      const ref = 'Séquence ' + (x.seq || '—') + ' · Plan ' + (x.plan || '—');
      // un shot fusionne ou abandonne est dit a part, avec ce qu'il est devenu : le DIT ne le cherche pas
      if (x.etat === 'drop'){
        const dans = x.fusionDans && plan(x.fusionDans);
        abandonnes.push({ ref, meta, ou: refShot(x), fusion: !!dans,
          etat: dans ? 'Fusionné dans ' + refShot(dans) + ' : ses prises y sont'
                     : 'Abandonné' + (pr.length ? ' · ' + pr.length + ' prise' + plur(pr.length) + ' tournée' + plur(pr.length) : '') });
        return;
      }
      if (pr.length || x.etat === 'done'){
        const ok = pr.filter(t => t.statut === 'OK').length, ng = pr.filter(t => t.statut === 'NG').length,
              ret = pr.filter(t => t.retenue).length;
        const b = { seq: '', seqTitre: '', plan: x.plan || '—', prises: pr.map(prise), ecarts: x.ecarts || [],
                    seqNum: x.seq || '', titreSeq: x.seqTitre || '', lieu: x.lieu || '', desc: x.desc || '',
                    meta: [ETATS[x.etat], meta].filter(Boolean).join(' · '),
                    bilan: pr.length ? [pr.length + ' prise' + plur(pr.length), ok && ok + ' OK', ng && ng + ' NG',
                                        ret && ret + ' retenue' + plur(ret)].filter(Boolean).join(' · ') : 'aucune prise' };
        if ((x.seq || '') !== seqCourante){
          seqCourante = x.seq || '';
          b.seq = 'Séquence ' + (seqCourante || '—'); b.seqTitre = x.seqTitre || '';
        }
        tournes.push(b);
      } else reste.push({ ref, meta });
    });
    /* 3. Ce qu'il y a a sauvegarder : un fichier par prise, carte par carte,
       du premier au dernier clip ; et ce qui manque pour les retrouver. */
    const parCarte = new Map();
    T.forEach(t => { const c = (t.carte || '').trim(); if (c) parCarte.set(c, (parCarte.get(c) || []).concat([t])); });
    const sauvegarde = {
      total: T.length,
      cartes: [...parCarte].sort((a, b) => a[0].localeCompare(b[0], 'fr', { numeric: true })).map(([carte, l]) => {
        const clips = l.map(t => (t.clip || '').trim()).filter(Boolean).sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
        return { carte, n: l.length, premier: clips[0] || '', dernier: clips[clips.length - 1] || '' };
      }),
      sansCarte: T.filter(t => !(t.carte || '').trim()).length,
      sansClip: T.filter(t => !(t.clip || '').trim()).length
    };
    const dec = jour === 'CG' ? 'Full CG' : decorJour(jour);
    const ecarts = tournes.reduce((n, b) => n + b.ecarts.length + b.prises.reduce((m, t) => m + t.ecarts.length, 0), 0);
    /* les ecarts, un par ligne : la prise (ou le plan), le champ, ce que chacun a saisi */
    const listeEcarts = tournes.flatMap(b =>
      b.prises.flatMap(t => t.ecarts.map(e => ({ seq: t.seq, plan: t.plan, n: t.n, clip: t.clip, retenue: t.retenue, champ: e.champ, valeurs: e.valeurs })))
        .concat(b.ecarts.map(e => ({ seq: b.seqNum, plan: b.plan, n: '', clip: '', retenue: false, champ: e.champ, valeurs: e.valeurs }))));
    /* les wranglers : ceux qui ont saisi des prises ce jour-la, dans l'ordre de leur premiere prise */
    const saisis = [...new Set(T.flatMap(t => String(t.par || '').split(/\s*,\s*/)).filter(Boolean))];
    return {
      jour, titre: p.titre || 'Projet sans titre', sauvegarde, ecarts, listeEcarts,
      sous: ['Journal DIT', nomJour(jour), dec, dateJourFr(jour), p.dit && 'DIT ' + p.dit,
             saisis.length && 'Wrangler' + plur(saisis.length) + ' ' + saisis.join(', ')].filter(Boolean).join(' · '),
      // les plans tournes du journal : ceux qui ont des prises (ou marques a la main), comme sa liste
      chiffres: [[tournes.length, 'plans tournés sur ' + P.length], [reste.length, 'à tourner'],
                 [T.length, 'fichier' + plur(T.length) + ' à sauvegarder'], [gardees.length, 'prises à monter'],
                 [T.filter(t => t.statut === 'OK').length, 'OK'], [T.filter(t => t.statut === 'NG').length, 'NG'],
                 [cartes.length, 'carte' + plur(cartes.length) + (cartes.length && cartes.length <= 6 ? ' · ' + cartes.join(', ') : '')]],
      montage, tournes, reste, abandonnes, pied
    };
  });
}

/* ------------------------------------------------ Un PDF ecrit a la main */
/* Le journal se telecharge sans passer par la fenetre d'impression : la page
   ecrit le PDF elle-meme. Helvetica et Courier, que tout lecteur possede,
   en WinAnsi pour les accents ; pas de compression, le fichier se relit tel
   quel. A4, marges de 40 points, l'origine en bas a gauche comme dans tout PDF. */
const PDF_L = 595.28, PDF_H = 841.89, PDF_M = 40;
/* les largeurs d'Helvetica, en milliemes de cadratin : pour couper les lignes au bon endroit */
const PDF_HELV = { ' ':278, '!':278, '"':355, '#':556, '$':556, '%':889, '&':667, "'":191, '(':333, ')':333, '*':389,
  '+':584, ',':278, '-':333, '.':278, '/':278, ':':278, ';':278, '<':584, '=':584, '>':584, '?':556, '@':1015, '[':278,
  '\\':278, ']':278, '_':556, '`':333, '{':334, '|':260, '}':334, 'a':556, 'b':556, 'c':500, 'd':556, 'e':556, 'f':278,
  'g':556, 'h':556, 'i':222, 'j':222, 'k':500, 'l':222, 'm':833, 'n':556, 'o':556, 'p':556, 'q':556, 'r':333, 's':500,
  't':278, 'u':556, 'v':500, 'w':722, 'x':500, 'y':500, 'z':500, 'A':667, 'B':667, 'C':722, 'D':722, 'E':667, 'F':611,
  'G':778, 'H':722, 'I':278, 'J':500, 'K':667, 'L':556, 'M':833, 'N':722, 'O':778, 'P':667, 'Q':778, 'R':722, 'S':667,
  'T':611, 'U':722, 'V':667, 'W':944, 'X':667, 'Y':667, 'Z':611, '•':350, '–':556, '—':1000, '…':1000, '«':556, '»':556,
  '°':400, '€':556, '·':278, 'œ':944, 'Œ':1000, '→':584 };
/* ce que WinAnsi place au-dela du latin-1 */
const PDF_WINANSI = { '€':128, '‚':130, 'ƒ':131, '„':132, '…':133, '†':134, '‡':135, 'ˆ':136, '‰':137, 'Š':138, '‹':139,
  'Œ':140, 'Ž':142, '‘':145, '’':146, '“':147, '”':148, '•':149, '–':150, '—':151, '˜':152, '™':153, 'š':154, '›':155,
  'œ':156, 'ž':158, 'Ÿ':159 };

/* La charte du site, en clair comme sur papier : encre brune, caramel pour
   ce qui compte, tan pour ce qui accompagne, creme pour les fonds. */
const PDF_TEINTES = {
  encre:   [42, 26, 5],      // --acc-txt
  brun:    [58, 42, 32],     // le texte courant
  tan:     [142, 122, 105],  // --dim2 : les libelles, les metas
  caramel: [154, 106, 20],   // --acc en clair : titres de section, filets forts
  or:      [231, 176, 74],   // --acc : le logo
  creme:   [241, 232, 220],  // --surface2 en clair : les fonds
  creme2:  [232, 220, 205],  // --surface3 en clair : la prise retenue
  creme3:  [247, 243, 237],  // une rangee sur deux des tableaux
  creme4:  [239, 233, 224],  // le croisement d'une rangee et d'une colonne teintees
  filet:   [216, 204, 190],  // les traits fins
  filet2:  [176, 160, 142],  // les traits des en-tetes
  ok:      [72, 138, 90],    // une prise bonne
  ng:      [188, 84, 76],    // une prise a jeter
  blanc:   [255, 255, 255]   // le texte des barres encre
};
/* la largeur d'un texte interlettre */
const largeurEsp = (s, taille, police, esp) => largeurPdf(s, taille, police) + (esp || 0) * Math.max(0, String(s || '').length - 1);
function teintePdf(couleur, gris){
  const c = PDF_TEINTES[couleur];
  if (c) return c.map(v => (v / 255).toFixed(3)).join(' ');
  const g = (gris == null ? 0 : gris).toFixed(2);
  return `${g} ${g} ${g}`;
}

function largeurPdf(s, taille, police){
  if (police === 'C' || police === 'CB') return String(s || '').length * 600 * taille / 1000;
  let l = 0;
  for (const ch of String(s || '')){
    const base = ch.normalize('NFD').replace(/[̀-ͯ]/g, '');
    l += PDF_HELV[ch] || PDF_HELV[base] || 556;
  }
  return l * taille / 1000 * (police === 'HB' ? 1.05 : 1);
}
/* Une chaine PDF : en WinAnsi, parentheses et barres echappees. La fleche,
   que WinAnsi n'a pas, s'ecrit « > ». */
function chainePdf(s){
  let out = '';
  for (const ch of String(s || '').replace(/→/g, '>')){
    let c = ch.charCodeAt(0);
    if (c > 255) c = PDF_WINANSI[ch] || 63;
    if (c < 32) c = 32;
    if (c === 40 || c === 41 || c === 92) out += '\\';
    out += String.fromCharCode(c);
  }
  return out;
}
/* Coupe un texte en lignes qui tiennent dans `larg` points ; un mot trop long est brise. */
function lignesPdf(s, larg, taille, police){
  const out = []; let l = '';
  for (let m of String(s || '').replace(/\s+/g, ' ').trim().split(' ')){
    while (largeurPdf(m, taille, police) > larg && m.length > 1){
      let k = m.length; while (k > 1 && largeurPdf(m.slice(0, k), taille, police) > larg) k--;
      if (l){ out.push(l); l = ''; }
      out.push(m.slice(0, k)); m = m.slice(k);
    }
    const essai = l ? l + ' ' + m : m;
    if (!l || largeurPdf(essai, taille, police) <= larg) l = essai; else { out.push(l); l = m; }
  }
  if (l) out.push(l);
  return out.length ? out : [''];
}

/* `paysage` : la page couchee, pour les tableaux larges */
function nouveauPdf(paysage){
  const pages = [], largeur = paysage ? PDF_H : PDF_L, hauteur = paysage ? PDF_L : PDF_H;
  const doc = {
    y: 0, page: null, largeur, hauteur,
    nouvellePage(){ doc.page = { ops: [] }; pages.push(doc.page); doc.y = hauteur - PDF_M; },
    /* du texte a partir de (x, y), y etant la ligne de base ; `couleur` est un
       nom de la charte (PDF_TEINTES), a defaut un gris de 0 (noir) a 1 */
    texte(x, y, s, o){
      o = o || {};
      // `esp` : l'interlettrage, pour les petites capitales ; il reste pose tant qu'on ne le remet pas a zero
      doc.page.ops.push(`BT /${o.police || 'H'} ${o.taille || 9} Tf ${(o.esp || 0).toFixed(2)} Tc ` +
                        `${teintePdf(o.couleur || (o.gris == null ? 'brun' : ''), o.gris)} rg ` +
                        `${x.toFixed(2)} ${y.toFixed(2)} Td (${chainePdf(s)}) Tj ET`);
    },
    /* un point plein : quatre arcs de Bezier */
    disque(cx, cy, r, couleur){
      const k = .5523 * r, f = v => v.toFixed(2);
      doc.page.ops.push(`${teintePdf(couleur)} rg ${f(cx + r)} ${f(cy)} m ` +
        `${f(cx + r)} ${f(cy + k)} ${f(cx + k)} ${f(cy + r)} ${f(cx)} ${f(cy + r)} c ` +
        `${f(cx - k)} ${f(cy + r)} ${f(cx - r)} ${f(cy + k)} ${f(cx - r)} ${f(cy)} c ` +
        `${f(cx - r)} ${f(cy - k)} ${f(cx - k)} ${f(cy - r)} ${f(cx)} ${f(cy - r)} c ` +
        `${f(cx + k)} ${f(cy - r)} ${f(cx + r)} ${f(cy - k)} ${f(cx + r)} ${f(cy)} c f`);
    },
    ligne(x1, y1, x2, y2, ep, couleur){
      doc.page.ops.push(`${teintePdf(couleur)} RG ${ep || .5} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
    },
    /* une image JPEG ({ l, h, octets } : octets en chaine binaire), posee dans (x, y, l, h) */
    images: [],
    image(im, x, y, l, h){
      if (!doc.images.includes(im)) doc.images.push(im);
      doc.page.ops.push(`q ${l.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im${doc.images.indexOf(im) + 1} Do Q`);
    },
    rect(x, y, w, h, couleur){ doc.page.ops.push(`${teintePdf(couleur)} rg ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); },
    /* un trace ferme, en points de la page, rempli d'une teinte */
    forme(points, couleur){
      if (points.length < 3) return;
      doc.page.ops.push(`${teintePdf(couleur)} rg ` + points.map((p, i) => `${p[0].toFixed(2)} ${p[1].toFixed(2)} ${i ? 'l' : 'm'}`).join(' ') + ' h f');
    },
    /* un trace SVG (M, L, Z seulement) pose dans la page : (x0, y0) est l'origine
       du dessin, k son echelle ; le SVG compte y vers le bas, la page vers le haut */
    trace(d, couleur, evenodd, x0, y0, k){
      const t = d.match(/[MLZ]|-?[\d.]+/g) || [], ops = [teintePdf(couleur) + ' rg'];
      for (let i = 0; i < t.length;){
        const c = t[i++];
        if (c === 'Z') ops.push('h');
        else if (c === 'M' || c === 'L'){
          const x = +t[i++], y = +t[i++];
          ops.push(`${(x0 + x * k).toFixed(2)} ${(y0 - y * k).toFixed(2)} ${c === 'M' ? 'm' : 'l'}`);
        }
      }
      ops.push(evenodd ? 'f*' : 'f');
      doc.page.ops.push(ops.join(' '));
    },
    /* assez de place pour `h` points, sinon page suivante */
    place(h){ if (doc.y - h < PDF_M) doc.nouvellePage(); },
    /* le fichier : les objets, la table des adresses, le pied de chaque page */
    fichier(pied, numero){
      pages.forEach((pg, i) => {
        const s = numero ? numero(i + 1, pages.length) : (i + 1) + ' / ' + pages.length;
        pg.ops.push(`${teintePdf('filet2')} RG 0.5 w ${PDF_M} ${PDF_M - 10} m ${(largeur - PDF_M).toFixed(2)} ${PDF_M - 10} l S`);
        pg.ops.push(`BT /H 7 Tf 0 Tc ${teintePdf('tan')} rg ${PDF_M} ${PDF_M - 20} Td (${chainePdf(pied)}) Tj ET`);
        pg.ops.push(`BT /H 7 Tf 0 Tc ${teintePdf('tan')} rg ${(largeur - PDF_M - largeurPdf(s, 7, 'H')).toFixed(2)} ${PDF_M - 20} Td (${chainePdf(s)}) Tj ET`);
      });
      const objets = [];
      const ajouter = s => { objets.push(s); return objets.length; };
      const fontes = ['Helvetica', 'Helvetica-Bold', 'Courier', 'Courier-Bold'].map(f =>
        ajouter(`<< /Type /Font /Subtype /Type1 /BaseFont /${f} /Encoding /WinAnsiEncoding >>`));
      const ims = doc.images.map(im => ajouter(`<< /Type /XObject /Subtype /Image /Width ${im.l} /Height ${im.h} /ColorSpace /DeviceRGB ` +
        `/BitsPerComponent 8 /Filter /DCTDecode /Length ${im.octets.length} >>
stream
${im.octets}
endstream`));
      const res = `<< /Font << /H ${fontes[0]} 0 R /HB ${fontes[1]} 0 R /C ${fontes[2]} 0 R /CB ${fontes[3]} 0 R >>` +
        (ims.length ? ` /XObject << ${ims.map((k, i) => `/Im${i + 1} ${k} 0 R`).join(' ')} >>` : '') + ` >>`;
      const noPages = ajouter('');
      const kids = pages.map(pg => {
        const flux = pg.ops.join('\n');
        const c = ajouter(`<< /Length ${flux.length} >>\nstream\n${flux}\nendstream`);
        return ajouter(`<< /Type /Page /Parent ${noPages} 0 R /MediaBox [0 0 ${largeur} ${hauteur}] /Resources ${res} /Contents ${c} 0 R >>`);
      });
      objets[noPages - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
      const racine = ajouter(`<< /Type /Catalog /Pages ${noPages} 0 R >>`);
      let s = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
      const adresses = objets.map((o, i) => { const a = s.length; s += `${i + 1} 0 obj\n${o}\nendobj\n`; return a; });
      const xref = s.length;
      s += `xref\n0 ${objets.length + 1}\n0000000000 65535 f \n` +
           adresses.map(a => String(a).padStart(10, '0') + ' 00000 n \n').join('') +
           `trailer\n<< /Size ${objets.length + 1} /Root ${racine} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
      return Uint8Array.from(s, ch => ch.charCodeAt(0) & 255);
    }
  };
  doc.nouvellePage();
  return doc;
}

/* Un tableau : des colonnes [titre, largeur, police], des lignes { v: cellules, fond, gras }.
   Une ligne tient d'un seul tenant ; l'en-tete se repete apres un saut de page. */
/* Une cellule est un texte, ou { t, couleur, police, puce } : `puce` pose un
   point de couleur devant le texte ; { caseVide: true } dessine une case a cocher. Une cellule { parts: [...] } enchaine
   plusieurs textes sur une ligne, chacun avec sa police et sa couleur. */
/* `suite` : ce qu'on rappelle en tete du tableau quand il continue sur la page d'apres. */
function tableauPdf(doc, cols, lignes, taille, suite){
  const inter = taille * 1.4, x0 = PDF_M, larg = cols.reduce((a, c) => a + c[1], 0);
  const entete = encore => {
    doc.place(inter + 12);
    if (encore && suite){ doc.texte(x0, doc.y - 9, suite, { taille: 8, police: 'HB', couleur: 'tan' }); doc.y -= 13; }
    let x = x0;
    cols.forEach(c => { doc.texte(x + 3, doc.y - 8, c[0].toUpperCase(), { taille: 6.3, police: 'HB', couleur: 'tan', esp: .5 }); x += c[1]; });
    doc.y -= 11;
    doc.ligne(x0, doc.y, x0 + larg, doc.y, .7, 'filet2');
    doc.y -= 1;
  };
  entete(false);
  lignes.forEach((li, n) => {
    const cel = li.v.map(c => (c && typeof c === 'object') ? c : { t: c });
    // chaque cellule est mesuree dans la police ou elle sera ecrite : en gras, un texte est plus large
    const policeDe = (c, i) => { const b = c.police || cols[i][2] || 'H';
      return b === 'C' || b === 'CB' ? (li.gras ? 'CB' : b) : (li.gras || b === 'HB' ? 'HB' : 'H'); };
    const lg = cols.map((c, i) => cel[i].parts ? [''] : lignesPdf(cel[i].t, c[1] - 8 - (cel[i].puce ? 9 : 0), taille, policeDe(cel[i], i)));
    const h = Math.max(...lg.map(l => l.length)) * inter + 5;
    if (doc.y - h < PDF_M){ doc.nouvellePage(); entete(true); }
    // une rangee sur deux est teintee ; la prise retenue l'est davantage
    if (li.fond) doc.rect(x0, doc.y - h, larg, h, 'creme2');
    else if (n % 2) doc.rect(x0, doc.y - h, larg, h, 'creme3');
    let x = x0 + 3;
    lg.forEach((l, i) => {
      const c = cel[i], police = policeDe(c, i);
      let dx = 0;
      if (c.puce && c.t){ doc.disque(x + 2.6, doc.y - taille + 1, 2.1, c.puce); dx = 9; }
      // une case vide, a cocher au stylo
      if (c.caseVide){ const y0 = doc.y - taille - 3, k = taille;
        [[0, 0, k, 0], [k, 0, k, k], [k, k, 0, k], [0, k, 0, 0]].forEach(([a, b, e, f]) => doc.ligne(x + a, y0 + b, x + e, y0 + f, .6, 'filet2')); }
      if (c.parts) c.parts.forEach(p => {
        if (!p.t) return;
        const pol = p.police || police;
        doc.texte(x + dx, doc.y - taille - 2, p.t, { taille, police: pol, couleur: p.couleur });
        dx += largeurPdf(p.t, taille, pol);
      });
      else l.forEach((s, k) => doc.texte(x + dx, doc.y - taille - 2 - k * inter, s, { taille, police, couleur: c.couleur }));
      x += cols[i][1];
    });
    doc.y -= h;
  });
  doc.ligne(x0, doc.y, x0 + larg, doc.y, .5, 'filet2');
  doc.y -= 2;
}

/* Le logo, lu une fois dans son SVG : le mot et la touche caramel. Sans lui
   (page ouverte hors serveur), le journal se fait quand meme. */
let LOGO_PDF = null;
function chargerLogo(){
  if (LOGO_PDF) return Promise.resolve(LOGO_PDF);
  return fetch('public/wrangle-logo.svg').then(r => r.ok ? r.text() : '').then(svg => {
    const d = [...svg.matchAll(/<path\b[^>]*?\sd="([^"]*)"/g)].map(x => x[1]);
    // dans le fichier : la decoupe, puis le mot, puis la touche caramel
    LOGO_PDF = d.length >= 3 ? { mot: d[1], touche: d[2] } : null;
    return LOGO_PDF;
  }).catch(() => null);
}
// la boite du dessin dans son SVG (viewBox 1569 x 484) : le mot tient la
const LOGO_BOITE = { x: 109.4, y: 132.4, l: 1346.3, h: 232.6 };

/* L'en-tete d'un document : le logo a gauche, le titre et le sous-titre a
   droite sur un trait caramel, puis les chiffres en tuiles comme sur le site,
   le nombre en grand et son libelle en petites capitales dessous. */
function entetePdf(doc, titre, sous, chiffres){
  const L = doc.largeur - 2 * PDF_M, hl = 26, kl = hl / LOGO_BOITE.h;
  if (LOGO_PDF){
    const ox = PDF_M - LOGO_BOITE.x * kl, oy = doc.y + LOGO_BOITE.y * kl;
    doc.trace(LOGO_PDF.mot, 'encre', true, ox, oy, kl);
    doc.trace(LOGO_PDF.touche, 'or', false, ox, oy, kl);
  }
  const xd = PDF_M + L;
  doc.texte(xd - largeurPdf(titre, 20, 'HB'), doc.y - 16, titre, { taille: 20, police: 'HB', couleur: 'encre' });
  doc.texte(xd - largeurPdf(sous, 8.5, 'H'), doc.y - 29, sous, { taille: 8.5, couleur: 'tan' });
  doc.y -= 40;
  doc.ligne(PDF_M, doc.y, PDF_M + L, doc.y, 1, 'caramel');   // le seul trait caramel de la page
  const lt = L / chiffres.length;
  doc.y -= 6;
  chiffres.forEach(([n, l], k) => {
    const xt = PDF_M + k * lt;
    if (k) doc.ligne(xt - 7, doc.y - 4, xt - 7, doc.y - 32, .4, 'filet');
    doc.texte(xt, doc.y - 18, String(n), { taille: 17, police: 'HB', couleur: 'encre' });
    lignesPdf(l.toUpperCase(), lt - 14, 5.8, 'HB').slice(0, 2).forEach((s, q) =>
      doc.texte(xt, doc.y - 27.5 - q * 7.5, s, { taille: 5.8, police: 'HB', couleur: 'tan', esp: .45 }));
  });
  doc.y -= 44; doc.ligne(PDF_M, doc.y, PDF_M + L, doc.y, .6, 'filet2');
}
/* un titre de section : petites capitales espacees, encre, sur un filet */
function sectionPdf(doc, s){
  const L = doc.largeur - 2 * PDF_M;
  doc.place(48); doc.y -= 18;
  doc.texte(PDF_M, doc.y - 8, s.toUpperCase(), { taille: 7.4, police: 'HB', couleur: 'encre', esp: .9 });
  doc.y -= 12; doc.ligne(PDF_M, doc.y, PDF_M + L, doc.y, .7, 'filet2'); doc.y -= 8;
}

/* Une journee de dix plans a dix prises fait cent lignes : chacune doit se
   lire d'un coup d'oeil. Les tableaux ne montrent que les colonnes remplies
   ce jour-la, un tableau qui continue sur la page d'apres rappelle son plan,
   et chaque plan annonce son bilan. */
function pdfDIT(j){
  const jours = modeleDIT(j), doc = nouveauPdf(), L = doc.largeur - 2 * PDF_M;
  const section = s => sectionPdf(doc, s);
  const vide = s => { doc.texte(PDF_M, doc.y - 8, s, { taille: 8.5, couleur: 'tan' }); doc.y -= 13; };
  // le statut d'une prise, dans sa couleur : OK en vert, NG en rouge, le reste en tan
  const statut = s => ({ t: s, couleur: s === 'OK' ? 'ok' : s === 'NG' ? 'ng' : 'tan', police: s === 'OK' || s === 'NG' ? 'HB' : 'H' });
  // et Pick-up a sa suite, en tan
  const statutPu = t => !t.pickup ? statut(t.statut) : !t.statut ? statut('Pick-up')
    : { parts: [statut(t.statut), { t: ' · Pick-up', couleur: 'tan' }] };
  // qui a saisi : les deux premieres lettres de chaque prenom en gras (Si, Ro), l'heure en tan
  const initiales = par => String(par || '').split(/\s*,\s*/).filter(Boolean).map(n => n.slice(0, 2)).join(', ');
  const saisi = t => ({ parts: [{ t: initiales(t.par), police: 'HB', couleur: 'encre' }, { t: t.par && t.heure ? ' · ' : '', couleur: 'tan' },
                                { t: t.heure, couleur: 'tan' }] });
  /* les colonnes d'une journee : celles qui ont quelque chose a dire. Chaque
     colonne sait lire sa cellule dans une prise ; la note prend la place qui reste. */
  const COLONNES = {
    n:      ['Pr.', 22, 'H', t => t.n],
    clip:   ['Clip', 68, 'C', t => t.clip || '—'],
    // la sequence, le shot et la prise en toutes lettres : « Séq 06 · Shot 01 · Prise 2 »
    ou:     ['Séq · Shot · Prise', 128, 'H', t => [t.seq && 'Séq ' + t.seq, t.plan && 'Shot ' + t.plan, t.n && 'Prise ' + t.n].filter(Boolean).join(' · ')],
    statut: ['Statut', 42, 'H', statutPu],
    // la duree chronometree de la prise ; a defaut, celle prevue pour le shot, en tan
    duree:  ['Durée', 58, 'H', t => t.duree || (t.dureePrevue ? { t: t.dureePrevue + ' prévue', couleur: 'tan' } : '')],
    carte:  ['Carte', 52, 'H', t => t.carte ? { t: t.carte, police: 'HB', couleur: 'encre' } : { t: '—', couleur: 'tan' }],
    note:   ['Note', 0, 'H', t => t.note],
    qui:    ['Saisi par', 64, 'H', saisi]
  };
  const colonnes = (fixes, prises, taille) => {
    const avec = k => prises.some(t => t[k]);
    const ids = fixes.slice(0, -1)
      .concat(avec('duree') && !fixes.includes('duree') ? ['duree'] : [],
              avec('note') ? ['note'] : [], fixes.slice(-1));
    const cols = ids.map(id => COLONNES[id].slice());
    // « Saisi par » s'elargit quand trois personnes ont saisi la meme prise
    const qui = cols.find(c => c[0] === 'Saisi par');
    if (qui) qui[1] = Math.max(qui[1], ...prises.map(t => largeurPdf(initiales(t.par) + ' · ' + t.heure, taille, 'HB') + 8));
    // « OK · Pick-up » ne tient pas dans la colonne du statut seul
    const st = cols.find(c => c[0] === 'Statut');
    if (st) st[1] = Math.max(st[1], ...prises.map(t => largeurPdf(libStatut(t), taille, 'HB') + 8));
    const reste = L - cols.reduce((a, c) => a + c[1], 0);
    const note = cols.find(c => c[0] === 'Note');
    if (note) note[1] = Math.max(80, reste); else cols[cols.length - 1][1] += Math.max(0, reste);
    return cols;
  };
  const rangee = (cols, t, extra) => Object.assign({ v: cols.map(c => c[3](t)) }, extra || {});

  /* Ce que le montage attend, avec tout le compte de la journee en tete ; puis,
     s'il y en a, les shots fusionnes ou abandonnes : ce que chacun est devenu.
     Les ecarts entre les saisies n'y sont pas : ils se reglent dans le rapprochement. */
  jours.forEach((m, i) => {
    if (i) doc.nouvellePage();
    // la carte est toujours la : le DIT voit d'un coup d'oeil sur quelle carte est chaque prise
    // la duree du shot est toujours la : le monteur sait ce que dure chaque prise retenue
    const colsM = colonnes(['clip', 'ou', 'statut', 'duree', 'carte', 'qui'], m.montage, 8.5);
    const chiffres = m.chiffres.filter(c => c[1] !== 'à tourner');
    entetePdf(doc, m.titre, m.sous, chiffres);

    // 1. ce que le montage attend
    section('1. Pour le montage — ' + m.montage.length + ' prise' + plur(m.montage.length) + ' retenue' + plur(m.montage.length));
    if (m.montage.length) tableauPdf(doc, colsM, m.montage.map(t => rangee(colsM, t, { gras: true })), 8.5, 'Prises retenues, suite');
    else vide('Aucune prise marquée à monter pour l’instant.');

    // 2. les shots fusionnes ou abandonnes : ce que chacun est devenu, pour que le DIT ne cherche pas leurs prises
    if (m.abandonnes.length){
      const colsA = [['Shot', 128, 'HB', a => ({ t: a.ou, police: 'HB', couleur: 'encre' })],
                     ['Ce qu’il est devenu', L - 128, 'H', a => ({ t: a.etat, police: 'HB', couleur: a.fusion ? 'caramel' : 'ng' })]];
      section('2. Shots fusionnés ou abandonnés — ' + m.abandonnes.length);
      tableauPdf(doc, colsA, m.abandonnes.map(a => rangee(colsA, a)), 8.5, 'Shots fusionnés ou abandonnés, suite');
    }
  });
  return doc.fichier(jours.length ? jours[0].pied : '');
}
/* Un bloc du rapport qui se replie (ferme d'office) : son titre et un compte ; ouvert ou ferme,
   il le reste sur cet appareil, meme quand le rapport se redessine. */
function blocRepli(cle, titre, nb, corps){
  const ouvert = !!(UI.rapOuvert || {})[cle];
  return `<details class="bloc repli"${ouvert ? ' open' : ''} ontoggle="replierRap('${cle}', this.open)">
    <summary><h3>${esc(titre)}${nb ? ` <em>${nb}</em>` : ''}</h3></summary>${corps}</details>`;
}
function replierRap(cle, ouvert){ UI.rapOuvert = Object.assign({}, UI.rapOuvert, { [cle]: ouvert }); ecrireUI(); }
function telechargerDIT(){
  const j = fJourR;
  chargerLogo().then(() => avecEquipeAJour(() => {
    surLePerimetre(() => download(fname('journal-DIT' + (j === '*' ? '' : '-' + j), 'pdf'), pdfDIT(j), 'application/pdf'));
    direPerimetre('Journal DIT exporté');
  }));
}

/* ------------------------------------------------------------ Fiche VFX */
/* Le VFX camera report : une feuille par plan (un « setup »), celle que le
   plateau remplissait au stylo. En tete le projet, le tournage et le script ;
   la camera ; quatorze lignes de prises aux releves du matchmove ; puis la
   description, les elements, les notes, le croquis du decor et les distances.
   Tout ce que l'app sait y est deja ecrit, le reste attend le stylo. Elle est
   en anglais, comme la feuille : elle part chez le studio. */
const VFX_LIGNES = 14;
/* les elements de la feuille, ceux de la colonne « On set » du breakdown VFX, et ceux de l'app
   qui les cochent ; les autres (lidar, camtrack, mur LED, « Autre ») vont dans « Other » */
const ELEMENTS_VFX = [
  ['Photogrammetry', ['photogram']], ['HDRI', ['hdri']], ['Chrome / grey ball', ['chrome']],
  ['Green / blue screen', ['vert', 'bleu']], ['Gaussian splat', ['splat']],
  ['Color charts', ['chart']], ['Extra plate', ['plates']], ['Clean plate', ['cleanplate']],
  ['Wide angle camera', ['wide']], ['Trackers', ['trackers']]
];
/* les mouvements de la feuille, lus dans le mouvement et le support du plan et de ses prises */
const MOUV_VFX = [['STATIC', /fixe|static/i], ['PAN', /\b(pan|tilt|suivi)/i],
                  ['TRAVEL', /travel|dolly|rail|slider|grue|drone|v[ée]hicule/i], ['HANDHELD', /[ée]paule|handheld/i],
                  ['STEADI', /steadi|gimbal/i]];
const MOMENT_VFX = [['DAY', /jour|day/i], ['NIGHT', /nuit|night/i], ['DAWN', /aube|dawn/i], ['DUSK', /cr[ée]puscule|dusk/i]];
/* l'unite est dans l'en-tete de la colonne : « 35 mm » s'ecrit 35 */
const sansUnite = (v, u) => String(v || '').trim().replace(u, '');

function modeleVFX(j){
  const jours = j === '*' ? joursConnus().filter(x => plansDuJour(x).length) : [j];
  const feuilles = [];
  jours.forEach(jour => {
    const P = plansDuJour(jour).filter(x => x.etat !== 'drop');
    const tournes = P.filter(x => prisesDe(x.id).length || x.etat === 'done' || aElements(x));
    // un jour ou rien n'est encore tourne : les feuilles de ses plans, pretes pour le plateau
    (tournes.length || j === '*' ? tournes : P).forEach(x => feuilles.push(feuilleVFX(x, jour)));
  });
  // rien du tout : une feuille vierge, l'en-tete du projet rempli
  return feuilles.length ? feuilles : [feuilleVFX(null, j === '*' ? '' : j)];
}
function feuilleVFX(x, jour){
  const p = DB.prod, pr = x ? prisesDe(x.id) : [];
  const val = k => ((pr.find(t => String(t[k] || '').trim()) || {})[k] || '').trim();
  const heures = pr.map(t => t.heure).filter(Boolean).sort();
  const nJours = joursConnus().filter(v => v && v !== 'CG').length;
  const mouv = x ? [x.mouv, x.support].concat(pr.map(t => t.mouvement), pr.map(t => t.support)).filter(Boolean).join(' / ') : '';
  const coches = x ? elementsTous(x) : {}, lus = new Set(ELEMENTS_VFX.flatMap(e => e[1]));
  const cotes = x ? croquisListe(x).flatMap(c => (c && c.objets || []).filter(o => o.t === 'cote' && o.txt).map(o => o.txt)) : [];
  // le croquis de la feuille : le premier dessine (a defaut, le plan du decor seul) ; les autres ont leur page
  const dessines = x ? croquisListe(x).map((c, i) => pleinCroquis(c) ? i : -1).filter(i => i >= 0) : [];
  const auj = new Date();
  // une ligne par mesure differente ; les prises qui la partagent se lisent ensemble
  const dist = [];
  pr.filter(t => t.focusStart || t.focusStop || t.mesureDepuis).forEach(t => {
    const focus = fleche(sansUnite(t.focusStart, /\s*m$/i), sansUnite(t.focusStop, /\s*m$/i)).replace(' → ', ' > '), d = t.mesureDepuis || '';
    const l = dist.find(r => r[1] === focus && r[4] === d);
    if (l) l.prises.push(t.n); else dist.push(Object.assign(['', focus, '', '', d, ''], { prises: [t.n] }));
  });
  dist.forEach(r => { r[0] = (r.prises.length > 1 ? 'Takes ' : 'Take ') + r.prises.join(', '); });
  // quatre lignes sur la feuille : les cotes du croquis gardent la leur
  if (cotes.length){ dist.length = Math.min(dist.length, 3); dist.push(['Set diagram', '', '', '', '', cotes.join(' · ')]); }
  return {
    seq: x ? x.seq || '' : '', plan: x ? x.plan || '' : '', titre: p.titre || '',
    // le titre est en tete de page
    projet: [['Director', p.real], ['DOP', p.dop], ['First AD', p.firstAD], ['Production', p.prod], ['Producer', p.producer]],
    // la date : celle de l'export de la feuille ; elle partage sa ligne avec le jour de tournage
    tournage: [['Date', deuxCh(auj.getDate()) + '/' + deuxCh(auj.getMonth() + 1) + '/' + auj.getFullYear(),
                'Shooting day', jour && jour !== 'CG' ? numJour(jour) + ' / ' + nJours : jour === 'CG' ? 'Full CG' : ''],
               ['Time', heures.length ? heures[0] + (heures.length > 1 ? ' – ' + heures[heures.length - 1] : '') : ''],
               // le lieu du jour, par son adresse reelle (Decors) ; a defaut, le nom du decor
               ['Location', (jour === 'CG' ? '' : (jour && decorJour(jour)) || p.lieu || '').split(' + ').map(l => adresseDecor(l) || l).join(' + ')],
               ['VFX Sup.', p.vfxSuper]],
    // la sequence et le plan partagent leur ligne
    script: [['Sequence', x ? x.seq || '' : '', 'Shot', x ? x.plan : ''],
             ['Int / Ext', { choix: [['INT', /int/i.test(x && x.intExt || '')], ['EXT', /ext/i.test(x && x.intExt || '')]] }],
             ['Location', x ? x.lieu : ''],
             ['Time of day', { choix: MOMENT_VFX.map(([n, re]) => [n, !!x && re.test(x.momentJour || '')]) }]],
    camera: val('camModel') || 'ARRI Alexa 35', lens: val('objectif') || p.objectif || '', format: val('reso'),
    codec: [val('codec'), val('fps') && val('fps') + ' fps'].filter(Boolean).join(' / '),
    mouvements: MOUV_VFX.map(([n, re]) => [n, re.test(mouv)]),
    // le mouvement ecrit sur la feuille : celui du plan seul (a defaut d'un nom connu, tel que saisi)
    mouvement: MOUV_VFX.filter(([, re]) => re.test(mouv)).map(m => m[0]).join(' · ') || mouv,
    prises: pr.map(t => ({
      n: t.n, clip: t.clip || '', statut: t.statut || '', retenue: !!t.retenue,
      focale: [sansUnite(t.focale, /\s*mm$/i), sansUnite(t.focaleStop, /\s*mm$/i)],
      focus: [sansUnite(t.focusStart, /\s*m$/i), sansUnite(t.focusStop, /\s*m$/i)],
      diaph: t.diaph || '', ei: sansUnite(t.ei, /^(iso|ei)\s*/i), wb: sansUnite(t.wb, /\s*k$/i), shutter: t.shutter || '',
      hauteur: [sansUnite(t.hauteurStart, /\s*m$/i), sansUnite(t.hauteurStop, /\s*m$/i)],
      pan: [sansUnite(t.panStart, /\s*°$/), sansUnite(t.panStop, /\s*°$/)],
      tilt: [sansUnite(t.tiltStart, /\s*°$/), sansUnite(t.tiltStop, /\s*°$/)],
      roll: [sansUnite(t.rollStart, /\s*°$/), sansUnite(t.rollStop, /\s*°$/)],
      // le resultat qui n'est ni OK ni NG (Serie, Faux depart…) et le montage se lisent dans la note
      note: [t.statut && t.statut !== 'OK' && t.statut !== 'NG' ? t.statut : '', t.pickup ? 'Pick-up' : '', t.retenue ? 'Kept for edit' : '', t.notes]
        .filter(Boolean).join(' · ')
    })),
    mesure: val('mesureDepuis'),
    scene: x ? x.desc || '' : '',
    vfx: x ? [texteDe(x, 'vfxDesc'), x.assets && 'Assets: ' + x.assets].filter(Boolean).join('\n') : '',
    elements: ELEMENTS_VFX.map(([nom, cles]) => ({ nom, on: cles.some(k => coches[k]) })),
    autres: x ? ELEMENTS.filter(e => coches[e[0]] && !lus.has(e[0])).map(e => e[1])
                  .concat(texteDe(x, 'elementsAutre') ? [texteDe(x, 'elementsAutre')] : []).join(', ') : '',
    client: x ? texteDe(x, 'notesClient') : '', interne: x ? texteDe(x, 'notesInternes') : '', studio: p.vfxStudio || '',
    distances: dist.slice(0, 4).map(r => r.slice()),
    croquis: x && aCroquis(x) ? x.id + ':' + (dessines[0] || 0) : '',
    autresCroquis: x ? dessines.slice(1).map(i => x.id + ':' + i) : []
  };
}

/* Un croquis d'un plan, son decor dessous, rendu en JPEG pour la feuille. */
function imageCroquis(p, i){
  return chargerImage(fondDecor(lieuFond(p))).catch(() => null).then(img => {
    const garde = dessin;
    try{
      dessin = etatCroquis(p, img, i || 0);
      const cv = document.createElement('canvas');
      cv.width = 1400; cv.height = hauteurApercu(1400);
      rendreCroquis(cv);
      return { l: cv.width, h: cv.height, octets: atob(cv.toDataURL('image/jpeg', .85).split(',')[1]) };
    } finally { dessin = garde; }
  });
}
function imagesVFX(j){
  // une cle par croquis : « id du plan:numero »
  const cles = modeleVFX(j).flatMap(f => [f.croquis].concat(f.autresCroquis)).filter(Boolean);
  return Promise.all(cles.map(k => { const [id, i] = k.split(':'), p = plan(id);
    return p ? imageCroquis(p, +i).then(im => [k, im], () => [k, null]) : [k, null]; }))
    .then(l => Object.fromEntries(l.filter(x => x[1])));
}

function pdfVFX(j, images, imposees){
  const feuilles = imposees || modeleVFX(j), doc = nouveauPdf(), M = 24, W = doc.largeur - 2 * M;
  // la feuille vierge, a remplir au stylo : ni nom, ni date, le numero de page a la main
  const vierge = feuilles.some(f => f.vierge), BLANC = '_____ / _____';
  images = images || {};
  const T = (x, y, s, o) => doc.texte(x, y, String(s == null ? '' : s), o);
  const cadre = (x, y, w, h, ep, c) => {
    doc.ligne(x, y, x + w, y, ep, c); doc.ligne(x + w, y, x + w, y + h, ep, c);
    doc.ligne(x + w, y + h, x, y + h, ep, c); doc.ligne(x, y + h, x, y, ep, c);
  };
  /* un texte qui tient dans sa case : il rapetisse jusqu'a 5 points, puis se coupe */
  const ajuste = (s, larg, taille, police) => {
    s = String(s || ''); let t = taille;
    while (t > 5 && largeurPdf(s, t, police) > larg) t -= .25;
    if (largeurPdf(s, t, police) > larg){
      while (s.length > 1 && largeurPdf(s + '…', t, police) > larg) s = s.slice(0, -1);
      s += '…';
    }
    return [s, t];
  };
  const ecrire = (x, y, s, larg, taille, police, couleur, centre) => {
    const [v, t] = ajuste(s, larg, taille, police);
    T(centre ? x + (larg - largeurPdf(v, t, police)) / 2 : x, y, v, { taille: t, police, couleur });
  };
  /* une case de prise : le texte rapetisse pour tenir (« 100 mm macro ») ; trop long meme a 5 points,
     il passe sur deux lignes, coupe au blanc le plus proche du milieu, avant de se couper */
  const ecrireCase = (x, yl, s, larg, taille, police, couleur, centre) => {
    s = String(s || ''); larg -= 2; x += 1;
    let t = taille;
    while (t > 5 && largeurPdf(s, t, police) > larg) t -= .25;
    const blancs = [...s.matchAll(/ /g)].map(m => m.index);
    if (largeurPdf(s, t, police) <= larg || !blancs.length) return ecrire(x, yl - 11, s, larg, taille, police, couleur, centre);
    const i = blancs.reduce((a, b) => Math.abs(b - s.length / 2) < Math.abs(a - s.length / 2) ? b : a);
    const deux = [s.slice(0, i), s.slice(i + 1)];
    let t2 = Math.min(taille, 6);
    while (t2 > 4 && deux.some(l => largeurPdf(l, t2, police) > larg)) t2 -= .25;
    deux.forEach((l, k) => ecrire(x, yl - 7.6 - k * (t2 + 1.2), l, larg, t2, police, couleur, centre));
  };
  // une barre de titre : encre, petites capitales claires ; une mention a droite
  const barre = (x, yh, w, titre, droite) => {
    doc.rect(x, yh - 11, w, 11, 'encre');
    T(x + 5, yh - 7.8, titre.toUpperCase(), { taille: 6.2, police: 'HB', couleur: 'blanc', esp: .6 });
    if (droite) T(x + w - 5 - largeurPdf(droite, 6, 'H'), yh - 7.8, droite, { taille: 6, couleur: 'or' });
  };
  // une case a cocher ; cochee, elle est or avec sa coche
  const coche = (x, y, on, k) => {
    k = k || 7;
    if (!on) return cadre(x, y, k, k, .6, 'filet2');
    doc.rect(x, y, k, k, 'or');
    doc.ligne(x + k * .2, y + k * .52, x + k * .42, y + k * .25, 1.1, 'encre');
    doc.ligne(x + k * .42, y + k * .25, x + k * .82, y + k * .8, 1.1, 'encre');
  };
  // des choix sur une ligne (INT / EXT) : le bon en caramel gras, les autres en tan
  const choix = (x, y, l, taille, sep, larg) => {
    sep = sep || '/';
    // trop large pour sa case : tout rapetisse d'autant
    const tout = l.reduce((a, [n, on], i) => a + largeurPdf(n + ' ', taille, on ? 'HB' : 'H') + 1 + (i ? largeurPdf(sep + ' ', taille, 'H') + 1 : 0), 0);
    if (larg && tout > larg) taille *= larg / tout;
    l.forEach(([n, on], i) => {
    if (i){ T(x, y, sep, { taille, couleur: 'filet2' }); x += largeurPdf(sep + ' ', taille, 'H') + 1; }
    T(x, y, n, { taille, police: on ? 'HB' : 'H', couleur: on ? 'caramel' : 'tan' });
    x += largeurPdf(n + ' ', taille, on ? 'HB' : 'H') + 1;
    });
  };
  // un bloc de texte sur des lignes reglees, comme la feuille ; le texte s'ecrit dessus
  const regle = (x, yh, w, n, s) => {
    const lignes = String(s || '').split('\n').flatMap(l => lignesPdf(l, w - 10, 7, 'H'));
    if (lignes.length > n){ lignes.length = n; lignes[n - 1] = ajuste(lignes[n - 1] + '…', w - 10, 7, 'H')[0]; }
    for (let i = 0; i < n; i++){
      const y = yh - 10 - i * 10;
      doc.ligne(x + 5, y - 2.5, x + w - 5, y - 2.5, .35, 'filet');
      if (lignes[i]) T(x + 5, y, lignes[i], { taille: 7, couleur: 'brun' });
    }
  };

  /* les colonnes du tableau des prises : [titre, largeur, lecture, sous-titres, police] */
  const COLS = [
    ['Take', 18, t => t.n], ['Clipname', 58, t => t.clip, null, 'C'],
    ['Focal (mm)', 44, t => t.focale, ['Start', 'Stop']], ['Focus (m)', 44, t => t.focus, ['Start', 'Stop']],
    ['F-stop', 24, t => t.diaph], ['ISO', 24, t => t.ei], ['WB', 26, t => t.wb, ['(K)']], ['Shutter', 28, t => t.shutter],
    ['Height (m)', 44, t => t.hauteur, ['Start', 'Stop']], ['Pan (°)', 40, t => t.pan, ['Start', 'Stop']],
    ['Tilt (°)', 40, t => t.tilt, ['Start', 'Stop']], ['Roll (°)', 40, t => t.roll, ['Start', 'Stop']],
    ['Validated', 32, null, ['OK', 'NG']], ['Notes', 0, t => t.note]
  ];
  COLS[COLS.length - 1][1] = W - COLS.reduce((a, c) => a + c[1], 0);
  const HL = 16.5;   // la hauteur d'une ligne de prise
  const tableau = (yh, lignes, numeros) => {
    // l'en-tete : deux etages, le groupe puis Start / Stop
    doc.rect(M, yh - 22, W, 22, 'encre');
    let x = M;
    COLS.forEach(([titre, w, , sous]) => {
      const deux = sous && sous.length === 2;
      if (deux){
        ecrire(x, yh - 8.5, titre.toUpperCase(), w, 5.8, 'HB', 'blanc', true);
        doc.ligne(x + 3, yh - 11.5, x + w - 3, yh - 11.5, .4, 'tan');
        sous.forEach((s, k) => ecrire(x + k * w / 2, yh - 18.5, s, w / 2, 5.3, 'H', 'creme', true));
      } else if (sous){
        ecrire(x, yh - 10, titre.toUpperCase(), w, 5.8, 'HB', 'blanc', true);
        ecrire(x, yh - 18, sous[0], w, 5, 'H', 'creme', true);
      } else ecrire(x, yh - 13.5, titre.toUpperCase(), w, 5.8, 'HB', 'blanc', true);
      x += w;
    });
    const y0 = yh - 22;
    // une colonne sur deux teintee, sur toute la hauteur : on suit une valeur de prise en prise ;
    // la prise gardee pour le montage passe par-dessus
    // et une rangee sur deux aussi : leur croisement est un peu plus fonce
    { let xb = M; COLS.forEach(([, w], k) => { if (k % 2) doc.rect(xb, y0 - lignes.length * HL, w, lignes.length * HL, 'creme3'); xb += w; }); }
    lignes.forEach((t, i) => {
      const yl = y0 - i * HL;
      if (t && t.retenue) doc.rect(M, yl - HL, W, HL, 'creme2');
      else if (i % 2){
        doc.rect(M, yl - HL, W, HL, 'creme3');
        let xb = M; COLS.forEach(([, w], k) => { if (k % 2) doc.rect(xb, yl - HL, w, HL, 'creme4'); xb += w; });
      }
      let x = M;
      COLS.forEach(([titre, w, lire, sous, police]) => {
        const yb = yl - 11;
        if (titre === 'Take') ecrire(x, yb, t ? t.n : numeros[i], w, 6.8, t ? 'HB' : 'H', t ? 'encre' : 'tan', true);
        else if (titre === 'Validated'){
          coche(x + w / 4 - 3.5, yl - 12, t && t.statut === 'OK', 7); coche(x + 3 * w / 4 - 3.5, yl - 12, t && t.statut === 'NG', 7);
        } else if (t){
          const v = lire(t);
          if (Array.isArray(v)){
            // un depart sans arrivee n'a rien bouge : la case d'arrivee reste vide
            ecrireCase(x, yl, v[0], w / 2, 6.6, t.retenue ? 'HB' : 'H', 'encre', true);
            if (v[1] && v[1] !== v[0]) ecrireCase(x + w / 2, yl, v[1], w / 2, 6.6, t.retenue ? 'HB' : 'H', 'encre', true);
          } else if (titre === 'Notes'){
            const l = lignesPdf(v, w - 6, 5.8, 'H');
            if (l.length > 2){ l.length = 2; l[1] = ajuste(l[1] + '…', w - 6, 5.8, 'H')[0]; }
            l.forEach((s, k) => T(x + 3, yl - (l.length > 1 ? 7 : 11) - k * 6.5, s, { taille: 5.8, couleur: 'brun' }));
          } else ecrireCase(x + 1, yl, v, w - 2, 6.6, police === 'C' ? (t.retenue ? 'CB' : 'C') : (t.retenue ? 'HB' : 'H'), 'encre', police !== 'C');
        }
        x += w;
      });
    });
    // la grille : un filet entre chaque case, Start et Stop compris
    const yb = y0 - lignes.length * HL;
    let xg = M;
    COLS.forEach(([, w, , sous], k) => {
      if (k) doc.ligne(xg, y0, xg, yb, .35, 'filet');
      if (sous && sous.length === 2) doc.ligne(xg + w / 2, y0, xg + w / 2, yb, .25, 'filet');
      xg += w;
    });
    for (let i = 1; i < lignes.length; i++) doc.ligne(M, y0 - i * HL, M + W, y0 - i * HL, .3, 'filet');
    cadre(M, yb, W, yh - yb, .5, 'filet2');
    return yb;
  };

  // les pages : une feuille, et une suite pour chaque quarantaine de prises au-dela de quatorze
  const SUITE = 38;
  const pagesDe = f => 1 + Math.ceil(Math.max(0, f.prises.length - VFX_LIGNES) / SUITE) + f.autresCroquis.filter(k => images[k]).length;
  const total = feuilles.reduce((a, f) => a + pagesDe(f), 0);
  let page = 0;
  // l'en-tete, comme celui du journal DIT : le logo a gauche ; le projet a droite et, dessous,
  // la feuille, le plan et la page ; un seul trait caramel sur toute la largeur
  const HAUT = 66;   // ce que l'en-tete occupe en haut de page, trait compris
  const entete = (f, suite, sous) => {
    page++;
    const H = doc.hauteur, xd = M + W, haut = H - 22;
    if (LOGO_PDF){
      const hl = 24, kl = hl / LOGO_BOITE.h;
      doc.trace(LOGO_PDF.mot, 'encre', true, M - LOGO_BOITE.x * kl, haut + LOGO_BOITE.y * kl, kl);
      doc.trace(LOGO_PDF.touche, 'or', false, M - LOGO_BOITE.x * kl, haut + LOGO_BOITE.y * kl, kl);
    }
    const titre = f.titre || 'Untitled project';
    T(xd - largeurPdf(titre, 19, 'HB'), haut - 16, titre, { taille: 19, police: 'HB', couleur: 'encre' });
    const ligne = ['Data wrangling' + (suite || sous ? ' · continued' : ''),
                   f.plan ? 'Seq ' + (f.seq || '—') + ' · Shot ' + f.plan : '', sous || (suite ? 'Takes ' + suite : ''),
                   'Page ' + (vierge ? BLANC : page + ' / ' + total)].filter(Boolean).join(' · ');
    T(xd - largeurPdf(ligne, 8.5, 'H'), haut - 29, ligne, { taille: 8.5, couleur: 'tan' });
    doc.ligne(M, haut - 40, xd, haut - 40, 1, 'caramel');
  };

  feuilles.forEach((f, n) => {
    if (n) doc.nouvellePage();
    entete(f);
    const H = doc.hauteur;
    // 1. projet, tournage, script : quatre lignes serrees ; une ligne peut porter deux champs
    const w3 = (W - 16) / 3, LH = 9.5, hb = 11 + Math.max(f.projet.length, f.tournage.length, f.script.length) * LH + 5;
    const champ = (xg, xdr, y, lib, v, lw) => {
      T(xg, y, lib, { taille: 6, couleur: 'tan' });
      doc.ligne(xg + lw - 2, y - 2.5, xdr, y - 2.5, .35, 'filet');
      // saisi sur le shot : seulement ce qui l'a ete (INT, NIGHT) ; rien de saisi : tous les choix, a entourer
      if (v && v.choix) choix(xg + lw, y, v.choix.some(c => c[1]) ? v.choix.filter(c => c[1]) : v.choix, 6.8, null, xdr - xg - lw);
      else if (v) ecrire(xg + lw, y, v, xdr - xg - lw - 1, 7, 'HB', 'encre');
    };
    [['Project', f.projet], ['Shoot', f.tournage], ['Script', f.script]].forEach(([titre, champs], k) => {
      const x = M + k * (w3 + 8), yh = H - HAUT - 4;
      barre(x, yh, w3, titre);
      cadre(x, yh - hb, w3, hb, .5, 'filet');
      champs.forEach(([lib, v, lib2, v2], i) => {
        const y = yh - 19 - i * LH;
        if (!lib2) return champ(x + 5, x + w3 - 5, y, lib, v, 44);
        // Sequence | Shot (et, sur la vierge, Date | Shooting day) : deux moities egales ; ailleurs le second
        // champ a la place de son libelle et d'une valeur courte (1 / 5), le premier le reste
        const l2 = largeurPdf(lib2, 6, 'H') + 7, m = k === 2 || f.vierge ? x + 5 + (w3 - 10) / 2 : x + w3 - 5 - l2 - 30;
        champ(x + 5, m - 4, y, lib, v, 44);
        champ(m + 4, x + w3 - 5, y, lib2, v2, l2);
      });
    });
    // 2. la camera, sur une barre ; le capteur et le codec n'y sont que s'ils sont remplis.
    //    Chaque valeur a la place de son texte ; s'il n'y en a pas assez pour tout, toutes
    //    rapetissent d'autant (rien n'est coupe), s'il en reste, elle se partage
    let x = M;
    const yc = H - HAUT - 4 - hb - 6, hc = 16, TL = 5.2, PAD = 9;
    let TV = 6.5;
    const cam = [['Camera', f.camera], ['Lens set', f.lens], ['Movement', f.mouvement]]
      // remplis, ou sur la feuille vierge (a ecrire au stylo)
      .concat(f.format || f.vierge ? [['Sensor / format', f.format]] : [], f.codec || f.vierge ? [['Codec / fps', f.codec]] : [])
      .map(([lib, v]) => [lib.toUpperCase(), v || '', largeurPdf(lib.toUpperCase(), TL, 'HB') + 8]);
    const libres = W - cam.reduce((a, c) => a + c[2], 0) - cam.length * PAD;
    const textes = cam.reduce((a, c) => a + largeurPdf(c[1], TV, 'HB'), 0);
    if (textes > libres) TV = Math.max(4.6, TV * libres / textes);
    // une case vide garde de quoi y ecrire au stylo
    const nat = cam.map(c => c[1] ? largeurPdf(c[1], TV, 'HB') : 80);
    const surplus = Math.max(0, libres - nat.reduce((a, n) => a + n, 0)) / cam.length;
    cam.forEach(([lib, v, wl], i) => {
      const wv = nat[i] + PAD + surplus;
      doc.rect(x, yc - hc, wl, hc, 'encre');
      ecrire(x + 4, yc - 10.1, lib, wl - 5, TL, 'HB', 'blanc');
      cadre(x + wl, yc - hc, wv, hc, .5, 'filet2');
      ecrire(x + wl + 4.5, yc - 10.3, v, wv - 7, TV, 'HB', 'encre');
      x += wl + wv;
    });
    // 3. les prises : quatorze lignes, les premieres remplies ; les autres numerotees a la suite
    const pr = f.prises.slice(0, VFX_LIGNES), dernier = Math.max(0, ...f.prises.map(t => parseInt(t.n, 10) || 0));
    const lignes = Array.from({ length: VFX_LIGNES }, (_, i) => pr[i] || null);
    const numeros = lignes.map((t, i) => t ? t.n : dernier + i - pr.length + 1);
    let y = tableau(yc - hc - 8, lignes, numeros);
    T(M, y - 8, 'Focus = distance from camera to subject.  Height measured ' + (f.mesure ? 'from: ' + f.mesure : 'from the ground to the lens centre') +
      '.  Clipname = camera file name.  OK / NG = validated takes' + (f.prises.some(t => t.retenue) ? ' · shaded row = kept for edit.' : '.'),
      { taille: 5.6, couleur: 'tan' });

    // 4. en bas a gauche : descriptions, elements, notes ; le bas de page tient, la place gagnee
    //    en tete va aux descriptions (des lignes de plus), aux notes et au croquis
    const BAS = 42, yB = y - 16, wg = 172, xg = M;
    const bloc = (yh, titre, h, droite) => { barre(xg, yh, wg, titre, droite); cadre(xg, yh - h, wg, h, .5, 'filet'); return yh - 11; };
    const plus = Math.max(0, Math.floor((yB - 357 - BAS) / 10)), nS = 5 + Math.floor(plus / 2), nV = 5 + Math.ceil(plus / 2);
    let yh = yB;
    regle(xg, bloc(yh, 'Scene description', 17 + nS * 10), wg, nS, f.scene); yh -= 23 + nS * 10;
    regle(xg, bloc(yh, 'VFX description', 17 + nV * 10), wg, nV, f.vfx); yh -= 23 + nV * 10;
    const ye = bloc(yh, 'Elements', 85);
    // la liste « On set » du breakdown, dans son ordre : deux colonnes de cinq
    const demi = Math.ceil(f.elements.length / 2);
    f.elements.forEach((e, i) => {
      const xe = i < demi ? xg + 6 : xg + wg / 2 + 2, yy = ye - 11 - (i % demi) * 11;
      coche(xe, yy - 1, e.on, 6.5);
      ecrire(xe + 10, yy, e.nom, wg / 2 - 18, 6.6, e.on ? 'HB' : 'H', e.on ? 'encre' : 'brun');
    });
    coche(xg + 6, ye - 69, !!f.autres, 6.5);
    T(xg + 16, ye - 68, 'Other :', { taille: 6.6, couleur: 'brun' });
    doc.ligne(xg + 42, ye - 70.5, xg + wg - 6, ye - 70.5, .35, 'filet');
    if (f.autres) ecrire(xg + 44, ye - 68, f.autres, wg - 52, 6.6, 'HB', 'encre');
    yh -= 91;
    regle(xg, bloc(yh, 'Client notes', 57, f.studio), wg, 4, f.client); yh -= 63;
    const hI = Math.max(57, yh - BAS);
    regle(xg, bloc(yh, 'Internal notes', hI, 'between us'), wg, Math.floor((hI - 17) / 10), f.interne);

    // 5. a droite : le croquis du decor, puis les distances
    const xd = M + wg + 8, wd = W - wg - 8, yBas = yh - hI;
    // les distances commencent et finissent a la hauteur des notes internes, a gauche
    const yDist = yh, hDist = yDist - yBas, hDia = yB - yDist - 6 - 11, rh = (hDist - 22) / 4;
    barre(xd, yB, wd, 'Diagram of the set');
    cadre(xd, yB - 11 - hDia, wd, hDia, .5, 'filet');
    const im = f.croquis && images[f.croquis];
    if (im){
      // le croquis entier, a l'echelle, au milieu du cadre
      const k = Math.min((wd - 8) / im.l, (hDia - 8) / im.h), l = im.l * k, h = im.h * k;
      doc.image(im, xd + (wd - l) / 2, yB - 11 - hDia + (hDia - h) / 2, l, h);
    } else {
      // une feuille pointee, a dessiner au stylo
      for (let gx = xd + 9; gx < xd + wd - 4; gx += 12)
        for (let gy = yB - 20; gy > yB - 11 - hDia + 6; gy -= 12) doc.disque(gx, gy, .45, 'filet2');
    }
    barre(xd, yDist, wd, 'Distances to note (m)');
    const CD = [['Setup / Take', 58], ['Focus x Camera', 62], ['Light x Actor', 56], ['Bounce x Actor', 58], ['Measured from', 60], ['Notes', 0]];
    CD[CD.length - 1][1] = wd - CD.reduce((a, c) => a + c[1], 0);
    let yd = yDist - 11;
    doc.rect(xd, yd - 11, wd, 11, 'creme');
    let xc = xd;
    CD.forEach(([t, w]) => { ecrire(xc, yd - 7.6, t, w, 5.6, 'HB', 'encre', true); xc += w; });
    yd -= 11;
    for (let i = 0; i < 4; i++){
      const r = f.distances[i], yl = yd - i * rh;
      if (i < 3) doc.ligne(xd, yl - rh, xd + wd, yl - rh, .3, 'filet');
      if (r){ xc = xd; CD.forEach(([, w], k) => { if (r[k]) ecrire(xc + 3, yl - rh / 2 - 2.3, r[k], w - 6, 6.4, k ? 'H' : 'HB', 'encre', k > 0 && k < 5); xc += w; }); }
    }
    xc = xd;
    CD.forEach(([, w], k) => { if (k) doc.ligne(xc, yDist - 11, xc, yBas, .3, 'filet'); xc += w; });
    cadre(xd, yBas, wd, hDist - 11, .5, 'filet');

    // 6. les prises au-dela de quatorze, sur des pages de suite
    for (let d = VFX_LIGNES; d < f.prises.length; d += SUITE){
      const l = f.prises.slice(d, d + SUITE);
      doc.nouvellePage();
      entete(f, l[0].n + ' – ' + l[l.length - 1].n);
      tableau(doc.hauteur - HAUT - 6, l, l.map(t => t.n));
    }
    // 7. les autres croquis du plan, chacun sur sa page, en grand
    f.autresCroquis.filter(k => images[k]).forEach((k, q) => {
      doc.nouvellePage();
      entete(f, '', 'Set diagram ' + (q + 2));
      const im = images[k], yh = doc.hauteur - HAUT - 6, hb = yh - 40 - 11;
      barre(M, yh, W, 'Diagram of the set ' + (q + 2));
      cadre(M, 40, W, hb, .5, 'filet');
      const kk = Math.min((W - 12) / im.l, (hb - 12) / im.h), l = im.l * kk, h = im.h * kk;
      doc.image(im, M + (W - l) / 2, 40 + (hb - h) / 2, l, h);
    });
  });
  const d = new Date(), p = DB.prod;
  if (vierge) return doc.fichier([p.titre || '', 'Data wrangling', 'Wrangle'].filter(Boolean).join(' · '), () => BLANC);
